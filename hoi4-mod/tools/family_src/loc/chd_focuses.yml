 # Mongolia
 # Ideas
 MON_soviet_republic:0 "Soviet Republic"
 MON_soviet_republic_desc:0 "While a Soviet Republic, Mongolia is unrecognised by almost every nation in the world. By most we are considered nothing more than a satelite state of the Soviet Union. This is a severe blow to our ability to conduct diplomacy and limits us."
 MON_soviet_economic_ties:0 "Soviet Economic Ties"
 MON_russofication:0 "Russofication"
 MON_russofication_desc:0 "The Russians have had a largely negative effect on our heritage and the stability of our nation. While progress is being made, there is a wound in our nation that won't heal any time soon."
 MON_political_paranoia:0 "Political Paranoia"
 MON_political_paranoia_desc:0 "There is a constant feeling of Political Paranoia within our government, with crackdowns by the NKVD and Stalin's watchful eye over our politics this paranoia is making people afraid to act out of line."
 MON_political_paranoia_lowered:0 "Political Paranoia"
 MON_political_paranoia_lowered_desc:0 "There is a constant feeling of Political Paranoia within our government, with crackdowns by the NKVD and Stalin's watchful eye over our politics this paranoia is making people afraid to act out of line.\nThankfully things are a little better as more wiggleroom to act is being given."
 MON_illiteracy_problem:0 "Illiteracy Problem"
 MON_the_front_against_japan:0 "The Front Against Japan"
 MON_the_front_against_japan_desc:0 "Our position in the Commintern is vital to the defence of the East. We're considered the main defensive front should Japan attack and our populace is ready for that defence."
 
 MON_inefficient_economic_plans:0 "Inefficient Economic Plans"
 MON_semi_efficient_economic_plans:0 "Semi-Inefficient Economic Plans"
 MON_barely_efficient_economic_plans:0 "Barely Efficient Economic Plans"
