 PAX_FRA_co_summit_desc:0 "Десять корпораций сидят за одним столом. Решает тот, кто платит больше."
 PAX_ENG_her:0 "Наследие: Республика мореходов"
 PAX_ENG_her_desc:0 "Каждый гражданин Союза моряк, и каждый порт его дом."
 PAX_ENG_fai:0 "Государственная вера: Союз Числа"
 PAX_ENG_fai_desc:0 "Школа Пифагора. Мореходы верят, что у всего есть число, даже у удачи."
 PAX_ENG_said_no:0 "Мы сказали «нет»"
 PAX_ENG_said_no_desc:0 "Память о войне за независимость 1781 года объединяет все острова."
 PAX_ENG_ports:0 "Порты на всех берегах"
 PAX_ENG_ports_desc:0 "Эпоха парусов оставила Союзу порты по всему миру."
 PAX_ENG_fog:0 "Туман Безымянных"
 PAX_ENG_fog_desc:0 "В 1700 году флот пропал в тумане. Союз до сих пор посылает туда разведчиков."
 PAX_ENG_sailor_fleet:0 "Флот мореходов"
 PAX_ENG_sailor_fleet_desc:0 "Республика мореходов строит новый флот."
 PAX_ENG_join_pax:0 "Место в Союзе PAX"
 PAX_ENG_join_pax_desc:0 "Острова никому не платят дань, но клятву PAX дают сами."
 PAX_ENG_cw_watch:0 "Дежурные у башни"
 PAX_ENG_cw_watch_desc:0 "Островной Союз. Сто лет назад мы дали клятву PAX. Теперь у башни каждый день стоит наш караул."
 PAX_ENG_cw_intel:0 "Разведка обсидиана"
 PAX_ENG_cw_intel_desc:0 "Обе стороны тайно ищут обсидиан под землёй. Наши агенты знают, где копать."
 PAX_ENG_cw_shield:0 "Щит PAX"
 PAX_ENG_cw_shield_desc:0 "Блок держит строй. Пока мы вместе, никто не рискнёт начать войну."
 PAX_ENG_cw_deter:0 "Сдерживание"
 PAX_ENG_cw_deter_desc:0 "Ни одна сторона не нажмёт первой. Лучшая война та, которой не было."
 PAX_ENG_rb_net:0 "Сеть Седьмого"
 PAX_ENG_rb_net_desc:0 "Страж-7 считает быстрее любого бюро. Мы подключаем к нему лаборатории."
 PAX_ENG_rb_golems:0 "Медные легионы"
 PAX_ENG_rb_golems_desc:0 "Големы с медным сердцем встают на границах и заменяют дивизии."
 PAX_ENG_rb_human:0 "Ответ человека"
 PAX_ENG_rb_human_desc:0 "Разум разумом, а последнее слово останется за нами."
 PAX_ENG_rb_merge:0 "Слияние с разумом"
 PAX_ENG_rb_merge_desc:0 "Мы отдаём штабы и заводы общему разуму. Это быстрее и тише."
 PAX_ENG_rb_war:0 "Война двух разумов"
 PAX_ENG_rb_war_desc:0 "Страж-7 и Курултай смотрят друг на друга. Мы стоим между ними."
 PAX_ENG_co_charter:0 "Устав корпорации"
 PAX_ENG_co_charter_desc:0 "Островной Союз теперь бренд. Гражданин стал акционером, налог подпиской."
 PAX_ENG_co_sculk:0 "Скалк-сеть"
 PAX_ENG_co_sculk_desc:0 "Сигналы идут через скалк. Новости приходят раньше событий."
 PAX_ENG_co_gates:0 "Врата по подписке"
 PAX_ENG_co_gates_desc:0 "Врата открываются тем, кто заплатил. Карт-Хадашт уже продаёт места."
 PAX_ENG_co_loyal:0 "Лояльность Протекторату"
 PAX_ENG_co_loyal_desc:0 "Протекторат Сети запретил войны. Мы подпишем всё, что он попросит."
 PAX_ENG_co_shadow:0 "Теневая корпорация"
 PAX_ENG_co_shadow_desc:0 "Мы существуем, пока нас не ищут. Чёрные серверы платят дороже."
 PAX_ENG_cw_arms:0 "Гонка вооружений"
 PAX_ENG_cw_arms_desc:0 "Обе стороны складывают снаряды в погреба. Заводы работают в три смены."
 PAX_ENG_cw_spies:0 "Тени у башни"
 PAX_ENG_cw_spies_desc:0 "Агенты Союза и Пакта играют в игру, правила которой знают только они."
 PAX_ENG_cw_bunkers:0 "Подземные убежища"
 PAX_ENG_cw_bunkers_desc:0 "Если башня упадёт, под землёй должны остаться люди и станки."
 PAX_ENG_cw_diplo:0 "Переговоры у Монолита"
 PAX_ENG_cw_diplo_desc:0 "Каждые пять лет послы собираются у башни и обещают не стрелять."
 PAX_ENG_cw_balance:0 "Равновесие страха"
 PAX_ENG_cw_balance_desc:0 "Мир держится, пока обе стороны боятся друг друга."
 PAX_ENG_rb_factories:0 "Автоматические заводы"
 PAX_ENG_rb_factories_desc:0 "Конвейеры больше не ждут людей. Люди смотрят, чтобы ничего не сломалось."
 PAX_ENG_rb_labs:0 "Лаборатории Седьмого"
 PAX_ENG_rb_labs_desc:0 "Разум помогает ставить опыты и читать результаты быстрее любого учёного."
 PAX_ENG_rb_drones:0 "Дроны разведки"
 PAX_ENG_rb_drones_desc:0 "Лёгкие машины облетают границы и видят дальше любого часового."
 PAX_ENG_rb_cyber:0 "Нейроинтерфейсы"
 PAX_ENG_rb_cyber_desc:0 "Командиры подключают штаб прямо к разуму. Приказ идёт мгновенно."
 PAX_ENG_rb_peace:0 "Договор двух разумов"
 PAX_ENG_rb_peace_desc:0 "Машины сели за стол раньше людей. Остальным остаётся подписать."
