 GRE_pax_fai_desc:0 "Боги Олимпа. Морской бог хранит корабли Эллады."
 GRE_pax_thalassia:0 "Наследие Талассии"
 GRE_pax_thalassia_desc:0 "Сто островов Западного моря ушли под воду, но их чертежи кораблей остались у эллинов."
 GRE_pax_academy:0 "Академия Эллады"
 GRE_pax_academy_desc:0 "Платон и Аристотель составили перечень всего. Академия продолжает их работу."
 GRE_pax_isles:0 "Острова Лиги"
 GRE_pax_isles_desc:0 "Каждый остров Лиги строит свою верфь."
 GRE_pax_hoplites:0 "Гоплиты Олимпа"
 GRE_pax_hoplites_desc:0 "Строй гоплитов теперь держит винтовки."
 GRE_pax_join_pax:0 "Место в Союзе PAX"
 GRE_pax_join_pax_desc:0 "Эллада всегда стояла рядом с Ромеей. Пора сказать это вслух."
