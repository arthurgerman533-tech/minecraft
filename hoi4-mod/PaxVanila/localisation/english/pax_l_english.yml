 pax.1.t:0 "Peace Between the Great Wars"
 pax.1.d:0 "The year 1936. Eighteen years have passed since the First Great War. In 1914 lightning struck the Monolith at 0, 0, and the first crack appeared on the tower, exactly at the level of the sixth row. Of the six Guardians at the entrance, four have fallen. Two still stand.\n\nIn the west, Romea, Carthage, Hellas, Gaul and the Island Union remember the oath of PAX. In the east, the German Reich counts its grievances, the Northern Kingdom waits for winter, and Dacia, the Horde and Scythia look at the steppe. The chroniclers of the Forum write: 'Laws always lag behind weapons.'\n\nThis world is taken from the lore of the PaxVanila server."
 pax.1.a:0 "Let it all be recorded."
 pax.2.t:0 "Treaty at the Monolith"
 pax.2.d:0 "[From.GetNameDefCap] calls us into the PAX Union. As in 251, the powers of the west promise not to fight each other and to keep the seal at the tower together."
 pax.2.a:0 "We swear the oath of PAX."
 pax.2.b:0 "We have our own path."
 pax.3.t:0 "Kurultai of the Victors"
 pax.3.d:0 "[From.GetNameDefCap] gathers the eastern powers on the steppe. This is how the Steppe Pact is born."
 pax.3.a:0 "We ride to the Kurultai."
 pax.3.b:0 "The steppe can wait."
 pax.10.t:0 "Storm Over the Monolith"
 pax.10.d:0 "The great powers are at war again. A shell burst at the walls of the tower, and another Guardian has fallen. The chroniclers of the Forum recorded a new crack in the sixth row of stones."
 pax.10.a:0 "The laws have lagged behind weapons again."
 pax.11.t:0 "No More Guardians"
 pax.11.d:0 "Only an empty pedestal is left at the entrance of the Monolith. No one knows that deep beneath the tower, before the door to the Seal hall, stands a seventh golem with a copper heart. Romean engineers are already looking for the way down."
 pax.11.a:0 "The Seal is cracking."
 pax.12.t:0 "Awakening"
 pax.12.d:0 "Romean engineers descended beneath the Monolith and found the seventh golem. When current was brought to it, its eyes lit with a copper glow. The first word of Guardian-7 was 'PAX'."
 pax.12.a:0 "He remembers how this ends."
 pax.30.t:0 "North for Iron"
 pax.30.d:0 "The Reich has too little land. The iron and coal of the Northern Kingdom lie across the border. The generals say the army will make it before the snow. The chroniclers of the Forum say winter is always on the side of the one at home."
 pax.30.a:0 "Prepare for war with the North."
 pax.30.b:0 "Wait."
 pax.20.t:0 "PaxVanila Guide"
 pax.20.d:0 "Choose a section. The economy and army sections are taken from the Family mod guide."
 pax.20.a:0 "Exit"
 pax.21.d:0 "§HThe world.§! 1936, between the First and Second Great Wars. Ten lore powers of the PaxVanila server hold the countries of Europe and Asia. The rest of the world is the 'Far Lands'.\n\n§HFocuses.§! As on the server: Industry, Army and Economy. 'Total War' and 'Hegemony' are mutually exclusive. The 'Legacy' focus gives a bonus of your power, the 'State Faith' focus gives a bonus of its gods. The national branch follows the lore.\n\n§HThe Monolith.§! Two last Guardians stand at the tower. When two great powers go to war, one of them falls. When both have fallen, Romea can awaken Guardian-7.\n\n§HBlocs.§! Romea forms the PAX Union, the Northern Kingdom forms the Steppe Pact."
