 ITA_pax_romul:0 "Romulus the Two Hundred and Fifth"
 ITA_pax_romul_desc:0 "Every ruler of Romea takes the name Romulus on accession. This one has kept the seal since 1931 and remembers how the first crack appeared on the tower in 1914."
 SPR_pax_hannon:0 "Suffete Hanno Barca"
 SPR_pax_hannon_desc:0 "Head of the Council of Suffetes and master of the Golden Caravan. He says the best war is the one both sides profit from."
 GRE_pax_pericles:0 "Archon Pericles Thalassidis"
 GRE_pax_pericles_desc:0 "Descendant of the sailors of Thalassia. Believes the sea remembers everything, even what has sunk."
 FRA_pax_ambiorix:0 "High Druid Ambiorix"
 FRA_pax_ambiorix_desc:0 "Head of the Council of Druids. Every autumn he gathers mistletoe himself in the sacred grove near the capital."
 ENG_pax_elinor:0 "Admiral-President Eleanor Vane"
 ENG_pax_elinor_desc:0 "The Republic of Seafarers elects its president from among captains. Vane commanded the fleet that returned from the Fog of the Nameless."
 GER_pax_arminius:0 "Reich Chancellor Arminius Waldger"
 GER_pax_arminius_desc:0 "Veteran of the trenches of 1914. Promises the Reich the iron and coal of the North and does not believe in blizzards."
 SOV_pax_vseslav:0 "Tsar Vseslav the Icy"
 SOV_pax_vseslav_desc:0 "The Northern Kingdom was founded by refugees of all peoples. Tsar Vseslav says winter is always on the side of the one at home."
 ROM_pax_decebal:0 "Tsar Decebalus the Ninth"
 ROM_pax_decebal_desc:0 "Tsar of the copper mountains. Romea took tribute from Dacia since 117, and Decebalus has not forgiven it."
 TUR_pax_tengiz:0 "Khagan Tengiz"
 TUR_pax_tengiz_desc:0 "Elected by the kurultai of the clans. His ancestors emerged from the sandstorm in 375 and reached the tower itself."
 PER_pax_idanthyrsus:0 "Tsar Idanthyrsus the Second"
 PER_pax_idanthyrsus_desc:0 "Kurgan king of the far east. His treasury is the gold of his ancestors, and his army is horse archers."
 ITA_pax_scientist_1:0 "Марк Витрувий Младший"
 ITA_pax_scientist_1_desc:0 "Главный физик Форума. Первым измерил излучение трещины в Монолите."
 ITA_pax_scientist_2:0 "Корнелия Аврелиана"
 ITA_pax_scientist_2_desc:0 "Инженер легионных мастерских, придумала новые осадные машины."
 ITA_pax_scientist_3:0 "Сисикал Строитель"
 ITA_pax_scientist_3_desc:0 "Человек, который построил тысячу цивок. Вечный слабейший, но всегда на связи: «Да, сисикал, да!»"
 SPR_pax_scientist_1:0 "Ганнон Магонид"
 SPR_pax_scientist_1_desc:0 "Карфагенский корабел, строитель торговых галер нового типа."
 SPR_pax_scientist_2:0 "Элисса Баркид"
 SPR_pax_scientist_2_desc:0 "Литейщица Гаевых пушек, снизила цену осадных орудий."
 GRE_pax_scientist_1:0 "Архимед Младший"
 GRE_pax_scientist_1_desc:0 "Потомок сиракузского геометра, считает волны и корабли."
 GRE_pax_scientist_2:0 "Гипатия Эллинская"
 GRE_pax_scientist_2_desc:0 "Хранительница Александрийской библиотеки и её чертежей."
 FRA_pax_scientist_1:0 "Дивициак Мудрый"
 FRA_pax_scientist_1_desc:0 "Друид-инженер священных рощ, мастер полевых укреплений."
 FRA_pax_scientist_2:0 "Бригита Эдуйская"
 FRA_pax_scientist_2_desc:0 "Строит первые галльские воздушные шары для разведки."
 ENG_pax_scientist_1:0 "Пифей Мореход"
 ENG_pax_scientist_1_desc:0 "Мореход-астроном Союза Числа, считает курс по звёздам."
 ENG_pax_scientist_2:0 "Теано Пифагорейская"
 ENG_pax_scientist_2_desc:0 "Математик школы Пифагора, считает аэродинамику крыла."
 GER_pax_scientist_1:0 "Гельмут Донарсон"
 GER_pax_scientist_1_desc:0 "Кузнец и инженер, мастер германской брони."
 GER_pax_scientist_2:0 "Хильда Вотанстохтер"
 GER_pax_scientist_2_desc:0 "Исследует руды Германских королевств."
 SOV_pax_scientist_1:0 "Борислав Метельный"
 SOV_pax_scientist_1_desc:0 "Строит ракеты в студёных лабораториях Царства."
 SOV_pax_scientist_2:0 "Ольга Печатникова"
 SOV_pax_scientist_2_desc:0 "Изучает Печать Монолита с севера."
 ROM_pax_scientist_1:0 "Децебал Мудрец"
 ROM_pax_scientist_1_desc:0 "Мастер рудников Медного Союза."
 ROM_pax_scientist_2:0 "Залмоксиана Дакская"
 ROM_pax_scientist_2_desc:0 "Конструктор лёгких штурмовых самолётов Дакии."
 TUR_pax_scientist_1:0 "Билге Тюркут"
 TUR_pax_scientist_1_desc:0 "Мастер степных осадных машин Орды."
 TUR_pax_scientist_2:0 "Умай Бурян"
 TUR_pax_scientist_2_desc:0 "Изучает ветры и бури, из которых выходит Орда."
 PER_pax_scientist_1:0 "Дарий Скифский"
 PER_pax_scientist_1_desc:0 "Мастер золота и конных луков."
 PER_pax_scientist_2:0 "Табити Золотая"
 PER_pax_scientist_2_desc:0 "Хранительница царских курганов и их тайн."
 pax_award_1_1:0 "Козийболт"
 pax_award_1_1_desc:0 "Прозвище из чата Бох-мастерской. Говорят, жизнь не бесконечна, так что Козебот ест где надо. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_1_2:0 "Слуга Хирохито-хана"
 pax_award_1_2_desc:0 "Награда за то, что вместе с Еврактором и Силановым служит мастеру Бох без упрёка. (Медаль слегка погнута, как и заслуги.)"
 pax_award_1_3:0 "Знак подсоса Бох-мода"
 pax_award_1_3_desc:0 "Шуточный знак верности Бох-моду. Орда носит его с гордостью. (Комиссия проголосовала, потому что устала.)"
 pax_award_1_4:0 "Бронебойный упор"
 pax_award_1_4_desc:0 "За танки, которые он ставит на оборону так, что их не берёт ни одна пушка. (Вручена после третьей кружки.)"
 pax_award_1_5:0 "Сисикал вечен"
 pax_award_1_5_desc:0 "Награда за преданность Сисикалу, пока Козебот ест где надо. (Эксперты спорят, настоящая ли она.)"
 pax_award_1_6:0 "Медаль рудного окопа"
 pax_award_1_6_desc:0 "За то, что ни разу не отдал шахту врагу. (Носить на левой груди, ближе к совести.)"
 pax_award_1_7:0 "Танковый щит"
 pax_award_1_7_desc:0 "Награда за любовь к танкам на защиту. Козебот ставит бронетехнику в оборону и ни разу не пожалел. (Вручена после третьей кружки.)"
 pax_award_1:0 "Железный окоп"
 pax_award_1_desc:0 "Награда Хирохито за оборону рудников. Окоп Козебота не взяла ни одна армия. (Изготовлена из чайной ложки и энтузиазма.)"
 GER_pax_player_1:0 "kozebot1"
 GER_pax_player_1_desc:0 "Козебот родился в окопе под Берлином и с детства рыл землю быстрее, чем ходил. Верный соратник Хирохито, создателя мода Бох, и мастер обороны германских рудников. Его танки стоят так, что их не сдвинуть даже Монолитом."
 pax_award_2_1:0 "Тень Козебота"
 pax_award_2_1_desc:0 "Награда за то, что верная тень всегда рядом и никогда не спорит. (Вручена без оркестра и с опозданием.)"
 pax_award_2_2:0 "Перо писаря"
 pax_award_2_2_desc:0 "За аккуратные доклады, которые читают даже в Берлине. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_2:0 "Печать верного друга"
 pax_award_2_desc:0 "Вручена за то, что всегда стоит рядом с Козеботом. (Вручена без оркестра и с опозданием.)"
 GER_pax_player_2:0 "siqye"
 GER_pax_player_2_desc:0 "Тень Козебота и ещё один соратник Бох. Где один роет укрепления, там другой носит ему воду и приказы. Германские хроники называют их неразлучными."
 pax_award_3_1:0 "Печать молчаливого мастера"
 pax_award_3_1_desc:0 "За то, что мастер Бох служит тихо и без жалоб. (Эксперты спорят, настоящая ли она.)"
 pax_award_3_2:0 "Ключ от кладовой"
 pax_award_3_2_desc:0 "Доверенное лицо, знающее, где лежит всё снабжение. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_3:0 "Знак безымянного"
 pax_award_3_desc:0 "Награда за службу, о которой никто не знает. Приказы выполняются, а имён не называют. (Изготовлена из чайной ложки и энтузиазма.)"
 FRA_pax_player_3:0 "Euroctor"
 FRA_pax_player_3_desc:0 "Соратник Хирохито по мастерской Бох. Никто не знает, откуда он пришёл. Галльские друиды видели его у священных рощ, а штаб видел только его приказы. Он ничего не рассказывает и этим всех устраивает."
 pax_award_4_1:0 "Гимн Сисикала"
 pax_award_4_1_desc:0 "Награда за то, что гимн знает наизусть и поёт во всех походах. (Носить на левой груди, ближе к совести.)"
 pax_award_4_2:0 "Знамя главного фаната"
 pax_award_4_2_desc:0 "Носить его могут только самые преданные. (Медаль слегка погнута, как и заслуги.)"
 pax_award_4:0 "Орден Сисикала"
 pax_award_4_desc:0 "Высшая награда Ромеи за преданность Сисикалу. «Да, сисикал, да!» (Медаль слегка погнута, как и заслуги.)"
 ITA_pax_player_4:0 "feels"
 ITA_pax_player_4_desc:0 "Первый и самый преданный ученик Сисикала Строителя. Он записывает каждое его слово на восковых табличках и цитирует в Сенате. «Да, сисикал, да!» его девиз, а Ромея его слушает."
 pax_award_5_1:0 "Архив Family"
 pax_award_5_1_desc:0 "За то, что помнит каждый патч и каждую ошибку мода. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_5_2:0 "Печать ворчуна"
 pax_award_5_2_desc:0 "Награда за вечные споры о версиях. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_5:0 "Свиток старых версий"
 pax_award_5_desc:0 "За память о каждой версии Family и бесконечные споры о них. (Вручена без оркестра и с опозданием.)"
 ITA_pax_player_5:0 "comeback_"
 ITA_pax_player_5_desc:0 "Хранитель древних версий. Помнит, что было в Family до всех обновлений, и готов спорить об этом ночь напролёт. Ромейские сенаторы зовут его живой летописью."
 pax_award_6_1:0 "⚡ Модератор-корпуса"
 pax_award_6_1_desc:0 "Фиолетовая роль порядка. Кефир следит, чтобы в корпусе никто не нарушал правил, и банит не глядя. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_6_2:0 "★ Капитан-очевидность"
 pax_award_6_2_desc:0 "Жёлтая роль человека, который всегда первым говорит то, что видят все. (Носить на левой груди, ближе к совести.)"
 pax_award_6_3:0 "Скамейка лузеров"
 pax_award_6_3_desc:0 "Коричневая роль скамейки запасных. Оттуда видно весь фронт, и никто не мешает. (Гордость начисляется отдельно.)"
 pax_award_6_4:0 "Клоун-корпуса"
 pax_award_6_4_desc:0 "Красная роль того, кто смешит штаб, пока идёт мобилизация. Говорят, лучшее оружие против уныния. (Вручена без оркестра и с опозданием.)"
 pax_award_6:0 "Галльский рог"
 pax_award_6_desc:0 "Награда друидов за стойкость на родной земле. (Вручена после третьей кружки.)"
 FRA_pax_player_6:0 "__kefir__"
 FRA_pax_player_6_desc:0 "Галл до мозга костей: усы, плащ, любовь к вину и к священным рощам. Говорят, что кефир он пьёт только по праздникам, а в бою не отступает."
 pax_award_7_1:0 "Знак мастера на все руки"
 pax_award_7_1_desc:0 "За то, что умеет всего понемногу и пригодится везде. (Эксперты спорят, настоящая ли она.)"
 pax_award_7_2:0 "Золотой гаечный ключ"
 pax_award_7_2_desc:0 "Награда за починку всего, что сломалось в штабе. (Изготовлена из чайной ложки и энтузиазма.)"
 pax_award_7:0 "Значок универсала"
 pax_award_7_desc:0 "За то, что везде понемногу, и всегда вовремя. (Эксперты спорят, настоящая ли она.)"
 SPR_pax_player_7:0 "walli"
 SPR_pax_player_7_desc:0 "Везде понемногу: в штабе, в порту, на складе, в лавке. Карфагенские купцы считают его своим, а армия своим. Универсальный человек, которого невозможно потерять."
 pax_award_8_1:0 "Рядовой КаллМиДрист"
 pax_award_8_1_desc:0 "Звание рядового мультиплеера Mi Hist. Даже Вадя когда-то начинал с самого низа. (Эксперты спорят, настоящая ли она.)"
 pax_award_8_2:0 "Meh"
 pax_award_8_2_desc:0 "Роль того, кого ничем не удивить. Любой штурм вызывает у него одно слово: «мех». (Комиссия проголосовала, потому что устала.)"
 pax_award_8_3:0 "Бэст оф зэ Бэст оф зэ Бэст Сисикал"
 pax_award_8_3_desc:0 "Титул лучшего из лучших из лучших сисикала. Никто не помнит, кто его присудил. (Носить на левой груди, ближе к совести.)"
 pax_award_8_4:0 "BoH Hist hoi4"
 pax_award_8_4_desc:0 "Знак игрока исторического мода Бох. Его носят те, кто помнит старые хисты. (Носить на левой груди, ближе к совести.)"
 pax_award_8_5:0 "Саботирующий игры"
 pax_award_8_5_desc:0 "Роль того, кто умеет развалить любую катку изнутри, и все его за это любят. (Вручена без оркестра и с опозданием.)"
 pax_award_8_6:0 "Похотливый"
 pax_award_8_6_desc:0 "Фиолетовая роль, которую Вадя носит с гордостью. Штаб предпочитает не уточнять, почему она ему досталась. (Вручена без оркестра и с опозданием.)"
 pax_award_8_7:0 "Цирковая обезьяна"
 pax_award_8_7_desc:0 "Синяя роль вечного шоумена. Вся Михиста ждёт его выступлений. (Вручена без оркестра и с опозданием.)"
 pax_award_8_8:0 "Медаль обезьяны"
 pax_award_8_8_desc:0 "Награда за самое весёлое поведение на карте. Вешается на грудь рядом с Цирковой обезьяной. (Вручена после третьей кружки.)"
 pax_award_8_9:0 "Медаль главного болтуна"
 pax_award_8_9_desc:0 "Награда за самые длинные и смелые истории про свои победы. Правда в них встречается редко. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_8_10:0 "Рядовой СисиФофорд"
 pax_award_8_10_desc:0 "Розовое звание в армии Сисикала. Рядовой, который знает больше многих генералов. (Вручена после третьей кружки.)"
 pax_award_8:0 "Звезда Михисты"
 pax_award_8_desc:0 "Высшая награда Михисты. Её носят только те, чьё слово закон. (Вручена после третьей кружки.)"
 SOV_pax_player_8:0 "vadya1337"
 SOV_pax_player_8_desc:0 "Вадя, Хозяин Михисты. Его слово в Царстве закон, а его имя знают на всех фронтах. Рассказывают, что Метель 1942 началась в тот день, когда он вышел из дома без шапки."
 pax_award_9_1:0 "Тень Вади"
 pax_award_9_1_desc:0 "Награда за то, что правая рука не отстаёт ни на шаг. (Медаль слегка погнута, как и заслуги.)"
 pax_award_9_2:0 "Красная печать приказа"
 pax_award_9_2_desc:0 "Вручается тем, кто передаёт слова вождя без искажений. (Вручена без оркестра и с опозданием.)"
 pax_award_9:0 "Печать второго"
 pax_award_9_desc:0 "Награда за службу правой рукой Вади. (Носить на левой груди, ближе к совести.)"
 SOV_pax_player_9:0 "Adolfus"
 SOV_pax_player_9_desc:0 "Второй человек в Михисте и правая рука Вади. Он тот, кто молча решает дела, пока первый произносит речи. Его печать на документах весит больше, чем иные армии."
 pax_award_10_1:0 "Скамейка лузеров"
 pax_award_10_1_desc:0 "Почётное место на скамейке лузеров. Орфей сидит там дольше всех и знает каждую доску. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_10_2:0 "Медаль за второе место"
 pax_award_10_2_desc:0 "Награда за то, что он дошёл до финала и ровно там проиграл. (Носить на левой груди, ближе к совести.)"
 pax_award_10_3:0 "Кубок утешения"
 pax_award_10_3_desc:0 "Приз для тех, кто старался и не получил ничего. Орфей хранит его на видном месте. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_10_4:0 "Лавровый венок поражений"
 pax_award_10_4_desc:0 "Венок, сплетённый из всех его проигранных катек. Выглядит красиво. (Вручена после третьей кружки.)"
 pax_award_10_5:0 "Сын твари"
 pax_award_10_5_desc:0 "Прозвище, которое Орфей носит с неловкой гордостью, и стоит оно ровно один евро. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_10_6:0 "Медаль последнего донатера"
 pax_award_10_6_desc:0 "За самую щедрую подачку штабу и самое громкое хвастовство ею. (Комиссия проголосовала, потому что устала.)"
 pax_award_10:0 "Лента невезения"
 pax_award_10_desc:0 "Награда за то, что вернулся живым вопреки всему. Невезение хранит его. (Гордость начисляется отдельно.)"
 GRE_pax_player_10:0 "Orfey"
 GRE_pax_player_10_desc:0 "Самый невезучий полководец в мире: любой план при нём идёт наперекосяк, любая дорога ведёт не туда. Эллины считают его проклятым Посейдоном, но почему-то он всегда возвращается живым."
 pax_award_11_1:0 "Дакийский щит"
 pax_award_11_1_desc:0 "За оборону Дакии, которую не взяли даже со второго раза. (Медаль слегка погнута, как и заслуги.)"
 pax_award_11_2:0 "Знак Arsen34"
 pax_award_11_2_desc:0 "Награда по второму имени генерала. (Эксперты спорят, настоящая ли она.)"
 pax_award_11:0 "Знак Болгара"
 pax_award_11_desc:0 "Награда дакийских полков за харизму и любовь к Болгару. (Выдана строго за заслуги, которых никто не помнит.)"
 ROM_pax_player_11:0 "arsen0541"
 ROM_pax_player_11_desc:0 "Любит Болгар и говорит о нём так, что слушают даже враги. Харизма дакийского вождя и крепкий голос. Идти за ним готовы полки Медного Союза."
 pax_award_12_1:0 "Стальной клин"
 pax_award_12_1_desc:0 "За прорыв, о котором потом писали все хроники. (Медаль слегка погнута, как и заслуги.)"
 pax_award_12_2:0 "Масло танкиста"
 pax_award_12_2_desc:0 "Награда за то, что танки у неё не ломаются. (Гордость начисляется отдельно.)"
 pax_award_12:0 "Танковый гвоздь"
 pax_award_12_desc:0 "Награда за клинья, которыми режут фронты, как гвоздём доску. (Вручена без оркестра и с опозданием.)"
 GER_pax_player_12:0 "Гвоздичка"
 GER_pax_player_12_desc:0 "Германский генерал, ставший легендой танковых клиньев. Он режет вражеский фронт, как гвоздь доску. Враги шутят, что он оставляет после себя только пыль."
 pax_award_13_1:0 "Лапа степного кота"
 pax_award_13_1_desc:0 "За то, что в бою двигается так же тихо, как кошка. (Эксперты спорят, настоящая ли она.)"
 pax_award_13_2:0 "Ожерелье Орды"
 pax_award_13_2_desc:0 "Орда вручает его тем, кого уважает. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_13:0 "Хвост степной кошки"
 pax_award_13_desc:0 "Награда Орды за спокойствие перед бурей. (Изготовлена из чайной ложки и энтузиазма.)"
 TUR_pax_player_13:0 "kotofei_1488"
 TUR_pax_player_13_desc:0 "Спокойный как степь перед бурей. Орда называет его Котофеем, и это единственное имя, которое он признаёт. Говорят, он пришёл в Орду вместе с кошкой, и она ему важнее любого штаба."
 pax_award_14_1:0 "Золотой дот"
 pax_award_14_1_desc:0 "За самый крепкий дот в истории Союза мореходов. (Вручена после третьей кружки.)"
 pax_award_14_2:0 "Древнекитайская мудрость"
 pax_award_14_2_desc:0 "Награда за цитату про котёл, которую знает каждый новобранец. (Комиссия проголосовала, потому что устала.)"
 pax_award_14:0 "Знак дотера"
 pax_award_14_desc:0 "За страсть к доту и танкам. Союз мореходов принял его как своего. (Комиссия проголосовала, потому что устала.)"
 ENG_pax_player_14:0 "g000dd"
 ENG_pax_player_14_desc:0 "Моряк по крови, американец по духу, большой любитель дота и танков. Союз Числа считает его своим странным родственником из-за океана. Вместе с Корой они держат фронт."
 pax_award_15_1:0 "Печать напарника"
 pax_award_15_1_desc:0 "За то, что всегда прикрывает g000dd. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_15_2:0 "Старая броня"
 pax_award_15_2_desc:0 "Награда за службу, которая тянется дольше многих войн. (Вручена без оркестра и с опозданием.)"
 pax_award_15_3:0 "Пивной кор"
 pax_award_15_3_desc:0 "Звание за то, что кор у нас пивной: чем гуще пена, тем крепче держится фронт. (Комиссия проголосовала, потому что устала.)"
 pax_award_15:0 "Бронза старого друга"
 pax_award_15_desc:0 "За то, что вместе с g000dd держит фронт. (Вручена после третьей кружки.)"
 ENG_pax_player_15:0 "kor2062"
 ENG_pax_player_15_desc:0 "Старый друг g000dd. Вдвоём они держат фронт и острят о прошлых боях. Говорят, что без него в Союзе мореходов было бы тише, но и скучнее. Кор у нас пивной: фронт держится на пене."
 pax_award_16_1:0 "Диплом новичка"
 pax_award_16_1_desc:0 "Выдан после сотой катки. Гокерс повесил его на стену и теперь показывает всем. (Вручена без оркестра и с опозданием.)"
 pax_award_16_2:0 "Вечный ученик"
 pax_award_16_2_desc:0 "Награда за слова «я ещё учусь», которые Гокерс повторяет после каждой катки. Он учится так упорно, что учителя уже устали. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_16:0 "Лента новичка"
 pax_award_16_desc:0 "Выдаётся тем, кто учится быстро. Гокерс носит её с гордостью. (Эксперты спорят, настоящая ли она.)"
 ENG_pax_player_16:0 "gokers"
 ENG_pax_player_16_desc:0 "Младший в компании, учится быстро и всё ещё ищет свой путь. Мореходы дали ему полк на пробу. Он уже вырос, но шутить над ним по-прежнему приятно."
 pax_award_17_1:0 "Компас новичка"
 pax_award_17_1_desc:0 "Награда за то, что адмирал без карты всё равно находит порт. (Гордость начисляется отдельно.)"
 pax_award_17_2:0 "Первая верфь"
 pax_award_17_2_desc:0 "За строительство первого корабля собственными руками. (Гордость начисляется отдельно.)"
 pax_award_17:0 "Якорь упорства"
 pax_award_17_desc:0 "Награда Ромеи за упорство, с которым адмирал учится строить флот. (Медаль слегка погнута, как и заслуги.)"
 ITA_pax_player_17:0 "imperialmp"
 ITA_pax_player_17_desc:0 "Адмирал Ромеи, которому ещё предстоит научиться строить флот. Корабли Республики порой тонут раньше, чем выходят из порта. Но он упрям и обещает, что в следующий раз всё получится."
 pax_award_18_1:0 "Знание превыше всего"
 pax_award_18_1_desc:0 "Награда за то, что его интеллект выше интеллекта окружающих. Он сам так считает и охотно напоминает об этом штабу. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_18_2:0 "Забывчивый маг"
 pax_award_18_2_desc:0 "Шуточная награда: маг так занят стихиями, что забывает о подчинённых за считаные минуты. (Носить на левой груди, ближе к совести.)"
 pax_award_18_3:0 "Тайна скифа"
 pax_award_18_3_desc:0 "Награда за то, что даже штаб не знает, кто это. (Изготовлена из чайной ложки и энтузиазма.)"
 pax_award_18_4:0 "Стрела степи"
 pax_award_18_4_desc:0 "Скифская стрела, летящая туда, куда никто не целился. (Вручена после третьей кружки.)"
 pax_award_18:0 "Вопросительный знак"
 pax_award_18_desc:0 "Скифская награда для тех, кого никто не знает. Её нельзя расшифровать. (Не пытайтесь съесть, это не шоколад.)"
 PER_pax_player_18:0 "luxel_"
 PER_pax_player_18_desc:0 "Загадочный вопросительный знак на карте Скифии. Никто не видел его лица, но все знают его приказы. Курганы хранят молчание о том, кто он на самом деле. Сам он говорит, что его интеллект превосходит интеллект окружающих, а знание для него высшая ценность. Магией стихий он стремится к власти над степью, и очень высокого о себе мнения: почти никого не уважает и забывает о подчинённых за считаные минуты."
 pax_award_19_1:0 "Колос Персии"
 pax_award_19_1_desc:0 "Награда за каждый колос, который он спас от голода. (Комиссия проголосовала, потому что устала.)"
 pax_award_19_2:0 "Печать амбара"
 pax_award_19_2_desc:0 "За снабжение, не знающее перебоев, пока оно есть. (Вручена без оркестра и с опозданием.)"
 pax_award_19:0 "Зерно юга"
 pax_award_19_desc:0 "Награда за борьбу с голодом в провинциях. Зерна всегда не хватает, но он не сдаётся. (Эксперты спорят, настоящая ли она.)"
 PER_pax_player_19:0 "artemyruz"
 PER_pax_player_19_desc:0 "Сын великого юга и вечный борец с голодом. Каждый раз, когда он пытается накормить провинцию, зерно кончается раньше, чем наступает урожай. Скифский двор терпит его за терпение и добрый нрав."
 pax_award_20_1:0 "Лимонный чай"
 pax_award_20_1_desc:0 "Награда за то, что штаб без него не начинает ни одного похода. (Гордость начисляется отдельно.)"
 pax_award_20_2:0 "Улыбка маршала"
 pax_award_20_2_desc:0 "Враг сдаётся, увидев её. (Изготовлена из чайной ложки и энтузиазма.)"
 pax_award_20:0 "Лимонная звезда"
 pax_award_20_desc:0 "Самая милая награда Ромеи. Враги не хотят воевать против того, кто её носит. (Комиссия проголосовала, потому что устала.)"
 ITA_pax_player_20:0 "Lemon4ik"
 ITA_pax_player_20_desc:0 "Самый милый маршал Ромеи и лучший друг создателя мира. Враги сдаются ему сами, потому что не могут на него сердиться. В штабе его зовут Лимончиком, и без него не начинается ни один поход."
 pax_award_21_1:0 "Знак подсоса Бох-мода"
 pax_award_21_1_desc:0 "Шуточный знак для создателя Family, который тайно болеет за Бох-мод и верен Хирохито-хану. (Изготовлена из чайной ложки и энтузиазма.)"
 pax_award_21_2:0 "Перо Создателя"
 pax_award_21_2_desc:0 "Награда за каждую строчку, написанную для мира PaxVanila. (Изготовлена из чайной ложки и энтузиазма.)"
 pax_award_21_3:0 "Венец Сенатора"
 pax_award_21_3_desc:0 "Высшее признание Сената Ромеи. (Комиссия проголосовала, потому что устала.)"
 pax_award_21:0 "Печать Создателя Family"
 pax_award_21_desc:0 "Высшая награда мира PaxVanila. Принадлежит тому, кто написал правила. (Гордость начисляется отдельно.)"
 ITA_pax_player_21:0 "Ромул Арутр"
 ITA_pax_player_21_desc:0 "Создатель мода Family и хранитель его древних чертежей. Каждый ромейский правитель берёт имя Ромул, но Арутр единственный, кто сам написал правила мира. Сенат слушает его так же внимательно, как Монолит. Втайне он ещё и верный подсос Бох-мода и Хирохито-хана, о чём в Ромее предпочитают не говорить вслух."
 pax_award_22_1:0 "Свиток Vesti"
 pax_award_22_1_desc:0 "За рождение Vesti, ставшей основой мода Family. (Изготовлена из чайной ложки и энтузиазма.)"
 pax_award_22_2:0 "Печать архитектора"
 pax_award_22_2_desc:0 "Награда за то, что один из родителей Family. (Вручена без оркестра и с опозданием.)"
 pax_award_22:0 "Чертёж Vesti"
 pax_award_22_desc:0 "Награда за создание Vesti и вклад в Family. Эллада хранит его чертежи под замком. (Вручена без оркестра и с опозданием.)"
 GRE_pax_player_22:0 "Extreme"
 GRE_pax_player_22_desc:0 "Создатель Vesti и один из отцов мода Family. Эллада зовёт его Экстримом и верит, что чертежи, которые он оставил, держат Лигу вместе. Он редко говорит, но если говорит, то все записывают."
 pax_award_23_1:0 "Линкор мечты"
 pax_award_23_1_desc:0 "Награда за любовь к самым большим кораблям флота. (Эксперты спорят, настоящая ли она.)"
 pax_award_23_2:0 "Британский чай"
 pax_award_23_2_desc:0 "За британский дух, с которым он ходит в бой. (Вручена после третьей кружки.)"
 pax_award_23:0 "Якорь без лодок"
 pax_award_23_desc:0 "Награда за верность линкорам. Подводные лодки по-прежнему уходят безнаказанными. (Гордость начисляется отдельно.)"
 ENG_pax_player_23:0 "Molod"
 ENG_pax_player_23_desc:0 "Британец по духу, адмирал Союза мореходов. Любит большие линкоры, а вот подводных охотников до сих пор побаивается: лодки у него обычно уходят безнаказанно. Мореходы зовут его Молодым, хотя он давно не молод. В штабе ходит шутка, что его тайная страсть это длинные мощные орудия главного калибра, и он в этом даже не стесняется признаться."
 pax_award_24_1:0 "Резец картографа"
 pax_award_24_1_desc:0 "За каждую гору, нанесённую на Sapn Maps. (Эксперты спорят, настоящая ли она.)"
 pax_award_24_2:0 "Легенда сисикала"
 pax_award_24_2_desc:0 "Награда за то, что его слава живёт дольше самого мода. (Изготовлена из чайной ложки и энтузиазма.)"
 pax_award_24:0 "Карта Сисикала"
 pax_award_24_desc:0 "Награда за Sapn Maps. Говорят, на ней отмечены все горы мира. (Медаль слегка погнута, как и заслуги.)"
 ROM_pax_player_24:0 "Sapr"
 ROM_pax_player_24_desc:0 "Создатель Sapn Maps и живая легенда Сисикала. Дакийские картографы считают, что каждая гора на карте нарисована его рукой. Говорят, он единственный, кто дочитал Сисикала до конца."
 pax_award_25_1:0 "Правая рука Sapr"
 pax_award_25_1_desc:0 "Награда за службу второй рукой великого картографа. (Вручена без оркестра и с опозданием.)"
 pax_award_25_2:0 "Огненное клеймо"
 pax_award_25_2_desc:0 "За боевой пыл и самоотверженность. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_25:0 "Огненная маска"
 pax_award_25_desc:0 "Награда Медного Союза для огненного воина и второй руки Sapr. (Выдана строго за заслуги, которых никто не помнит.)"
 ROM_pax_player_25:0 "mavrus"
 ROM_pax_player_25_desc:0 "Вторая рука Sapr и его вечный помощник. Огненный воин Медного Союза: там, где он проходит, остаётся только пепел. Любит Sapr и верен ему до последней карты."
 pax_award_26_1:0 "Золото забытых"
 pax_award_26_1_desc:0 "Награда за то, чего никто не заметил, но все использовали. (Медаль слегка погнута, как и заслуги.)"
 pax_award_26_2:0 "Печать сисикала"
 pax_award_26_2_desc:0 "Недооценённый игрок получает сисикала по праву. (Гордость начисляется отдельно.)"
 pax_award_26:0 "Недооценённый"
 pax_award_26_desc:0 "Награда, которую вручают тем, кого помнят меньше, чем стоило бы. Она тяжелее золота. (Не пытайтесь съесть, это не шоколад.)"
 SPR_pax_player_26:0 "Nizzi"
 SPR_pax_player_26_desc:0 "Самый недооценённый игрок во всём Сисикале и сообществе Hearts of Iron. Он бывал почти везде и побеждал всех, но об этом почти никто не помнит. Карфагенские хроники записали его имя мелким шрифтом, а зря."
 pax_award_27_1:0 "Совместная медаль «Любят друг друга»"
 pax_award_27_1_desc:0 "Шуточная парная медаль для Трахиночки и Хэвина: он ждёт её в Орде, она пишет ему из Эллады, и они очень любят друг друга. Вторую такую же носит он. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_27_2:0 "Цветок Эллады"
 pax_award_27_2_desc:0 "Награда за красоту, с которой она вернётся. (Эксперты спорят, настоящая ли она.)"
 pax_award_27_3:0 "Письмо из степи"
 pax_award_27_3_desc:0 "Памятка о том, что её кто-то ждёт в Орде. (Вручена после третьей кружки.)"
 pax_award_27:0 "Лента возвращения"
 pax_award_27_desc:0 "Эллинская награда, которую хранят до возвращения Трахиночки. (Эксперты спорят, настоящая ли она.)"
 GRE_pax_player_27:0 "trazynn_"
 GRE_pax_player_27_desc:0 "Трахиночка, наша общая любимица Эллады. Её все помнят, но с тех пор, как она подружилась с Хэвингом, о ней ничего не слышно. Эллинские хроники хранят надежду, что она однажды вернётся."
 pax_award_28_1:0 "Орда в ладони"
 pax_award_28_1_desc:0 "Награда за то, что вся Орда зовёт его ханом. (Носить на левой груди, ближе к совести.)"
 pax_award_28_2:0 "Меч мастера Бох"
 pax_award_28_2_desc:0 "Подарок соратников из мастерской Бох. (Медаль слегка погнута, как и заслуги.)"
 pax_award_28:0 "Корона Бох"
 pax_award_28_desc:0 "Высшая награда Бох-мастерской. Носит только её создатель. (Не пытайтесь съесть, это не шоколад.)"
 TUR_pax_player_28:0 "Хирохито"
 TUR_pax_player_28_desc:0 "Создатель мода Бох и повелитель его соратников. Орда зовёт его Хирохито-хан. Козебот, Еврактор и Силанов служат ему и называют своим мастером."
 pax_award_29_1:0 "Перо порядка"
 pax_award_29_1_desc:0 "За то, что у него в штабе всё на своих местах. (Медаль слегка погнута, как и заслуги.)"
 pax_award_29_2:0 "Печать Бох"
 pax_award_29_2_desc:0 "Награда мастерской Бох за верность Хирохито. (Носить на левой груди, ближе к совести.)"
 pax_award_29:0 "Печать писаря"
 pax_award_29_desc:0 "За аккуратные приказы и порядок на карте. (Изготовлена из чайной ложки и энтузиазма.)"
 GER_pax_player_29:0 "Silanov A.N."
 GER_pax_player_29_desc:0 "Ещё один соратник мастерской Бох. Строг, пунктуален и любит порядок на карте. Германские короли считают его надёжным писарем и полководцем."
 pax_award_30_1:0 "Совместная медаль «Любят друг друга»"
 pax_award_30_1_desc:0 "Шуточная парная медаль для Хэвина и Трахиночки: они самая настоящая парочка и любят друг друга. На фронте стоят плечом к плечу, а вторую такую же носит она. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_30_2:0 "Письма в Элладу"
 pax_award_30_2_desc:0 "Награда за каждое письмо, которое дошло до адресата. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_30_3:0 "Сисикал навсегда"
 pax_award_30_3_desc:0 "За слова «Сисикал живёт вечно», сказанные в 3:36 ночи. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_30:0 "Лента двоих"
 pax_award_30_desc:0 "Награда Бох-мастерской за любовь к Трахиночке. Её вручают только вдвоём. (Эксперты спорят, настоящая ли она.)"
 TUR_pax_player_30:0 "Havin'"
 TUR_pax_player_30_desc:0 "Хэвин из мастерской Бох, соратник Хирохито-хана. Вместе с Трахиночкой они пара, которую знает вся Орда: она осталась в Элладе, а он в степи, и письма между ними не прекращаются. Говорят, ради неё он готов обойти пол-мира."
 pax_award_31_1:0 "Я Сисивин"
 pax_award_31_1_desc:0 "Роль и гордость. Он сам так сказал. (Комиссия проголосовала, потому что устала.)"
 pax_award_31_2:0 "Смех легиона"
 pax_award_31_2_desc:0 "За смех, который заражает целую армию. (Выдана строго за заслуги, которых никто не помнит.)"
 pax_award_31:0 "Знак Сисивина"
 pax_award_31_desc:0 "Шуточная награда Ромеи. Тот, кто её носит, поднимает боевой дух одним своим видом. (Комиссия проголосовала, потому что устала.)"
 ITA_pax_player_31:0 "Nurik"
 ITA_pax_player_31_desc:0 "Нурик, воин Ромеи, который с гордостью называет себя Сисивином. Его лицо знает вся армия: стоит ему появиться перед строем, и легионеры начинают хохотать, а потом идут в бой ещё веселее. Говорят, сам Сисикал признал его своим."
 pax_award_32_1:0 "Танковый щит"
 pax_award_32_1_desc:0 "Награда за любовь к танкам на защиту. Колдер ставит бронетехнику в оборону и ни разу не пожалел. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_32_2:0 "Бронебойный упор"
 pax_award_32_2_desc:0 "За танки, которые стоят так, что их не берёт ни одна пушка. (Эксперты спорят, настоящая ли она.)"
 pax_award_32_3:0 "Стальной клин"
 pax_award_32_3_desc:0 "За прорыв, о котором потом писали все хроники. (Комиссия проголосовала, потому что устала.)"
 pax_award_32_4:0 "Масло танкиста"
 pax_award_32_4_desc:0 "Награда за то, что танки у него не ломаются. (Носить на левой груди, ближе к совести.)"
 pax_award_32_5:0 "Танковый гвоздь"
 pax_award_32_5_desc:0 "Награда за клинья, которыми он режет фронты, как гвоздём доску. (Вручена после третьей кружки.)"
 pax_award_32_6:0 "Золотая гусеница"
 pax_award_32_6_desc:0 "Высшая танковая награда Ромеи. Её вручают только тем, чьи танки доходят до моря. (Гордость начисляется отдельно.)"
 pax_award_32_7:0 "Танковод"
 pax_award_32_7_desc:0 "Награда за любовь к танкам и смелые прорывы. Колдер водит бронеколонны так, будто едет на праздник. (Гордость начисляется отдельно.)"
 pax_award_32_8:0 "Сисикаллер"
 pax_award_32_8_desc:0 "Титул тех, кто живёт и дышит Сисикалом. Колдер носит его с гордостью. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_32_9:0 "Любимчик создателя"
 pax_award_32_9_desc:0 "Награда лично от Ромула Арутра. Самое тёплое признание в Ромее. (Носить на левой груди, ближе к совести.)"
 pax_award_32:0 "Сакуровый венок"
 pax_award_32_desc:0 "Награда Ромеи за красоту и боевой дух. Лепестки не вянут, пока жив Сисикал. (Изготовлена из чайной ложки и энтузиазма.)"
 ITA_pax_player_32:0 "KoLDeR"
 ITA_pax_player_32_desc:0 "Колдер, самый любимый сисикаллер Ромулов. Рыжий лис в венке из лепестков сакуры, которого враги принимают за шутку, пока не поздно. Он ещё и танковод: его бронеклинья рвут фронты быстрее, чем враг успевает понять, что произошло. Говорят, под его знаменем легионеры поют гимн Сисикала быстрее, чем маршируют."
 pax_award_33_1:0 "Танковая степь"
 pax_award_33_1_desc:0 "Награда за любовь к броне и танковым клиньям. (Гордость начисляется отдельно.)"
 pax_award_33_2:0 "Красный колпак"
 pax_award_33_2_desc:0 "Узнаваемый знак генерала в тёмных очках. Враги видят колпак и отходят. (Комиссия проголосовала, потому что устала.)"
 pax_award_33:0 "Орден монгольской брони"
 pax_award_33_desc:0 "Награда танковой Монголии за степные прорывы. (Изготовлена из чайной ложки и энтузиазма.)"
 MON_pax_player_33:0 "Арсен (Монголия)"
 MON_pax_player_33_desc:0 "Арсен, генерал танковой Монголии и ханский любимец. Он водит бронеколонны по степи так, будто едет на праздник, и ни одна пехота перед ним не устоит. В штабе его знают по красному колпаку и тёмным очкам."
 pax_award_34_1:0 "Злоупотребление опиумом"
 pax_award_34_1_desc:0 "Степной недуг. Арсен слишком часто задерживается над калыванем, из-за чего приказы выходят вялыми и запутанными. (Вручена без оркестра и с опозданием.)"
 pax_award_34:0 "Калыван степи"
 pax_award_34_desc:0 "Дымный трофей, который Арсен возит с собой в каждый поход. (Эксперты спорят, настоящая ли она.)"
 MON_pax_player_34:0 "Арсен с калыванем"
 MON_pax_player_34_desc:0 "Тот же Арсен, но с калыванем. В дыму он становится философом, и приказы выходят красивые, но запутанные. Степные ветераны говорят, что с калыванем он быстрее, но иногда забывает, куда ехали танки."
 pax_award_35:0 "Ханская печать Булгара"
 pax_award_35_desc:0 "Награда булгарской степи за танковый клин, прошедший сквозь три фронта. (Гордость начисляется отдельно.)"
 BUL_pax_player_35:0 "Арсен Булгар"
 BUL_pax_player_35_desc:0 "Арсен из Булгара, степной брат монгольских Арсенов. Говорит, что в его жилах течёт волжская вода и крымский ветер, а броня для него вторая кожа. Булгары чтят его как хана танковых клиньев."
 pax_award_36_1:0 "Подсос Сапра"
 pax_award_36_1_desc:0 "Шуточная награда за то, как преданно он стоит рядом с создателем Sapn Maps и кивает на каждую карту. (Не пытайтесь съесть, это не шоколад.)"
 pax_award_36_2:0 "Сапр-мод"
 pax_award_36_2_desc:0 "Награда за любовь к моду Sapr. Дэби ругает его, но играет только в него. (Медаль слегка погнута, как и заслуги.)"
 pax_award_36:0 "Двенадцатый командир"
 pax_award_36_desc:0 "Награда Дакии за двенадцатый заход в бой и танковый клин без лишних слов. (Вручена после третьей кружки.)"
 ROM_pax_player_36:0 "Commander-in-Chief Dabi"
 ROM_pax_player_36_desc:0 "Главнокомандующий Дэби, он же «Боевой вертолёт Апачи». Генерал Восточного фронта: служит и Германии, и Союзу, и Дакии, и везде танкист. В биографии у него написано: не фанат первой доки, не фанат SAPR MP, не фанат 1-го абуза, не фанат жёсткого режима 41 года, зато фанат Nizzi MP и двенадцатый коммандер."
