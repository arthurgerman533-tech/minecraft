 won_sp_riv_h:0 "Самые влиятельные сферы"
 won.250.t:0 "Растущая экономическая сфера"
 won.250.d:0 "Наши партнёры торгуют, строят и инвестируют друг в друга в масштабах, заметных всему миру. Влияние нашей экономической сферы достигло 50, и малые страны начинают смотреть на нас, прежде чем подписывать что-либо с другими."
 won.250.a:0 "Процветание связывает крепче договоров."
 won.251.t:0 "Экономическая гегемония"
 won.251.d:0 "Влияние нашей сферы превысило 80. Цены, кредит и промышленность всего нашего блока теперь движутся в ритме наших министерств, а столицы соперников говорят о нашей сфере так, как когда-то говорили об империях."
 won.251.a:0 "Мир теперь живёт за счёт нашей экономики."
