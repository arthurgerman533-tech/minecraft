 # ---------------------------------------------------------------- Game rules
 RULE_GROUP_WON:0 "Economic System Rework"
 RULE_WON_SYSTEM_CHOICE:0 "Economic System Choice"
 RULE_WON_SYSTEMS_IDEOLOGICAL:0 "Ideological"
 RULE_WON_SYSTEMS_IDEOLOGICAL_DESC:0 "Every country can only adopt the economic systems of its ruling ideology: democracies choose between capitalist systems, communists between socialist ones, fascists between corporatist ones."
 RULE_WON_SYSTEMS_FREE_PLAYERS:0 "Free for Players"
 RULE_WON_SYSTEMS_FREE_PLAYERS_DESC:0 "Human players may adopt any of the twelve economic systems whatever their ideology. AI countries stay ideological."
 RULE_WON_SYSTEMS_FREE_ALL:0 "Free for Everyone"
 RULE_WON_SYSTEMS_FREE_ALL_DESC:0 "Every country may adopt any economic system. About a quarter of AI countries break with convention and pick a system from another ideology."
 RULE_WON_AI_OFFERS:0 "AI economic proposals to players"
 RULE_WON_OFFERS_ON:0 "On"
 RULE_WON_OFFERS_ON_DESC:0 "AI countries may propose trade agreements and investments to human players (at most one offer every 120 days)."
 RULE_WON_OFFERS_OFF:0 "Off"
 RULE_WON_OFFERS_OFF_DESC:0 "AI countries never send economic proposals to human players. They still trade with each other."
 RULE_WON_EVENT_RATE:0 "Economic event frequency"
 RULE_WON_EVENTS_NORMAL:0 "Normal"
 RULE_WON_EVENTS_NORMAL_DESC:0 "About one economic event every four to five months."
 RULE_WON_EVENTS_HIGH:0 "Frequent"
 RULE_WON_EVENTS_HIGH_DESC:0 "About one economic event every two to three months."
 RULE_WON_EVENTS_LOW:0 "Rare"
 RULE_WON_EVENTS_LOW_DESC:0 "About one economic event every nine months."
 # ---------------------------------------------------------------- Events
 won.1.t:0 "The Ministry of Economy Reports"
 won.1.d:0 "The Minister of Economy has prepared a first report for [Root.GetLeader]. Our economy produces [?won_gdp|1] bn a year, the treasury holds [?won_treasury|1] bn, and the nation runs a [GetWonSystem].\n\nFrom now on the economy is ours to steer: set taxes, interest rates and budget priorities; reform the economic system; and use the diplomacy screen of any country to sign trade agreements and construction pacts, invest capital, hire their companies or sell our own services.\n\nClick the treasury figure in the top bar to open the ministry at any time."
 won.1.a:0 "Show me the numbers."
 won.1.b:0 "Later."
 won.2.t:0 "Economic Reform"
 won.2.d:0 "Economists, industrialists and party officials crowd the cabinet room. Each has a vision for the nation's economy. Our ideology rules out some of them, but within those limits the choice is ours.\n\nCurrent system: [GetWonSystem]."
 won.2.x:0 "Keep things as they are (refund 75 political power)."
 won.3.t:0 "A New Regime, a New Economy"
 won.3.d:0 "The old economic order did not survive the change of government. The ministries need a new doctrine, and they need it now."
 won_sys_opt_1:0 "Laissez-Faire Capitalism."
 won_sys_opt_2:0 "Keynesian Mixed Economy."
 won_sys_opt_3:0 "Social Market Economy."
 won_sys_opt_4:0 "Command Economy."
 won_sys_opt_5:0 "Market Socialism."
 won_sys_opt_6:0 "War Communism."
 won_sys_opt_7:0 "Corporatism."
 won_sys_opt_8:0 "Autarky."
 won_sys_opt_9:0 "Defence Economy."
 won_sys_opt_10:0 "State Capitalism."
 won_sys_opt_11:0 "Agrarian Economy."
 won_sys_opt_12:0 "Mercantilism."
 won.10.t:0 "Stock Market Rally"
 won.10.d:0 "Share prices have climbed for weeks. Clerks are buying stock on margin and the papers talk of a new era of prosperity. The central bank asks whether it should take away the punch bowl."
 won.10.a:0 "Let the good times roll."
 won.10.b:0 "Raise interest rates before it overheats."
 won.11.t:0 "Market Crash"
 won.11.d:0 "Black Monday: the exchange lost a fifth of its value in a single session. Brokers are ruined and banks that lent against shares are in trouble."
 won.11.a:0 "Bail out the banks."
 won.11.b:0 "Let them fail. The market must clear."
 won.11.p:0 "Banking Supervision: the deposit fund steadies the markets."
 won.12.t:0 "Run on the Banks"
 won.12.d:0 "Queues stretch around the block as depositors rush to withdraw their savings. If the panic spreads, credit will freeze."
 won.12.a:0 "Guarantee every deposit."
 won.12.b:0 "Declare a bank holiday."
 won.12.p:0 "Banking Supervision: deposit insurance pays out."
 won.13.t:0 "Inflation Spiral"
 won.13.d:0 "Prices are rising faster than wages. Housewives complain that the weekly shop costs a third more than last year, and unions demand compensation."
 won.13.a:0 "Freeze prices by decree."
 won.13.b:0 "Tighten the money supply."
 won.13.c:0 "Ride it out."
 won.14.t:0 "Deflation Trap"
 won.14.d:0 "Prices keep falling. Buyers wait for things to get cheaper, factories cut output and debts grow heavier in real terms."
 won.14.a:0 "Cut interest rates to the bone."
 won.14.b:0 "Prime the pump with public spending."
 won.15.t:0 "General Strike"
 won.15.d:0 "The unions have called out the factories. Workers say wages are not keeping up with taxes and prices."
 won.15.a:0 "Negotiate a settlement."
 won.15.b:0 "Break the strike."
 won.15.c:0 "Wait until they run out of money."
 won.15.p:0 "Labour Relations Board: arbitration settles it."
 won.16.t:0 "Bumper Harvest"
 won.16.d:0 "Ideal weather has given our farmers the best harvest in a generation. Granaries are overflowing."
 won.16.a:0 "Sell the surplus abroad."
 won.16.b:0 "Cheap bread for everyone."
 won.17.t:0 "Harvest Failure"
 won.17.d:0 "Drought and blight have ruined the crops in several provinces. Bread prices are climbing."
 won.17.a:0 "Import grain, whatever the cost."
 won.17.b:0 "The people will tighten their belts (risk of famine)."
 won.17.p:0 "Farm Subsidies: release grain from the state reserves."
 won.18.t:0 "Black Market"
 won.18.d:0 "With the war straining supplies, a black market in everything from cigarettes to tyres has sprung up in every city."
 won.18.a:0 "Crack down on the profiteers."
 won.18.b:0 "Look the other way."
 won.18.p:0 "Anti-Corruption Bureau: raid the black markets."
 won.19.t:0 "An Inventor's Breakthrough"
 won.19.d:0 "A provincial engineer has patented a process that could cut production costs across our industry. He needs capital to scale it up."
 won.19.a:0 "Fund him."
 won.19.b:0 "Private investors can back him."
 won.20.t:0 "Industrial Disaster"
 won.20.d:0 "An explosion has gutted one of our largest plants. Dozens are dead and production will be disrupted for months."
 won.20.a:0 "Rebuild it with state money."
 won.20.b:0 "It is the owners' problem."
 won.20.p:0 "Industrial Safety: rescue teams and quick repairs."
 won.21.t:0 "Consumer Boom"
 won.21.d:0 "Department stores are packed. For the first time, ordinary families are buying radios, refrigerators and even motor cars."
 won.21.a:0 "Let them spend."
 won.21.b:0 "Tax the luxury goods."
 won.22.t:0 "The Rationing Debate"
 won.22.d:0 "The war is eating our supplies. The ministry proposes ration cards for food, fuel and clothing."
 won.22.a:0 "Introduce rationing."
 won.22.b:0 "Keep the shelves open."
 won.23.t:0 "Corruption Scandal"
 won.23.d:0 "A newspaper has revealed that state contracts were steered to firms owned by ministers' relatives."
 won.23.a:0 "Order a public inquiry."
 won.23.b:0 "Make it go away."
 won.23.p:0 "Anti-Corruption Bureau: the Bureau handles it quietly."
 won.24.t:0 "Credit Rating Downgraded"
 won.24.d:0 "International bankers have downgraded our bonds. Borrowing will cost more, and investors are nervous."
 won.24.a:0 "Promise fiscal reform: raise taxes."
 won.24.b:0 "We do not answer to bankers."
 won.25.t:0 "Credit Rating Upgraded"
 won.25.d:0 "Our sound finances have impressed the markets. Our bonds are now among the safest in the world."
 won.25.a:0 "Excellent."
 won.26.t:0 "Emigre Scientists"
 won.26.d:0 "Scientists and engineers fleeing persecution abroad are asking for visas. They bring rare skills."
 won.26.a:0 "Welcome them, and fund their laboratories."
 won.26.b:0 "Immigration quotas stay as they are."
 won.27.t:0 "Brain Drain"
 won.27.d:0 "Some of our best scientists and engineers have quietly emigrated, and more are applying for exit permits."
 won.27.a:0 "Let them go."
 won.27.b:0 "Close the borders to them."
 won.28.t:0 "The Railway Barons"
 won.28.d:0 "A consortium offers to lay new lines in the provinces if the state shares the cost."
 won.28.a:0 "Sign the concession."
 won.28.b:0 "Too expensive."
 won.29.t:0 "Capital Flight"
 won.29.d:0 "Spooked investors are moving their money abroad. Gold is leaving the country by the trainload."
 won.29.a:0 "Impose capital controls."
 won.29.b:0 "Raise rates to keep money here."
 won.29.c:0 "Let it go."
 won.29.p:0 "Banking Supervision: the central bank holds the line."
 won.31.t:0 "Trade Partner Demands Better Terms"
 won.31.d:0 "Negotiators from [?global.won_ev_partner_name.GetNameDef] say our trade agreement favours us too much. They want a better deal, or they may walk away."
 won.31.a:0 "Sweeten the deal."
 won.31.b:0 "A deal is a deal."
 won.32.t:0 "The Recession of 1937"
 won.32.d:0 "Just as the recovery seemed secure, output has slumped again. Economists blame the government's rush to balance the budget; bankers blame the deficits."
 won.32.a:0 "Spend our way out."
 won.32.b:0 "Balance the budget, whatever it takes."
 won.33.t:0 "The Gold Standard"
 won.33.d:0 "Other nations have left gold and devalued, making their exports cheaper than ours. Should we follow?"
 won.33.a:0 "Leave gold and devalue."
 won.33.b:0 "Hold the gold line."
 won.34.t:0 "A World's Fair"
 won.34.d:0 "Our capital has been chosen to host a World's Fair. Pavilions of every nation will show the world of tomorrow."
 won.34.a:0 "Host it in style."
 won.34.b:0 "A modest fair will do."
 won.35.t:0 "Housing Shortage"
 won.35.d:0 "Workers are pouring into the industrial cities faster than homes can be built. Rents are soaring."
 won.35.a:0 "Build public housing."
 won.35.b:0 "The market will provide."
 won.36.t:0 "War Profiteering"
 won.36.d:0 "Arms makers are reporting record profits while soldiers die at the front. The public is outraged."
 won.36.a:0 "Impose an excess profits tax."
 won.36.b:0 "Production comes first."
 won.37.t:0 "Hyperinflation"
 won.37.d:0 "Prices are doubling month after month. Workers are paid twice a day and run to the shops before their wages lose value."
 won.37.a:0 "Currency reform: a new money, whatever it costs."
 won.37.b:0 "Keep the presses running."
 won.38.t:0 "Debt Crisis Warning"
 won.38.d:0 "Our public debt now exceeds our entire annual GDP ([?won_debt_pct|0]%). Interest payments are crushing the budget and lenders demand higher rates.\n\nRaise taxes, cut the budget priority, take an austerity budget, or restructure the debt from the Ministry of Economy."
 won.38.a:0 "We must act."
 won.40.t:0 "Assets Abroad Lost"
 won.40.d:0 "Investments worth [?won_lost_assets|1] bn have been lost: the host country went to war with us, nationalised its industry or ceased to exist."
 won.40.a:0 "A bitter loss."
 won.50.t:0 "Foreign Investors"
 won.50.d:0 "Industrialists from [?global.won_ev_partner_name.GetNameDef] want to build a modern factory in our country with their own money. In return they would take a share of its profits every month."
 won.50.a:0 "Welcome their money."
 won.50.b:0 "Only as a joint venture."
 won.50.c:0 "Our industry is not for sale."
 won.60.t:0 "The Corporate Chambers Convene"
 won.60.d:0 "Employers and union leaders face each other across the chamber. The state must decide whose interests come first this year."
 won.60.a:0 "Back the industrialists."
 won.60.b:0 "Back the workers."
 won.60.c:0 "Remind them both who is in charge."
 won.61.t:0 "The Mefo Bills Fall Due"
 won.61.d:0 "The bills we issued last year have matured. Creditors expect [?won_mefo_due|2] bn."
 won.61.a:0 "Pay in full."
 won.61.b:0 "Pay half and roll over the rest."
 won.61.c:0 "Default."
 won.62.t:0 "The Five-Year Plan Ends"
 won.62.d:0 "The plan aimed for [?won_fyp_target|0] factories. Our industry now counts [?won_fyp_now|0]."
 won.62.a:0 "The plan has been fulfilled!"
 won.62.b:0 "Saboteurs and wreckers are to blame."
 won.70.t:0 "Prospectors Strike It Rich"
 won.70.d:0 "The survey company reports a rich deposit in one of our core states. Mining can begin at once."
 won.70.a:0 "Start digging."
