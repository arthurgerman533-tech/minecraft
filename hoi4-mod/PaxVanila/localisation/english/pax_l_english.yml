 SOV_pax_her:0 "Legacy: Blizzard of 1942"
 SOV_pax_her_desc:0 "In winter, enemies on the Kingdom's soil freeze into the snow. The legacy of the ten lore powers, like the 'her' focus on the PaxVanila server."
 SOV_pax_fai:0 "State Faith: Keepers of the Seal"
 SOV_pax_fai_desc:0 "Northerners believe in the Monolith more than in the gods. The Seal holds the world."
 SOV_pax_tsar:0 "Tsar in the Ice"
 SOV_pax_tsar_desc:0 "The Kingdom was gathered by refugees of all peoples. The Tsar holds them together."
 SOV_pax_winter_campaign:0 "Custom of the Winter Campaign"
 SOV_pax_winter_campaign_desc:0 "The custom was born in 1241, when a blizzard stopped the Horde. Northerners fight in winter."
 SOV_pax_forests:0 "Retreat to the Forests and Wait"
 SOV_pax_forests_desc:0 "Northerners do not hold the border. They go into the forests and wait for the enemy to freeze."
 SOV_pax_north_iron:0 "Iron of the North"
 SOV_pax_north_iron_desc:0 "The Reich will come for this iron. Let it first become guns."
 SOV_pax_kurultai:0 "Kurultai of the Victors"
 SOV_pax_kurultai_desc:0 "The eastern powers gather on the steppe. The Steppe Pact is born."
