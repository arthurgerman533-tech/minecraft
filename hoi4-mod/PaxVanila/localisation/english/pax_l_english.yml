 TUR_pax_fai:0 "State Faith: Yasa"
 TUR_pax_fai_desc:0 "Tengri and Umay. Under the open sky the cavalry of the Horde knows no defeat."
 TUR_pax_clans:0 "Kurultai of the Clans"
 TUR_pax_clans_desc:0 "The clans of the Horde elect a khagan and swear to him on horseback."
 TUR_pax_cavalry:0 "Cavalry of the Steppe"
 TUR_pax_cavalry_desc:0 "The cavalry of the Horde went from the sandstorm to the walls of Romea."
 TUR_pax_sand_roads:0 "Roads Through the Sands"
 TUR_pax_sand_roads_desc:0 "The old caravan roads become iron ones."
 TUR_pax_raid:0 "Back to the Walls"
 TUR_pax_raid_desc:0 "In 375 the Horde reached the tower. The khagan wants to repeat the path of his ancestors through the lands of Hellas."
