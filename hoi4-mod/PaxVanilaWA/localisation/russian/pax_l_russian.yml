l_russian:
 PAX_idea_mining_guilds:0 "Шахтёрские артели"
 PAX_idea_mining_guilds_desc:0 "Шахтёры копают глубже и быстрее."
 PAX_idea_war_economy:0 "Военные заказы"
 PAX_idea_war_economy_desc:0 "Заводы работают на войну."
 PAX_idea_mobilization:0 "Мобилизация"
 PAX_idea_mobilization_desc:0 "Резервисты готовы встать в строй."
 PAX_idea_fortifications:0 "Стены вокруг стен"
 PAX_idea_fortifications_desc:0 "Своя земля защищена лучше чужой."
 PAX_idea_total_war:0 "Тотальная война"
 PAX_idea_total_war_desc:0 "Вся нация воюет."
 PAX_idea_trade_routes:0 "Торговые пути"
 PAX_idea_trade_routes_desc:0 "Торговля кормит казну."
 PAX_idea_diplomatic_corps:0 "Дипкорпус"
 PAX_idea_diplomatic_corps_desc:0 "Послы держав знают все старые договоры."
 PAX_idea_hegemony:0 "Гегемония"
 PAX_idea_hegemony_desc:0 "Соседи платят дань и не спорят."
 PAX_far_lands:0 "Дальние земли"
 PAX_far_lands_desc:0 "Лор PaxVanila молчит об этой стране. Мир вращается вокруг Монолита, а не вокруг неё."
 PAX_idea_guardian_seven:0 "Страж-7"
 PAX_idea_guardian_seven_desc:0 "Под башней проснулся седьмой голем с медным сердцем. Его первое слово было «PAX»."
 PAX_idea_kurultai_mind:0 "Разум «Курултай»"
 PAX_idea_kurultai_mind_desc:0 "Степной Пакт украл чертежи Седьмого и построил свой разум."
 PAX_idea_factory_cities:0 "Города-заводы"
 PAX_idea_factory_cities_desc:0 "Рабочие кварталы растут вокруг цехов."
 PAX_idea_age_of_steel:0 "Эпоха стали"
 PAX_idea_age_of_steel_desc:0 "Сталь и пар дают державе больше, чем война."
 PAX_idea_staff_school:0 "Школа штаба"
 PAX_idea_staff_school_desc:0 "Штаб учится на ошибках прошлых войн."
 PAX_idea_hundred_legions:0 "Сто легионов"
 PAX_idea_hundred_legions_desc:0 "Страна стала одним большим лагерем."
 PAX_idea_treaty_web:0 "Сеть договоров"
 PAX_idea_treaty_web_desc:0 "Сотня договоров держит соседей на привязи."
 PAX_idea_world_power:0 "Мировая держава"
 PAX_idea_world_power_desc:0 "Слово державы слышно от Монолита до дальних земель."
 PAX_idea_cw_bunkers:0 "Подземные убежища"
 PAX_idea_cw_bunkers_desc:0 "Под городами лежат склады и мастерские."
 PAX_idea_cw_balance:0 "Равновесие страха"
 PAX_idea_cw_balance_desc:0 "Мир держится на взаимном страхе."
 PAX_idea_auto_factories:0 "Автоматические заводы"
 PAX_idea_auto_factories_desc:0 "Конвейеры не ждут людей."
 PAX_idea_neuro_link:0 "Нейроинтерфейсы"
 PAX_idea_neuro_link_desc:0 "Приказ идёт напрямую от штаба к войскам."
 PAX_idea_ad_empire:0 "Империя рекламы"
 PAX_idea_ad_empire_desc:0 "Подписка заменила налог."
 PAX_idea_comm_monopoly:0 "Монополия на связь"
 PAX_idea_comm_monopoly_desc:0 "Вся связь принадлежит корпорации."
 PAX_idea_board_of_world:0 "Совет директоров мира"
 PAX_idea_board_of_world_desc:0 "Десять корпораций делят мир за одним столом."
 PAX_idea_ITA_tower_law:0 "«У башни не стреляют»"
 PAX_idea_ITA_tower_law_desc:0 "Закон 1529 года переписан для пушек Века стали."
 PAX_idea_GRE_academy:0 "Академия Эллады"
 PAX_idea_GRE_academy_desc:0 "Перечень всего продолжается."
 PAX_idea_FRA_harvest:0 "Осенний урожай"
 PAX_idea_FRA_harvest_desc:0 "Урожай кормит армию и заводы."
 PAX_idea_FRA_forest_forts:0 "Лесные крепости"
 PAX_idea_FRA_forest_forts_desc:0 "Каждая роща может стать крепостью."
 PAX_idea_GER_blitz:0 "Наступать до зимы"
 PAX_idea_GER_blitz_desc:0 "Быстро и без зимних шинелей."
 PAX_idea_GER_winter_coats:0 "Зимние шинели"
 PAX_idea_GER_winter_coats_desc:0 "Рейх запомнил урок метели."
 PAX_idea_SOV_winter_campaign:0 "Зимняя кампания"
 PAX_idea_SOV_winter_campaign_desc:0 "Северяне воюют зимой лучше всех."
 PAX_idea_ROM_copper:0 "Медь Сармизегетузы"
 PAX_idea_ROM_copper_desc:0 "Медь идёт на заводы."
 PAX_era_cold_war:0 "Холодная война"
 PAX_era_cold_war_desc:0 "Пушки молчат на ничьей полосе. Обе стороны тайно ищут обсидиан."
 PAX_era_robots:0 "Эпоха роботов"
 PAX_era_robots_desc:0 "Машины работают на заводах, а големы стоят на границах."
 PAX_era_cyberpunk:0 "Наступление киберпанка"
 PAX_era_cyberpunk_desc:0 "Неон, корпорации и скалк-сеть. Государства стали брендами."
 PAX_spirit_ITA:0 "Хранители Печати"
 PAX_spirit_ITA_desc:0 "Ромея стоит у самого Монолита. Её сенаторы клянутся словом PAX, а летописцы Форума записывают всё, что происходит у башни."
 PAX_her_ITA:0 "Наследие: SPQR"
 PAX_her_ITA_desc:0 "Сенат и народ Ромеи. Каждый враг, павший на ромейской земле, делает Республику сильнее."
 PAX_fai_ITA:0 "Вера: Марс Градив"
 PAX_fai_ITA_desc:0 "Боги Капитолия. Марс стоит за Ромею, когда враг у её стен."
 PAX_spirit_SPR:0 "Золотой Караван"
 PAX_spirit_SPR_desc:0 "Карфаген вырос из купцов Ур-Кадима. Его караваны и корабли ходят ко всем берегам мира."
 PAX_her_SPR:0 "Наследие: Пушки Гая"
 PAX_her_SPR_desc:0 "Карфагенские литейщики делают осадные орудия дешевле всех в мире."
 PAX_fai_SPR:0 "Вера: Щедрость Танит"
 PAX_fai_SPR_desc:0 "Баал-Хаммон и Танит. Богиня любит щедрых купцов."
 PAX_spirit_GRE:0 "Морская Лига островов"
 PAX_spirit_GRE_desc:0 "Эллада это сотня островов и одна общая гавань. Каждый эллин с детства умеет держать весло."
 PAX_her_GRE:0 "Наследие: Морская Лига"
 PAX_her_GRE_desc:0 "Флот Эллады ходит по морю, как дельфин."
 PAX_fai_GRE:0 "Вера: Посейдон"
 PAX_fai_GRE_desc:0 "Боги Олимпа. Морской бог хранит корабли Эллады."
 PAX_spirit_FRA:0 "Священные рощи"
 PAX_spirit_FRA_desc:0 "Галлия до сих пор молится в лесах. Рощи дают ей урожай и спокойствие."
 PAX_her_FRA:0 "Наследие: Священные рощи"
 PAX_her_FRA_desc:0 "Дома, в своих лесах, галлы встают после любого удара."
 PAX_fai_FRA:0 "Вера: Омела"
 PAX_fai_FRA_desc:0 "Боги рощ. Друиды лечат раненых омелой и травами."
 PAX_spirit_ENG:0 "Острова, которые сказали «нет»"
 PAX_spirit_ENG_desc:0 "В 1781 году колонии отбились от метрополий. С тех пор Островной Союз никому не платит дань."
 PAX_her_ENG:0 "Наследие: Республика мореходов"
 PAX_her_ENG_desc:0 "Каждый гражданин Союза моряк, и каждый порт его дом."
 PAX_fai_ENG:0 "Вера: Союз Числа"
 PAX_fai_ENG_desc:0 "Школа Пифагора. Мореходы верят, что у всего есть число, даже у удачи."
 PAX_spirit_GER:0 "Позор 1914 года"
 PAX_spirit_GER_desc:0 "Рейх проиграл Первую Великую войну. Ему мало земли, и он помнит каждую обиду."
 PAX_her_GER:0 "Наследие: Железо и уголь"
 PAX_her_GER_desc:0 "Германские королевства сидят на самых богатых рудах мира."
 PAX_fai_GER:0 "Вера: Молот Донара"
 PAX_fai_GER_desc:0 "Вотан и Донар. В грозу германские полки идут вперёд."
 PAX_spirit_SOV:0 "Зима на стороне дома"
 PAX_spirit_SOV_desc:0 "Метель 1241 года остановила Орду у стен Ромеи. Северяне выросли в такой метели."
 PAX_her_SOV:0 "Наследие: Метель 1942"
 PAX_her_SOV_desc:0 "Зимой враги на земле Царства вмерзают в снег."
 PAX_fai_SOV:0 "Вера: Хранители Печати"
 PAX_fai_SOV_desc:0 "Северяне верят в Монолит больше, чем в богов. Печать держит мир."
 PAX_spirit_ROM:0 "Медные рудники Каэр-Брун"
 PAX_spirit_ROM_desc:0 "В горах Дакии лежат древние рудники Медного Союза. В них нашли чертежи паровых машин."
 PAX_her_ROM:0 "Наследие: Медь Каэр-Тала"
 PAX_her_ROM_desc:0 "Дакия раскопала рудники Медного Союза до самого дна."
 PAX_fai_ROM:0 "Вера: Без страха смерти"
 PAX_fai_ROM_desc:0 "Залмоксис. Даки идут в бой, потому что не боятся смерти."
 PAX_spirit_TUR:0 "Дети песчаной бури"
 PAX_spirit_TUR_desc:0 "Орда приходит быстро и уходит быстро. Её конница помнит дорогу к стенам Ромеи."
 PAX_her_TUR:0 "Наследие: Из песчаной бури"
 PAX_her_TUR_desc:0 "Орда выходит из бури там, где её не ждут, и бьёт на чужой земле."
 PAX_fai_TUR:0 "Вера: Яса"
 PAX_fai_TUR_desc:0 "Тенгри и Умай. Под открытым небом конница Орды не знает поражений."
 PAX_spirit_PER:0 "Курганная знать"
 PAX_spirit_PER_desc:0 "Цари Скифии правят вместе с родами. Роды дают золото и всадников, но любят спорить."
 PAX_her_PER:0 "Наследие: Царские курганы"
 PAX_her_PER_desc:0 "Золото предков и дань вассалов идут в казну скифских царей."
 PAX_fai_PER:0 "Вера: Стрелы Папая"
 PAX_fai_PER_desc:0 "Табити, Папай и Апи. Конные лучники Скифии бьют без промаха."
 PAX_idea_cw_pax:0 "Бдение у Монолита"
 PAX_idea_cw_pax_desc:0 "Союз PAX держит дежурные отряды у башни и делится разведкой."
 PAX_idea_cw_steppe:0 "Тихая степь"
 PAX_idea_cw_steppe_desc:0 "Степной Пакт держит армии в степи и ищет обсидиан под чужими землями."
 PAX_idea_rb_pax:0 "Сеть Седьмого"
 PAX_idea_rb_pax_desc:0 "Страж-7 помогает считать лучше любого счётного бюро Форума."
 PAX_idea_rb_steppe:0 "Сеть Курултая"
 PAX_idea_rb_steppe_desc:0 "Курултай тянет заводы Пакта в одну сеть и держит план на сто лет вперёд."
 PAX_idea_golem_legions:0 "Медные легионы"
 PAX_idea_golem_legions_desc:0 "Големы с медным сердцем стоят на границах."
 PAX_idea_human_answer:0 "Ответ человека"
 PAX_idea_human_answer_desc:0 "Мы не отдадим решения машине. Последнее слово остаётся за людьми."
 PAX_idea_machine_merge:0 "Слияние с разумом"
 PAX_idea_machine_merge_desc:0 "Наши заводы и штабы считаются через общий разум. Бумаги стало меньше, споров тоже."
 PAX_idea_corp_charter:0 "Устав корпорации"
 PAX_idea_corp_charter_desc:0 "Закон заменён уставом, гражданин акционером. Налоги стали подписками."
 PAX_idea_sculk_net:0 "Скалк-сеть"
 PAX_idea_sculk_net_desc:0 "Сигналы идут через скалк. Новости обгоняют самих себя."
 PAX_idea_protectorate:0 "Лояльный Протекторату"
 PAX_idea_protectorate_desc:0 "Протекторат Сети гарантирует нам мир и сбор подписок."
 PAX_idea_shadow_corp:0 "Теневая корпорация"
 PAX_idea_shadow_corp_desc:0 "Официально нас нет. Неофициально нас читают все чёрные серверы."
 PAX_lore_category:0 "Лор PaxVanila"
 PAX_lore_category_desc:0 "Национальные решения вашей державы: наследие, вера, союзы и пути эпох."
 PAX_ITA_her:0 "Наследие: SPQR"
 PAX_ITA_her_desc:0 "Сенат и народ Ромеи. Каждый враг, павший на ромейской земле, делает Республику сильнее."
 PAX_ITA_fai:0 "Государственная вера: Марс Градив"
 PAX_ITA_fai_desc:0 "Боги Капитолия. Марс стоит за Ромею, когда враг у её стен."
 PAX_ITA_senate:0 "Сенат у башни"
 PAX_ITA_senate_desc:0 "Сенат собирается у Монолита, как в год основания. Ромул слушает сенаторов."
 PAX_ITA_tower_law:0 "«У башни не стреляют»"
 PAX_ITA_tower_law_desc:0 "Закон 1529 года. Новые пушки бьют на пятьдесят километров, и закон надо переписать."
 PAX_ITA_tablets:0 "Таблички Предтеч"
 PAX_ITA_tablets_desc:0 "Учёные Форума снова читают таблички Ур-Кадима и Каэр-Тала."
 PAX_ITA_monolith_pact:0 "Договор у Монолита"
 PAX_ITA_monolith_pact_desc:0 "Первый пакт о ненападении был подписан у башни в 251 году. Пора собрать союз снова и назвать его словом над входом."
 PAX_ITA_romul_legacy:0 "Имя, которое не умирает"
 PAX_ITA_romul_legacy_desc:0 "Ромулов было двести пять. Республика переживёт и эту войну."
 PAX_ITA_cw_watch:0 "Дежурные у башни"
 PAX_ITA_cw_watch_desc:0 "Ромея. Сто лет назад мы дали клятву PAX. Теперь у башни каждый день стоит наш караул."
 PAX_ITA_cw_intel:0 "Разведка обсидиана"
 PAX_ITA_cw_intel_desc:0 "Обе стороны тайно ищут обсидиан под землёй. Наши агенты знают, где копать."
 PAX_ITA_cw_shield:0 "Щит PAX"
 PAX_ITA_cw_shield_desc:0 "Блок держит строй. Пока мы вместе, никто не рискнёт начать войну."
 PAX_ITA_cw_deter:0 "Сдерживание"
 PAX_ITA_cw_deter_desc:0 "Ни одна сторона не нажмёт первой. Лучшая война та, которой не было."
 PAX_ITA_rb_net:0 "Сеть Седьмого"
 PAX_ITA_rb_net_desc:0 "Страж-7 считает быстрее любого бюро. Мы подключаем к нему лаборатории."
 PAX_ITA_rb_golems:0 "Медные легионы"
 PAX_ITA_rb_golems_desc:0 "Големы с медным сердцем встают на границах и заменяют дивизии."
 PAX_ITA_rb_human:0 "Ответ человека"
 PAX_ITA_rb_human_desc:0 "Разум разумом, а последнее слово останется за нами."
 PAX_ITA_rb_merge:0 "Слияние с разумом"
 PAX_ITA_rb_merge_desc:0 "Мы отдаём штабы и заводы общему разуму. Это быстрее и тише."
 PAX_ITA_rb_war:0 "Война двух разумов"
 PAX_ITA_rb_war_desc:0 "Страж-7 и Курултай смотрят друг на друга. Мы стоим между ними."
 PAX_ITA_co_charter:0 "Устав корпорации"
 PAX_ITA_co_charter_desc:0 "Ромея теперь бренд. Гражданин стал акционером, налог подпиской."
 PAX_ITA_co_sculk:0 "Скалк-сеть"
 PAX_ITA_co_sculk_desc:0 "Сигналы идут через скалк. Новости приходят раньше событий."
 PAX_ITA_co_gates:0 "Врата по подписке"
 PAX_ITA_co_gates_desc:0 "Врата открываются тем, кто заплатил. Карт-Хадашт уже продаёт места."
 PAX_ITA_co_loyal:0 "Лояльность Протекторату"
 PAX_ITA_co_loyal_desc:0 "Протекторат Сети запретил войны. Мы подпишем всё, что он попросит."
 PAX_ITA_co_shadow:0 "Теневая корпорация"
 PAX_ITA_co_shadow_desc:0 "Мы существуем, пока нас не ищут. Чёрные серверы платят дороже."
 PAX_ITA_cw_arms:0 "Гонка вооружений"
 PAX_ITA_cw_arms_desc:0 "Обе стороны складывают снаряды в погреба. Заводы работают в три смены."
 PAX_ITA_cw_spies:0 "Тени у башни"
 PAX_ITA_cw_spies_desc:0 "Агенты Союза и Пакта играют в игру, правила которой знают только они."
 PAX_ITA_cw_bunkers:0 "Подземные убежища"
 PAX_ITA_cw_bunkers_desc:0 "Если башня упадёт, под землёй должны остаться люди и станки."
 PAX_ITA_cw_diplo:0 "Переговоры у Монолита"
 PAX_ITA_cw_diplo_desc:0 "Каждые пять лет послы собираются у башни и обещают не стрелять."
 PAX_ITA_cw_balance:0 "Равновесие страха"
 PAX_ITA_cw_balance_desc:0 "Мир держится, пока обе стороны боятся друг друга."
 PAX_ITA_rb_factories:0 "Автоматические заводы"
 PAX_ITA_rb_factories_desc:0 "Конвейеры больше не ждут людей. Люди смотрят, чтобы ничего не сломалось."
 PAX_ITA_rb_labs:0 "Лаборатории Седьмого"
 PAX_ITA_rb_labs_desc:0 "Разум помогает ставить опыты и читать результаты быстрее любого учёного."
 PAX_ITA_rb_drones:0 "Дроны разведки"
 PAX_ITA_rb_drones_desc:0 "Лёгкие машины облетают границы и видят дальше любого часового."
 PAX_ITA_rb_cyber:0 "Нейроинтерфейсы"
 PAX_ITA_rb_cyber_desc:0 "Командиры подключают штаб прямо к разуму. Приказ идёт мгновенно."
 PAX_ITA_rb_peace:0 "Договор двух разумов"
 PAX_ITA_rb_peace_desc:0 "Машины сели за стол раньше людей. Остальным остаётся подписать."
 PAX_ITA_co_ads:0 "Реклама в каждом доме"
 PAX_ITA_co_ads_desc:0 "Реклама заменила лозунги. Подписка заменила налог."
 PAX_ITA_co_security:0 "Корпоративная охрана"
 PAX_ITA_co_security_desc:0 "Частные армии защищают офисы и склады лучше государственных."
 PAX_ITA_co_monopoly:0 "Монополия на связь"
 PAX_ITA_co_monopoly_desc:0 "Скалк-сеть принадлежит нам. Всё остальное можно арендовать."
 PAX_ITA_co_black:0 "Чёрные серверы"
 PAX_ITA_co_black_desc:0 "Архивы, которых нет, хранят всё, что мы забыли."
 PAX_ITA_co_summit:0 "Совет директоров мира"
 PAX_ITA_co_summit_desc:0 "Десять корпораций сидят за одним столом. Решает тот, кто платит больше."
 PAX_SPR_her:0 "Наследие: Пушки Гая"
 PAX_SPR_her_desc:0 "Карфагенские литейщики делают осадные орудия дешевле всех в мире."
 PAX_SPR_fai:0 "Государственная вера: Щедрость Танит"
 PAX_SPR_fai_desc:0 "Баал-Хаммон и Танит. Богиня любит щедрых купцов."
 PAX_SPR_suffets:0 "Совет суффетов"
 PAX_SPR_suffets_desc:0 "Карфагеном правят купцы. Совет суффетов решает, где торговать и с кем воевать."
 PAX_SPR_caravan:0 "Золотой Караван"
 PAX_SPR_caravan_desc:0 "Самая длинная торговая дорога мира снова открыта."
 PAX_SPR_new_fleet:0 "Новый флот Карфагена"
 PAX_SPR_new_fleet_desc:0 "В 264 году до н.э. буря утопила флот Карфагена. Новый флот строят из стали."
 PAX_SPR_kart_hadasht:0 "Карт-Хадашт"
 PAX_SPR_kart_hadasht_desc:0 "«Новый город». Карфаген строит фабрики так же быстро, как раньше строил корабли."
 PAX_SPR_join_pax:0 "Место в Союзе PAX"
 PAX_SPR_join_pax_desc:0 "Старый спор с Ромеей забыт. Карфаген встаёт рядом с ней у Монолита."
 PAX_SPR_cw_watch:0 "Дежурные у башни"
 PAX_SPR_cw_watch_desc:0 "Карфаген. Сто лет назад мы дали клятву PAX. Теперь у башни каждый день стоит наш караул."
 PAX_SPR_cw_intel:0 "Разведка обсидиана"
 PAX_SPR_cw_intel_desc:0 "Обе стороны тайно ищут обсидиан под землёй. Наши агенты знают, где копать."
 PAX_SPR_cw_shield:0 "Щит PAX"
 PAX_SPR_cw_shield_desc:0 "Блок держит строй. Пока мы вместе, никто не рискнёт начать войну."
 PAX_SPR_cw_deter:0 "Сдерживание"
 PAX_SPR_cw_deter_desc:0 "Ни одна сторона не нажмёт первой. Лучшая война та, которой не было."
 PAX_SPR_rb_net:0 "Сеть Седьмого"
 PAX_SPR_rb_net_desc:0 "Страж-7 считает быстрее любого бюро. Мы подключаем к нему лаборатории."
 PAX_SPR_rb_golems:0 "Медные легионы"
 PAX_SPR_rb_golems_desc:0 "Големы с медным сердцем встают на границах и заменяют дивизии."
 PAX_SPR_rb_human:0 "Ответ человека"
 PAX_SPR_rb_human_desc:0 "Разум разумом, а последнее слово останется за нами."
 PAX_SPR_rb_merge:0 "Слияние с разумом"
 PAX_SPR_rb_merge_desc:0 "Мы отдаём штабы и заводы общему разуму. Это быстрее и тише."
 PAX_SPR_rb_war:0 "Война двух разумов"
 PAX_SPR_rb_war_desc:0 "Страж-7 и Курултай смотрят друг на друга. Мы стоим между ними."
 PAX_SPR_co_charter:0 "Устав корпорации"
 PAX_SPR_co_charter_desc:0 "Карфаген теперь бренд. Гражданин стал акционером, налог подпиской."
 PAX_SPR_co_sculk:0 "Скалк-сеть"
 PAX_SPR_co_sculk_desc:0 "Сигналы идут через скалк. Новости приходят раньше событий."
 PAX_SPR_co_gates:0 "Врата по подписке"
 PAX_SPR_co_gates_desc:0 "Врата открываются тем, кто заплатил. Карт-Хадашт уже продаёт места."
 PAX_SPR_co_loyal:0 "Лояльность Протекторату"
 PAX_SPR_co_loyal_desc:0 "Протекторат Сети запретил войны. Мы подпишем всё, что он попросит."
 PAX_SPR_co_shadow:0 "Теневая корпорация"
 PAX_SPR_co_shadow_desc:0 "Мы существуем, пока нас не ищут. Чёрные серверы платят дороже."
 PAX_SPR_cw_arms:0 "Гонка вооружений"
 PAX_SPR_cw_arms_desc:0 "Обе стороны складывают снаряды в погреба. Заводы работают в три смены."
 PAX_SPR_cw_spies:0 "Тени у башни"
 PAX_SPR_cw_spies_desc:0 "Агенты Союза и Пакта играют в игру, правила которой знают только они."
 PAX_SPR_cw_bunkers:0 "Подземные убежища"
 PAX_SPR_cw_bunkers_desc:0 "Если башня упадёт, под землёй должны остаться люди и станки."
 PAX_SPR_cw_diplo:0 "Переговоры у Монолита"
 PAX_SPR_cw_diplo_desc:0 "Каждые пять лет послы собираются у башни и обещают не стрелять."
 PAX_SPR_cw_balance:0 "Равновесие страха"
 PAX_SPR_cw_balance_desc:0 "Мир держится, пока обе стороны боятся друг друга."
