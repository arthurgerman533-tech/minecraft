 aon_exhibition_opinion_tt:0 "Каждая страна с §YДоступом к рынку§! к нам, не воюющая с нами, получает модификатор мнения §YОружейная выставка§! (§G+20§!) на 12 месяцев.\n"
 aon_exhibition_boost_tt:0 "Положение на рынке, получаемое от экспорта, увеличено на §G50%§! на 180 дней.\n"
 aon_export_credit_ai_tt:0 "На 180 дней страны с §YДоступом к рынку§! к нам сильно предпочитают покупать нашу технику (ждите много запросов на покупку), деньги рынка §G+25%§!, а предложения контрактов на поставки приходят чаще.\n"
 aon_exhibition_done_tt:0 "Новые клиенты будут благосклонно смотреть на нашу технику, и предложения контрактов на поставки некоторое время будут приходить чаще.\n"
 aon_gain_rep_10_tt:0 "Положение на рынке: §G+10§!\n"
 aon_gain_rep_15_tt:0 "Положение на рынке: §G+15§!\n"
