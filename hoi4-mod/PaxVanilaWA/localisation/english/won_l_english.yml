 # --- International Market window ---
 AON_BUREAU_BUTTON:0 "Arms Trade"
 AON_BUREAU_BUTTON_TT:0 "Open the §YArms Trade Bureau§!: Market Standing, trade flows, what the arms trade does for our economy, and the way to the §YForeign Trade Office§!."
 AON_PANEL_TITLE:0 "Arms Trade Bureau"
 AON_PANEL_TIER_NAME:0 "[GetAonTierName]"
 AON_PANEL_TIER_TT:0 "§YMarket Standing§! is our reputation as an arms supplier. Every contract we sell on this market adds its trade weight each week, and every supply contract delivery adds §Y6§!. Without exports it fades by §R1%§! per week.\n\nEvery level grants a national spirit, raises our cash from market sales by §G5%§!, raises supply contract prices and lets the Arms Export Agency run more contracts at once."
 AON_PANEL_STANDING:0 "Market Standing: §Y[?aon_rep|0]§!"
 AON_PANEL_STANDING_TT:0 "Standing is lost only when it falls below §Y75%§! of the current level's threshold."
 AON_PANEL_NEXT:0 "[GetAonNextTier]"
 AON_PANEL_FLOWS_HEADER:0 "Trade Flows"
 AON_PANEL_EXPORTS:0 "Contracts Selling: §Y[?aon_exp_n|0]§!\nTrade Weight: §Y[?aon_exp_w|1]§! per week\nCash: §G[?won_mkt_income|2] bn§! last month\nBuyers: §Y[?aon_ai_clients|0]§!   Subjects: §Y[?aon_supplied_subjects|0]§!"
 AON_PANEL_EXPORTS_TT:0 "Each contract we sell weighs §Y1§!. Contracts with guns or vehicles weigh §Y1.5§!, contracts with tanks or aircraft weigh §Y3§!. At most §Y30§! weight counts per week. Every point of weight pays the treasury §G0.002 bn§! a week, more with a higher standing.\n\n§YBuyers§! are AI nations that prefer our equipment over other sellers while we §Ycourt foreign buyers§! (the switch below). Only nations not at war with us and not holding us in contempt are interested; a standing of §YEstablished Arms Exporter§! makes them prefer us even more. Turn courting off if purchase requests become too many.\n\n§YSubjects§! controlled by the AI buy their equipment from us alone.\n\nThey can only buy what we put up for sale in the §YSell Equipment§! tab."
 AON_PANEL_IMPORTS:0 "Contracts Buying: §Y[?aon_imp_n|0]§!\nTrade Weight: §Y[?aon_imp_w|1]§! per week\nTechnical Insight: §Y[?aon_insight|0]§!"
 AON_PANEL_IMPORTS_TT:0 "Each contract we buy weighs §Y1§!, or §Y1.5§! with tanks or aircraft. Only our first §Y4§! contracts count.\n\nTechnical Insight lets our engineers study imported equipment for a research bonus."
 AON_PANEL_EFFECTS_HEADER:0 "Economic Effects"
 AON_PANEL_EFFECTS_LEFT:0 "Factory Output: [?aon_m_output|1%+]\nConsumer Goods: [?aon_m_cg|1-%]\nConstruction Speed: [?aon_m_build|1%+]\nResearch Speed: [?aon_m_research|1%+]"
 AON_PANEL_EFFECTS_RIGHT:0 "Efficiency Growth: [?aon_m_eff|1%+]\nEfficiency Cap: [?aon_m_maxeff|1%+]\nLicence Production: [?aon_m_license|1%+]"
 AON_PANEL_EFFECTS_TT:0 "These effects follow our §Ytrade flow§! over the past weeks, rising and falling gradually.\n\nExports reach their full effect at a flow of §Y20§! weight per week (now §Y[?aon_exp_flow|1]§!).\nImports reach their full effect at a flow of §Y4§! (now §Y[?aon_imp_flow|1]§!)."
 AON_PANEL_EXHIBITION:0 "[GetAonExhibitionStatus]"
