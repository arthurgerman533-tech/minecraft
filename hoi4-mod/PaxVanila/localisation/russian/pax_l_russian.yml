 TUR_pax_fai_desc:0 "Тенгри и Умай. Под открытым небом конница Орды не знает поражений."
 TUR_pax_clans:0 "Курултай кланов"
 TUR_pax_clans_desc:0 "Кланы Орды выбирают кагана и клянутся ему на коне."
 TUR_pax_cavalry:0 "Конница степи"
 TUR_pax_cavalry_desc:0 "Конница Орды прошла от песчаной бури до стен Ромеи."
 TUR_pax_sand_roads:0 "Дороги через пески"
 TUR_pax_sand_roads_desc:0 "Старые караванные дороги становятся железными."
 TUR_pax_raid:0 "Снова к стенам"
 TUR_pax_raid_desc:0 "В 375 году Орда дошла до башни. Каган хочет повторить путь предков через земли Эллады."
 TUR_pax_steppe_peace:0 "Мир степи"
 TUR_pax_steppe_peace_desc:0 "Каган выбирает союз с Севером, а не набег."
 TUR_pax_cw_watch:0 "Курултай у костра"
 TUR_pax_cw_watch_desc:0 "Орда. Пакт собирается каждую зиму. Мы смотрим на башню издалека и ждём."
 TUR_pax_cw_intel:0 "Разведка обсидиана"
 TUR_pax_cw_intel_desc:0 "Обе стороны тайно ищут обсидиан под землёй. Наши агенты знают, где копать."
 TUR_pax_cw_shield:0 "Кулак степи"
 TUR_pax_cw_shield_desc:0 "Блок держит строй. Пока мы вместе, никто не рискнёт начать войну."
 TUR_pax_cw_deter:0 "Сдерживание"
 TUR_pax_cw_deter_desc:0 "Ни одна сторона не нажмёт первой. Лучшая война та, которой не было."
 TUR_pax_rb_net:0 "Сеть Курултая"
 TUR_pax_rb_net_desc:0 "Курултай просит доступ к каждому заводу Пакта. Отказать ему нельзя."
 TUR_pax_rb_golems:0 "Медные легионы"
 TUR_pax_rb_golems_desc:0 "Големы с медным сердцем встают на границах и заменяют дивизии."
 TUR_pax_rb_human:0 "Ответ человека"
 TUR_pax_rb_human_desc:0 "Разум разумом, а последнее слово останется за нами."
 TUR_pax_rb_merge:0 "Слияние с разумом"
 TUR_pax_rb_merge_desc:0 "Мы отдаём штабы и заводы общему разуму. Это быстрее и тише."
 TUR_pax_rb_war:0 "Война двух разумов"
 TUR_pax_rb_war_desc:0 "Страж-7 и Курултай смотрят друг на друга. Мы стоим между ними."
 TUR_pax_co_charter:0 "Устав корпорации"
 TUR_pax_co_charter_desc:0 "Орда теперь бренд. Гражданин стал акционером, налог подпиской."
 TUR_pax_co_sculk:0 "Скалк-сеть"
 TUR_pax_co_sculk_desc:0 "Сигналы идут через скалк. Новости приходят раньше событий."
 TUR_pax_co_gates:0 "Врата по подписке"
 TUR_pax_co_gates_desc:0 "Врата открываются тем, кто заплатил. Карт-Хадашт уже продаёт места."
 TUR_pax_co_loyal:0 "Лояльность Протекторату"
 TUR_pax_co_loyal_desc:0 "Протекторат Сети запретил войны. Мы подпишем всё, что он попросит."
 TUR_pax_co_shadow:0 "Теневая корпорация"
 TUR_pax_co_shadow_desc:0 "Мы существуем, пока нас не ищут. Чёрные серверы платят дороже."
 PER_pax_ind1:0 "Индустриализация"
 PER_pax_ind1_desc:0 "Первый шаг любой державы Века стали: заводы, железные дороги, уголь."
 PER_pax_ind2:0 "Шахтёрские артели"
 PER_pax_ind2_desc:0 "Артели шахтёров копают глубже, как когда-то мастера Каэр-Тала."
 PER_pax_ind3:0 "Военная экономика"
 PER_pax_ind3_desc:0 "Заводы переходят на снаряды и винтовки. Казна наполняется военными заказами."
 PER_pax_mil1:0 "Мобилизация"
 PER_pax_mil1_desc:0 "Каждый житель получает винтовку и паёк. Резервисты возвращаются в казармы."
 PER_pax_mil2:0 "Укрепления"
 PER_pax_mil2_desc:0 "Стены вокруг стен. Ромея научила весь мир, что крепость переживёт любой набег."
 PER_pax_mil3:0 "Тотальная война"
 PER_pax_mil3_desc:0 "Вся нация становится армией. Нельзя одновременно воевать мечом и держать соседей в вассалах."
 PER_pax_eco1:0 "Торговые пути"
 PER_pax_eco1_desc:0 "Караваны и корабли снова ходят по старым дорогам. Торговля кормит казну."
 PER_pax_eco2:0 "Дипкорпус"
 PER_pax_eco2_desc:0 "Со времён Договора у Монолита в 251 году пакт о ненападении стоит дешевле войны."
 PER_pax_eco3:0 "Гегемония"
 PER_pax_eco3_desc:0 "Держава правит не мечом, а данью. Соседи платят, а казна растёт."
 PER_pax_her:0 "Наследие: Царские курганы"
 PER_pax_her_desc:0 "Золото предков и дань вассалов идут в казну скифских царей. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 PER_pax_fai:0 "Государственная вера: Стрелы Папая"
 PER_pax_fai_desc:0 "Табити, Папай и Апи. Конные лучники Скифии бьют без промаха."
 PER_pax_kurgan_gold:0 "Золото курганов"
 PER_pax_kurgan_gold_desc:0 "Цари вскрывают казну предков. Золото курганов идёт на заводы."
 PER_pax_archers:0 "Конные лучники"
 PER_pax_archers_desc:0 "Скифский всадник стреляет на скаку. Теперь из винтовки."
 PER_pax_animal_style:0 "Звериный стиль"
 PER_pax_animal_style_desc:0 "Олени и барсы на золотых бляхах снова на знамёнах. Роды спорят меньше."
 PER_pax_tribute:0 "Дань степи"
 PER_pax_tribute_desc:0 "Кочевья платят дань царю, а царь строит дороги."
 PER_pax_join_steppe:0 "Скифы на Курултае"
 PER_pax_join_steppe_desc:0 "Скифия встаёт в Степной Пакт рядом с Ордой и Севером."
