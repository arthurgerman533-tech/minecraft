 concentrated_industry6:0 "Концентрированная промышленность VI"
 concentrated_industry6_desc:0 "Произошли значительные прорывы в автоматизации и эффективности производства. Благодаря передовым технологиям и усовершенствованным процессам удаётся значительно снизить издержки и увеличить выпуск."
 dispersed_industry6:0 "Рассредоточенная промышленность VI"
 dispersed_industry6_desc:0 "Интеграция передовых технологий и безопасной связи улучшает защиту промышленности, делая её почти невозможной для обнаружения и уничтожения воздушными атаками."
 construction6:0 "Строительство VI"
 construction6_desc:0 "Строительный процесс оптимизирован с использованием новейших технологий и достижений в области проектного планирования."
 excavation6:0 "Разработка VI"
 excavation6_desc:0 "Добыча ресурсов становится эффективнее благодаря автоматизации и робототехнике: больше руды и меньше отходов."
 flexible_line2:0 "Улучшенная гибкая линия"
 flexible_line2_desc:0 "Автоматизация и робототехника повышают гибкость производства и скорость перехода на новые модели."
 streamlined_line2:0 "Улучшенная упорядоченная линия"
 streamlined_line2_desc:0 "Автоматизация и робототехника увеличивают стандартизацию и эффективность производства."
 improved_modern_oil_processing:0 "Улучшенная современная переработка нефти"
 improved_modern_oil_processing_desc:0 "Термический крекинг и деасфальтизация растворителями увеличивают выход топлива."
 improved_modern_rubber_processing:0 "Улучшенная современная переработка резины"
 improved_modern_rubber_processing_desc:0 "Оптимизированная полимеризация снижает затраты и увеличивает выпуск резины."
 modern_equipment_conversion:0 "Современная модернизация оборудования"
 modern_equipment_conversion_desc:0 "Современные процессы переоснащения и специальные команды быстро обновляют старое оружие и технику до новых стандартов."
 modern_fire_control_system:0 "Современная система управления огнём"
 modern_fire_control_system_desc:0 "Вводя курс, скорость и расстояние до цели, современный механический компьютер может точнее предсказать, где будет находиться цель, когда будет готов следующий залп."
 modern_encryption:0 "Шифрование: продвинутый стандарт шифрования"
 modern_encryption_desc:0 "AES работает с блоками по 128 бит и ключами 128, 192 или 256 бит и защищает связь армии от чужих ушей."
 modern_decryption:0 "Дешифрование: анализ блочного шифра"
 modern_decryption_desc:0 "Анализ закономерностей в блоках символов и статистика позволяют вскрыть чужой шифр и прочитать исходное сообщение."
 PAX_small_world:0 "Малый мир"
 PAX_small_world_desc:0 "Сценарий «без Азии»: дальние земли молчат, и державы лора строят быстрее. Взято из Family (NO_asia)."
 PAX_small_world_ENG:0 "Малый мир: острова"
 PAX_small_world_ENG_desc:0 "Островной Союз строит быстрее и держится дольше. Взято из Family (NO_asia_ENG)."
 PAX_small_world_GER:0 "Малый мир: дешёвые крылья"
 PAX_small_world_GER_desc:0 "Лёгкие самолёты Рейха на 15% дешевле. Взято из Family (NO_asia_GER)."
 PAX_far_lands_sealed:0 "Закрытые дальние земли"
 PAX_far_lands_sealed_desc:0 "В сценарии «без Азии» эта страна выключена из игры, как e_neutral в Family."
 PAX_peaceful_sky:0 "Мирное небо"
 PAX_peaceful_sky_desc:0 "Пока пушки молчат, армия учится без потерь. Дух пропадает с первой войной. Взято из Family."
 pax.40.t:0 "Вы хотите Тотальной Войны?"
 pax.40.d:0 "Вы устроили Тотальную войну... Чем всё это закончится? Кто выиграет? ВАМ предстоит узнать это.\n\nС уважением, разработчики Family mod."
 pax.40.a:0 "МЫ ВЫИГРАЕМ, Я ВАС УВЕРЯЮ!!"
 pax.20.b:0 "О мире PaxVanila"
 pax.20.c:0 "Экономика"
 pax.20.e:0 "Технологии MD и армия"
 pax.20.f:0 "Сценарии и эпохи"
 pax.20.g:0 "Монолит и Стражи"
 pax.24.t:0 "Гайд о сценариях и эпохах"
 pax.24.d:0 "На старте два сценария: «1936» (весь мир) и «1936 без Азии» (малый мир, дальний восток выключен). Другие эпохи заложены в моде, но скрыты из списка: 1241 «Метель», 1914 «Первая Великая война», 1939, 1962, 2041, 2096.\n\nВ каждой эпохе по-своему расставлены правители, блоки и число живых Стражей. В поздних эпохах держав лора ждут ветки решений: холодная война, роботы, корпорации. Все ветки лежат во вкладке решений, категория «Лор PaxVanila»: наследие, государственная вера и национальные решения вашей державы."
 pax.25.t:0 "Гайд о Монолите и Стражах"
 pax.25.d:0 "Монолит стоит в точке 0, 0. У входа были шесть Стражей, к 1936 году живы двое. Когда две великие державы воюют, один из Стражей падает и появляется новая трещина. Когда падут все, Ромея может начать проект «Страж-7» (решение, 150 политической власти) и разбудить седьмого голема с медным сердцем под башней. После этого Северное Царство получает решение «Украсть чертежи».\n\nБлоки: Ромея собирает Союз PAX, Северное Царство собирает Степной Пакт. Правителей и названия держав смотрите в описании сценария."
 pax.21.t:0 "Гайд о мире"
 pax.22.t:0 "Гайд об экономике"
 pax.22.d:0 "Экономика PaxVanila собрана из двух частей: законов Family и меню «Экономика» в духе Millennium Dawn.\n\nЗАКОНЫ (вкладка политики). «Гражданская экономика» даёт +30% к скорости стройки гражданских фабрик и +25% к инфраструктуре. Когда фабрики готовы, переходите на военную экономику: она ускоряет военные заводы и верфи. «Свободная торговля» усилена, «Закрытая экономика» изменена.\n\nМЕНЮ «ЭКОНОМИКА» (вкладка решений). Четыре группы по три режима, в каждой действует один, смена стоит 25 политической власти: налоги (низкие, умеренные, высокие), финансирование (гражданское, баланс, военное), торговля (открытые рынки, выборочная, протекционизм), энергетика и топливо (нефть и уголь, атом, зелёная). Это упрощение MD: бюджета и энергосети там нет, режимы дают только модификаторы.\n\nФОКУСЫ идут вдвое быстрее ванильных (3.5 дня на очко вместо 7)."
 pax.23.t:0 "Гайд о технологиях MD и армии"
 pax.23.d:0 "ТЕХНОЛОГИИ MD. 111 технологий из Millennium Dawn (промышленность, пехота, электроника) покупаются в решениях за политическую власть, в трёх категориях «Технологии MD». Стоимость от 25 и растёт с годом технологии, эффект постоянный. В эпохах 2041 и 2096 державы лора получают их по умолчанию. \n\nАРМИЯ. Пока нет войны, у всех дух «Мирное небо»: обучение вдвое быстрее, авиация и флот учатся без потерь. С первой войной он пропадает. Шаблоны меняются бесплатно, опыт копится до 9999. Роты поддержки Family (снайперы, миномёты, псы, огнемёты, огнемётные танки) открыты всем с начала игры."
 pax.21.a:0 "Вернуться назад"
 pax.21.b:0 "Выйти из гайда"
