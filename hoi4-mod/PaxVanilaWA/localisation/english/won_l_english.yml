 won_union_accord_desc:0 "Unions and employers have signed a peace."
 won_labour_shortage:0 "Labour Shortage"
 won_labour_shortage_desc:0 "There are not enough hands for the machines."
 won_speculation:0 "Speculative Boom"
 won_speculation_desc:0 "Everyone is buying land and building on credit."
 won_epidemic:0 "Epidemic"
 won_epidemic_desc:0 "Disease is spreading through the cities."
 won_blackout:0 "Power Rationing"
 won_blackout_desc:0 "Factories run only a few hours a day."
 won_rail_chaos:0 "Rail Chaos"
 won_rail_chaos_desc:0 "Deliveries are weeks late."
 won_new_technique:0 "New Production Technique"
 won_new_technique_desc:0 "A better way to run an assembly line."
 won_flood_damage:0 "Disaster Damage"
 won_flood_damage_desc:0 "Whole districts must be rebuilt."
 won_relief_works:0 "Relief Works"
 won_relief_works_desc:0 "The state is rebuilding, and people notice."
 won_hard_winter:0 "Harsh Winter"
 won_hard_winter_desc:0 "Coal is short and homes are cold."
 won_fuel_shortage:0 "Fuel Rationing"
 won_fuel_shortage_desc:0 "Petrol coupons and empty roads."
 won_rubber_shortage:0 "Rubber Shortage"
 won_rubber_shortage_desc:0 "Tyres and belts are hard to find."
 won_radio_boom:0 "Radio Age"
 won_radio_boom_desc:0 "Every household gathers around the wireless."
 won_tax_evasion:0 "Tax Evasion"
 won_tax_evasion_desc:0 "The rich have stopped paying."
 won_red_tape_cut:0 "Red Tape Cut"
 won_red_tape_cut_desc:0 "Permits in days, not months. Not everyone is happy about the shortcuts."
 won_holiday_act:0 "Paid Holidays"
 won_holiday_act_desc:0 "Workers get two weeks off every summer."
 won.100.t:0 "Drought"
 won.100.d:0 "No rain has fallen for weeks. The wheat is withering in the fields and the price of bread is climbing every market day.\n\nA Farm Subsidies and Grain Reserves programme would make crises like this rarer and easier to handle."
 won.100.dp:0 "No rain has fallen for weeks. The wheat is withering in the fields and the price of bread is climbing every market day.\n\nOur Farm Subsidies and Grain Reserves programme is ready for exactly this."
 won.100.a:0 "Farm Subsidies: Open the state granaries."
 won.100.b:0 "Import grain, whatever it costs."
 won.100.c:0 "Tighten rations and pray for rain."
 won.101.t:0 "Crop Blight"
 won.101.d:0 "A fungus is rotting the potato and grain crops in several provinces. Agronomists say whole harvests could be lost.\n\nA Farm Subsidies and Grain Reserves programme would make crises like this rarer and easier to handle."
 won.101.dp:0 "A fungus is rotting the potato and grain crops in several provinces. Agronomists say whole harvests could be lost.\n\nOur Farm Subsidies and Grain Reserves programme is ready for exactly this."
 won.101.a:0 "Farm Subsidies: Subsidised replanting with clean seed."
 won.101.b:0 "Burn the fields and replant."
 won.101.c:0 "Let the farmers deal with it."
 won.102.t:0 "Livestock Plague"
 won.102.d:0 "Foot-and-mouth disease is spreading from farm to farm. Every infected herd must be destroyed or the plague will run across the country.\n\nA Farm Subsidies and Grain Reserves programme would make crises like this rarer and easier to handle."
 won.102.dp:0 "Foot-and-mouth disease is spreading from farm to farm. Every infected herd must be destroyed or the plague will run across the country.\n\nOur Farm Subsidies and Grain Reserves programme is ready for exactly this."
 won.102.a:0 "Farm Subsidies: State vets and compensation for farmers."
 won.102.b:0 "Order a mass cull."
 won.102.c:0 "Hush it up."
 won.103.t:0 "Farmers March on the Capital"
 won.103.d:0 "Grain prices have collapsed below the cost of growing it. Thousands of farmers and their tractors are blocking the roads into the capital.\n\nA Farm Subsidies and Grain Reserves programme would make crises like this rarer and easier to handle."
 won.103.dp:0 "Grain prices have collapsed below the cost of growing it. Thousands of farmers and their tractors are blocking the roads into the capital.\n\nOur Farm Subsidies and Grain Reserves programme is ready for exactly this."
 won.103.a:0 "Guarantee prices: set up Farm Subsidies now."
 won.103.b:0 "Promise reforms later."
 won.103.c:0 "Clear the roads with the police."
 won.104.t:0 "Famine"
 won.104.d:0 "The bad harvests have turned into hunger. Villages are emptying as families walk to the cities in search of bread.\n\nA Farm Subsidies and Grain Reserves programme would make crises like this rarer and easier to handle."
 won.104.dp:0 "The bad harvests have turned into hunger. Villages are emptying as families walk to the cities in search of bread.\n\nOur Farm Subsidies and Grain Reserves programme is ready for exactly this."
 won.104.a:0 "Emergency food aid, at any price."
 won.104.b:0 "Requisition grain from the farmers."
 won.104.c:0 "Appeal for international aid."
 won.105.t:0 "Tractors for the Farms"
 won.105.d:0 "A machinery maker offers tractors and combine harvesters at a bulk price. One machine does the work of twenty labourers."
 won.105.a:0 "Buy them for the cooperatives."
 won.105.b:0 "Not now."
 won.106.t:0 "Rural Exodus"
 won.106.d:0 "Young people are leaving the villages for factory jobs in the cities. The factories are happy; the city councils are not."
 won.106.a:0 "Build workers' housing."
 won.106.b:0 "Let the cities sort it out."
 won.110.t:0 "Dock Strike"
 won.110.d:0 "The longshoremen have walked out. Ships are piling up at anchor and cargo is rotting on the quays.\n\nA Labour Relations Board programme would make crises like this rarer and easier to handle."
 won.110.dp:0 "The longshoremen have walked out. Ships are piling up at anchor and cargo is rotting on the quays.\n\nOur Labour Relations Board programme is ready for exactly this."
 won.110.a:0 "Labour Relations Board: The Labour Board brokers a deal."
 won.110.b:0 "Meet their demands."
 won.110.c:0 "Send in the navy to unload."
 won.110.e:0 "Wait them out."
 won.111.t:0 "Miners' Strike"
 won.111.d:0 "The coal and ore miners have downed tools over pay and safety. Without them the furnaces will soon go cold.\n\nA Labour Relations Board programme would make crises like this rarer and easier to handle."
 won.111.dp:0 "The coal and ore miners have downed tools over pay and safety. Without them the furnaces will soon go cold.\n\nOur Labour Relations Board programme is ready for exactly this."
 won.111.a:0 "Labour Relations Board: The Labour Board brokers a deal."
 won.111.b:0 "Raise their wages."
 won.111.c:0 "Lock them out."
 won.112.t:0 "Unions Demand Recognition"
 won.112.d:0 "The trade union federation wants a national collective agreement: recognised unions, fixed wage talks, no wildcat strikes."
 won.112.a:0 "Labour Relations Board: Sign a national accord."
 won.112.b:0 "Recognise the unions."
 won.112.c:0 "Refuse."
 won.113.t:0 "Labour Shortage"
 won.113.d:0 "With so many men at the front, factories cannot fill their shifts."
 won.113.a:0 "Bring women into industry."
 won.113.b:0 "Raise wages to attract workers."
 won.113.c:0 "Make do."
 won.120.t:0 "A Swindle Collapses"
 won.120.d:0 "An investment fund promising thirty percent a year has collapsed. It paid old investors with new investors' money. Thousands of savers are ruined.\n\nA Banking Supervision programme would make crises like this rarer and easier to handle."
 won.120.dp:0 "An investment fund promising thirty percent a year has collapsed. It paid old investors with new investors' money. Thousands of savers are ruined.\n\nOur Banking Supervision programme is ready for exactly this."
 won.120.a:0 "Banking Supervision: The regulators caught it early."
 won.120.b:0 "Compensate the small savers."
 won.120.c:0 "Caveat emptor."
 won.121.t:0 "Insurance Giant Fails"
 won.121.d:0 "The country's largest insurer cannot pay its claims. Policyholders are queuing outside its offices.\n\nA Banking Supervision programme would make crises like this rarer and easier to handle."
 won.121.dp:0 "The country's largest insurer cannot pay its claims. Policyholders are queuing outside its offices.\n\nOur Banking Supervision programme is ready for exactly this."
 won.121.a:0 "Banking Supervision: The guarantee fund pays the claims."
 won.121.b:0 "Bail it out."
 won.121.c:0 "Liquidate it."
 won.122.t:0 "Land Speculation Fever"
 won.122.d:0 "Plots that sold for a pittance last year now change hands for a fortune. Banks are lending against the rising prices.\n\nA Banking Supervision programme would make crises like this rarer and easier to handle."
 won.122.dp:0 "Plots that sold for a pittance last year now change hands for a fortune. Banks are lending against the rising prices.\n\nOur Banking Supervision programme is ready for exactly this."
 won.122.a:0 "Banking Supervision: Tighten lending standards."
 won.122.b:0 "Let the boom run."
 won.122.c:0 "Tax the speculators."
 won.123.t:0 "The Bubble Bursts"
 won.123.d:0 "Land prices have crashed as fast as they rose. Builders are bankrupt and the banks are full of worthless mortgages."
 won.123.a:0 "Bail out the banks."
 won.123.b:0 "Let it burst."
 won.124.t:0 "Foreign Loan Offer"
 won.124.d:0 "A consortium of foreign banks offers a large loan at a low rate, repayable in two years with 15% interest."
 won.124.a:0 "Take the loan."
 won.124.b:0 "We do not need it."
 won.125.t:0 "Loan Repayment Due"
 won.125.d:0 "The foreign loan falls due. The bankers expect [?won_loan_due|2] bn."
 won.125.a:0 "Repay it in full."
 won.125.b:0 "Default."
 won.126.t:0 "Currency Speculators Attack"
 won.126.d:0 "Foreign speculators are betting heavily against our currency. If it breaks, prices will soar.\n\nA Banking Supervision programme would make crises like this rarer and easier to handle."
 won.126.dp:0 "Foreign speculators are betting heavily against our currency. If it breaks, prices will soar.\n\nOur Banking Supervision programme is ready for exactly this."
 won.126.a:0 "Banking Supervision: The central bank defends the currency."
 won.126.b:0 "Raise interest rates."
 won.126.c:0 "Let it fall."
 won.130.t:0 "Mine Collapse"
 won.130.d:0 "A gallery has collapsed deep underground with a full shift trapped below.\n\nA Industrial Safety Inspectorate programme would make crises like this rarer and easier to handle."
 won.130.dp:0 "A gallery has collapsed deep underground with a full shift trapped below.\n\nOur Industrial Safety Inspectorate programme is ready for exactly this."
 won.130.a:0 "Industrial Safety Inspectorate: The rescue teams are already there."
 won.130.b:0 "Rescue them and compensate the families."
 won.130.c:0 "Reopen the pit as soon as possible."
 won.131.t:0 "Great Factory Fire"
 won.131.d:0 "A fire has swept through one of our largest works. The night shift barely escaped.\n\nA Industrial Safety Inspectorate programme would make crises like this rarer and easier to handle."
 won.131.dp:0 "A fire has swept through one of our largest works. The night shift barely escaped.\n\nOur Industrial Safety Inspectorate programme is ready for exactly this."
 won.131.a:0 "Industrial Safety Inspectorate: The fire brigade contained it."
 won.131.b:0 "Rebuild with state money."
 won.131.c:0 "Leave it to the owners."
 won.132.t:0 "Blackout"
 won.132.d:0 "The overloaded power grid has failed across the industrial heartland.\n\nA Industrial Safety Inspectorate programme would make crises like this rarer and easier to handle."
 won.132.dp:0 "The overloaded power grid has failed across the industrial heartland.\n\nOur Industrial Safety Inspectorate programme is ready for exactly this."
 won.132.a:0 "Industrial Safety Inspectorate: Maintenance crews restore it overnight."
 won.132.b:0 "Rent emergency generators."
 won.132.c:0 "Ration electricity."
 won.133.t:0 "Railway Disaster"
 won.133.d:0 "Two trains have collided on the main line. The line is closed and freight is backing up.\n\nA Industrial Safety Inspectorate programme would make crises like this rarer and easier to handle."
 won.133.dp:0 "Two trains have collided on the main line. The line is closed and freight is backing up.\n\nOur Industrial Safety Inspectorate programme is ready for exactly this."
 won.133.a:0 "Industrial Safety Inspectorate: Inspectors had the line repaired fast."
 won.133.b:0 "Public inquiry and new signals."
 won.133.c:0 "Keep the trains running."
 won.134.t:0 "New Production Technique"
 won.134.d:0 "Engineers have worked out a way to cut assembly time by a third."
 won.134.a:0 "License it for the whole industry."
 won.134.b:0 "Let firms adopt it at their own pace."
 won.140.t:0 "Influenza Epidemic"
 won.140.d:0 "A severe influenza is sweeping the cities. Hospitals are full and factories are half-empty.\n\nA Public Health Service programme would make crises like this rarer and easier to handle."
 won.140.dp:0 "A severe influenza is sweeping the cities. Hospitals are full and factories are half-empty.\n\nOur Public Health Service programme is ready for exactly this."
 won.140.a:0 "Public Health Service: The health service starts a vaccination drive."
 won.140.b:0 "Close schools and theatres."
 won.140.c:0 "Business as usual."
 won.141.t:0 "Typhus Behind the Lines"
 won.141.d:0 "Lice and crowded camps have brought typhus to the rear areas and the cities beyond.\n\nA Public Health Service programme would make crises like this rarer and easier to handle."
 won.141.dp:0 "Lice and crowded camps have brought typhus to the rear areas and the cities beyond.\n\nOur Public Health Service programme is ready for exactly this."
 won.141.a:0 "Public Health Service: Delousing stations everywhere."
 won.141.b:0 "Emergency hospitals."
 won.141.c:0 "The war comes first."
 won.142.t:0 "Slum Outbreak"
 won.142.d:0 "Cholera has broken out in the overcrowded tenements of the industrial districts.\n\nA Public Health Service programme would make crises like this rarer and easier to handle."
 won.142.dp:0 "Cholera has broken out in the overcrowded tenements of the industrial districts.\n\nOur Public Health Service programme is ready for exactly this."
 won.142.a:0 "Public Health Service: Sanitary inspectors seal it off."
 won.142.b:0 "Clear the slums."
 won.142.c:0 "Ignore it."
 won.150.t:0 "Smuggling Ring"
 won.150.d:0 "Customs officers have been taking bribes to wave through contraband by the trainload.\n\nA Anti-Corruption Bureau programme would make crises like this rarer and easier to handle."
 won.150.dp:0 "Customs officers have been taking bribes to wave through contraband by the trainload.\n\nOur Anti-Corruption Bureau programme is ready for exactly this."
 won.150.a:0 "Anti-Corruption Bureau: The Bureau breaks the ring and seizes the goods."
 won.150.b:0 "Purge the customs service."
 won.150.c:0 "Turn a blind eye."
 won.151.t:0 "Tax Evasion Scandal"
 won.151.d:0 "A leaked ledger shows the country's richest families have paid almost no tax for years.\n\nA Anti-Corruption Bureau programme would make crises like this rarer and easier to handle."
 won.151.dp:0 "A leaked ledger shows the country's richest families have paid almost no tax for years.\n\nOur Anti-Corruption Bureau programme is ready for exactly this."
 won.151.a:0 "Anti-Corruption Bureau: The Bureau recovers the back taxes."
 won.151.b:0 "Offer a tax amnesty."
 won.151.c:0 "Ignore it."
 won.152.t:0 "Procurement Bribery"
 won.152.d:0 "Army buyers have been taking kickbacks for overpriced, shoddy equipment.\n\nA Anti-Corruption Bureau programme would make crises like this rarer and easier to handle."
 won.152.dp:0 "Army buyers have been taking kickbacks for overpriced, shoddy equipment.\n\nOur Anti-Corruption Bureau programme is ready for exactly this."
 won.152.a:0 "Anti-Corruption Bureau: Prosecute them publicly."
 won.152.b:0 "Quiet dismissals."
 won.152.c:0 "Ignore it."
 won.160.t:0 "Great Flood"
 won.160.d:0 "Rivers have burst their banks after days of rain. Towns, farms and rail lines are under water.\n\nA Disaster Relief and Flood Control programme would make crises like this rarer and easier to handle."
 won.160.dp:0 "Rivers have burst their banks after days of rain. Towns, farms and rail lines are under water.\n\nOur Disaster Relief and Flood Control programme is ready for exactly this."
 won.160.a:0 "Disaster Relief: The dykes held. Relief crews mop up."
 won.160.b:0 "State relief works."
 won.160.c:0 "Let the localities cope."
 won.161.t:0 "Earthquake"
 won.161.d:0 "A violent earthquake has levelled a provincial city. The death toll is still rising.\n\nA Disaster Relief and Flood Control programme would make crises like this rarer and easier to handle."
 won.161.dp:0 "A violent earthquake has levelled a provincial city. The death toll is still rising.\n\nOur Disaster Relief and Flood Control programme is ready for exactly this."
 won.161.a:0 "Disaster Relief: The relief corps is on the scene within hours."
 won.161.b:0 "Rebuild with state money."
 won.161.c:0 "Rebuilding will take time."
 won.162.t:0 "Harsh Winter"
 won.162.d:0 "The coldest winter in living memory has frozen rivers and railways. Coal is running out.\n\nA Disaster Relief and Flood Control programme would make crises like this rarer and easier to handle."
 won.162.dp:0 "The coldest winter in living memory has frozen rivers and railways. Coal is running out.\n\nOur Disaster Relief and Flood Control programme is ready for exactly this."
 won.162.a:0 "Disaster Relief: Release the coal reserves."
 won.162.b:0 "Buy emergency coal."
 won.162.c:0 "Ration heating."
 won.170.t:0 "Oil Price Shock"
 won.170.d:0 "World oil prices have doubled overnight after trouble in the producing regions.\n\nA Strategic Commodity Reserves programme would make crises like this rarer and easier to handle."
 won.170.dp:0 "World oil prices have doubled overnight after trouble in the producing regions.\n\nOur Strategic Commodity Reserves programme is ready for exactly this."
 won.170.a:0 "Strategic Commodity Reserves: Release the strategic reserves."
 won.170.b:0 "Pay the world price."
 won.170.c:0 "Ration fuel."
 won.171.t:0 "Rubber Shortage"
 won.171.d:0 "Plantation troubles have cut rubber shipments in half. Tyre and belt makers are cutting shifts.\n\nA Strategic Commodity Reserves programme would make crises like this rarer and easier to handle."
 won.171.dp:0 "Plantation troubles have cut rubber shipments in half. Tyre and belt makers are cutting shifts.\n\nOur Strategic Commodity Reserves programme is ready for exactly this."
 won.171.a:0 "Strategic Commodity Reserves: Draw on the stockpile."
 won.171.b:0 "Buy at any price."
 won.171.c:0 "Make do with substitutes."
 won.172.t:0 "Commodity Windfall"
 won.172.d:0 "World prices for our raw materials have shot up. Exporters are making a fortune."
 won.172.a:0 "Tax the export windfall."
 won.172.b:0 "Strategic Commodity Reserves: Fill the state stockpiles while we can."
 won.172.c:0 "Let the exporters keep it."
 won.180.t:0 "The Radio Craze"
 won.180.d:0 "Cheap wireless sets have reached every town. Families gather every evening for news, music and serials."
 won.180.a:0 "Build a national broadcaster."
 won.180.b:0 "Let advertisers fund the airwaves."
 won.181.t:0 "Motor Car Fever"
 won.181.d:0 "Mass-produced cars are within reach of the middle class. The roads are not ready for them."
 won.181.a:0 "Build modern roads."
 won.181.b:0 "Tax motorists."
 won.182.t:0 "Tourist Season"
 won.182.d:0 "Foreign tourists are filling our hotels, spas and beaches this summer."
 won.182.a:0 "Promote the country abroad."
 won.182.b:0 "Enjoy it."
 won.183.t:0 "Paid Holidays Bill"
 won.183.d:0 "Parliament is debating two weeks of paid holiday for every worker."
 won.183.a:0 "Pass it."
 won.183.b:0 "Too costly for industry."
 won.215.t:0 "Merchants of Death"
 won.215.d:0 "A newspaper exposes our arms shipments to dictatorships. Opposition deputies demand an inquiry into the merchants of death who profit from other nations' wars."
 won.215.a:0 "Defend the industry: exports keep our workers employed."
 won.215.b:0 "Hold an inquiry and cancel the contracts with dictatorships."
 won.215.c:0 "Route the shipments through middlemen."
 won.184.t:0 "National Industrial Exhibition"
 won.184.d:0 "Our manufacturers want a grand exhibition to show off their newest products."
 won.184.a:0 "Host it in the capital."
 won.184.b:0 "Let them pay for it themselves."
