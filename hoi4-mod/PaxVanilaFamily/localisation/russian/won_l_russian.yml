 # ---------------------------------------------------------------- Events
 won.1.t:0 "Министерство экономики докладывает"
 won.1.d:0 "Министр экономики подготовил первый доклад для [Root.GetLeader]. Наша экономика производит [?won_gdp|1] млрд в год, в казне [?won_treasury|1] млрд, а нация живёт при строе: [GetWonSystem].\n\nОтныне экономикой управляем мы: задаём налоги, процентные ставки и приоритеты бюджета; реформируем экономическую систему; и через экран дипломатии любой страны подписываем торговые соглашения и строительные пакты, вкладываем капитал, нанимаем их компании или продаём собственные услуги.\n\nНажмите на цифру казны на верхней панели, чтобы в любой момент открыть министерство."
 won.1.a:0 "Покажите цифры."
 won.1.b:0 "Позже."
 won.2.t:0 "Экономическая реформа"
 won.2.d:0 "Экономисты, промышленники и партийные чиновники толпятся в зале кабинета. У каждого своё видение экономики страны. Наша идеология исключает часть из них, но в этих рамках выбор за нами.\n\nТекущая система: [GetWonSystem]."
 won.2.x:0 "Оставить всё как есть (вернуть 75 политической силы)."
 won.3.t:0 "Новый режим, новая экономика"
 won.3.d:0 "Старый экономический порядок не пережил смену правительства. Министерствам нужна новая доктрина, и нужна немедленно."
 won_sys_opt_1:0 "Капитализм невмешательства."
 won_sys_opt_2:0 "Кейнсианская смешанная экономика."
 won_sys_opt_3:0 "Социальная рыночная экономика."
 won_sys_opt_4:0 "Командная экономика."
 won_sys_opt_5:0 "Рыночный социализм."
 won_sys_opt_6:0 "Военный коммунизм."
 won_sys_opt_7:0 "Корпоративизм."
 won_sys_opt_8:0 "Автаркия."
 won_sys_opt_9:0 "Оборонная экономика."
 won_sys_opt_10:0 "Государственный капитализм."
 won_sys_opt_11:0 "Аграрная экономика."
 won_sys_opt_12:0 "Меркантилизм."
 won.10.t:0 "Подъём на фондовом рынке"
 won.10.d:0 "Цены на акции растут уже несколько недель. Клерки покупают акции в кредит, а газеты пишут о новой эре процветания. Центробанк спрашивает, не убрать ли чашу с пуншем."
 won.10.a:0 "Пусть хорошие времена продолжаются."
 won.10.b:0 "Поднять ставки, пока не перегрелось."
 won.11.t:0 "Крах рынка"
 won.11.d:0 "Чёрный понедельник: биржа за одну сессию потеряла пятую часть стоимости. Брокеры разорены, а банки, кредитовавшие под акции, в беде."
 won.11.a:0 "Спасти банки."
 won.11.b:0 "Пусть разоряются. Рынок должен очиститься."
 won.11.p:0 "Банковский надзор: депозитный фонд успокаивает рынки."
 won.12.t:0 "Паника вкладчиков"
 won.12.d:0 "Очереди тянутся вокруг квартала: вкладчики спешат снять сбережения. Если паника разрастётся, кредит замёрзнет."
 won.12.a:0 "Гарантировать все вклады."
 won.12.b:0 "Объявить банковские каникулы."
 won.12.p:0 "Банковский надзор: страхование вкладов выплачивает."
 won.13.t:0 "Инфляционная спираль"
 won.13.d:0 "Цены растут быстрее зарплат. Домохозяйки жалуются, что недельные покупки стоят на треть дороже, чем год назад, а профсоюзы требуют компенсации."
 won.13.a:0 "Заморозить цены указом."
 won.13.b:0 "Ужесточить денежную политику."
 won.13.c:0 "Переждать."
 won.14.t:0 "Дефляционная ловушка"
 won.14.d:0 "Цены продолжают падать. Покупатели ждут удешевления, фабрики сокращают выпуск, а долги тяжелеют в реальном выражении."
 won.14.a:0 "Снизить ставки до предела."
 won.14.b:0 "Подстегнуть экономику государственными расходами."
 won.15.t:0 "Всеобщая забастовка"
 won.15.d:0 "Профсоюзы вывели людей с фабрик. Рабочие говорят, что зарплаты не поспевают за налогами и ценами."
 won.15.a:0 "Договориться об урегулировании."
 won.15.b:0 "Подавить забастовку."
 won.15.c:0 "Подождать, пока у них закончатся деньги."
 won.15.p:0 "Совет по трудовым отношениям: арбитраж всё урегулирует."
 won.16.t:0 "Рекордный урожай"
 won.16.d:0 "Идеальная погода дала нашим фермерам лучший урожай за поколение. Амбары переполнены."
 won.16.a:0 "Продать излишки за рубеж."
 won.16.b:0 "Дешёвый хлеб для всех."
 won.17.t:0 "Неурожай"
 won.17.d:0 "Засуха и болезни погубили посевы в нескольких провинциях. Цены на хлеб растут."
 won.17.a:0 "Закупить зерно любой ценой."
 won.17.b:0 "Народ затянет пояса (риск голода)."
 won.17.p:0 "Субсидии фермерам: выдать зерно из государственных резервов."
 won.18.t:0 "Чёрный рынок"
 won.18.d:0 "Война истощает запасы, и в каждом городе возник чёрный рынок всего, от сигарет до шин."
 won.18.a:0 "Расправиться со спекулянтами."
 won.18.b:0 "Закрыть на это глаза."
 won.18.p:0 "Антикоррупционное бюро: облавы на чёрные рынки."
 won.19.t:0 "Прорыв изобретателя"
 won.19.d:0 "Провинциальный инженер запатентовал процесс, способный снизить издержки производства во всей нашей промышленности. Ему нужен капитал для масштабирования."
 won.19.a:0 "Профинансировать его."
 won.19.b:0 "Его могут поддержать частные инвесторы."
 won.20.t:0 "Промышленная катастрофа"
 won.20.d:0 "Взрыв разрушил один из крупнейших наших заводов. Десятки погибли, производство будет нарушено на месяцы."
 won.20.a:0 "Восстановить на государственные деньги."
 won.20.b:0 "Это проблема владельцев."
 won.20.p:0 "Промышленная безопасность: спасательные команды и быстрый ремонт."
 won.21.t:0 "Потребительский бум"
 won.21.d:0 "Универмаги забиты. Впервые обычные семьи покупают радиоприёмники, холодильники и даже автомобили."
 won.21.a:0 "Пусть тратят."
 won.21.b:0 "Обложить налогом предметы роскоши."
 won.22.t:0 "Спор о нормировании"
 won.22.d:0 "Война съедает наши запасы. Министерство предлагает карточки на продукты, топливо и одежду."
 won.22.a:0 "Ввести нормирование."
 won.22.b:0 "Оставить полки открытыми."
 won.23.t:0 "Коррупционный скандал"
 won.23.d:0 "Газета раскрыла, что государственные контракты направлялись фирмам родственников министров."
 won.23.a:0 "Назначить публичное расследование."
 won.23.b:0 "Замять дело."
 won.23.p:0 "Антикоррупционное бюро: бюро тихо разберётся."
 won.24.t:0 "Кредитный рейтинг понижен"
 won.24.d:0 "Международные банкиры понизили рейтинг наших облигаций. Заимствования подорожают, инвесторы нервничают."
 won.24.a:0 "Пообещать финансовую реформу: поднять налоги."
 won.24.b:0 "Мы не отчитываемся перед банкирами."
 won.25.t:0 "Кредитный рейтинг повышен"
 won.25.d:0 "Наши здоровые финансы впечатлили рынки. Наши облигации теперь одни из самых надёжных в мире."
 won.25.a:0 "Отлично."
 won.26.t:0 "Учёные-эмигранты"
 won.26.d:0 "Учёные и инженеры, бегущие от преследований за рубежом, просят визы. Они привозят редкие навыки."
 won.26.a:0 "Принять их и финансировать их лаборатории."
 won.26.b:0 "Иммиграционные квоты остаются прежними."
 won.27.t:0 "Утечка мозгов"
 won.27.d:0 "Часть наших лучших учёных и инженеров тихо эмигрировала, и новые подают на выездные разрешения."
 won.27.a:0 "Пусть уезжают."
 won.27.b:0 "Закрыть для них границы."
 won.28.t:0 "Железнодорожные бароны"
 won.28.d:0 "Консорциум предлагает проложить новые линии в провинциях, если государство разделит расходы."
 won.28.a:0 "Подписать концессию."
 won.28.b:0 "Слишком дорого."
 won.29.t:0 "Бегство капитала"
 won.29.d:0 "Напуганные инвесторы выводят деньги за рубеж. Золото уходит из страны целыми эшелонами."
 won.29.a:0 "Ввести валютный контроль."
 won.29.b:0 "Поднять ставки, чтобы удержать деньги."
 won.29.c:0 "Пусть уходит."
 won.29.p:0 "Банковский надзор: центральный банк удерживает рубеж."
 won.31.t:0 "Торговый партнёр требует лучших условий"
 won.31.d:0 "Переговорщики из [?global.won_ev_partner_name.GetNameDef] говорят, что наше торговое соглашение слишком выгодно нам. Они хотят лучшей сделки, иначе могут уйти."
 won.31.a:0 "Подсластить сделку."
 won.31.b:0 "Уговор есть уговор."
 won.32.t:0 "Рецессия 1937 года"
 won.32.d:0 "Когда казалось, что восстановление обеспечено, выпуск снова упал. Экономисты винят спешку правительства с балансировкой бюджета, банкиры винят дефицит."
 won.32.a:0 "Тратить, чтобы выбраться."
 won.32.b:0 "Сбалансировать бюджет любой ценой."
 won.33.t:0 "Золотой стандарт"
 won.33.d:0 "Другие страны ушли с золота и девальвировали валюту, сделав свой экспорт дешевле нашего. Последовать ли нам?"
 won.33.a:0 "Уйти с золота и девальвировать."
 won.33.b:0 "Удержать золотую линию."
 won.34.t:0 "Всемирная выставка"
 won.34.d:0 "Наша столица выбрана для проведения Всемирной выставки. Павильоны всех наций покажут миру завтрашний день."
 won.34.a:0 "Провести с размахом."
 won.34.b:0 "Скромной выставки достаточно."
 won.35.t:0 "Нехватка жилья"
 won.35.d:0 "Рабочие стекаются в промышленные города быстрее, чем строятся дома. Арендная плата взлетает."
 won.35.a:0 "Построить государственное жильё."
 won.35.b:0 "Рынок всё обеспечит."
 won.36.t:0 "Военная спекуляция"
 won.36.d:0 "Оружейники сообщают о рекордных прибылях, пока на фронте гибнут солдаты. Общество возмущено."
 won.36.a:0 "Ввести налог на сверхприбыль."
 won.36.b:0 "Производство прежде всего."
 won.37.t:0 "Гиперинфляция"
 won.37.d:0 "Цены удваиваются месяц за месяцем. Рабочим платят дважды в день, и они бегут в магазины, пока зарплата не обесценилась."
 won.37.a:0 "Денежная реформа: новые деньги любой ценой."
 won.37.b:0 "Пусть станки печатают дальше."
 won.38.t:0 "Предупреждение о долговом кризисе"
 won.38.d:0 "Наш государственный долг превысил весь годовой ВВП ([?won_debt_pct|0]%). Проценты душат бюджет, кредиторы требуют более высоких ставок.\n\nПоднимите налоги, снизьте приоритет бюджета, введите бюджет жёсткой экономии или реструктурируйте долг в Министерстве экономики."
 won.38.a:0 "Надо действовать."
 won.40.t:0 "Потеряны активы за рубежом"
 won.40.d:0 "Инвестиции на [?won_lost_assets|1] млрд потеряны: принимающая страна начала с нами войну, национализировала промышленность или перестала существовать."
 won.40.a:0 "Горькая потеря."
 won.50.t:0 "Иностранные инвесторы"
 won.50.d:0 "Промышленники из [?global.won_ev_partner_name.GetNameDef] хотят построить в нашей стране современную фабрику на свои деньги. Взамен они будут забирать долю прибыли каждый месяц."
 won.50.a:0 "Приветствовать их деньги."
 won.50.b:0 "Только как совместное предприятие."
 won.50.c:0 "Наша промышленность не продаётся."
 won.60.t:0 "Корпоративные палаты собираются"
 won.60.d:0 "Работодатели и профсоюзные лидеры стоят друг против друга в палате. Государство должно решить, чьи интересы будут на первом месте в этом году."
 won.60.a:0 "Поддержать промышленников."
 won.60.b:0 "Поддержать рабочих."
 won.60.c:0 "Напомнить обоим, кто здесь главный."
 won.61.t:0 "Наступил срок векселей «Мефо»"
 won.61.d:0 "Векселя, выпущенные в прошлом году, созрели. Кредиторы ожидают [?won_mefo_due|2] млрд."
 won.61.a:0 "Заплатить полностью."
 won.61.b:0 "Заплатить половину, остальное пролонгировать."
 won.61.c:0 "Объявить дефолт."
 won.62.t:0 "Пятилетка завершается"
 won.62.d:0 "План целился в [?won_fyp_target|0] фабрик. Сейчас в нашей промышленности их [?won_fyp_now|0]."
 won.62.a:0 "План выполнен!"
 won.62.b:0 "Виноваты вредители и саботажники."
 won.70.t:0 "Геологи нашли богатое месторождение"
 won.70.d:0 "Геологоразведочная компания сообщает о богатом месторождении в одном из наших коренных штатов. Добычу можно начинать немедленно."
 won.70.a:0 "Начать копать."
 won.71.t:0 "Пустые скважины"
 won.71.d:0 "После трёх месяцев бурения геологи не нашли ничего, что стоило бы добывать."
 won.71.a:0 "В следующий раз повезёт."
 # ---------------------------------------------------------------- Global Markets category
 won_cat_global:0 "Мировые рынки"
 won_cat_global_desc:0 "§YБюро внешней торговли: запросов в ожидании [?won_q_count|0]§!\n\nПоложение на рынке: §Y[GetAonTierName]§! ([?aon_rep|0])   Контракты на поставки: §Y[?won_sc_count|0]/[?won_sc_max|0]§!\nДеньги Международного рынка: §G[?won_mkt_income|2] млрд§! за прошлый месяц   Лицензионные отчисления: §G[?won_inc_roy|2] млрд§!/мес\nЭкспорт оружия: §Y[?won_arms_rev_12|1] млрд§! за прошлый год\n\nИнвестиционный климат: §Y[?won_climate|0]/100§! (§Y[?won_fdi_chance|1]%§! шанс иностранного инвестора каждый месяц; торговый закон [?won_law_cl|+0])\nЭкспорт ресурсов: §Y[?won_res_units|0]§! ед., §G[?won_inc_res|2] млрд§!/мес\nИностранный капитал здесь: §Y[?won_fdi_in|1] млрд§!, налог на корпорации §G[?won_inc_corp|2] млрд§!/мес"
 won_publish_growth:0 "Опубликовать данные о росте за рубежом"
 won_publish_growth_desc:0 "Отправить министра финансов в турне по зарубежным биржам с нашими цифрами роста. §G+15 к инвестиционному климату§! на 180 дней."
 won_tax_holiday_dec:0 "Налоговые каникулы для корпораций"
 won_tax_holiday_dec_desc:0 "Без налога на корпорации на год. §G+20 к инвестиционному климату§!, но мы теряем налог с иностранных фирм и 0,1% ВВП в месяц от отечественного корпоративного налога."
 won_red_tape_dec:0 "Сократить бюрократию для промышленности"
 won_red_tape_dec_desc:0 "Ускоренные разрешения и меньше проверок на год: §G+10 к инвестиционному климату§!, +5% скорости строительства, -2% стабильности."
 won_sez_dec:0 "Создать особую экономическую зону"
 won_sez_dec_desc:0 "Постоянная зона с низкими налогами и собственной таможней вокруг столицы: §G+2 слота зданий§! в столичном штате и §G+10 к инвестиционному климату§! навсегда, но иностранные фирмы платят лишь половину корпоративного налога."
 won_court_investors:0 "Обхаживать иностранных промышленников"
 won_court_investors_desc:0 "Пригласить советы директоров иностранных фирм в столицу. Иностранный инвестор сразу делает предложение."
 won_found_arms_agency:0 "Основать агентство экспорта оружия"
 won_found_arms_agency_desc:0 "Государственное агентство, продающее наше оружие за рубеж.\n- Правительства присылают предложения контрактов на поставки и запросы лицензий в §YБюро внешней торговли§!, а §YПредложить оружейную сделку§! появляется на каждом экране дипломатии.\n- Страны ИИ предпочитают наши лоты на §YМеждународном рынке§! (отключается в бюро или в окне рынка), и каждая продажа там приносит казне деньги.\n- Наше §YПоложение на рынке§! начинается с «Малого поставщика оружия»."
 # ---------------------------------------------------------------- tooltips
 won_tt_needs_growth:0 "Экономика выросла более чем на 2% за последний год."
 won_tt_needs_open:0 "Мы открыты для иностранного капитала."
 won_tt_investor_exists:0 "У какой-то иностранной фирмы есть деньги для инвестиций."
