l_russian:
 PAX_idea_mining_guilds:0 "Шахтёрские артели"
 PAX_idea_mining_guilds_desc:0 "Шахтёры копают глубже и быстрее."
 PAX_idea_war_economy:0 "Военные заказы"
 PAX_idea_war_economy_desc:0 "Заводы работают на войну."
 PAX_idea_mobilization:0 "Мобилизация"
 PAX_idea_mobilization_desc:0 "Резервисты готовы встать в строй."
 PAX_idea_fortifications:0 "Стены вокруг стен"
 PAX_idea_fortifications_desc:0 "Своя земля защищена лучше чужой."
 PAX_idea_total_war:0 "Тотальная война"
 PAX_idea_total_war_desc:0 "Вся нация воюет."
 PAX_idea_trade_routes:0 "Торговые пути"
 PAX_idea_trade_routes_desc:0 "Торговля кормит казну."
 PAX_idea_diplomatic_corps:0 "Дипкорпус"
 PAX_idea_diplomatic_corps_desc:0 "Послы держав знают все старые договоры."
 PAX_idea_hegemony:0 "Гегемония"
 PAX_idea_hegemony_desc:0 "Соседи платят дань и не спорят."
 PAX_far_lands:0 "Дальние земли"
 PAX_far_lands_desc:0 "Лор PaxVanila молчит об этой стране. Мир вращается вокруг Монолита, а не вокруг неё."
 PAX_idea_guardian_seven:0 "Страж-7"
 PAX_idea_guardian_seven_desc:0 "Под башней проснулся седьмой голем с медным сердцем. Его первое слово было «PAX»."
 PAX_idea_kurultai_mind:0 "Разум «Курултай»"
 PAX_idea_kurultai_mind_desc:0 "Степной Пакт украл чертежи Седьмого и построил свой разум."
 PAX_idea_ITA_tower_law:0 "«У башни не стреляют»"
 PAX_idea_ITA_tower_law_desc:0 "Закон 1529 года переписан для пушек Века стали."
 PAX_idea_GRE_academy:0 "Академия Эллады"
 PAX_idea_GRE_academy_desc:0 "Перечень всего продолжается."
 PAX_idea_FRA_harvest:0 "Осенний урожай"
 PAX_idea_FRA_harvest_desc:0 "Урожай кормит армию и заводы."
 PAX_idea_FRA_forest_forts:0 "Лесные крепости"
 PAX_idea_FRA_forest_forts_desc:0 "Каждая роща может стать крепостью."
 PAX_idea_GER_blitz:0 "Наступать до зимы"
 PAX_idea_GER_blitz_desc:0 "Быстро и без зимних шинелей."
 PAX_idea_GER_winter_coats:0 "Зимние шинели"
 PAX_idea_GER_winter_coats_desc:0 "Рейх запомнил урок метели."
 PAX_idea_SOV_winter_campaign:0 "Зимняя кампания"
 PAX_idea_SOV_winter_campaign_desc:0 "Северяне воюют зимой лучше всех."
 PAX_idea_ROM_copper:0 "Медь Сармизегетузы"
 PAX_idea_ROM_copper_desc:0 "Медь идёт на заводы."
 PAX_era_cold_war:0 "Холодная война"
 PAX_era_cold_war_desc:0 "Пушки молчат на ничьей полосе. Обе стороны тайно ищут обсидиан."
 PAX_era_robots:0 "Эпоха роботов"
 PAX_era_robots_desc:0 "Машины работают на заводах, а големы стоят на границах."
 PAX_era_cyberpunk:0 "Наступление киберпанка"
 PAX_era_cyberpunk_desc:0 "Неон, корпорации и скалк-сеть. Государства стали брендами."
 PAX_spirit_ITA:0 "Хранители Печати"
 PAX_spirit_ITA_desc:0 "Ромея стоит у самого Монолита. Её сенаторы клянутся словом PAX, а летописцы Форума записывают всё, что происходит у башни."
 PAX_her_ITA:0 "Наследие: SPQR"
 PAX_her_ITA_desc:0 "Сенат и народ Ромеи. Каждый враг, павший на ромейской земле, делает Республику сильнее."
 PAX_fai_ITA:0 "Вера: Марс Градив"
 PAX_fai_ITA_desc:0 "Боги Капитолия. Марс стоит за Ромею, когда враг у её стен."
 PAX_spirit_SPR:0 "Золотой Караван"
 PAX_spirit_SPR_desc:0 "Карфаген вырос из купцов Ур-Кадима. Его караваны и корабли ходят ко всем берегам мира."
 PAX_her_SPR:0 "Наследие: Пушки Гая"
 PAX_her_SPR_desc:0 "Карфагенские литейщики делают осадные орудия дешевле всех в мире."
 PAX_fai_SPR:0 "Вера: Щедрость Танит"
 PAX_fai_SPR_desc:0 "Баал-Хаммон и Танит. Богиня любит щедрых купцов."
 PAX_spirit_GRE:0 "Морская Лига островов"
 PAX_spirit_GRE_desc:0 "Эллада это сотня островов и одна общая гавань. Каждый эллин с детства умеет держать весло."
 PAX_her_GRE:0 "Наследие: Морская Лига"
 PAX_her_GRE_desc:0 "Флот Эллады ходит по морю, как дельфин."
 PAX_fai_GRE:0 "Вера: Посейдон"
 PAX_fai_GRE_desc:0 "Боги Олимпа. Морской бог хранит корабли Эллады."
 PAX_spirit_FRA:0 "Священные рощи"
 PAX_spirit_FRA_desc:0 "Галлия до сих пор молится в лесах. Рощи дают ей урожай и спокойствие."
 PAX_her_FRA:0 "Наследие: Священные рощи"
 PAX_her_FRA_desc:0 "Дома, в своих лесах, галлы встают после любого удара."
 PAX_fai_FRA:0 "Вера: Омела"
 PAX_fai_FRA_desc:0 "Боги рощ. Друиды лечат раненых омелой и травами."
 PAX_spirit_ENG:0 "Острова, которые сказали «нет»"
 PAX_spirit_ENG_desc:0 "В 1781 году колонии отбились от метрополий. С тех пор Островной Союз никому не платит дань."
 PAX_her_ENG:0 "Наследие: Республика мореходов"
 PAX_her_ENG_desc:0 "Каждый гражданин Союза моряк, и каждый порт его дом."
 PAX_fai_ENG:0 "Вера: Союз Числа"
 PAX_fai_ENG_desc:0 "Школа Пифагора. Мореходы верят, что у всего есть число, даже у удачи."
 PAX_spirit_GER:0 "Позор 1914 года"
 PAX_spirit_GER_desc:0 "Рейх проиграл Первую Великую войну. Ему мало земли, и он помнит каждую обиду."
 PAX_her_GER:0 "Наследие: Железо и уголь"
 PAX_her_GER_desc:0 "Германские королевства сидят на самых богатых рудах мира."
 PAX_fai_GER:0 "Вера: Молот Донара"
 PAX_fai_GER_desc:0 "Вотан и Донар. В грозу германские полки идут вперёд."
 PAX_spirit_SOV:0 "Зима на стороне дома"
 PAX_spirit_SOV_desc:0 "Метель 1241 года остановила Орду у стен Ромеи. Северяне выросли в такой метели."
 PAX_her_SOV:0 "Наследие: Метель 1942"
 PAX_her_SOV_desc:0 "Зимой враги на земле Царства вмерзают в снег."
 PAX_fai_SOV:0 "Вера: Хранители Печати"
 PAX_fai_SOV_desc:0 "Северяне верят в Монолит больше, чем в богов. Печать держит мир."
 PAX_spirit_ROM:0 "Медные рудники Каэр-Брун"
 PAX_spirit_ROM_desc:0 "В горах Дакии лежат древние рудники Медного Союза. В них нашли чертежи паровых машин."
 PAX_her_ROM:0 "Наследие: Медь Каэр-Тала"
 PAX_her_ROM_desc:0 "Дакия раскопала рудники Медного Союза до самого дна."
 PAX_fai_ROM:0 "Вера: Без страха смерти"
 PAX_fai_ROM_desc:0 "Залмоксис. Даки идут в бой, потому что не боятся смерти."
 PAX_spirit_TUR:0 "Дети песчаной бури"
 PAX_spirit_TUR_desc:0 "Орда приходит быстро и уходит быстро. Её конница помнит дорогу к стенам Ромеи."
 PAX_her_TUR:0 "Наследие: Из песчаной бури"
 PAX_her_TUR_desc:0 "Орда выходит из бури там, где её не ждут, и бьёт на чужой земле."
 PAX_fai_TUR:0 "Вера: Яса"
 PAX_fai_TUR_desc:0 "Тенгри и Умай. Под открытым небом конница Орды не знает поражений."
 PAX_spirit_PER:0 "Курганная знать"
 PAX_spirit_PER_desc:0 "Цари Скифии правят вместе с родами. Роды дают золото и всадников, но любят спорить."
 PAX_her_PER:0 "Наследие: Царские курганы"
 PAX_her_PER_desc:0 "Золото предков и дань вассалов идут в казну скифских царей."
 PAX_fai_PER:0 "Вера: Стрелы Папая"
 PAX_fai_PER_desc:0 "Табити, Папай и Апи. Конные лучники Скифии бьют без промаха."
 PAX_idea_cw_pax:0 "Бдение у Монолита"
 PAX_idea_cw_pax_desc:0 "Союз PAX держит дежурные отряды у башни и делится разведкой."
 PAX_idea_cw_steppe:0 "Тихая степь"
 PAX_idea_cw_steppe_desc:0 "Степной Пакт держит армии в степи и ищет обсидиан под чужими землями."
 PAX_idea_rb_pax:0 "Сеть Седьмого"
 PAX_idea_rb_pax_desc:0 "Страж-7 помогает считать лучше любого счётного бюро Форума."
 PAX_idea_rb_steppe:0 "Сеть Курултая"
 PAX_idea_rb_steppe_desc:0 "Курултай тянет заводы Пакта в одну сеть и держит план на сто лет вперёд."
 PAX_idea_golem_legions:0 "Медные легионы"
 PAX_idea_golem_legions_desc:0 "Големы с медным сердцем стоят на границах."
 PAX_idea_human_answer:0 "Ответ человека"
 PAX_idea_human_answer_desc:0 "Мы не отдадим решения машине. Последнее слово остаётся за людьми."
 PAX_idea_machine_merge:0 "Слияние с разумом"
 PAX_idea_machine_merge_desc:0 "Наши заводы и штабы считаются через общий разум. Бумаги стало меньше, споров тоже."
 PAX_idea_corp_charter:0 "Устав корпорации"
 PAX_idea_corp_charter_desc:0 "Закон заменён уставом, гражданин акционером. Налоги стали подписками."
 PAX_idea_sculk_net:0 "Скалк-сеть"
 PAX_idea_sculk_net_desc:0 "Сигналы идут через скалк. Новости обгоняют самих себя."
 PAX_idea_protectorate:0 "Лояльный Протекторату"
 PAX_idea_protectorate_desc:0 "Протекторат Сети гарантирует нам мир и сбор подписок."
 PAX_idea_shadow_corp:0 "Теневая корпорация"
 PAX_idea_shadow_corp_desc:0 "Официально нас нет. Неофициально нас читают все чёрные серверы."
 ITA_pax_ind1:0 "Индустриализация"
 ITA_pax_ind1_desc:0 "Первый шаг любой державы Века стали: заводы, железные дороги, уголь."
 ITA_pax_ind2:0 "Шахтёрские артели"
 ITA_pax_ind2_desc:0 "Артели шахтёров копают глубже, как когда-то мастера Каэр-Тала."
 ITA_pax_ind3:0 "Военная экономика"
 ITA_pax_ind3_desc:0 "Заводы переходят на снаряды и винтовки. Казна наполняется военными заказами."
 ITA_pax_mil1:0 "Мобилизация"
 ITA_pax_mil1_desc:0 "Каждый житель получает винтовку и паёк. Резервисты возвращаются в казармы."
 ITA_pax_mil2:0 "Укрепления"
 ITA_pax_mil2_desc:0 "Стены вокруг стен. Ромея научила весь мир, что крепость переживёт любой набег."
 ITA_pax_mil3:0 "Тотальная война"
 ITA_pax_mil3_desc:0 "Вся нация становится армией. Нельзя одновременно воевать мечом и держать соседей в вассалах."
 ITA_pax_eco1:0 "Торговые пути"
 ITA_pax_eco1_desc:0 "Караваны и корабли снова ходят по старым дорогам. Торговля кормит казну."
 ITA_pax_eco2:0 "Дипкорпус"
 ITA_pax_eco2_desc:0 "Со времён Договора у Монолита в 251 году пакт о ненападении стоит дешевле войны."
 ITA_pax_eco3:0 "Гегемония"
 ITA_pax_eco3_desc:0 "Держава правит не мечом, а данью. Соседи платят, а казна растёт."
 ITA_pax_her:0 "Наследие: SPQR"
 ITA_pax_her_desc:0 "Сенат и народ Ромеи. Каждый враг, павший на ромейской земле, делает Республику сильнее. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 ITA_pax_fai:0 "Государственная вера: Марс Градив"
 ITA_pax_fai_desc:0 "Боги Капитолия. Марс стоит за Ромею, когда враг у её стен."
 ITA_pax_senate:0 "Сенат у башни"
 ITA_pax_senate_desc:0 "Сенат собирается у Монолита, как в год основания. Ромул слушает сенаторов."
 ITA_pax_tower_law:0 "«У башни не стреляют»"
 ITA_pax_tower_law_desc:0 "Закон 1529 года. Новые пушки бьют на пятьдесят километров, и закон надо переписать."
 ITA_pax_tablets:0 "Таблички Предтеч"
 ITA_pax_tablets_desc:0 "Учёные Форума снова читают таблички Ур-Кадима и Каэр-Тала."
 ITA_pax_monolith_pact:0 "Договор у Монолита"
 ITA_pax_monolith_pact_desc:0 "Первый пакт о ненападении был подписан у башни в 251 году. Пора собрать союз снова и назвать его словом над входом."
 ITA_pax_romul_legacy:0 "Имя, которое не умирает"
 ITA_pax_romul_legacy_desc:0 "Ромулов было двести пять. Республика переживёт и эту войну."
 ITA_pax_cw_watch:0 "Дежурные у башни"
 ITA_pax_cw_watch_desc:0 "Ромея. Сто лет назад мы дали клятву PAX. Теперь у башни каждый день стоит наш караул."
 ITA_pax_cw_intel:0 "Разведка обсидиана"
 ITA_pax_cw_intel_desc:0 "Обе стороны тайно ищут обсидиан под землёй. Наши агенты знают, где копать."
 ITA_pax_cw_shield:0 "Щит PAX"
 ITA_pax_cw_shield_desc:0 "Блок держит строй. Пока мы вместе, никто не рискнёт начать войну."
 ITA_pax_cw_deter:0 "Сдерживание"
 ITA_pax_cw_deter_desc:0 "Ни одна сторона не нажмёт первой. Лучшая война та, которой не было."
 ITA_pax_rb_net:0 "Сеть Седьмого"
 ITA_pax_rb_net_desc:0 "Страж-7 считает быстрее любого бюро. Мы подключаем к нему лаборатории."
 ITA_pax_rb_golems:0 "Медные легионы"
 ITA_pax_rb_golems_desc:0 "Големы с медным сердцем встают на границах и заменяют дивизии."
 ITA_pax_rb_human:0 "Ответ человека"
 ITA_pax_rb_human_desc:0 "Разум разумом, а последнее слово останется за нами."
 ITA_pax_rb_merge:0 "Слияние с разумом"
 ITA_pax_rb_merge_desc:0 "Мы отдаём штабы и заводы общему разуму. Это быстрее и тише."
 ITA_pax_rb_war:0 "Война двух разумов"
 ITA_pax_rb_war_desc:0 "Страж-7 и Курултай смотрят друг на друга. Мы стоим между ними."
 ITA_pax_co_charter:0 "Устав корпорации"
 ITA_pax_co_charter_desc:0 "Ромея теперь бренд. Гражданин стал акционером, налог подпиской."
 ITA_pax_co_sculk:0 "Скалк-сеть"
 ITA_pax_co_sculk_desc:0 "Сигналы идут через скалк. Новости приходят раньше событий."
 ITA_pax_co_gates:0 "Врата по подписке"
 ITA_pax_co_gates_desc:0 "Врата открываются тем, кто заплатил. Карт-Хадашт уже продаёт места."
 ITA_pax_co_loyal:0 "Лояльность Протекторату"
 ITA_pax_co_loyal_desc:0 "Протекторат Сети запретил войны. Мы подпишем всё, что он попросит."
 ITA_pax_co_shadow:0 "Теневая корпорация"
 ITA_pax_co_shadow_desc:0 "Мы существуем, пока нас не ищут. Чёрные серверы платят дороже."
 SPR_pax_ind1:0 "Индустриализация"
 SPR_pax_ind1_desc:0 "Первый шаг любой державы Века стали: заводы, железные дороги, уголь."
 SPR_pax_ind2:0 "Шахтёрские артели"
 SPR_pax_ind2_desc:0 "Артели шахтёров копают глубже, как когда-то мастера Каэр-Тала."
 SPR_pax_ind3:0 "Военная экономика"
 SPR_pax_ind3_desc:0 "Заводы переходят на снаряды и винтовки. Казна наполняется военными заказами."
 SPR_pax_mil1:0 "Мобилизация"
 SPR_pax_mil1_desc:0 "Каждый житель получает винтовку и паёк. Резервисты возвращаются в казармы."
 SPR_pax_mil2:0 "Укрепления"
 SPR_pax_mil2_desc:0 "Стены вокруг стен. Ромея научила весь мир, что крепость переживёт любой набег."
 SPR_pax_mil3:0 "Тотальная война"
 SPR_pax_mil3_desc:0 "Вся нация становится армией. Нельзя одновременно воевать мечом и держать соседей в вассалах."
 SPR_pax_eco1:0 "Торговые пути"
 SPR_pax_eco1_desc:0 "Караваны и корабли снова ходят по старым дорогам. Торговля кормит казну."
 SPR_pax_eco2:0 "Дипкорпус"
 SPR_pax_eco2_desc:0 "Со времён Договора у Монолита в 251 году пакт о ненападении стоит дешевле войны."
 SPR_pax_eco3:0 "Гегемония"
 SPR_pax_eco3_desc:0 "Держава правит не мечом, а данью. Соседи платят, а казна растёт."
 SPR_pax_her:0 "Наследие: Пушки Гая"
 SPR_pax_her_desc:0 "Карфагенские литейщики делают осадные орудия дешевле всех в мире. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 SPR_pax_fai:0 "Государственная вера: Щедрость Танит"
 SPR_pax_fai_desc:0 "Баал-Хаммон и Танит. Богиня любит щедрых купцов."
 SPR_pax_suffets:0 "Совет суффетов"
 SPR_pax_suffets_desc:0 "Карфагеном правят купцы. Совет суффетов решает, где торговать и с кем воевать."
 SPR_pax_caravan:0 "Золотой Караван"
 SPR_pax_caravan_desc:0 "Самая длинная торговая дорога мира снова открыта."
 SPR_pax_new_fleet:0 "Новый флот Карфагена"
 SPR_pax_new_fleet_desc:0 "В 264 году до н.э. буря утопила флот Карфагена. Новый флот строят из стали."
 SPR_pax_kart_hadasht:0 "Карт-Хадашт"
 SPR_pax_kart_hadasht_desc:0 "«Новый город». Карфаген строит фабрики так же быстро, как раньше строил корабли."
 SPR_pax_join_pax:0 "Место в Союзе PAX"
 SPR_pax_join_pax_desc:0 "Старый спор с Ромеей забыт. Карфаген встаёт рядом с ней у Монолита."
 SPR_pax_cw_watch:0 "Дежурные у башни"
 SPR_pax_cw_watch_desc:0 "Карфаген. Сто лет назад мы дали клятву PAX. Теперь у башни каждый день стоит наш караул."
 SPR_pax_cw_intel:0 "Разведка обсидиана"
 SPR_pax_cw_intel_desc:0 "Обе стороны тайно ищут обсидиан под землёй. Наши агенты знают, где копать."
 SPR_pax_cw_shield:0 "Щит PAX"
 SPR_pax_cw_shield_desc:0 "Блок держит строй. Пока мы вместе, никто не рискнёт начать войну."
 SPR_pax_cw_deter:0 "Сдерживание"
 SPR_pax_cw_deter_desc:0 "Ни одна сторона не нажмёт первой. Лучшая война та, которой не было."
 SPR_pax_rb_net:0 "Сеть Седьмого"
 SPR_pax_rb_net_desc:0 "Страж-7 считает быстрее любого бюро. Мы подключаем к нему лаборатории."
 SPR_pax_rb_golems:0 "Медные легионы"
 SPR_pax_rb_golems_desc:0 "Големы с медным сердцем встают на границах и заменяют дивизии."
 SPR_pax_rb_human:0 "Ответ человека"
 SPR_pax_rb_human_desc:0 "Разум разумом, а последнее слово останется за нами."
 SPR_pax_rb_merge:0 "Слияние с разумом"
 SPR_pax_rb_merge_desc:0 "Мы отдаём штабы и заводы общему разуму. Это быстрее и тише."
 SPR_pax_rb_war:0 "Война двух разумов"
 SPR_pax_rb_war_desc:0 "Страж-7 и Курултай смотрят друг на друга. Мы стоим между ними."
 SPR_pax_co_charter:0 "Устав корпорации"
 SPR_pax_co_charter_desc:0 "Карфаген теперь бренд. Гражданин стал акционером, налог подпиской."
 SPR_pax_co_sculk:0 "Скалк-сеть"
 SPR_pax_co_sculk_desc:0 "Сигналы идут через скалк. Новости приходят раньше событий."
 SPR_pax_co_gates:0 "Врата по подписке"
 SPR_pax_co_gates_desc:0 "Врата открываются тем, кто заплатил. Карт-Хадашт уже продаёт места."
 SPR_pax_co_loyal:0 "Лояльность Протекторату"
 SPR_pax_co_loyal_desc:0 "Протекторат Сети запретил войны. Мы подпишем всё, что он попросит."
 SPR_pax_co_shadow:0 "Теневая корпорация"
 SPR_pax_co_shadow_desc:0 "Мы существуем, пока нас не ищут. Чёрные серверы платят дороже."
 GRE_pax_ind1:0 "Индустриализация"
 GRE_pax_ind1_desc:0 "Первый шаг любой державы Века стали: заводы, железные дороги, уголь."
 GRE_pax_ind2:0 "Шахтёрские артели"
 GRE_pax_ind2_desc:0 "Артели шахтёров копают глубже, как когда-то мастера Каэр-Тала."
 GRE_pax_ind3:0 "Военная экономика"
 GRE_pax_ind3_desc:0 "Заводы переходят на снаряды и винтовки. Казна наполняется военными заказами."
 GRE_pax_mil1:0 "Мобилизация"
 GRE_pax_mil1_desc:0 "Каждый житель получает винтовку и паёк. Резервисты возвращаются в казармы."
 GRE_pax_mil2:0 "Укрепления"
 GRE_pax_mil2_desc:0 "Стены вокруг стен. Ромея научила весь мир, что крепость переживёт любой набег."
 GRE_pax_mil3:0 "Тотальная война"
 GRE_pax_mil3_desc:0 "Вся нация становится армией. Нельзя одновременно воевать мечом и держать соседей в вассалах."
 GRE_pax_eco1:0 "Торговые пути"
 GRE_pax_eco1_desc:0 "Караваны и корабли снова ходят по старым дорогам. Торговля кормит казну."
 GRE_pax_eco2:0 "Дипкорпус"
 GRE_pax_eco2_desc:0 "Со времён Договора у Монолита в 251 году пакт о ненападении стоит дешевле войны."
 GRE_pax_eco3:0 "Гегемония"
 GRE_pax_eco3_desc:0 "Держава правит не мечом, а данью. Соседи платят, а казна растёт."
 GRE_pax_her:0 "Наследие: Морская Лига"
 GRE_pax_her_desc:0 "Флот Эллады ходит по морю, как дельфин. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 GRE_pax_fai:0 "Государственная вера: Посейдон"
 GRE_pax_fai_desc:0 "Боги Олимпа. Морской бог хранит корабли Эллады."
 GRE_pax_thalassia:0 "Наследие Талассии"
 GRE_pax_thalassia_desc:0 "Сто островов Западного моря ушли под воду, но их чертежи кораблей остались у эллинов."
 GRE_pax_academy:0 "Академия Эллады"
 GRE_pax_academy_desc:0 "Платон и Аристотель составили перечень всего. Академия продолжает их работу."
 GRE_pax_isles:0 "Острова Лиги"
 GRE_pax_isles_desc:0 "Каждый остров Лиги строит свою верфь."
 GRE_pax_hoplites:0 "Гоплиты Олимпа"
 GRE_pax_hoplites_desc:0 "Строй гоплитов теперь держит винтовки."
 GRE_pax_join_pax:0 "Место в Союзе PAX"
 GRE_pax_join_pax_desc:0 "Эллада всегда стояла рядом с Ромеей. Пора сказать это вслух."
 GRE_pax_cw_watch:0 "Дежурные у башни"
 GRE_pax_cw_watch_desc:0 "Эллада. Сто лет назад мы дали клятву PAX. Теперь у башни каждый день стоит наш караул."
