 concentrated_industry6:0 "Concentrated Industry VI"
 concentrated_industry6_desc:0 "Significant breakthroughs in automation and production efficiency have occurred. Advanced technologies and improved processes make it possible to cut costs substantially and raise output."
 dispersed_industry6:0 "Dispersed Industry VI"
 dispersed_industry6_desc:0 "Integrating advanced technologies and secure communications improves the protection of industry, making it almost impossible to detect and destroy by air attack."
 construction6:0 "Construction VI"
 construction6_desc:0 "The construction process is optimized with the latest technologies and advances in project planning."
 excavation6:0 "Excavation VI"
 excavation6_desc:0 "Resource extraction becomes more efficient thanks to automation and robotics: more ore and less waste."
 flexible_line2:0 "Improved Flexible Line"
 flexible_line2_desc:0 "Automation and robotics increase production flexibility and the speed of switching to new models."
 streamlined_line2:0 "Improved Streamlined Line"
 streamlined_line2_desc:0 "Automation and robotics increase standardization and production efficiency."
 improved_modern_oil_processing:0 "Improved Modern Oil Processing"
 improved_modern_oil_processing_desc:0 "Thermal cracking and solvent deasphalting increase fuel yield."
 improved_modern_rubber_processing:0 "Improved Modern Rubber Processing"
 improved_modern_rubber_processing_desc:0 "Optimized polymerization lowers costs and increases rubber output."
 modern_equipment_conversion:0 "Modern Equipment Conversion"
 modern_equipment_conversion_desc:0 "Modern refit processes and special teams quickly upgrade old weapons and equipment to new standards."
 modern_fire_control_system:0 "Modern Fire Control System"
 modern_fire_control_system_desc:0 "By entering course, speed and range to the target, a modern mechanical computer can predict more accurately where the target will be when the next salvo is ready."
 modern_encryption:0 "Encryption: Advanced Encryption Standard"
 modern_encryption_desc:0 "AES works with 128-bit blocks and 128, 192 or 256-bit keys and protects army communications from foreign ears."
 modern_decryption:0 "Decryption: Block Cipher Analysis"
 modern_decryption_desc:0 "Analysis of patterns in blocks of symbols and statistics make it possible to break an enemy cipher and read the original message."
 PAX_small_world:0 "Small World"
 PAX_small_world_desc:0 "The 'No Asia' scenario: the far lands fall silent, and the lore powers build faster. Taken from Family (NO_asia)."
 PAX_small_world_ENG:0 "Small World: Islands"
 PAX_small_world_ENG_desc:0 "The Island Union builds faster and holds out longer. Taken from Family (NO_asia_ENG)."
 PAX_small_world_GER:0 "Small World: Cheap Wings"
 PAX_small_world_GER_desc:0 "The Reich's light aircraft are 15% cheaper. Taken from Family (NO_asia_GER)."
 PAX_far_lands_sealed:0 "Sealed Far Lands"
 PAX_far_lands_sealed_desc:0 "In the 'No Asia' scenario this country is switched off, like e_neutral in Family."
 PAX_peaceful_sky:0 "Peaceful Sky"
 PAX_peaceful_sky_desc:0 "While the guns are silent, the army trains without losses. The spirit disappears with the first war. Taken from Family."
 pax.40.t:0 "Do You Want Total War?"
 pax.40.d:0 "You have started a Total War... How will it all end? Who will win? YOU will find out.\n\nSincerely, the developers of Family mod."
 pax.40.a:0 "WE WILL WIN, I ASSURE YOU!!"
