 MON_efficient_economic_plans:0 "Efficient Economic Plans"
 
 MON_towards_long_term_reliance:0 "Towards Long-Term Self Reliance"
 MON_long_term_reliance:0 "Long-Term Self Reliance"
 MON_rural_arsenals:0 "Rural Arsenals"
 MON_self_serving_resources:0 "Self-Serving Resources"
 MON_stable_industrial_expansion_idea:0 "Stable Industrial Expansion"
 MON_qoutas_first_policy:0 "Qoutas First Policy"
 MON_qoutas_first_policy_desc:0 "No matter the cost, the army will be equipped!"
 
 MON_four_year_plan:0 "Four-Year Plan"
 
 MON_studying_china_war:0 "Studying China War"
 
 MON_political_purges_idea:0 "Political Purge"
 MON_undermine_the_power_struggle_idea:0 "Undermine The Power Struggle"
