 won_cat_programmes:0 "Общественные программы"
 won_cat_programmes_desc:0 "Постоянные программы ежемесячно обходятся в долю ВВП, но делают целые семейства кризисов §Yв четыре раза реже§! и дают дешёвый выход, когда кризис всё же случается.\n\nАктивных программ: §Y[?won_prog_count|0]§!   Ежемесячная стоимость: §Y[?won_exp_prog|2] млрд§!\n\nДосрочно завершённая программа оплачивается за этот месяц и не может быть перезапущена в течение 90 дней."
 won_tt_prog_cooldown:0 "Эта программа была завершена менее 90 дней назад."
 won_tt_prog_end:0 "Программа немедленно останавливается. Этот месяц всё равно оплачивается, и перезапуск невозможен 90 дней."
 won_prog_farm_start:0 "Финансировать: субсидии фермерам и зерновые резервы"
 won_prog_farm_start_desc:0 "Гарантированные цены для фермеров и государственные зернохранилища на голодные годы.\n\nСтоит §Y[?won_c_prog_farm|2] млрд§! в месяц (0,15% ВВП). Пассивно: §G+1% стабильности§!.\n§GЗащищает от:§! засух, болезней посевов, эпизоотий, протестов фермеров и голода."
 won_prog_farm_end:0 "Прекратить: субсидии фермерам и зерновые резервы"
 won_prog_farm_end_desc:0 "Прекратить платить §Y[?won_c_prog_farm|2] млрд§! в месяц. Защита и пассивный бонус исчезают немедленно."
 won_tt_prog_farm:0 "Запускает §Yсубсидии фермерам и зерновые резервы§!: §R-[?won_c_prog_farm|2] млрд§! ежемесячно, §G+1% стабильности§! и защита от засух, болезней посевов, эпизоотий, протестов фермеров и голода."
 won_prog_labour_start:0 "Финансировать: совет по трудовым отношениям"
 won_prog_labour_start_desc:0 "Постоянный совет, где профсоюзы и работодатели разрешают споры до того, как они перерастут в забастовки.\n\nСтоит §Y[?won_c_prog_labour|2] млрд§! в месяц (0,1% ВВП). Пассивно: §G+1% стабильности§!.\n§GЗащищает от:§! всеобщих забастовок, забастовок докеров и шахтёров и трудовых споров."
 won_prog_labour_end:0 "Прекратить: совет по трудовым отношениям"
 won_prog_labour_end_desc:0 "Прекратить платить §Y[?won_c_prog_labour|2] млрд§! в месяц. Защита и пассивный бонус исчезают немедленно."
 won_tt_prog_labour:0 "Запускает §Yсовет по трудовым отношениям§!: §R-[?won_c_prog_labour|2] млрд§! ежемесячно, §G+1% стабильности§! и защита от всеобщих забастовок, забастовок докеров и шахтёров и трудовых споров."
 won_prog_bank_start:0 "Финансировать: банковский надзор"
 won_prog_bank_start_desc:0 "Инспекторы, резервные требования и фонд страхования вкладов.\n\nСтоит §Y[?won_c_prog_bank|2] млрд§! в месяц (0,1% ВВП). Пассивно: §G+3 к доверию рынка§!.\n§GЗащищает от:§! обвалов рынка, набегов на банки, сбоев страхования, мошенничества, пузырей и валютных атак."
 won_prog_bank_end:0 "Прекратить: банковский надзор"
 won_prog_bank_end_desc:0 "Прекратить платить §Y[?won_c_prog_bank|2] млрд§! в месяц. Защита и пассивный бонус исчезают немедленно."
 won_tt_prog_bank:0 "Запускает §Yбанковский надзор§!: §R-[?won_c_prog_bank|2] млрд§! ежемесячно, §G+3 к доверию рынка§! и защита от обвалов рынка, набегов на банки, сбоев страхования, мошенничества, пузырей и валютных атак."
 won_prog_safety_start:0 "Финансировать: инспекция промышленной безопасности"
 won_prog_safety_start_desc:0 "Фабричные инспекторы, горноспасательные команды и бригады обслуживания энергосети.\n\nСтоит §Y[?won_c_prog_safety|2] млрд§! в месяц (0,1% ВВП). Пассивно: §G+1% к пределу эффективности производства§!.\n§GЗащищает от:§! промышленных катастроф, обрушений шахт, пожаров на заводах, отключений электричества и железнодорожных аварий."
 won_prog_safety_end:0 "Прекратить: инспекция промышленной безопасности"
