 won_cost_big_blocked:0 "§R[?won_c_big|2] bn§!"
 won_cost_factory_blocked:0 "§R[?won_c_factory|2] bn§!"
 won_open_dashboard:0 "Open the Economic Dashboard"
 won_open_dashboard_desc:0 "Charts, policies, trade and the full budget. Also opens from the treasury figure in the top bar."
 won_reform_system:0 "Reform the Economic System"
 won_reform_system_desc:0 "Choose a new economic system allowed by our ideology. Causes a 120-day transition."
 won_stimulus_package:0 "Stimulus Package"
 won_stimulus_package_desc:0 "Pour money into the economy: +10% construction for 180 days, a big confidence boost, some inflation."
 won_austerity_budget:0 "Austerity Budget"
 won_austerity_budget_desc:0 "Cut spending to raise §Y[?won_c_mid|2] bn§!. Confidence and stability suffer for 180 days."
 won_print_money:0 "Print Money"
 won_print_money_desc:0 "Raise §Y[?won_c_big|2] bn§! at once. Inflation target +5 for a whole year."
 won_issue_war_bonds:0 "Issue War Bonds"
 won_issue_war_bonds_desc:0 "Raise §Y[?won_c_mid|2] bn§! from patriotic savers and rally the nation."
 won_sell_gold:0 "Sell Gold Reserves"
 won_sell_gold_desc:0 "Raise §Y[?won_c_big|2] bn§! by selling bullion. Markets read it as a sign of trouble."
 won_devalue_currency:0 "Devalue the Currency"
 won_devalue_currency_desc:0 "Cheaper exports, dearer imports: +3% factory output, +2% consumer goods for a year, inflation +2."
 won_restructure_debt:0 "Restructure the Debt"
 won_restructure_debt_desc:0 "Force creditors to accept a 35% haircut. Our debt shrinks, but we suffer a §RSovereign Default§! for a year."
 won_deregulate_markets:0 "Deregulate the Markets"
 won_deregulate_markets_desc:0 "Scrap regulations: +8% construction for a year and a confidence surge."
 won_public_works_dec:0 "Public Works Programme"
 won_public_works_dec_desc:0 "Build three infrastructure levels at once and +25% infrastructure speed for a year."
 won_social_insurance_act:0 "Social Insurance Act"
 won_social_insurance_act_desc:0 "Pensions and unemployment insurance: +6% stability for a year."
 won_five_year_plan:0 "Launch a Five-Year Plan"
 won_five_year_plan_desc:0 "For two years: +15% construction, +5% consumer goods. Grow total factories by 15% (at least 5). Success brings +10% factory output for two years; failure brings purges."
 won_lease_concessions_dec:0 "Grant Lease Concessions"
 won_lease_concessions_dec_desc:0 "Lease plants to foreign firms for §Y[?won_c_mid|2] bn§! and their know-how. Party purists grumble."
 won_requisition_campaign:0 "Requisition Campaign"
 won_requisition_campaign_desc:0 "Seize goods worth §Y[?won_c_mid|2] bn§! and push factories harder, at a heavy cost to stability."
 won_corporate_chambers:0 "Convene the Corporate Chambers"
 won_corporate_chambers_desc:0 "The chambers will set economic policy for the coming year. Whose side will the state take?"
 won_ersatz_drive:0 "Ersatz Production Drive"
 won_ersatz_drive_desc:0 "Synthetic fuel and substitute materials: +20% resources for a year."
 won_mefo_bills:0 "Issue Mefo Bills"
 won_mefo_bills_desc:0 "Raise §Y[?won_c_big|2] bn§! twice over through a shell company. In a year the bills fall due with 20% interest. Defaulting on them brings a §RSovereign Default§! and bars new bills for three years."
 won_nationalize_industry:0 "Nationalise Key Industries"
 won_nationalize_industry_desc:0 "Take the commanding heights into state hands: permanent income of 0.2% of GDP a month and more political power. Every foreign investor here loses their stake and is furious."
 won_agri_export_drive:0 "Agricultural Export Drive"
 won_agri_export_drive_desc:0 "Sell the harvest abroad for §Y[?won_c_mid|2] bn§!."
 won_rural_electrification:0 "Rural Electrification"
 won_rural_electrification_desc:0 "Bring power to the countryside: +6% construction for a year."
 won_export_subsidies:0 "Export Subsidies"
 won_export_subsidies_desc:0 "For a year, every trade agreement earns 50% more."
 won_merchant_marine_dec:0 "Expand the Merchant Marine"
 won_merchant_marine_dec_desc:0 "+10% dockyard output for a year."
 won_fund_factory:0 "Fund a State Factory"
 won_fund_factory_desc:0 "Build a civilian factory at once in one of our core states. Each purchase makes the next one dearer (up to 4 bn)."
 won_fund_railways:0 "Fund Railways and Roads"
 won_fund_railways_desc:0 "Two infrastructure levels, built at once."
 won_hire_consortium:0 "Commission a Construction Consortium"
 won_hire_consortium_desc:0 "+15% construction speed for 180 days."
 won_hire_consultants:0 "Engage Industrial Consultants"
 won_hire_consultants_desc:0 "+8% production efficiency cap and +10% efficiency growth for 180 days."
 won_hire_institute:0 "Fund Contract Research Institutes"
 won_hire_institute_desc:0 "+5% research speed for 180 days."
 won_hire_prospectors:0 "Hire a Prospecting Company"
 won_hire_prospectors_desc:0 "Survey our core lands for 90 days. They might strike oil, steel or rarer ores. Every strike makes the next one less likely (55%, then 43%, 31%... never below 10%)."
 won_world_contracts:0 "Sell Engineering Services Abroad"
 won_world_contracts_desc:0 "Rent out two civilian factories to the world market for 180 days. They earn 0.4% of GDP every month (0.03 to 0.12 bn)."
 # ---------------------------------------------------------------- Tooltips
 won_tt_system_cooldown:0 "The economic system was changed less than 24 months ago (§Y[?won_system_cd|0]§! months left)."
 won_tt_core_slot:0 "A core state we control has a free building slot."
 won_tt_conf_up:0 "Market confidence: §G+7§!"
 won_tt_conf_up_big:0 "Market confidence: §G+12 to +14§!"
 won_tt_conf_down:0 "Market confidence: §R-5 to -8§!"
 won_tt_conf_down_big:0 "Market confidence: §R-15 or worse§!"
 won_tt_infl_up:0 "Inflation: §Rrises§!"
 won_tt_infl_down:0 "Inflation: §Gfalls§!"
 won_tt_infl_down_big:0 "Inflation: §G-3 points§!"
 won_tt_pay_small:0 "Treasury: §R-[?won_c_small|2] bn§!"
 won_tt_pay_mid:0 "Treasury: §R-[?won_c_mid|2] bn§!"
 won_tt_pay_big:0 "Treasury: §R-[?won_c_big|2] bn§!"
 won_tt_receive_small:0 "Treasury: §G+[?won_c_small|2] bn§!"
 won_tt_receive_mid:0 "Treasury: §G+[?won_c_mid|2] bn§!"
 won_tt_receive_big:0 "Treasury: §G+[?won_c_big|2] bn§!"
 won_tt_print_inflation:0 "Inflation target §R+5§! for 12 months."
 won_tt_devalue:0 "Inflation §R+2§!, market confidence §R-5§!."
 won_tt_restructure:0 "Our debt is cut by §G35%§!. Market confidence §R-25§!."
 won_tt_fyp_start:0 "Factory target: total factories must grow by §Y15%§! (at least 5) within two years."
 won_tt_mefo:0 "Treasury: §G+[?won_c_big|2] bn§! twice over. Repayment of §Y120%§! falls due in a year."
 won_tt_mefo_pay:0 "Treasury: §R-[?won_mefo_due|2] bn§!"
 won_tt_mefo_roll:0 "Pay half now; the rest is quietly printed (inflation target §R+5§! for 8 months)."
 won_tt_nationalize:0 "All foreign stakes in our country are seized. Their owners will not forget."
 won_tt_export_drive:0 "Trade income and trade GDP: §G+50%§! for a year."
 won_tt_prospect:0 "In 90 days we learn whether they struck anything."
 won_tt_world_contract:0 "Treasury: §G+0.4% of GDP§! (0.03 to 0.12 bn) every month for 6 months."
 won_tt_buy_factory:0 "A §Ycivilian factory§! is built at once."
 won_tt_rate_high:0 "Interest rates set to §YHigh§!."
 won_tt_rate_low:0 "Interest rates set to §YLow§!."
 won_tt_tax_high:0 "Tax rate set to §YHigh§!."
 won_tt_closed:0 "Foreign capital: §YClosed§!."
 won_tt_partner_stays:0 "They grumble, but the agreement stands."
 won_tt_fdi_accept:0 "A §Ycivilian factory§! is built here. They hold a 1.5 bn stake and collect 1.5% of it every month."
 won_tt_fdi_joint:0 "We pay 0.75 bn; a §Ycivilian factory§! is built and they hold only a 0.75 bn stake."
 won_tt_root_trade_room:0 "We have room for another trade agreement."
 won_tt_this_trade_room:0 "They have room for another trade agreement."
 won_tt_no_autarky:0 "Neither side runs an Autarky."
 won_tt_recently_refused:0 "They have not refused us in the last 120 days."
 won_tt_needs_trade:0 "We already have a trade agreement with them."
 won_tt_pact_room:0 "Both sides have fewer than 4 construction pacts."
 won_tt_invest_funds:0 "Our treasury holds more than 1.5 bn."
 won_tt_invest_open:0 "They are open to foreign capital."
 won_tt_invest_slot:0 "They have a state with a free building slot."
 won_tt_hire_room:0 "We have hired fewer than 2 foreign firms."
 won_tt_hire_funds:0 "Our treasury covers three months of fees ([?won_c_fee|2] bn a month)."
 won_tt_provider_busy:0 "Their firms are working on fewer than 3 foreign contracts."
 won_tt_foreign_firms:0 "Our economic system allows foreign firms."
 won_tt_our_capacity:0 "We have fewer than 3 contracts abroad and more than 3 spare civilian factories."
 won_tt_client_room:0 "They have hired fewer than 2 foreign firms."
 won_tt_client_funds:0 "They can afford three months of fees."
 won_tt_client_firms:0 "Their economic system allows foreign firms."
 # ---------------------------------------------------------------- Diplomacy
 WON_TRADE_AGREEMENT_TITLE:0 "Propose Trade Agreement"
 WON_TRADE_AGREEMENT_ACTION_DESC:0 "Open our markets to each other: cheaper consumer goods (up to §G-1.5%§!), lower inflation, trade income and GDP for both. A partner counts fully only if its economy is at least a quarter the size of ours."
 won_trade_agreement:0 "Propose Trade Agreement"
 won_trade_agreement_send:0 "Send a trade delegation with a draft agreement?"
 won_trade_agreement_receive:0 "A foreign delegation proposes a trade agreement: open markets, cheaper consumer goods (§G-1.5%§!) and trade income for both of us."
 won_trade_agreement_accept:0 "Trade Agreement Signed"
 won_trade_agreement_accept_desc:0 "The agreement is signed. Goods will be flowing by the end of the month."
 won_trade_agreement_reject:0 "Trade Agreement Refused"
 won_trade_agreement_reject_desc:0 "They have turned our delegation away. We can try again in 120 days."
 WON_CONSTRUCTION_PACT_TITLE:0 "Propose Construction Pact"
 WON_CONSTRUCTION_PACT_ACTION_DESC:0 "Share engineers, machinery and building firms: up to §G+3%§! construction speed for both (up to 4 pacts), scaled by the partner's size. Requires a trade agreement."
 won_construction_pact:0 "Propose Construction Pact"
 won_construction_pact_send:0 "Propose an engineering and construction pact?"
 won_construction_pact_receive:0 "Our trade partner proposes a construction pact: shared engineers and machinery, §G+3%§! construction speed for both of us."
 won_construction_pact_accept:0 "Construction Pact Signed"
 won_construction_pact_accept_desc:0 "Our engineers will soon be working side by side."
 won_construction_pact_reject:0 "Construction Pact Refused"
 won_construction_pact_reject_desc:0 "They prefer to keep their engineers at home."
 WON_INVEST_TITLE:0 "Invest Capital (1.5 bn)"
 WON_INVEST_ACTION_DESC:0 "Pay §Y1.5 bn§! to build a §Ycivilian factory§! in their country. We collect §G1.5%§! of the stake every month for as long as we stay at peace with them."
 won_invest:0 "Invest Capital"
 won_invest_send:0 "Offer 1.5 bn of investment for a new factory in their country?"
 won_invest_receive:0 "Foreign investors offer to build a civilian factory in our country. In return they will take a share of its profits every month."
 won_invest_accept:0 "Investment Accepted"
 won_invest_accept_desc:0 "Ground has been broken on the new factory. Dividends will start next month."
 won_invest_reject:0 "Investment Refused"
 won_invest_reject_desc:0 "They want no foreign money in their industry."
 WON_HIRE_COMPANIES_TITLE:0 "Hire their Companies"
 WON_HIRE_COMPANIES_ACTION_DESC:0 "Their construction firms work for us for 12 months: about three civilian factories of extra building work (at most §G+10%§! construction speed), for a monthly fee of 0.4% of our GDP (0.02 to 0.06 bn)."
 won_hire_companies:0 "Hire their Companies"
 won_hire_companies_send:0 "Ask their firms to take on a 12-month construction contract in our country?"
 won_hire_companies_receive:0 "A foreign government wants to hire our construction firms for 12 months. They will pay us every month, but the work ties up one of our civilian factories."
 won_hire_companies_accept:0 "Contract Signed"
 won_hire_companies_accept_desc:0 "Their engineers and machinery are on their way."
 won_hire_companies_reject:0 "Contract Refused"
 won_hire_companies_reject_desc:0 "Their firms are not available."
 WON_OFFER_SERVICES_TITLE:0 "Offer our Services"
 WON_OFFER_SERVICES_ACTION_DESC:0 "Our construction firms work for them for 12 months. They get extra construction speed and pay us 0.4% of their GDP a month (0.02 to 0.06 bn). Uses one of our civilian factories."
 won_offer_services:0 "Offer our Services"
 won_offer_services_send:0 "Offer our firms for a 12-month construction contract?"
 won_offer_services_receive:0 "Foreign construction firms offer to work in our country for 12 months: extra construction speed for a monthly fee of 0.4% of our GDP (0.02 to 0.06 bn)."
 won_offer_services_accept:0 "Services Contract Signed"
 won_offer_services_accept_desc:0 "Our firms have a new client abroad. Fees will arrive every month."
 won_offer_services_reject:0 "Services Refused"
 won_offer_services_reject_desc:0 "They will build with their own firms."
 WON_CANCEL_AGREEMENTS_TITLE:0 "Cancel Economic Agreements"
 WON_CANCEL_AGREEMENTS_ACTION_DESC:0 "End our trade agreement and construction pact with them. They will resent it."
 won_cancel_agreements:0 "Cancel Economic Agreements"
 won_cancel_agreements_send:0 "Tear up our trade agreement and construction pact with them?"
