 IRE_contact_resistance_cells_in_south_ireland:0 "Contact Resistance Cells In [135.GetName]"
 IRE_contact_resistance_cells_in_west_ireland:0 "Contact Resistance Cells In [134.GetName]"
 IRE_contact_resistance_cells_in_northern_ireland:0 "Contact Resistance Cells In Northern Ireland"
 will_rise_up_once_uprising_starts_or_state_is_retaken_tt:0 "When the decision §YRetake Our Home!§! is taken there will spawn two pure infantry divisions within the state.\nIn addition once a state is §Yretaken§! an additional §YVolunteer Division§! will spawn."
 IRE_strike_back_from_abroad:0 "Retake Our Home!"
 IRE_strike_back_from_abroad_desc:0 "It's time for our people to finally rise up and retake our home!\n\n§RWe won't get a second chance!§!"
 IRE_further_access_to_guns:0 "Secure Weapons for The State"
 will_rise_up_against_the_occupiers_tt:0 "Divisions will rise up in states where we've Contacted the Resistance in. This course of action can only happen once as if it fails these resistance movements have to move underground."
 
 IRE_anti_british_stance:0 "Anti-British Stance"
 IRE_anti_british_stance_desc:0 "It's no surprise that your everyday man distrust the British, for too long have we been subjugated to them and their whims. Mostly to the cost of your everyday Irishman. This bad blood makes most look at the British and their needs with a cynical eye and they are heavily opposed to aiding them."
 IRE_heavy_anti_british_stance:0 "Anti-British Stance"
 IRE_heavy_anti_british_stance_desc:0 "It's no surprise that your everyday man distrust the British, for too long have we been subjugated to them and their whims. Mostly to the cost of your everyday Irishman. This bad blood makes most look at the British and their needs with a cynical eye and they are heavily opposed to aiding them. It seems that due to recent policies it has become worse."
 IRE_the_dominion_in_name_only:0 "Dominion In Name Only"
 IRE_the_dominion_in_name_only_desc:0 "The Irish Free State is a dominion of the British empire in name only. In fact compared to other dominions of the British Empire we're much more autonomous.\nHowever we're still very much considered a dominion of the Empire."
 IRE_the_external_relations_act:0 "The External Relations Act"
 IRE_the_external_relations_act_desc:0 "Executive Authority (External Relations) Act is an act passed in the aftermath of the crisis caused by Edward VIII abdication crisis. This has made it so that the British King has no say in our internal matters any longer."
 IRE_the_irish_free_state:0 "The Irish Free State"
 IRE_the_irish_free_state_desc:0 "Due to changes in the constitution Ireland is now truly independent from British rule and is able to pursue their own policies without as much worry.\nThis has had a profound effect on the country."
 
 IRE_anglo_trade_war:0 "The Anglo-Irish Trade War"
 IRE_anglo_trade_war_desc:0 "The Anglo-Irish trade war is an economic \"war\" between us and the United Kigdom, mostly caused due to disbutes regarding our constitutional status and our economic policy following the Great Depression. This economic conflict has caused us no end of troubles as the British has imposed import duty on our agricultural products.\n\nThis has in particular affected our farmers and will continue to do so until we can end the conflict."
 
 IRE_irish_republicanism:0 "Irish Republicanism"
 
 IRE_emergency_powers_act:0 "Emergency Powers Act"
 IRE_emergency_powers_act_desc:0 "The Emergency Powers Act has given the government much more control of the press and economy which is used to keep Ireland safe."
 
 IRE_british_irish_defence_plans:0 "British-Irish Defence Plans"
 IRE_british_irish_defence_plans_desc:0 "Many of our defence plans rely on the British fighting the same enemy as us, which has led to some advantages in our defence even if it puts us in a bit of an awkward spot in terms of how independent we truly are."
 
 IRE_ireland_resists_forever:0 "Ireland Resists Forever!"
 
 IRE_reforming_armed_forces:0 "Reforming Armed Forces"
 IRE_the_professional_army:0 "The Professional Army of Ireland"
 IRE_the_peoples_army:0 "The People's Army of Ireland"
 
 IRE_disloyal_ira:0 "IRA (§RDisloyal§!)"
 IRE_neutral_ira:0 "IRA (Neutral)"
 IRE_friendly_ira:0 "IRA (§GFriendly§!)"
 IRE_weakened_ira:0 "IRA (§HWeakened§!)"
 IRE_integrated_ira:0 "IRA (§GIntegrated§!)"
 
 will_lose_stability_upon_joining_british_alliance:0 "Will §Rlose§! §H5%§! §YStability§! and §YWar Support§! upon joining the United Kingdom's faction."
 will_lose_more_stability_upon_joining_british_alliance:0 "Will §Rlose§! §H10%§! §YStability§! and §YWar Support§! upon joining the United Kingdom's faction."
 
 IRE_irish_shipping:0 "Irish Shipping"
 IRE_irish_steel:0 "Irish Steel"
 
 IRE_democratic_party_2:0 "Fine Gael"
 IRE_democratic_party_2_long:0 "Fine Gael"
 
 IRE_continuation_of_policies:0 "Continuation of Policies"
 IRE_continuation_of_policies_desc:0 "We need to continue our current political policies and expand upon them as the future of Ireland is at a crossroad."
 IRE_end_of_trade_war:0 "End of The Trade War"
 IRE_end_of_trade_war_desc:0 "We're seeing that the economic conflict with the British is causing stagnation and is a massive expense, but its an expense that is slowly paying off as we're able to force the British hands to acccept more of our demands. Soon we'll be able to end the conflict in our favor."
 IRE_our_tax_duties:0 "Our Tax Duties"
 IRE_our_tax_duties_desc:0 "We've a duty to our people to leverage taxation against foreign investment and exports to make it more profitable for our populace. This way our government and the local economy benefit greatly."
 IRE_the_anglo_irish_trade_agreement:0 "The Anglo-Irish Trade Agreement"
 IRE_the_anglo_irish_trade_agreement_desc:0 "The Trade conflict between us and the United Kingdom has gone on for too long now and we've finally reached a point where both sides are happy with the concessions made. Let's finalize the treaty and end this conflict."
 IRE_regain_the_treaty_ports:0 "Regain the Treaty Ports"
 IRE_regain_the_treaty_ports_desc:0 "The Treaty Ports are three ports that have long been retained by the United Kingdom in accordance with the Anglo-Irish Treaty of 21. This was to discourage another U-boat Campaign around our coast.\nWe need to regain this ports under our control."
 IRE_an_isle_surrounded_by_sea:0 "An Isle Surrounded By the Sea"
 IRE_an_isle_surrounded_by_sea_desc:0 "Our people has not prepared itself for the reality of a conflict breaking out in Europe, the reality that we have to rely on the sea for imports. With war breaking out in the United Kingdom we need to formally make adjustment to our current economic policy to make sure we're not entirerly isolated."
 
 IRE_external_relations_act:0 "External Relations Act"
 IRE_external_relations_act_desc:0 "With the problem the British has been suffering with their succession, now is the perfect time to make amendments to our constitution to make it less monarchist in nature."
 IRE_amendendment_of_external_relations_act:0 "Amendment of External Relations Act"
 IRE_amendendment_of_external_relations_act_desc:0 "In response to many issues we've faced internally since strengthening our ties with the British, there has been further amendments done to our constitution and a treaty has been signed between the Irish Free State and the United Kingdom that will formally end the dominion status...eventually."
 IRE_fine_gaels_takeover:0 "Fine Gael's Takeover"
 IRE_fine_gaels_takeover_desc:0 "Fine Gael is a pro-treaty part within Ireland, being much more friendly towards the British than the former Fianna Fáil who was in charge of the nation."
 must_have_let_fine_gael_take_power_in_election:0 "Allowed §YFine Gael§! to win the election of 1937."
 IRE_confirm_our_dominion_status:0 "Confirm Dominion Status"
 IRE_confirm_our_dominion_status_desc:0 "We're a loyal subject of the British crown for now, with their aid Ireland will grow stronger and maybe one day the wounds between our nations will be repaired."
 IRE_extend_our_cooperation:0 "Extend Our Cooperation"
 IRE_extend_our_cooperation_desc:0 "There are many scientific minds in the commonwealth and we need to make sure they are willing to share their insights with us."
 IRE_attract_allied_investors:0 "Attract Allied Investors"
 IRE_attract_allied_investors_desc:0 "Our allies are much richer than we are and it's not hard to see that, we need to encourage them to invest in our industry."
 IRE_unified_the_defence_of_ireland:0 "Unified Defence of Ireland"
 IRE_unified_the_defence_of_ireland_desc:0 "By cooperating with the British it'll be easier to defend our island in the future."
 IRE_request_control_of_north_ireland:0 "Request Control of Northern Ireland"
 IRE_request_control_of_north_ireland_desc:0 "Northern Ireland is as Irish the rest of Ireland, only difference is them being misguided in their faith. We need to request England hand it over to us."
 
 IRE_a_new_constitution:0 "A New Constitution"
 IRE_a_new_constitution_desc:0 "We'll distance ourselves from the British by rewriting our Constitution and excluding the British crown from being mentioned in it. That way we'll show the world we're independent."
 IRE_encourage_irish_republicanism:0 "Encourage Irish Republicanism"
 IRE_encourage_irish_republicanism_desc:0 "We're a republic first and foremost and we need to encourage this idea in every place we can."
 IRE_gather_foreign_capital:0 "Gather Foreign Capital"
 IRE_gather_foreign_capital_desc:0 "Our small Island's industry isn't powerful and as such we need foreign capital to secure it's growth. As such we'll encourage friendly regimés to invest into us."
 IRE_increases_num_of_factories_gained_based_on_opinion:0 "Gain additional factories for each of the following countries having over 50 opinion of @IRE Ireland:\nUnited Kingdom\nFrance\nUnited States\nGermany\nSpain (if the Spanish Civil War is over)"
 IRE_the_war_plans:0 "Our War Plans"
 IRE_the_war_plans_desc:0 "War might reach us any day now and we need to make sure we're ready for it. Plans need to be made in regards to our defence."
 IRE_work_with_the_ira:0 "Work With the IRA"
 IRE_work_with_the_ira_desc:0 "The IRA may have caused us some headaches, it's clear they have the interest of the Irish people in mind. We need to cooperate closer with them."
 IRE_british_army_plans:0 "British Army Plans"
 IRE_british_army_plans_desc:0 "We need to work with the British military in the defence of Ireland, with shared knowledge it'll be easier to defend ourselves."
 
 IRE_the_emergency_powers_act:0 "Emergency Powers Act"
 IRE_the_emergency_powers_act_desc:0 "With war going on around us, our democracy is in danger and we need to root out any problem that may weaken it by giving the government powers to censor the press as needed among other powers."
 IRE_weaken_the_ira:0 "Weaken The IRA"
 IRE_weaken_the_ira_desc:0 "The IRA has been too troublesome lately and we need to make sure they won't cause us any more trouble!"
 
 IRE_aided_innovation:0 "Aided Innovation"
 IRE_aided_innovation_desc:0 "By working with the British we'll be able to properly innovate and strength our country, even if we'll do everything in our power to do it on our own terms."
 IRE_plan_w:0 "Plan W"
 IRE_plan_w_desc:0 "Plan W is a joint operation between us and the British government, where they by invitation of the President will be allowed to enter our country to help defend us should we be invaded."
 should_we_be_invaded_uk_will_gain_divisions_in_northern_ireland_to_aid_us_with_tt:0 "Should we be invaded we can pass the decision §YExecute Plan W§! and @ENGthe United Kingdom will spawn §G3§! §YInfantry Divisions§! in §YNorthern Ireland§! to help protect us from the invasion."
 IRE_join_the_allies:0 "Join The Allies"
 IRE_join_the_allies_desc:0 "While it'll likely be unpopular, it's high time we join the United Kingdom in their fight against extremism accross the globe."
 IRE_form_volunteer_corps:0 "Formation of Volunteer Corps"
 IRE_form_volunteer_corps_desc:0 "Some of our politicians have suggested that rather than take a proper side in the ongoing conflict we should form volunteer corps to aid likeminded nations abroad."
 IRE_ireland_forever:0 "Ireland Forever"
 IRE_ireland_forever_desc:0 "Ireland shall keep resisting this occupation no matter what happens. We'll fight until we're free once more!"
 IRE_continue_the_fight_abroad:0 "Continue The Fight Abroad"
 IRE_continue_the_fight_abroad_desc:0 "With the recent loss of our homeland, many Irishmen abroad is looking at it with anger and are wanting to get in to the action. We need to encourage this."
 irish_volunteers_will_spawn_in_a_random_allies_capital:0 "An §YIrish Volunteer Division§! will spawn in a Major Allied §GCore§! State."
 IRE_organise_outside_intervention:0 "Organise Outside Intervention"
 IRE_organise_outside_intervention_desc:0 "We cannot regain Ireland without outside aid and we need to accept this, we shall continue the fight abroad but not by ourselves!"
 IRE_learn_from_the_fighting:0 "Learn From Our Fall"
 IRE_learn_from_the_fighting_desc:0 "While we fought bravely against those who now occupy our homeland it wasn't enough, we need to learn from our mistakes if we want any hope of regaining our homeland."
 
 IRE_address_the_armed_forces:0 "Address the Armed Forces"
 IRE_address_the_armed_forces_desc:0 "Our armed forces are in a bit of a sorry state, it's high time we reform them and make sure they are up to the task of defending Ireland."
 IRE_allows_stronger_effects_from_military_focuses:0 "£trigger_yes  Grants larger bonuses from focuses under the §YAddress the Army§!, §YAddress the Navy§! and §YAddress the Airforce§! branches."
 
 IRE_the_irish_military_complex:0 "The Irish Military Complex"
 IRE_the_irish_military_complex_desc:0 "Our military complex is small to say the least, for now our efforts should lie in making it more efficient rather than growing it."
 IRE_organise_for_conflict:0 "Organize For Conflict"
 IRE_organise_for_conflict_desc:0 "There is conflict brewing around us and we need to make sure that we're prepared for it."
 IRE_seek_deterrence:0 "Seek Deterrence"
 IRE_seek_deterrence_desc:0 "We shall do what we can to deter people from invading our country, that way our way of life will be preserved."
 IRE_secure_a_stable_arms_industry:0 "A Stable Arms Industry"
 IRE_secure_a_stable_arms_industry_desc:0 "We cannot afford to spend our whole budget on expanding our military, instead a small expansion shall be enough."
 IRE_early_mobilisation_of_economy:0 "Early Economic Mobilisation"
 IRE_early_mobilisation_of_economy_desc:0 "We need to do what we can to mobilize our economy for what is by now inevietable. We shall not let this opportunity go to pass."
 IRE_the_greatest_effort:0 "A Great Effort"
 IRE_the_greatest_effort_desc:0 "War is comming, we'd be fools to wait on our people to get around to liking this idea and instead we shall use our existing industry to grow our military."
 IRE_armored_industries:0 "Armored Industries"
 IRE_armored_industries_desc:0 "Some madmen in our country believe we need our own tanks to defend Ireland, those madmen have a point and we need to create an industry dedicated to this."
 IRE_full_deterrence_effort:0 "Full Deterrence"
 IRE_full_deterrence_effort_desc:0 "No effort shall be spared in our Deterrence, we've reached a point where no comprimises can be made any more and the risk of people not respecting our independence is at an all time high."
 
 IRE_address_the_airforce:0 "Address the Airforce"
 IRE_address_the_airforce_desc:0 "Our efforts should go towards the Air force to make sure that the skies above Ireland are safe."
 IRE_home_defence_theory:0 "Home Defence Theory"
 IRE_home_defence_theory_desc:0 "The best way to defend Ireland is keeping the skies safe, and doing so requires effective short-range fighters."
 IRE_close_air_support:0 "CAS Effort"
 IRE_close_air_support_desc:0 "In our effort to defend our island we need planes that can support our land forces properly. As such we'll focus on improving our close-range support."
 IRE_long_range_operations:0 "Long-Range Operations"
 IRE_long_range_operations_desc:0 "Our island is far enough away from the European theatre where focusing on a short-range air force may not be feasable. We need long-range air craft that can disrupt our enemies far away."
 IRE_modern_bombers:0 "Modern Bombers"
 IRE_modern_bombers_desc:0 "With modern long-range bombers we'll be able to devastate industries that would otherwise be out of reach."
 IRE_safety_from_the_sea:0 "Safety From The Sea"
 IRE_safety_from_the_sea_desc:0 "Any enemy of ours will come by sea and as such we need to secure their unable to get any sort of safe foothold there, this is best achieved using naval bombers."
 IRE_air_doctrine_effort:0 "Improve Our Air Doctrine"
 IRE_air_doctrine_effort_desc:0 "Our air doctrine is nothing short of...okay. We need to put our efforts into making sure this changes and that our pilots can compete with those around us."
 
 IRE_address_the_army:0 "Address the Army"
 IRE_address_the_army_desc:0 "Our army isn't in great shape, with it being quite small compared to those around us and we need to make sure that it is ready to safekeep our land."
 IRE_professionalism_first_and_foremost:0 "Professionalism First and Foremost"
 IRE_professionalism_first_and_foremost_desc:0 "We need to ensure our army is professional first and foremost, no matter the cost."
 IRE_modern_defense_doctrines:0 "Modern Defense Doctrine"
 IRE_modern_defense_doctrines_desc:0 "A modern defense doctrine is needed to defend Ireland, as such we'll take a large iniatiive that will allow us to better protect Ireland."
 IRE_mobile_response_theories:0 "Mobile Response Theories"
 IRE_mobile_response_theories_desc:0 "While Ireland isn't as large as some other nations in Europe, it's not a walk in the backyard to invade it. We need to develop effective methods of responding to it's defence so our coasts aren't left undefended should war reach us."
 IRE_the_peoples_army:0 "The People's Army"
 IRE_the_peoples_army_desc:0 "Forming a people's army will ensure we've many people who will seek to join our cause against our enemies."
 IRE_popular_mobilisation:0 "Popular Mobilisation"
 IRE_popular_mobilisation_desc:0 "With a People's Army formed, we need a stronger backbone of our military. Rapid expansion of conscription and encouragement to join the military will allow us to expand our army in a way where our defences are simply too dense to be handled through conventional invasions."
 IRE_support_the_army:0 "Support the Army"
 IRE_support_the_army_desc:0 "It's our duty to support our army and make sure our recruits have access to weaponry that will reliably protect them. Our efforts need to go to making sure that this is achieved."
 IRE_the_lessons_from_the_past:0 "Lessons From The Past"
 IRE_the_lessons_from_the_past_desc:0 "We've much to learn from our past, while the Easter Rebellion was short lived we can investigate what occured during it to better counteract such tactics being deployed against us again in the future."
 IRE_integrate_the_ira:0 "Integrate the IRA"
 IRE_integrate_the_ira_desc:0 "The IRA has expected to serve by our sides and we need to encourage this in any way we can."
 IRE_a_conventional_force:0 "A Conventional Force"
 IRE_a_conventional_force_desc:0 "We need a conventional force to face the true horrors of war, we cannot spare ourselves from doing otherwise."
 IRE_will_gain_national_spirit_depending_on_army_choice:0 "Will Improve the National Spirit gained from §YProfessionalism First and Foremost§! and §YThe People's Army§! depending on which was selected."
 
 IRE_address_the_navy:0 "Address the Navy"
 IRE_address_the_navy_desc:0 "Like it or not, we're on an island. We need to control the seas to defend ourselves properly."
 IRE_reopen_the_dublin_ports:0 "Reopen The Dublin Ports"
 IRE_reopen_the_dublin_ports_desc:0 "We need to officially reopen the Dublin Ports to make sure that we can construct a navy to protect our heartland."
 IRE_defend_our_convoys:0 "Defend Our Convoys"
 IRE_defend_our_convoys_desc:0 "The convoys transporting imports are of vital importance to us and as such we need to defend them at any cost. This require dedicated screening vehicles to achieve."
 IRE_the_great_sea:0 "The Great Sea"
 IRE_the_great_sea_desc:0 "We need to go out to the greater seas and away from our coasts to discourage our enemies from invading, it's risky but may pay off in the long run."
 IRE_improve_our_navy:0 "Naval Improvements"
 IRE_improve_our_navy_desc:0 "We need to be ready for what may face us at sea, no matter if it's on the surface, in the air or underneath it."
 IRE_formation_of_paratrooper_corps:0 "Formation of Paratrooper Corps"
 IRE_formation_of_paratrooper_corps_desc:0 "If we were to conduct careful planning we may be able to use paratroopers to surprise and overcome our enemies."
 IRE_formation_of_marine_corps:0 "Formation of Marine Corps"
 IRE_formation_of_marine_corps_desc:0 "A marine corps may be of aid to us, as any way for us to battle our enemies will be by attacking them overseas. Having dedicated forces for that task will aid us greatly."
 
 enables_guerrilla_tactics_tt:0 "Enables §HMasterful Guerilla Warfare§!\n§HInfantry\n    Urban§!\n      Attack: §G+5%§!\n      Defence: §G+5%§!\n    §HForest§!\n      Attack: §G+5%§!\n      Defence: §G+5%§!\n§HRaider\n    Urban§!\n      Attack: §G+3%§!\n      Defence: §G+5%§!\n    §HForest§!\n      Attack: §G+3%§!\n      Defence: §G+5%§!"
 guerilla_warfare_tech:0 "Masterful Guerilla Warfare"
 
 chd_ireland.0.t:0 "Irish Election of 37"
 chd_ireland.0.d:0 "For the most part the Irish election has been set in stone, with Fianna Fáil being expected to win the election with the only real possible opposition being in Fine Gael, a pro-treaty party that has remained fairly influential despite not being the ruling party."
 chd_ireland.0.a:0 "Fianna Fáil remains in charge"
 chd_ireland.0.b:0 "Fine Gael secures victory"
 
 chd_ireland.1.t:0 "Plan W"
 chd_ireland.1.d:0 "Plan W has been a joint operation prepared between us and the Irish government, a counter-measure should they be invaded by a foreign enemy of ours...though only by direct request of the Irish government. These plans are now put into motion at the request of [IRE.GetLeader] and our government has raised some armies in Northern Ireland to help in their defence."
 chd_ireland.1.a:0 "Ireland will be saved!"
 ENG_plan_w_tt:0 "@ENGThe United Kingdom recieve §G3§! §YInfantry Divisions§! in §YNorthern Ireland§!."
 chd_ireland.2.t:0 "Plan W Executed"
 chd_ireland.2.d:0 "With the joint operation known as Plan W having been set in motion, there has already been word of the British mobilising armies in Northern Ireland to help in the defence of the island. We'll just have to hold out until they arrive."
 chd_ireland.2.a:0 "Let's hope they get here in time"
 
 chd_ireland.3.t:0 "Plan S"
 chd_ireland.3.d:0 "The IRA has long been unruly and now with war breaking out between the British and Germany they have officially declared themselves at war with the British. This hasn't had a huge effect on our politics as of now, but our sources tells us that they are planning to conduct campaigns against Northern Ireland which could have disasterous consequenses."
 chd_ireland.3.db:0 "The IRA has long been unruly, though thankfully since integrating them into our military we've been able to keep a closer eye on them. The war breaking out between the British and Germany has had some people defect but it seems for the most part they haven't been able to organise any resistance against the British beyond objections to where our loyalties may lie."
 chd_ireland.3.a:0 "We need to stop them!"
 chd_ireland.3.b:0 "We won't miss them"
 
 chd_ireland.4.t:0 "Plan S"
 chd_ireland.4.d:0 "A number of places within Northern Ireland were blown up with bombs earlier today, thankfully with few casualties but the damage to the industry isn't to be understated. After local garrisons got on scene it didn't take long for them to find the responsible, members of the IRA had crossed into Northern Ireland under protection of the dark night and placed explosives to sabotage these key industries. All under the guise of being the true government of Ireland and that the current ruling party is illegimate."
 chd_ireland.4.a:0 "Outrageous!"
 chd_ireland.5.t:0 "IRA Damages Our Industry"
 chd_ireland.5.d:0 "It seems that Plan S is far from over, the IRA is still actively trying to sabotage our industries and have managed to encourage local irishmen to aid them."
 chd_ireland.5.a:0 "This better not ruin our war effort"
 chd_ireland.6.t:0 "End of Plan S"
 chd_ireland.6.d:0 "It seems that the Irish government under [IRE.GetLeader] has finally gotten the IRA under control and ended their constant bombings. So for now it'll likely mean we'll be able to properly focus our war effort on more important things."
 chd_ireland.6.a:0 "Finally some good news"
 chd_ireland.7.t:0 "Opposition to Foreign Diplomacy"
 chd_ireland.7.d:0 "Our decision to join the Allies and not stick to our neutrality has caused some problems for us, our people believe that it is the wrong decision and has been vocal with their opposition."
 chd_ireland.7.a:0 "This is temporary backlash"
 
 chd_ireland.8.t:0 "Question of Northern Ireland"
 chd_ireland.8.d:0 "Ever since Ireland gained their independence, Northern Ireland has remained under British rule. Now [IRE.GetLeader] has requested the transfer of the land to Irish rule so that the island can be properly unified. There are however worries on both sides there might be resistance to this."
 chd_ireland.8.a:0 "They can have it"
 chd_ireland.8.b:0 "It's not the right time"
 chd_ireland.9.t:0 "Return of Northern Ireland"
 chd_ireland.9.d:0 "Northern Ireland is now under proper Irish rule, though many of our politicians are worried about the religious tensions there seem to be a sense of unity at the time being."
 chd_ireland.9.a:0 "Good to know"
 chd_ireland.10.t:0 "Northern Resistance"
 chd_ireland.10.d:0 "As many of our politicians expected, after less than a week of being returned resistance has begun to pop up in Northern Ireland. This will likely last until we can quell the rebellions there, however long that may take."
 chd_ireland.10.a:0 "We'll solve this, surely"
 chd_ireland.11.t:0 "Northern Ireland Remains in British Hands"
 chd_ireland.11.d:0 "It seems that despite our best appeals, the British has kept Northern Ireland under their control. It's likely this is due to a decision to keep stability on the Isle of Ireland."
 chd_ireland.11.a:0 "Fine we didn't want your silly land anyway!"
 
 chd_ireland.12.t:0 "The Second Anglo-Irish Treaty"
 chd_ireland.12.d:0 "In an attempt to mend ties that were previously broken from past transgressions, the Irish government has requested that we sign a treaty with them that will allow them to leave their status as a dominion of our empire within a set time frame.\nThis time frame is yet to be set into stone but many of our politicians are still worried about the implications of doing so."
 chd_ireland.12.a:0 "Let's sign the treaty"
 chd_ireland.12.b:0 "Who cares about the Irish?"
 chd_ireland.13.t:0 "Second Anglo-Irish Treaty Signed"
 chd_ireland.13.d:0 "We've officially been able to adjust our constitution and secure a treaty with the British that promises us that we'll be free from being a dominion by the end of the 1940s. This has helped give legitimacy to our government and increased the trust between our populace and it."
 chd_ireland.13.a:0 "Independence comes in a convoluted fashion"
 chd_ireland.14.t:0 "Britain Rebuffs Our Efforts"
 chd_ireland.14.d:0 "Our efforts to secure a treaty and mend the ties with the British hasn't gone quite as planned, our suggestion of signing a treaty with them that would secure our full independence from them by the end of the 1940s was meet with resistance and it quickly went nowhere. We're stuck now in a place that is only slightly better off than we were before."
 chd_ireland.14.a:0 "Damn brits"
 
 chd_ireland.15.t:0 "The End of Plan S"
 chd_ireland.15.d:0 "Our attempts to root out the operations the IRA is doing has been successful and we're now able to focus our efforts elsewhere. However there are still many remaining who were sympathic to their cause and the question remains what to do with them."
 chd_ireland.15.a:0 "We need to do a cleanup"
 chd_ireland.15.b:0 "Leave them be"
 chd_ireland.16.t:0 "IRA Declares War!"
 chd_ireland.16.d:0 "It seems that despite Ireland controlling Northern Ireland, the Irish Republican Army is still far from happy with the influence we hold over Ireland. They have declared the current ruling government illegimate and declared war on us, even going so far as to blow up buildings in Northern Ireland."
 chd_ireland.16.a:0 "Ireland better sort this out"
 
 chd_ireland.17.t:0 "IRA Approaches Us"
 chd_ireland.17.d:0 "Recently the IRA denounced the Irish government and declared themselves the legitimate government over Ireland. They have in addition to this declared \"war\" on the British, this is mostly conducted in Bombing campaigns. However they have approached some of our agents seeking support so that they can better organise their efforts."
 chd_ireland.17.a:0 "Very well"
 chd_ireland.18.t:0 "IRA Activities Intensifies"
 chd_ireland.18.d:0 "It seems that recently the IRA has found supporters abroad, it's unclear what nation may have supplied them with weapon and aided them in reorganising their efforts but many of our sources points to [GER.GetNameDef]."
 chd_ireland.18.a:0 "This is a setback"
 # Finland
 SOV_winter_war_flag:0 "The Winter War has occured."
 FIN_j_w_rangell:0 "Johan Wilhelm Rangell"
 FIN_pehr_evind_svinhufvud:0 "Pehr Evind Svinhufvud"
 FIN_neutrality_party_2:0 "Kok"
 FIN_neutrality_party_2_long:0 "Kansallinen Kokoomus"
 FIN_johan_helo:0 "Johan Helo"
 FIN_hjalmar_siilasvuo:0 "Hjalmar Siilasvuo"
 FIN_paavo_talvela:0 "Paavo Talvela"
 FIN_ruben_lagus:0 "Ruben Lagus"
 FIN_aksel_airo:0 "Aksel Airo"
 FIN_ernst_von_born:0 "Ernst von Born"
 FIN_rudolf_walden:0 "Rudolf Walden"
 # Cosmetic
 GREATER_FINLAND_neutrality:0 "Greater Finland"
 GREATER_FINLAND_neutrality_DEF:0 "the Republic of Greater Finland"
 GREATER_FINLAND_democratic:0 "Greater Freer Finland"
 GREATER_FINLAND_democratic_DEF:0 "the Greater Freer Finland"
 GREATER_FINLAND_communism:0 "Large Finnish Soviet Republic"
 GREATER_FINLAND_communism_DEF:0 "the Large Finnish Soviet Republic"
 # National Spirit
 FIN_german_scepticism:0 "German Scepticism"
 FIN_german_scepticism_desc:0 "Our politicans are sceptical about the ongoing rethorics and diplomacy of the German Reich and wouldn't agree to us getting some support from them.\n\nIt's likely that if a drastic political change occurs this will change."
 FIN_crushed_extremist_movements:0 "Splintered Extremist Movements"
 FIN_mining_operations:0 "Finnish Mining Operations"
 #FIN_crushed_extremist_movements_desc:0 "The communist movement in Finland has largely been limited due to the actions taken after the Civil War and attempts to mend the damages done by it. Many are drawn to the Social Democratic party of Finland before the communists.\n\nMeanwhile the former nationalist Lapua Movement started as an anti-communist movement while causing great troubles for our government, however their popularity rapidly dropped after attempting to kidnap ex-president Kaarlo Ståhlberg and his wife to send to the Soviet Union. As many left the movement afterwards it turned more violent and attempted an armed uprising. This was quickly dispersed thanks to a radio speech by Pehr Evind Svinhufvud and the leaders of the movement were punished."
 FIN_german_advisors:0 "German Military Attache"
 FIN_finger_four_formation:0 "Finger-Four Formation"
 FIN_finger_four_formation_desc:0 "Finland was an early adopter of the Finger-Four formation which proved itself more effective than the old Vic formation while fighting the Soviet air force during the Winter War."
 FIN_anti_german_turnaround:0 "Anti-German Turnaround"
 FIN_anti_german_turnaround_desc:0 "While Germany aren't our true enemies our recent policies has put us against them."
 # Focus
 FIN_army_effort:0 "Army Effort"
 FIN_army_effort_desc:0 "The Finnish army is very limited in size despite our best attempts, to remedy this we need to prepare some reforms that will help improve our army."
 FIN_fortify_the_coast:0 "Fortify Our Coastal Cities"
 FIN_fortify_the_coast_desc:0 "The Soviets may invade our coasts and we need to be ready for that."
 FIN_expansion_of_the_mannerheim_line:0 "Expansion of Mannerheim Line"
 FIN_expansion_of_the_mannerheim_line_desc:0 "The Mannerheim Line is a smaller line towards Leningrad which isn't as strong as other defensive lines, we need to strengthen the fortifications there."
 FIN_mining_defenses:0 "Mining Defenses"
 FIN_mining_defenses_desc:0 "To discourage a Soviet invasion from the sea we need to place mines near our waters, this will make it much more difficult to conduct operations for them!"
 FIN_salpalinja:0 "Salpalinja"
 FIN_salpalinja_desc:0 "Salpalinja is a defensive line accross the new Soviet border which many in our military believes is needed should the Soviets seek to invade us again."
 FIN_equipment_effort:0 "Equipment Effort"
 FIN_equipment_effort_desc:0 "Quality over quantity shall be the montra of our military, as such we need to prepare modern arms."
 FIN_equipment_effort_2:0 "Reconnaissance Equipment"
 FIN_equipment_effort_2_desc:0 "Reconnaissance and indirect fighting should make up majority of our forces to secure that we can counteract the tactics of our enemies."
 FIN_focus_on_offense:0 "Mobile Defence"
 FIN_focus_on_offense_desc:0 "The defence of Finland requires rapid relocation of our armies, which means we need modern transports."
 FIN_secure_foreign_weapon_contracts:0 "Foreign Arms Contracts"
 FIN_secure_foreign_weapon_contracts_desc:0 "To properly secure our ability to conduct a mobile defence we cannot leave our arms industry vulnerable. As such we'll secure arms contracts abroad."
 FIN_armor_focus:0 "Armored Focus"
 FIN_armor_focus_desc:0 "While it's unlikely we'll be able to produce them in large amount, having armored vehicles could be of great aid in the defence of Finland."
 FIN_focus_on_defense:0 "Careful Defence"
 FIN_focus_on_defense_desc:0 "The defence of Finland requires that our men are ready for overwhelming opposition and will need reliable rifles to handle this."
 FIN_support_focus:0 "Support Focus"
 FIN_support_focus_desc:0 "Proper integration of support companies into our armies will keep Finland safe during war."
 FIN_light_infantry_strategy:0 "Light Infantry Doctrine"
 FIN_light_infantry_strategy_desc:0 "We must make do with the limited manpower at our disposal. If we want more divisions, they necessarily have to be smaller. Light infantry divisions provide an optimal mix of striking power and size, and we will make it the backbone of our military."
 FIN_special_forces:0 "Specialised Divisions"
 FIN_special_forces_desc:0 "The needs of Finland requires specialised divisions that can spearhead any operation we conduct."
 FIN_invite_german_attaches:0 "Invite German Attaches"
 FIN_invite_german_attaches_desc:0 "German Attaches will help guide our military development and aid in the development of our military."
 FIN_german_arms_purchases:0 "German Arms Purchases"
 FIN_german_arms_purchases_desc:0 "We're not fully capable of equiping our armies and may need to rely on German aid."
 FIN_unlock_single_use_arm_purchase_tt:0 "Unlocks single-use decisions to purchase equipment from Germany."
 
 FIN_land_doctrine_effort:0 "Tactical Supremacy"
 FIN_land_doctrine_effort_desc:0 "It'll be difficult to achieve strategic supremacy against many of our neighbors, but instead we could improve our tactical supremacy."
 FIN_in_preparation_against_the_soviets:0 "Prepare For The Soviets"
 FIN_in_preparation_against_the_soviets_desc:0 "We cannot wait on the Soviets to invade us, we need to properly improve our wargames for the inevietable attack."
 FIN_modern_defensive_tactics:0 "Modernise Our Doctrines"
 FIN_modern_defensive_tactics_desc:0 "Modern army doctrines are required to properly defend Finland."
 FIN_army_innovations:0 "Army Innovations"
 FIN_army_innovations_desc:0 "With the help of Germany and the progress we've made so far we'll be able to properly invest into improving our military."
 
 FIN_continue_our_neutrality:0 "Continue Our Neutrality"
 FIN_continue_our_neutrality_desc:0 "Neutrality has protected us well so far and with the Russian Bear keeping its eyes on us we need to do what we can to proect our neutrality."
 FIN_nationalism:0 "Finnish Nationalism"
 FIN_nationalism_desc:0 "Our newfound independence requires a strong nationalist zeal, without that we might fall again."
 FIN_militarism:0 "Militarism"
 FIN_militarism_desc:0 "We need to encourage a sentiment of prepared militarism, this way our people will know that they can live their lives safe from foreign invasions."
 FIN_form_paramilitaries:0 "Form Paramilitaries"
 FIN_form_paramilitaries_desc:0 "Paramilitaries shall serve the duty of making our populace more prepared for another conflict."
 FIN_liberty_ethos:0 "Finnish Democracy"
 FIN_liberty_ethos_desc:0 "Our newfound independence isn't worth it if we fall again under a despot, we need to protect Finnish democracy."
 FIN_armed_neutrality:0 "Armed Neutrality"
 FIN_armed_neutrality_desc:0 "We need to arm the nation and discourage a soviet invasion, all while protecting our neutrality."
 FIN_why_we_fight:0 "Why We Fight"
 FIN_why_we_fight_desc:0 "We fight for our children, our people, our nation. We fight to make sure we won't fall under Russian occupation again. We'll stand united under democracy."
 FIN_expand_the_conscription:0 "Extend the Conscription"
 FIN_expand_the_conscription_desc:0 "There is no hope that we'll ever match the Soviets in numbers, but that doesn't mean we should limit ourselves in our defense of Finland."
 FIN_ready_for_another_war:0 "War Readiness"
 FIN_ready_for_another_war_desc:0 "With tensions slowly rising throughout the world the question about war is on our mind, we need to prepare our populace."
 
 FIN_declare_greater_finland:0 "Declare Greater Finland"
 FIN_declare_greater_finland_desc:0 "With the land of our all the Finnish people under our control, we can now declare ourselves Greater Finland proper."
 
 FIN_join_operation_barbarossa:0 "Join Operation Barbarossa"
 FIN_join_operation_barbarossa_desc:0 "Operation Barbarossa is on its way and it's the perfect time for us to strike back at the Soviets."
 FIN_join_the_axis:0 "Join the Axis"
 FIN_join_the_axis_desc:0 "With our problems caused after the Winter War we need to align with the Axis."
 FIN_a_new_government:0 "Rangell Cabinet"
 FIN_a_new_government_desc:0 "After the Interim Peace politics has changed in Finland and we've become more and more aligned with Germany. Now Rangell has risen to be able to take the position of Prime Minister and lead Finland through these turbolent times."
 if_completed_before_date_can_get_mannerheim_as_leader_tt:0 "If this focus is completed before §Y4th of August 1944§!, you get the chance to recieve an event that can put §YCarl Mannerheim§! in charge of Finland."
 FIN_german_investment:0 "German Industrial Investments"
 FIN_german_investment_desc:0 "With our military industry growing, it can prove itself more effective if we're aided by the Germans."
 FIN_moscow_armistice:0 "Moscow Armistice"
 FIN_moscow_armistice_desc:0 "The war isn't going well for Germany and it's only a matter of time until the Soviets turn against us. We need to sign an armstice with them."
 
 FIN_reorganise_our_economy:0 "Reorganise Our Economy"
 FIN_reorganise_our_economy_desc:0 "With the loss of our land and a fifth the industry that resided there we've to quickly reorganise our economy again."
 FIN_organise_the_youth:0 "Mobilize the Youth"
 FIN_organise_the_youth_desc:0 "We need to mobilize every man that we can to secure we've enough men in the field to protect Finland."
 
 FIN_strengthen_our_existing_industry:0 "Strengthen Our Existing Industry"
 FIN_strengthen_our_existing_industry_desc:0 "One fifth of our industrial heartland lies in [146.GetName] and we need to further expand it. Surely it'll be a safe way to expand our industry."
 FIN_capital_industrial_effort:0 "Southern Industrial Investment"
 FIN_capital_industrial_effort_desc:0 "With our industry being strengthened in the south, we're now ready to use that to propel our southern industry further."
 FIN_lappland_infrastructure_effort:0 "Lappi Industrial Effort"
 FIN_lappland_infrastructure_effort_desc:0 "There is a steel industry within Lappi that we need to make use of to expand our current industry, that will mean improving local infrastructure and ability to keep the industry going."
 FIN_militarise_lappland:0 "Lappi Militarisation"
 FIN_militarise_lappland_desc:0 "With the industry growing in the north, it's high time we make proper use of it by creating a proper military complex in Lappi."
 FIN_improve_our_industry:0 "Industrial Improvements"
 FIN_improve_our_industry_desc:0 "Finland has only recenty gotten out of an agrarian economy and we're ready to start investing into our industry now to start catching up to those around us."
 FIN_infrastructure_expansion:0 "Infrastructure Effort"
 FIN_infrastructure_expansion_desc:0 "Improving our infrastructure will allow us to better move supplies and resources throughout Finland."
 
 FIN_trained_pilot_effort:0 "Trained Pilot Effort"
 FIN_trained_pilot_effort_desc:0 "Our pilots need proper training to make up for the small size of our air force."
 FIN_plane_imports:0 "Fighter Imports"
 FIN_plane_imports_desc:0 "The only way to secure that we've an air force that can contend with a Soviet invasion is to import fighters from other countries."
 FIN_improve_and_learn:0 "Improve And Learn"
 FIN_improve_and_learn_desc:0 "With the fighters we've imported so far, we're in a position to learn from these imports."
 FIN_unlock_single_use_fighter_purchase_tt:0 "Unlocks single-use decisions to purchase fighters from other countries."
 
 FIN_modern_naval_doctrine:0 "Naval Doctrine Effort"
 FIN_modern_naval_doctrine_desc:0 "The Finnish navy isn't large and as such we need to modernise our doctrines to make up for this."
 FIN_submarine_fleet:0 "Submarine Fleet"
 FIN_submarine_fleet_desc:0 "Focusing on Submarines will allow us to indirectly take on our enemies."
 FIN_purchase_german_submarines:0 "Purchase German Submarines"
 FIN_purchase_german_submarines_desc:0 "It's going to be difficult for us to produce a proper navy and as such we need to go to Germany and purchase Submarines from them."
 gains_six_german_submarines_tt:0 "Gain §Y6§! §OGerman§! Submarines in [111.GetName]."
 FIN_surface_fleet:0 "Surface Fleet"
 FIN_surface_fleet_desc:0 "Most of our admirals are keen on the idea of us keeping our fleet near the surface and focusing on deterrence strategies first and foremoest."
 
 chd_finland.0.t:0 "The Moscow Armistice"
 chd_finland.0.d:0 "The Moscow Armistice is a newly drafted treaty between us and the Finnish in which they will have to accept the new borders from after the winter war and in addition hand over control of [722.GetName] to [SOV.GetAdjective] control and that they'll officially turn against the German Reich.\nThe question is if we accept this."
 chd_finland.0.a:0 "Let's accept this"
 chd_finland.0.b:0 "They won't escape that easy"
 chd_finland.1.a:0 "Moscow Armistice Signed"
 chd_finland.1.d:0 "With the territories officially handed over to the Soviets and war having ended between our two countries we need to do what we can to banish the remaining German forces out of Finland."
 chd_finland.1.a:0 "Time to kick some Germans out of Finland"
 chd_finland.2.t:0 "Finland Betrayed Us"
 chd_finland.2.d:0 "In our hour of need it seems that Finland has signed a seperate treaty with the Soviets, betraying our alliance."
 chd_finland.2.a:0 "Bastards, all of them!"
 chd_finland.3.t:0 "No Moscow Armistice"
 chd_finland.3.d:0 "It seems there won't be peace between us and the Soviets, which has forced us to stand our ground against them."
 chd_finland.3.a:0 "It was worth a shot"
 chd_finland.4.t:0 "Industrial Investment"
 chd_finland.4.d:0 "The loss of a fifth of our industry in [146.GetName] has led us having to properly address what to do now."
 chd_finland.4.a:0 "We've to restore our industry"
 chd_finland.4.b:0 "We need to arm ourselves"
 
 chd_finland.5.t:0 "1937 Presidental Election"
 chd_finland.5.d:0 "Two-stage presidential elections have been held within our nation and the result was a victory for Kyösti Kallio, who won on the second ballot after Kaarlo Juho Ståhlberg lost first ballot. Most believe this come down to that Kallio has fewer opponents within the Electoral College."
 chd_finland.5.a:0 "May Kallio lead us well"
 chd_finland.6.t:0 "President Kallio Suffered A Stroke"
 chd_finland.6.d:0 "Today it seems that Kallio suffered from a serious stroke and in turn Prime Minister Risto Ryti has taken over his duties. Despite this he has decided to participate in the formal farewell ceremonies."
 chd_finland.6.a:0 "This is concerning"
 chd_finland.7.t:0 "Kallio Notice of Resignation"
 chd_finland.7.d:0 "President Kyösti Kallio health has long been suffering, his right arm has been paralysed for some time now and the recent stroke he has decided to leave a notice of resigination."
 chd_finland.7.a:0 "An understandable decision"
 chd_finland.8.t:0 "1940 Presidental Election"
 chd_finland.8.d:0 "With Kallio's recent resigination the government has scrammbled to elect a new president. With Soviet pressure to not elect any president they may consider hostile to further peace between our nations the political situation has turned tense.\nThe 1937 presidental electors were summoned and in the end elected Risto Ryti.\n\nAfter the farewell ceremonies during the evening Kallio collapsed and died at the Helsinki Central Railway Station in the arms of his adjutant."
 chd_finland.8.a:0 "These are turbolent times we live in"
 chd_finland.9.t:0 "President Mannerheim?"
 chd_finland.9.d:0 "The ongoing conflicts that Germany has dragged themselves into has affected Finland severly, not only that but it has made our people unsure on what we should be doing.\nSome of our politicians has suggested that we abandon our old treaties, but it'd be difficult to null them without risking the wrath of the German Reich. One suggestion to solve this has been to ask Risto Ryti to resign, most treaties were signed by him as head of government and would in theory only apply as long as he rules Finland. The most promiment candidate to replace him seem to be our popular Field Marshal Mannerheim."
 chd_finland.9.a:0 "This sounds like a good idea"
 chd_finland.9.b:0 "No, we cannot do this"
 
 chd_finland.10.t:0 "End of German Scepticism"
 chd_finland.10.d:0 "The recent outbreak of the Winter War has caused a difficult change in our politics. We've been largely abandoned by the West and our only supporters are our Swedish brothers and the Axis."
 chd_finland.10.a:0 "We need to change our stance"
 chd_finland.11.t:0 "The Winter War"
 chd_finland.11.d:0 "As the winter war rages on in Finland, it is becoming clearer by the day that most of our populace wishes that our government takes a stand against the Russian aggression that is going on in Finland."
 chd_finland.11.a:0 "Ignore that conflict"
 chd_finland.11.b:0 "Denounce the Soviets"
 chd_finland.11.c:0 "Send Finland some weapons"
