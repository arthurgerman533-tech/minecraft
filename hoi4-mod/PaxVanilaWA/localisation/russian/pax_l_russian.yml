 PAX_GER_fai_desc:0 "Вотан и Донар. В грозу германские полки идут вперёд."
 PAX_GER_revanche:0 "Реванш за 1914"
 PAX_GER_revanche_desc:0 "Рейх проиграл Первую Великую войну. Канцлер обещает, что второй раз так не будет."
