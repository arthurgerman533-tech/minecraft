l_english:
 PAX_idea_mining_guilds:0 "Miners' Guilds"
 PAX_idea_mining_guilds_desc:0 "Miners dig deeper and faster."
 PAX_idea_war_economy:0 "War Orders"
 PAX_idea_war_economy_desc:0 "Factories work for the war."
 PAX_idea_mobilization:0 "Mobilization"
 PAX_idea_mobilization_desc:0 "Reservists are ready to take their places in the ranks."
 PAX_idea_fortifications:0 "Walls Around Walls"
 PAX_idea_fortifications_desc:0 "Your own land is better defended than someone else's."
 PAX_idea_total_war:0 "Total War"
 PAX_idea_total_war_desc:0 "The whole nation fights."
 PAX_idea_trade_routes:0 "Trade Routes"
 PAX_idea_trade_routes_desc:0 "Trade feeds the treasury."
 PAX_idea_diplomatic_corps:0 "Diplomatic Corps"
 PAX_idea_diplomatic_corps_desc:0 "The ambassadors of the powers know every old treaty."
 PAX_idea_hegemony:0 "Hegemony"
 PAX_idea_hegemony_desc:0 "Neighbors pay tribute and do not argue."
 PAX_far_lands:0 "Far Lands"
 PAX_far_lands_desc:0 "The PaxVanila lore is silent about this country. The world revolves around the Monolith, not around it."
 PAX_idea_guardian_seven:0 "Guardian-7"
 PAX_idea_guardian_seven_desc:0 "Beneath the tower the seventh golem with a copper heart awoke. Its first word was 'PAX'."
 PAX_idea_kurultai_mind:0 "The 'Kurultai' Mind"
 PAX_idea_kurultai_mind_desc:0 "The Steppe Pact stole Seven's blueprints and built a mind of its own."
 PAX_idea_factory_cities:0 "Factory Cities"
 PAX_idea_factory_cities_desc:0 "Workers' quarters grow around the workshops."
 PAX_idea_age_of_steel:0 "Age of Steel"
 PAX_idea_age_of_steel_desc:0 "Steel and steam give a power more than war does."
 PAX_idea_staff_school:0 "Staff School"
 PAX_idea_staff_school_desc:0 "The staff learns from the mistakes of past wars."
 PAX_idea_hundred_legions:0 "Hundred Legions"
 PAX_idea_hundred_legions_desc:0 "The country has become one big camp."
 PAX_idea_treaty_web:0 "Web of Treaties"
 PAX_idea_treaty_web_desc:0 "A hundred treaties keep the neighbors on a leash."
 PAX_idea_world_power:0 "World Power"
 PAX_idea_world_power_desc:0 "The word of the power is heard from the Monolith to the far lands."
 PAX_idea_cw_bunkers:0 "Underground Shelters"
 PAX_idea_cw_bunkers_desc:0 "Beneath the cities lie warehouses and workshops."
 PAX_idea_cw_balance:0 "Balance of Fear"
 PAX_idea_cw_balance_desc:0 "Peace is held by mutual fear."
 PAX_idea_auto_factories:0 "Automated Factories"
 PAX_idea_auto_factories_desc:0 "The conveyors do not wait for people."
 PAX_idea_neuro_link:0 "Neural Interfaces"
 PAX_idea_neuro_link_desc:0 "Orders go straight from the staff to the troops."
 PAX_idea_ad_empire:0 "Empire of Advertising"
 PAX_idea_ad_empire_desc:0 "The subscription has replaced the tax."
 PAX_idea_comm_monopoly:0 "Communications Monopoly"
 PAX_idea_comm_monopoly_desc:0 "All communications belong to the corporation."
 PAX_idea_board_of_world:0 "Board of Directors of the World"
 PAX_idea_board_of_world_desc:0 "Ten corporations divide the world at one table."
 PAX_idea_ITA_tower_law:0 "'No Shooting at the Tower'"
 PAX_idea_ITA_tower_law_desc:0 "The Law of 1529 has been rewritten for the cannons of the Age of Steel."
 PAX_idea_GRE_academy:0 "Academy of Hellas"
 PAX_idea_GRE_academy_desc:0 "The list of everything goes on."
 PAX_idea_FRA_harvest:0 "Autumn Harvest"
 PAX_idea_FRA_harvest_desc:0 "The harvest feeds the army and the factories."
 PAX_idea_FRA_forest_forts:0 "Forest Fortresses"
 PAX_idea_FRA_forest_forts_desc:0 "Every grove can become a fortress."
 PAX_idea_GER_blitz:0 "Attack Before Winter"
 PAX_idea_GER_blitz_desc:0 "Fast, and without winter greatcoats."
 PAX_idea_GER_winter_coats:0 "Winter Greatcoats"
 PAX_idea_GER_winter_coats_desc:0 "The Reich remembered the lesson of the blizzard."
 PAX_idea_SOV_winter_campaign:0 "Winter Campaign"
 PAX_idea_SOV_winter_campaign_desc:0 "Northerners fight better in winter than anyone."
 PAX_idea_ROM_copper:0 "Copper of Sarmizegetusa"
 PAX_idea_ROM_copper_desc:0 "Copper goes to the factories."
 PAX_era_cold_war:0 "Cold War"
 PAX_era_cold_war_desc:0 "The guns are silent in no man's land. Both sides secretly search for obsidian."
 PAX_era_robots:0 "Age of Robots"
 PAX_era_robots_desc:0 "Machines work in the factories while golems stand on the borders."
 PAX_era_cyberpunk:0 "Rise of Cyberpunk"
 PAX_era_cyberpunk_desc:0 "Neon, corporations and the sculk net. States have become brands."
 PAX_spirit_ITA:0 "Keepers of the Seal"
 PAX_spirit_ITA_desc:0 "Romea stands right beside the Monolith. Its senators swear by the word PAX, and the chroniclers of the Forum record everything that happens at the tower."
 PAX_her_ITA:0 "Legacy: SPQR"
 PAX_her_ITA_desc:0 "The Senate and People of Romea. Every enemy who falls on Romean soil makes the Republic stronger."
 PAX_fai_ITA:0 "Faith: Mars Gradivus"
 PAX_fai_ITA_desc:0 "The gods of the Capitol. Mars stands for Romea when the enemy is at its walls."
 PAX_spirit_SPR:0 "Golden Caravan"
 PAX_spirit_SPR_desc:0 "Carthage grew out of the merchants of Ur-Kadim. Its caravans and ships go to every shore of the world."
 PAX_her_SPR:0 "Legacy: Guns of Gaius"
 PAX_her_SPR_desc:0 "Carthaginian founders make siege guns cheaper than anyone in the world."
 PAX_fai_SPR:0 "Faith: Generosity of Tanit"
 PAX_fai_SPR_desc:0 "Baal Hammon and Tanit. The goddess loves generous merchants."
 PAX_spirit_GRE:0 "Maritime League of Islands"
 PAX_spirit_GRE_desc:0 "Hellas is a hundred islands and one shared harbor. Every Hellene knows how to hold an oar from childhood."
 PAX_her_GRE:0 "Legacy: Maritime League"
 PAX_her_GRE_desc:0 "The fleet of Hellas moves over the sea like a dolphin."
 PAX_fai_GRE:0 "Faith: Poseidon"
 PAX_fai_GRE_desc:0 "The gods of Olympus. The sea god guards the ships of Hellas."
 PAX_spirit_FRA:0 "Sacred Groves"
 PAX_spirit_FRA_desc:0 "Gaul still prays in the forests. The groves give it harvests and peace."
 PAX_her_FRA:0 "Legacy: Sacred Groves"
 PAX_her_FRA_desc:0 "At home, in their own forests, the Gauls rise after any blow."
 PAX_fai_FRA:0 "Faith: Mistletoe"
 PAX_fai_FRA_desc:0 "The gods of the groves. Druids heal the wounded with mistletoe and herbs."
 PAX_spirit_ENG:0 "The Islands That Said 'No'"
 PAX_spirit_ENG_desc:0 "In 1781 the colonies fought off their mother countries. Since then the Island Union has paid tribute to no one."
 PAX_her_ENG:0 "Legacy: Republic of Seafarers"
 PAX_her_ENG_desc:0 "Every citizen of the Union is a sailor, and every port is home."
 PAX_fai_ENG:0 "Faith: Union of Number"
 PAX_fai_ENG_desc:0 "The school of Pythagoras. Seafarers believe everything has a number, even luck."
 PAX_spirit_GER:0 "Disgrace of 1914"
 PAX_spirit_GER_desc:0 "The Reich lost the First Great War. It has too little land and remembers every grievance."
 PAX_her_GER:0 "Legacy: Iron and Coal"
 PAX_her_GER_desc:0 "The Germanic kingdoms sit on the richest ores in the world."
 PAX_fai_GER:0 "Faith: Hammer of Donar"
 PAX_fai_GER_desc:0 "Wotan and Donar. In a thunderstorm the Germanic regiments march forward."
 PAX_spirit_SOV:0 "Winter on the Side of Home"
 PAX_spirit_SOV_desc:0 "The blizzard of 1241 stopped the Horde at the walls of Romea. Northerners grew up in such a blizzard."
 PAX_her_SOV:0 "Legacy: Blizzard of 1942"
 PAX_her_SOV_desc:0 "In winter, enemies on the Kingdom's soil freeze into the snow."
 PAX_fai_SOV:0 "Faith: Keepers of the Seal"
 PAX_fai_SOV_desc:0 "Northerners believe in the Monolith more than in the gods. The Seal holds the world."
 PAX_spirit_ROM:0 "Copper Mines of Caer-Brun"
 PAX_spirit_ROM_desc:0 "In the mountains of Dacia lie the ancient mines of the Copper Union. Blueprints of steam engines were found in them."
 PAX_her_ROM:0 "Legacy: Copper of Caer-Tal"
 PAX_her_ROM_desc:0 "Dacia dug out the mines of the Copper Union to the very bottom."
 PAX_fai_ROM:0 "Faith: Without Fear of Death"
 PAX_fai_ROM_desc:0 "Zalmoxis. The Dacians go into battle because they do not fear death."
 PAX_spirit_TUR:0 "Children of the Sandstorm"
 PAX_spirit_TUR_desc:0 "The Horde comes fast and leaves fast. Its cavalry remembers the road to the walls of Romea."
 PAX_her_TUR:0 "Legacy: From the Sandstorm"
 PAX_her_TUR_desc:0 "The Horde emerges from the storm where it is not expected and strikes on foreign soil."
 PAX_fai_TUR:0 "Faith: Yasa"
 PAX_fai_TUR_desc:0 "Tengri and Umay. Under the open sky the cavalry of the Horde knows no defeat."
 PAX_spirit_PER:0 "Kurgan Nobility"
 PAX_spirit_PER_desc:0 "The kings of Scythia rule together with the clans. The clans provide gold and horsemen, but love to argue."
 PAX_her_PER:0 "Legacy: Royal Kurgans"
 PAX_her_PER_desc:0 "The gold of ancestors and the tribute of vassals flow into the treasury of the Scythian kings."
 PAX_fai_PER:0 "Faith: Arrows of Papaios"
 PAX_fai_PER_desc:0 "Tabiti, Papaios and Api. The horse archers of Scythia never miss."
 PAX_idea_cw_pax:0 "Vigil at the Monolith"
 PAX_idea_cw_pax_desc:0 "The PAX Union keeps guard detachments at the tower and shares intelligence."
 PAX_idea_cw_steppe:0 "Quiet Steppe"
 PAX_idea_cw_steppe_desc:0 "The Steppe Pact keeps its armies on the steppe and searches for obsidian beneath foreign lands."
 PAX_idea_rb_pax:0 "Seven's Network"
 PAX_idea_rb_pax_desc:0 "Guardian-7 helps calculate better than any counting bureau of the Forum."
 PAX_idea_rb_steppe:0 "Kurultai Network"
 PAX_idea_rb_steppe_desc:0 "The Kurultai pulls the Pact's factories into one network and holds a plan a hundred years ahead."
 PAX_idea_golem_legions:0 "Copper Legions"
 PAX_idea_golem_legions_desc:0 "Golems with copper hearts stand on the borders."
 PAX_idea_human_answer:0 "The Human Answer"
 PAX_idea_human_answer_desc:0 "We will not hand decisions over to the machine. The last word stays with people."
 PAX_idea_machine_merge:0 "Merging with the Mind"
 PAX_idea_machine_merge_desc:0 "Our factories and staffs are counted through a shared mind. There is less paperwork, and fewer arguments too."
 PAX_idea_corp_charter:0 "Corporate Charter"
 PAX_idea_corp_charter_desc:0 "Law has been replaced by a charter, the citizen by a shareholder. Taxes have become subscriptions."
 PAX_idea_sculk_net:0 "Sculk Net"
 PAX_idea_sculk_net_desc:0 "Signals travel through sculk. The news outruns itself."
 PAX_idea_protectorate:0 "Loyal to the Protectorate"
 PAX_idea_protectorate_desc:0 "The Network Protectorate guarantees us peace and the collection of subscriptions."
 PAX_idea_shadow_corp:0 "Shadow Corporation"
 PAX_idea_shadow_corp_desc:0 "Officially we do not exist. Unofficially all the black servers read us."
 PAX_lore_category:0 "PaxVanila Lore"
 PAX_lore_category_desc:0 "National decisions of your power: heritage, faith, alliances and the paths of the eras."
 PAX_ITA_her:0 "Legacy: SPQR"
 PAX_ITA_her_desc:0 "The Senate and People of Romea. Every enemy who falls on Romean soil makes the Republic stronger."
 PAX_ITA_fai:0 "State Faith: Mars Gradivus"
 PAX_ITA_fai_desc:0 "The gods of the Capitol. Mars stands for Romea when the enemy is at its walls."
 PAX_ITA_senate:0 "Senate at the Tower"
 PAX_ITA_senate_desc:0 "The Senate meets at the Monolith, as in the year of the founding. Romulus listens to the senators."
 PAX_ITA_tower_law:0 "'No Shooting at the Tower'"
 PAX_ITA_tower_law_desc:0 "The Law of 1529. The new guns hit at fifty kilometers, and the law must be rewritten."
 PAX_ITA_tablets:0 "Tablets of the Precursors"
 PAX_ITA_tablets_desc:0 "The scholars of the Forum read the tablets of Ur-Kadim and Caer-Tal again."
 PAX_ITA_monolith_pact:0 "Treaty at the Monolith"
 PAX_ITA_monolith_pact_desc:0 "The first non-aggression pact was signed at the tower in 251. It is time to gather the union again and name it with the word above the entrance."
 PAX_ITA_romul_legacy:0 "The Name That Does Not Die"
 PAX_ITA_romul_legacy_desc:0 "There were two hundred and five Romuluses. The Republic will survive this war too."
 PAX_ITA_cw_watch:0 "Tower Watch"
 PAX_ITA_cw_watch_desc:0 "Romea. A hundred years ago we swore the oath of PAX. Now our guard stands at the tower every day."
 PAX_ITA_cw_intel:0 "Obsidian Reconnaissance"
 PAX_ITA_cw_intel_desc:0 "Both sides secretly search for obsidian underground. Our agents know where to dig."
 PAX_ITA_cw_shield:0 "Shield of PAX"
 PAX_ITA_cw_shield_desc:0 "The bloc holds the line. As long as we stand together, no one will risk starting a war."
 PAX_ITA_cw_deter:0 "Deterrence"
 PAX_ITA_cw_deter_desc:0 "Neither side will press first. The best war is the one that never happened."
 PAX_ITA_rb_net:0 "Seven's Network"
 PAX_ITA_rb_net_desc:0 "Guardian-7 calculates faster than any bureau. We connect our laboratories to it."
 PAX_ITA_rb_golems:0 "Copper Legions"
 PAX_ITA_rb_golems_desc:0 "Golems with copper hearts rise on the borders and replace divisions."
 PAX_ITA_rb_human:0 "The Human Answer"
 PAX_ITA_rb_human_desc:0 "Mind is mind, but the last word will stay with us."
 PAX_ITA_rb_merge:0 "Merging with the Mind"
 PAX_ITA_rb_merge_desc:0 "We hand our staffs and factories to the shared mind. It is faster and quieter."
 PAX_ITA_rb_war:0 "War of Two Minds"
 PAX_ITA_rb_war_desc:0 "Guardian-7 and the Kurultai look at each other. We stand between them."
 PAX_ITA_co_charter:0 "Corporate Charter"
 PAX_ITA_co_charter_desc:0 "Romea is now a brand. The citizen has become a shareholder, the tax a subscription."
 PAX_ITA_co_sculk:0 "Sculk Net"
 PAX_ITA_co_sculk_desc:0 "Signals travel through sculk. The news arrives before the events."
 PAX_ITA_co_gates:0 "Gates by Subscription"
 PAX_ITA_co_gates_desc:0 "The gates open for those who pay. Qart-Hadasht is already selling seats."
 PAX_ITA_co_loyal:0 "Loyalty to the Protectorate"
 PAX_ITA_co_loyal_desc:0 "The Network Protectorate has banned wars. We will sign whatever it asks."
 PAX_ITA_co_shadow:0 "Shadow Corporation"
 PAX_ITA_co_shadow_desc:0 "We exist as long as no one looks for us. The black servers pay more."
 PAX_ITA_cw_arms:0 "Arms Race"
 PAX_ITA_cw_arms_desc:0 "Both sides stack shells in cellars. The factories work three shifts."
 PAX_ITA_cw_spies:0 "Shadows at the Tower"
 PAX_ITA_cw_spies_desc:0 "The agents of the Union and the Pact play a game whose rules only they know."
 PAX_ITA_cw_bunkers:0 "Underground Shelters"
 PAX_ITA_cw_bunkers_desc:0 "If the tower falls, people and machines must remain underground."
 PAX_ITA_cw_diplo:0 "Talks at the Monolith"
 PAX_ITA_cw_diplo_desc:0 "Every five years the ambassadors gather at the tower and promise not to shoot."
 PAX_ITA_cw_balance:0 "Balance of Fear"
 PAX_ITA_cw_balance_desc:0 "Peace holds as long as both sides fear each other."
 PAX_ITA_rb_factories:0 "Automated Factories"
 PAX_ITA_rb_factories_desc:0 "The conveyors no longer wait for people. People watch that nothing breaks."
 PAX_ITA_rb_labs:0 "Seven's Laboratories"
 PAX_ITA_rb_labs_desc:0 "The mind helps run experiments and read results faster than any scientist."
 PAX_ITA_rb_drones:0 "Reconnaissance Drones"
 PAX_ITA_rb_drones_desc:0 "Light machines fly around the borders and see farther than any sentry."
 PAX_ITA_rb_cyber:0 "Neural Interfaces"
 PAX_ITA_rb_cyber_desc:0 "Commanders connect the staff directly to the mind. The order arrives instantly."
 PAX_ITA_rb_peace:0 "Treaty of Two Minds"
 PAX_ITA_rb_peace_desc:0 "The machines sat down at the table before the people. The rest have only to sign."
 PAX_ITA_co_ads:0 "Advertising in Every Home"
 PAX_ITA_co_ads_desc:0 "Advertising replaced slogans. The subscription replaced the tax."
 PAX_ITA_co_security:0 "Corporate Security"
 PAX_ITA_co_security_desc:0 "Private armies guard offices and warehouses better than state ones."
 PAX_ITA_co_monopoly:0 "Communications Monopoly"
 PAX_ITA_co_monopoly_desc:0 "The sculk net belongs to us. Everything else can be rented."
 PAX_ITA_co_black:0 "Black Servers"
 PAX_ITA_co_black_desc:0 "Archives that do not exist keep everything we forgot."
 PAX_ITA_co_summit:0 "Board of Directors of the World"
 PAX_ITA_co_summit_desc:0 "Ten corporations sit at one table. Whoever pays more decides."
 PAX_SPR_her:0 "Legacy: Guns of Gaius"
 PAX_SPR_her_desc:0 "Carthaginian founders make siege guns cheaper than anyone in the world."
 PAX_SPR_fai:0 "State Faith: Generosity of Tanit"
 PAX_SPR_fai_desc:0 "Baal Hammon and Tanit. The goddess loves generous merchants."
 PAX_SPR_suffets:0 "Council of Suffetes"
 PAX_SPR_suffets_desc:0 "Carthage is ruled by merchants. The Council of Suffetes decides where to trade and whom to fight."
 PAX_SPR_caravan:0 "Golden Caravan"
 PAX_SPR_caravan_desc:0 "The longest trade road in the world is open again."
 PAX_SPR_new_fleet:0 "New Fleet of Carthage"
 PAX_SPR_new_fleet_desc:0 "In 264 BC a storm sank the fleet of Carthage. The new fleet is built of steel."
 PAX_SPR_kart_hadasht:0 "Qart-Hadasht"
 PAX_SPR_kart_hadasht_desc:0 "'New City'. Carthage builds factories as fast as it once built ships."
 PAX_SPR_join_pax:0 "A Seat in the PAX Union"
 PAX_SPR_join_pax_desc:0 "The old quarrel with Romea is forgotten. Carthage stands beside it at the Monolith."
 PAX_SPR_cw_watch:0 "Tower Watch"
