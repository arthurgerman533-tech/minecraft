 SPR_pax_her_desc:0 "Carthaginian founders make siege guns cheaper than anyone in the world. The legacy of the ten lore powers, like the 'her' focus on the PaxVanila server."
 SPR_pax_fai:0 "State Faith: Generosity of Tanit"
 SPR_pax_fai_desc:0 "Baal Hammon and Tanit. The goddess loves generous merchants."
 SPR_pax_suffets:0 "Council of Suffetes"
 SPR_pax_suffets_desc:0 "Carthage is ruled by merchants. The Council of Suffetes decides where to trade and whom to fight."
 SPR_pax_caravan:0 "Golden Caravan"
 SPR_pax_caravan_desc:0 "The longest trade road in the world is open again."
 SPR_pax_new_fleet:0 "New Fleet of Carthage"
 SPR_pax_new_fleet_desc:0 "In 264 BC a storm sank the fleet of Carthage. The new fleet is built of steel."
 SPR_pax_kart_hadasht:0 "Qart-Hadasht"
 SPR_pax_kart_hadasht_desc:0 "'New City'. Carthage builds factories as fast as it once built ships."
 SPR_pax_join_pax:0 "A Seat in the PAX Union"
 SPR_pax_join_pax_desc:0 "The old quarrel with Romea is forgotten. Carthage stands beside it at the Monolith."
 SPR_pax_cw_watch:0 "Tower Watch"
 SPR_pax_cw_watch_desc:0 "Carthage. A hundred years ago we swore the oath of PAX. Now our guard stands at the tower every day."
 SPR_pax_cw_intel:0 "Obsidian Reconnaissance"
 SPR_pax_cw_intel_desc:0 "Both sides secretly search for obsidian underground. Our agents know where to dig."
 SPR_pax_cw_shield:0 "Shield of PAX"
 SPR_pax_cw_shield_desc:0 "The bloc holds the line. As long as we stand together, no one will risk starting a war."
 SPR_pax_cw_deter:0 "Deterrence"
 SPR_pax_cw_deter_desc:0 "Neither side will press first. The best war is the one that never happened."
 SPR_pax_rb_net:0 "Seven's Network"
 SPR_pax_rb_net_desc:0 "Guardian-7 calculates faster than any bureau. We connect our laboratories to it."
 SPR_pax_rb_golems:0 "Copper Legions"
 SPR_pax_rb_golems_desc:0 "Golems with copper hearts rise on the borders and replace divisions."
 SPR_pax_rb_human:0 "The Human Answer"
 SPR_pax_rb_human_desc:0 "Mind is mind, but the last word will stay with us."
 SPR_pax_rb_merge:0 "Merging with the Mind"
 SPR_pax_rb_merge_desc:0 "We hand our staffs and factories to the shared mind. It is faster and quieter."
 SPR_pax_rb_war:0 "War of Two Minds"
 SPR_pax_rb_war_desc:0 "Guardian-7 and the Kurultai look at each other. We stand between them."
 SPR_pax_co_charter:0 "Corporate Charter"
 SPR_pax_co_charter_desc:0 "Carthage is now a brand. The citizen has become a shareholder, the tax a subscription."
 SPR_pax_co_sculk:0 "Sculk Net"
 SPR_pax_co_sculk_desc:0 "Signals travel through sculk. The news arrives before the events."
 SPR_pax_co_gates:0 "Gates by Subscription"
 SPR_pax_co_gates_desc:0 "The gates open for those who pay. Qart-Hadasht is already selling seats."
 SPR_pax_co_loyal:0 "Loyalty to the Protectorate"
 SPR_pax_co_loyal_desc:0 "The Network Protectorate has banned wars. We will sign whatever it asks."
 SPR_pax_co_shadow:0 "Shadow Corporation"
 SPR_pax_co_shadow_desc:0 "We exist as long as no one looks for us. The black servers pay more."
 SPR_pax_cw_arms:0 "Arms Race"
 SPR_pax_cw_arms_desc:0 "Both sides stack shells in cellars. The factories work three shifts."
 SPR_pax_cw_spies:0 "Shadows at the Tower"
 SPR_pax_cw_spies_desc:0 "The agents of the Union and the Pact play a game whose rules only they know."
 SPR_pax_cw_bunkers:0 "Underground Shelters"
 SPR_pax_cw_bunkers_desc:0 "If the tower falls, people and machines must remain underground."
 SPR_pax_cw_diplo:0 "Talks at the Monolith"
 SPR_pax_cw_diplo_desc:0 "Every five years the ambassadors gather at the tower and promise not to shoot."
 SPR_pax_cw_balance:0 "Balance of Fear"
 SPR_pax_cw_balance_desc:0 "Peace holds as long as both sides fear each other."
 SPR_pax_rb_factories:0 "Automated Factories"
 SPR_pax_rb_factories_desc:0 "The conveyors no longer wait for people. People watch that nothing breaks."
 SPR_pax_rb_labs:0 "Seven's Laboratories"
 SPR_pax_rb_labs_desc:0 "The mind helps run experiments and read results faster than any scientist."
 SPR_pax_rb_drones:0 "Reconnaissance Drones"
 SPR_pax_rb_drones_desc:0 "Light machines fly around the borders and see farther than any sentry."
 SPR_pax_rb_cyber:0 "Neural Interfaces"
 SPR_pax_rb_cyber_desc:0 "Commanders connect the staff directly to the mind. The order arrives instantly."
 SPR_pax_rb_peace:0 "Treaty of Two Minds"
 SPR_pax_rb_peace_desc:0 "The machines sat down at the table before the people. The rest have only to sign."
 SPR_pax_co_ads:0 "Advertising in Every Home"
 SPR_pax_co_ads_desc:0 "Advertising replaced slogans. The subscription replaced the tax."
 SPR_pax_co_security:0 "Corporate Security"
 SPR_pax_co_security_desc:0 "Private armies guard offices and warehouses better than state ones."
 SPR_pax_co_monopoly:0 "Communications Monopoly"
 SPR_pax_co_monopoly_desc:0 "The sculk net belongs to us. Everything else can be rented."
 SPR_pax_co_black:0 "Black Servers"
 SPR_pax_co_black_desc:0 "Archives that do not exist keep everything we forgot."
 SPR_pax_co_summit:0 "Board of Directors of the World"
 SPR_pax_co_summit_desc:0 "Ten corporations sit at one table. Whoever pays more decides."
 GRE_pax_ind1:0 "Industrialization"
 GRE_pax_ind1_desc:0 "The first step of every power of the Age of Steel: factories, railways, coal."
 GRE_pax_ind2:0 "Miners' Guilds"
 GRE_pax_ind2_desc:0 "Miners' guilds dig deeper, like the masters of Caer-Tal once did."
 GRE_pax_ind3:0 "War Economy"
 GRE_pax_ind3_desc:0 "Factories switch to shells and rifles. The treasury fills with war orders."
 GRE_pax_mil1:0 "Mobilization"
 GRE_pax_mil1_desc:0 "Every resident receives a rifle and a ration. Reservists return to the barracks."
 GRE_pax_mil2:0 "Fortifications"
 GRE_pax_mil2_desc:0 "Walls around walls. Romea taught the whole world that a fortress outlasts any raid."
 GRE_pax_mil3:0 "Total War"
 GRE_pax_mil3_desc:0 "The whole nation becomes an army. You cannot fight with a sword and keep your neighbors as vassals at the same time."
 GRE_pax_eco1:0 "Trade Routes"
 GRE_pax_eco1_desc:0 "Caravans and ships again travel the old roads. Trade feeds the treasury."
 GRE_pax_eco2:0 "Diplomatic Corps"
 GRE_pax_eco2_desc:0 "Since the Treaty at the Monolith in 251, a non-aggression pact costs less than war."
 GRE_pax_eco3:0 "Hegemony"
 GRE_pax_eco3_desc:0 "The power rules not by the sword but by tribute. Neighbors pay and the treasury grows."
 GRE_pax_ind4:0 "Great Construction"
 GRE_pax_ind4_desc:0 "The Republic builds by a plan for decades. Every city gets a factory, every factory its own railway branch."
 GRE_pax_ind5:0 "Factory Cities"
 GRE_pax_ind5_desc:0 "Entire cities switch to arms production. Workers' quarters grow around the workshops."
 GRE_pax_ind6:0 "Age of Steel"
 GRE_pax_ind6_desc:0 "Steel, coal and steam give a power more than any war. The laboratories of the Forum open one more department."
 GRE_pax_mil4:0 "New Army"
 GRE_pax_mil4_desc:0 "The old legions retrain for rifles, machine guns and armor. The main thing: listen to the staff, not to memory."
 GRE_pax_mil5:0 "Staff School"
 GRE_pax_mil5_desc:0 "The staff studies the mistakes of past wars. Generals go to courses together with lieutenants."
 GRE_pax_mil6:0 "Hundred Legions"
 GRE_pax_mil6_desc:0 "The Republic conscripts everyone who can hold a weapon. The country becomes one big camp."
 GRE_pax_eco4:0 "Golden Age of Trade"
 GRE_pax_eco4_desc:0 "Trading houses open offices all over the world. The treasury is full, and the ports cannot keep up with the cargo."
 GRE_pax_eco5:0 "Union of Treaties"
 GRE_pax_eco5_desc:0 "A hundred treaties bind the power to its neighbors. Break even one and you lose them all."
 GRE_pax_eco6:0 "World Power"
 GRE_pax_eco6_desc:0 "The word of the power is heard from the Monolith to the far lands. Its currency is in every pocket."
 GRE_pax_her:0 "Legacy: Maritime League"
 GRE_pax_her_desc:0 "The fleet of Hellas moves over the sea like a dolphin. The legacy of the ten lore powers, like the 'her' focus on the PaxVanila server."
 GRE_pax_fai:0 "State Faith: Poseidon"
 GRE_pax_fai_desc:0 "The gods of Olympus. The sea god guards the ships of Hellas."
 GRE_pax_thalassia:0 "Legacy of Thalassia"
 GRE_pax_thalassia_desc:0 "A hundred islands of the Western Sea went under the water, but their ship blueprints remained with the Hellenes."
 GRE_pax_academy:0 "Academy of Hellas"
 GRE_pax_academy_desc:0 "Plato and Aristotle compiled the list of everything. The Academy continues their work."
 GRE_pax_isles:0 "Islands of the League"
 GRE_pax_isles_desc:0 "Every island of the League builds its own shipyard."
 GRE_pax_hoplites:0 "Hoplites of Olympus"
 GRE_pax_hoplites_desc:0 "The hoplite phalanx now holds rifles."
 GRE_pax_join_pax:0 "A Seat in the PAX Union"
 GRE_pax_join_pax_desc:0 "Hellas has always stood beside Romea. It is time to say it out loud."
 GRE_pax_cw_watch:0 "Tower Watch"
 GRE_pax_cw_watch_desc:0 "Hellas. A hundred years ago we swore the oath of PAX. Now our guard stands at the tower every day."
