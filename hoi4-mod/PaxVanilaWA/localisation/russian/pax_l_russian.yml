 PAX_PER_co_security_desc:0 "Частные армии защищают офисы и склады лучше государственных."
 PAX_PER_co_monopoly:0 "Монополия на связь"
 PAX_PER_co_monopoly_desc:0 "Скалк-сеть принадлежит нам. Всё остальное можно арендовать."
 PAX_PER_co_black:0 "Чёрные серверы"
 PAX_PER_co_black_desc:0 "Архивы, которых нет, хранят всё, что мы забыли."
 PAX_PER_co_summit:0 "Совет директоров мира"
 PAX_PER_co_summit_desc:0 "Десять корпораций сидят за одним столом. Решает тот, кто платит больше."
 PAX_economy_category:0 "Экономика"
 PAX_economy_category_desc:0 "Упрощённое меню экономики в духе Millennium Dawn: налоги, финансирование, торговля, энергетика. В каждой группе действует один режим, его можно менять за политическую власть."
 PAX_eco_tax_low:0 "Налоги: Низкие налоги"
 PAX_eco_tax_low_desc:0 "Казна беднее, народ доволен. Режим группы «Налоги»: Низкие налоги."
 PAX_eco_tax_mid:0 "Налоги: Умеренные налоги"
 PAX_eco_tax_mid_desc:0 "Золотая середина, без бонусов и штрафов. Режим группы «Налоги»: Умеренные налоги."
 PAX_eco_tax_high:0 "Налоги: Высокие налоги"
 PAX_eco_tax_high_desc:0 "Казна полна, народ ворчит. Режим группы «Налоги»: Высокие налоги."
 PAX_eco_fund_civ:0 "Финансирование: Упор на гражданское"
 PAX_eco_fund_civ_desc:0 "Фабрики и стройки дешевле, армия ждёт. Режим группы «Финансирование»: Упор на гражданское."
 PAX_eco_fund_bal:0 "Финансирование: Баланс бюджета"
 PAX_eco_fund_bal_desc:0 "Ровное финансирование всего. Режим группы «Финансирование»: Баланс бюджета."
 PAX_eco_fund_mil:0 "Финансирование: Упор на военное"
 PAX_eco_fund_mil_desc:0 "Армия получает больше, стройки медленнее. Режим группы «Финансирование»: Упор на военное."
 PAX_eco_trade_open:0 "Торговля: Открытые рынки"
 PAX_eco_trade_open_desc:0 "Больше торговли, больше уважения за рубежом. Режим группы «Торговля»: Открытые рынки."
 PAX_eco_trade_mix:0 "Торговля: Выборочная торговля"
 PAX_eco_trade_mix_desc:0 "Торгуем с теми, с кем выгодно. Режим группы «Торговля»: Выборочная торговля."
 PAX_eco_trade_closed:0 "Торговля: Протекционизм"
 PAX_eco_trade_closed_desc:0 "Свои фабрики растут, чужие товары дороже. Режим группы «Торговля»: Протекционизм."
 PAX_eco_energy_fossil:0 "Энергетика и топливо: Нефть и уголь"
 PAX_eco_energy_fossil_desc:0 "Дёшево и быстро, но топлива уходит больше. Режим группы «Энергетика и топливо»: Нефть и уголь."
 PAX_eco_energy_atom:0 "Энергетика и топливо: Атомная энергия"
 PAX_eco_energy_atom_desc:0 "Дорогой старт, потом стабильная энергия. Режим группы «Энергетика и топливо»: Атомная энергия."
 PAX_eco_energy_green:0 "Энергетика и топливо: Зелёная энергия"
 PAX_eco_energy_green_desc:0 "Чистая сеть и меньше расходов на топливо. Режим группы «Энергетика и топливо»: Зелёная энергия."
 ITA_pax_romul:0 "Ромул Двести Пятый"
 ITA_pax_romul_desc:0 "Каждый правитель Ромеи при вступлении на престол берёт имя Ромул. Этот хранит печать с 1931 года и помнит, как в 1914 на башне появилась первая трещина."
 SPR_pax_hannon:0 "Суффет Ганнон Барка"
 SPR_pax_hannon_desc:0 "Глава Совета суффетов и хозяин Золотого Каравана. Говорит, что лучшая война та, на которой зарабатывают обе стороны."
 GRE_pax_pericles:0 "Архонт Перикл Талассидис"
 GRE_pax_pericles_desc:0 "Потомок моряков Талассии. Верит, что море помнит всё, даже то, что утонуло."
 FRA_pax_ambiorix:0 "Верховный друид Амбиорикс"
 FRA_pax_ambiorix_desc:0 "Глава Совета друидов. Каждую осень он сам собирает омелу в священной роще у столицы."
 ENG_pax_elinor:0 "Адмирал-президент Элинор Вейн"
 ENG_pax_elinor_desc:0 "Республика мореходов выбирает президента из капитанов. Вейн командовала флотом, который вернулся из Тумана Безымянных."
 GER_pax_arminius:0 "Рейхсканцлер Арминий Вальдгер"
 GER_pax_arminius_desc:0 "Ветеран окопов 1914 года. Обещает Рейху железо и уголь Севера и не верит в метели."
 SOV_pax_vseslav:0 "Царь Всеслав Ледяной"
 SOV_pax_vseslav_desc:0 "Северное Царство основали беглецы всех народов. Царь Всеслав говорит, что зима всегда на стороне того, кто дома."
 ROM_pax_decebal:0 "Царь Децебал Девятый"
 ROM_pax_decebal_desc:0 "Царь медных гор. Ромея брала с Дакии дань с 117 года, и Децебал этого не простил."
 TUR_pax_tengiz:0 "Каган Тенгиз"
 TUR_pax_tengiz_desc:0 "Избран курултаем кланов. Его предки вышли из песчаной бури в 375 году и дошли до самой башни."
 PER_pax_idanthyrsus:0 "Царь Иданфирс Второй"
 PER_pax_idanthyrsus_desc:0 "Курганный царь дальнего востока. Его казна это золото предков, а армия это конные лучники."
 ITA_pax_1962:0 "Ромул Двести Шестой"
 ITA_pax_1962_desc:0 "Приказал не ставить нового голема на пустой постамент: «Пусть все видят, что стражей больше нет»."
 SPR_pax_1962:0 "Суффет Гамилькар Магон"
 SPR_pax_1962_desc:0 "Глава Совета суффетов в годы Холодной войны."
 GRE_pax_1962:0 "Архонт Ирина Талассиду"
 GRE_pax_1962_desc:0 "Первая женщина-архонт Эллинской Республики."
 FRA_pax_1962:0 "Друид-канцлер Луэрн Арверн"
 FRA_pax_1962_desc:0 "Канцлер Конфедерации и хранитель старой рощи."
 ENG_pax_1962:0 "Адмирал-президент Томас Кейр"
 ENG_pax_1962_desc:0 "Капитан, который водил конвои Союза через Туман Безымянных."
 SOV_pax_1962:0 "Первый секретарь Ярослав Северин"
 SOV_pax_1962_desc:0 "Хозяин Курултая победителей. Его разведка ищет чертежи Ромеи."
 ROM_pax_1962:0 "Первый секретарь Буребиста Марин"
 ROM_pax_1962_desc:0 "Не простил Ромее старую дань и привёл Дакию в Пакт."
 TUR_pax_1962:0 "Каган Арслан"
 TUR_pax_1962_desc:0 "Каган Орды, который держит степь вместе с Севером."
 PER_pax_1962:0 "Царь Скопасис Третий"
 PER_pax_1962_desc:0 "Курганный царь, верный Курултаю."
 GER_pax_1962:0 "Председатель Отто Рейнвальд"
 GER_pax_1962_desc:0 "Разбитый Рейх стал вассалом Пакта, а потом его союзником."
 ITA_pax_2041:0 "Ромул Двести Тридцать Восьмой"
 ITA_pax_2041_desc:0 "Ромул, при котором проснулся Страж-7."
 SPR_pax_2041:0 "Суффет Элисса Барка"
 SPR_pax_2041_desc:0 "Глава Карфагена в эпоху роботов."
 GRE_pax_2041:0 "Архонт Никос Палейрас"
 GRE_pax_2041_desc:0 "Архонт Эллады в эпоху роботов."
 FRA_pax_2041:0 "Друид-канцлер Маэль Бриан"
 FRA_pax_2041_desc:0 "Канцлер, который отдал лаборатории друидов под Сеть."
 ENG_pax_2041:0 "Адмирал-президент Ада Морроу"
 ENG_pax_2041_desc:0 "Президент-мореход эпохи роботов."
 SOV_pax_2041:0 "Председатель Курултая Мирон Хольд"
 SOV_pax_2041_desc:0 "Человек, который дал Курултаю доступ ко всем заводам Пакта."
 ROM_pax_2041:0 "Председатель Децебал Стан"
 ROM_pax_2041_desc:0 "Глава Дакии эпохи роботов."
 TUR_pax_2041:0 "Каган Тимур Второй"
 TUR_pax_2041_desc:0 "Каган Орды эпохи роботов."
 PER_pax_2041:0 "Царь Ариапейт"
 PER_pax_2041_desc:0 "Скифский царь эпохи роботов."
 GER_pax_2041:0 "Председатель Карл Вендт"
 GER_pax_2041_desc:0 "Глава Германии в Пакте."
 ITA_pax_2096:0 "Ромул Двести Девяностый"
 ITA_pax_2096_desc:0 "Ромул при Протекторате Сети. Страж-7 говорит с ним каждый день."
 SPR_pax_2096:0 "Директор Ганна Барка-Седьмая"
 SPR_pax_2096_desc:0 "Генеральный директор Карт-Хадашт."
 GRE_pax_2096:0 "Директор Ксантиппа Нерей"
 GRE_pax_2096_desc:0 "Глава корпорации Талассо-Нет."
 FRA_pax_2096:0 "Директор Беленос Карно"
 FRA_pax_2096_desc:0 "Глава корпорации Друидикон."
 ENG_pax_2096:0 "Адмирал-президент Рэй Холлис"
 ENG_pax_2096_desc:0 "Островной Союз всё ещё выбирает президента из капитанов."
 SOV_pax_2096:0 "Царь Всеслав Двенадцатый"
 SOV_pax_2096_desc:0 "Цари вернулись на Север, когда Пакт распался."
 ROM_pax_2096:0 "Директор Залмокс Ионеску"
 ROM_pax_2096_desc:0 "Глава корпорации Сармизегетуза Майнинг."
 TUR_pax_2096:0 "Директор Тенгиз Нур"
 TUR_pax_2096_desc:0 "Глава корпорации Нео-Орда."
 PER_pax_2096:0 "Директор Атей Курган"
 PER_pax_2096_desc:0 "Глава корпорации Курган."
 GER_pax_2096:0 "Директор Арминия Вальд"
 GER_pax_2096_desc:0 "Глава корпорации Тевтобург Индастриз."
 pax.1.t:0 "Мир между Великими войнами"
 pax.1.d:0 "1936 год. Прошло восемнадцать лет после Первой Великой войны. В 1914 году молния ударила в Монолит на 0, 0, и на башне появилась первая трещина, ровно на уровне шестой строки. Из шести Стражей у входа пали четверо. Двое ещё стоят.\n\nНа западе Ромея, Карфаген, Эллада, Галлия и Островной Союз помнят клятву PAX. На востоке Германский Рейх считает обиды, Северное Царство ждёт зимы, а Дакия, Орда и Скифия смотрят на степь. Летописцы Форума пишут: «Законы всегда отстают от оружия».\n\nЭтот мир взят из лора сервера PaxVanila."
 pax.1.a:0 "Пусть всё будет записано."
 pax.2.t:0 "Договор у Монолита"
 pax.2.d:0 "[From.GetNameDefCap] зовёт нас в Союз PAX. Как в 251 году, державы запада обещают не воевать друг с другом и вместе хранить печать у башни."
 pax.2.a:0 "Мы даём клятву PAX."
 pax.2.b:0 "У нас свой путь."
 pax.3.t:0 "Курултай победителей"
 pax.3.d:0 "[From.GetNameDefCap] собирает восточные державы в степи. Так рождается Степной Пакт."
 pax.3.a:0 "Мы едем на Курултай."
 pax.3.b:0 "Степь подождёт."
 pax.10.t:0 "Гроза над Монолитом"
 pax.10.d:0 "Великие державы снова воюют. Снаряд разорвался у стен башни, и ещё один Страж пал. Летописцы Форума записали новую трещину в шестом ряду камней."
 pax.10.a:0 "Законы опять отстали от оружия."
 pax.11.t:0 "Стражей больше нет"
 pax.11.d:0 "У входа в Монолит остался только пустой постамент. Никто не знает, что глубоко под башней перед дверью в зал Печати стоит седьмой голем с медным сердцем. Ромейские инженеры уже ищут дорогу вниз."
 pax.11.a:0 "Печать трещит."
 pax.12.t:0 "Пробуждение"
 pax.12.d:0 "Ромейские инженеры спустились под Монолит и нашли седьмого голема. Когда к нему подвели ток, его глаза зажглись медным светом. Первое слово Стража-7 было «PAX»."
 pax.12.a:0 "Он помнит, как это заканчивается."
 pax.30.t:0 "За железом на север"
 pax.30.d:0 "Рейху мало земли. Железо и уголь Северного Царства лежат за границей. Генералы говорят, что армия успеет до снега. Летописцы Форума говорят, что зима всегда на стороне того, кто дома."
 pax.30.a:0 "Готовить войну с Севером."
 pax.30.b:0 "Подождать."
 pax.20.t:0 "Путеводитель PaxVanila"
 pax.20.d:0 "Выберите раздел путеводителя."
 pax.20.a:0 "Выйти"
 pax.21.d:0 "1936 год, между Первой и Второй Великими войнами. Десять держав лора сервера PaxVanila заняли страны Европы и Азии: Ромея, Карфаген, Эллада, Галлия и Островной Союз на западе, Германия, Северное Царство, Дакия, Орда и Скифия на востоке. Остальной мир это «Дальние земли».\n\nРазделы гайда: экономика и меню решений, технологии MD и армия, сценарии и эпохи, Монолит и Стражи.\n\nФокусы у держав из вашей сборки (CHADDFIXREBALANCE). Лорные ветки, наследие и вера вашей державы лежат в решениях, категория «Лор PaxVanila»."
 PAX_guide_category:0 "Путеводитель PaxVanila"
 PAX_guide_category_desc:0 "Как устроен этот мир и что даёт каждая ветка фокусов."
 PAX_open_guide:0 "Открыть путеводитель"
 PAX_open_guide_desc:0 "Короткая справка по моду."
 PAX_monolith_category:0 "Монолит"
 PAX_monolith_category_desc:0 "Все шесть Стражей у входа пали. Под башней кто-то ждёт."
 PAX_project_seven:0 "Проект «Седьмой»"
 PAX_project_seven_desc:0 "Спуститься под Монолит и разбудить седьмого голема."
 PAX_steal_blueprints:0 "Украсть чертежи Седьмого"
 PAX_steal_blueprints_desc:0 "Разведка Пакта знает, что Ромея разбудила машину. Мы построим свою и назовём её Курултай."
 PAX_faction_pax:0 "Союз PAX"
 PAX_faction_steppe:0 "Степной Пакт"
 pax_tech_tablets:0 "Таблички Предтеч"
 pax_tech_tablets_desc:0 "Учёные Ромеи и Эллады заново читают глиняные таблички Ур-Кадима."
 pax_tech_kaer_copper:0 "Медь Каэр-Тала"
 pax_tech_kaer_copper_desc:0 "Древние рудники Медного Союза дают медь и чертежи паровых машин."
 pax_tech_redstone:0 "Редстоун-машины"
 pax_tech_redstone_desc:0 "Медь, редстоун и уголь дали миру то, чего не знали даже Предтечи."
 pax_tech_star_shards:0 "Звёздные осколки"
 pax_tech_star_shards_desc:0 "Осколки звёздного дождя 1500 года наконец научились резать и плавить."
 pax_tech_copper_heart:0 "Медное сердце"
 pax_tech_copper_heart_desc:0 "Проект «Седьмой»: инженеры изучают сердце голема под Монолитом."
 pax_tech_copper_legions:0 "Медные легионы"
 pax_tech_copper_legions_desc:0 "Страж-7 строит армию медных големов. Теперь их умеют строить и люди."
 pax_tech_sculk_net:0 "Скалк-сеть"
 pax_tech_sculk_net_desc:0 "Скалк Народа Глубин передаёт сигналы. Корпорации строят на нём свою сеть."
 pax_tech_gates:0 "Врата по подписке"
 pax_tech_gates_desc:0 "Карт-Хадашт продаёт порталы в Незер всем, кто может платить."
