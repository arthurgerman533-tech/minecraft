 PAX_ROM_her:0 "Legacy: Copper of Caer-Tal"
 PAX_ROM_her_desc:0 "Dacia dug out the mines of the Copper Union to the very bottom."
 PAX_ROM_fai:0 "State Faith: Without Fear of Death"
 PAX_ROM_fai_desc:0 "Zalmoxis. The Dacians go into battle because they do not fear death."
 PAX_ROM_old_tribute:0 "The Old Tribute Is Not Forgotten"
 PAX_ROM_old_tribute_desc:0 "In 117 the mountains collapsed and hungry Dacia became the first vassal of Romea. The Dacians remember."
 PAX_ROM_sarmizegetusa:0 "Sarmizegetusa Mining"
 PAX_ROM_sarmizegetusa_desc:0 "The royal mines become a company. Copper goes to the factories."
 PAX_ROM_steam:0 "Steam Engines of Caer-Tal"
 PAX_ROM_steam_desc:0 "Blueprints of steam engines were found in the mines. The Age of Steel began with them."
 PAX_ROM_mountain_forts:0 "Mountain Fortresses"
 PAX_ROM_mountain_forts_desc:0 "The mountains of Dacia are a fortress in themselves."
 PAX_ROM_join_steppe:0 "A Voice at the Kurultai"
 PAX_ROM_join_steppe_desc:0 "Dacia has not forgiven Romea the old tribute and turns to the eastern powers."
 PAX_ROM_cw_watch:0 "Kurultai by the Campfire"
 PAX_ROM_cw_watch_desc:0 "Dacia. The Pact gathers every winter. We look at the tower from afar and wait."
