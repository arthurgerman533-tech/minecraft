 won.251.t:0 "Economic Hegemony"
 won.251.d:0 "Our sphere's influence has passed 80. Prices, credit and industry across our bloc now move to the rhythm of our ministries, and rival capitals speak of our sphere the way they once spoke of empires."
 won.251.a:0 "The world runs on our economy now."
