 # ---------------------------------------------------------------- Systems (national spirits)
 won_sys_1:0 "Капитализм невмешательства"
 won_sys_1_desc:0 "Пусть решает рынок. Низкие налоги и лёгкие правила ускоряют стройку и радуют инвесторов, но государство собирает меньше, а деловой цикл качается сильнее.\n\nОсобое решение: §YДерегулировать рынки§!."
 won_sys_2:0 "Кейнсианская смешанная экономика"
 won_sys_2_desc:0 "Государство вмешивается, когда падает спрос. Общественные работы сглаживают цикл, а дефицит вызывает лишь половину обычной инфляции.\n\nОсобое решение: §YПрограмма общественных работ§!."
 won_sys_3:0 "Социальная рыночная экономика"
 won_sys_3_desc:0 "Рынки с сеткой безопасности. Благосостояние держит общество спокойным и двигает науку, ценой высоких налогов и расходов.\n\nОсобое решение: §YЗакон о социальном страховании§!."
 won_sys_4:0 "Командная экономика"
 won_sys_4_desc:0 "Госплан ставит цели, фабрики их выполняют. Цены контролируются, инфляция низка, но рынки мало верят плановикам.\n\nОсобое решение: §YЗапустить пятилетку§!."
 won_sys_5:0 "Рыночный социализм"
 won_sys_5_desc:0 "Командные высоты остаются у государства, а мелкая торговля и сельское хозяйство отданы рынку. Гибкий компромисс.\n\nОсобое решение: §YВыдать концессии в аренду§!."
 won_sys_6:0 "Военный коммунизм"
 won_sys_6_desc:0 "Реквизировать всё, нормировать всё. Выпуск взлетает, тыл страдает, деньги теряют смысл.\n\nОсобое решение: §YКампания реквизиций§!."
 won_sys_7:0 "Корпоративизм"
 won_sys_7_desc:0 "Работодатели и рабочие сидят в государственных палатах, а решает государство. Порядок и политическая сила.\n\nОсобое решение: §YСозвать корпоративные палаты§!."
 won_sys_8:0 "Автаркия"
 won_sys_8_desc:0 "Нация, которой никто не нужен. Ресурсы выжимаются из родной земли, торговые соглашения отвергаются.\n\nОсобое решение: §YПрограмма производства эрзацев§!."
 won_sys_9:0 "Оборонная экономика"
 won_sys_9_desc:0 "Wehrwirtschaft: экономика как придаток армии. Оружейные фабрики растут быстро, потребители ждут.\n\nОсобое решение: §YВыпустить векселя «Мефо»§!."
 won_sys_10:0 "Государственный капитализм"
 won_sys_10_desc:0 "Государственные гиганты и тесная связь министерств с промышленностью.\n\nОсобое решение: §YНационализировать ключевые отрасли§!."
 won_sys_11:0 "Аграрная экономика"
 won_sys_11_desc:0 "Фермы кормят нацию и оплачивают её счета за рубежом. Общество стабильно, промышленность скромна.\n\nОсобые решения: §YАграрный экспортный рывок§! и §YЭлектрификация деревни§!."
 won_sys_12:0 "Меркантилизм"
 won_sys_12_desc:0 "Экспорт, судоходство и полная казна. Ещё два торговых соглашения, и каждое стоит на 50% больше.\n\nОсобые решения: §YЭкспортные субсидии§! и §YРасширить торговый флот§!."
 won_sys_fyp:0 "Пятилетка"
 won_sys_fyp_desc:0 "План должен быть выполнен. Цель: §Y[?won_fyp_target|0]§! фабрик (начинали с [?won_fyp_start|0])."
 won_economy:0 "Национальная экономика"
 won_economy_desc:0 "Текущее состояние нашей экономики, обновляется каждый месяц. Откройте §YМинистерство экономики§! (верхняя панель), чтобы узнать подробности."
