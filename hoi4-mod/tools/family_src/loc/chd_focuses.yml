 # Ireland
 IRE_plan_s:0 "Plan S"
 IRE_plan_s_desc:0 "Plan S is a plan set in motion purely by the IRA, who seek to sabotage the industries in Northern Ireland in objection of the Treaty forced upon us by the British back in the day."
 IRE_contiuation_of_plan_s:0 "Continuation of Plan S"
 IRE_contiuation_of_plan_s_desc:0 "Plan S is a plan set in motion purely by the IRA, who seek to sabotage the industries the United Kingdom in objection of what they consider unfair treatment by the British back in the day."
 IRE_days_betwen_plan_s_is_higher_than_100:0 "Days between time out of §YContinuation of Plan S§! is longer than §Y100§! days."
 IRE_the_treason_act:0 "The Treason Act"
 IRE_treason_act_achieved:0 "The Treason Act has been implemented."
 IRE_counteract_the_ira:0 "Counteract the IRA"
