 WON_TRADE_AGREEMENT_TITLE:0 "Предложить торговое соглашение"
 WON_TRADE_AGREEMENT_ACTION_DESC:0 "Открыть рынки друг для друга: дешевле потребительские товары (до §G-1,5%§!), ниже инфляция, доход от торговли и ВВП у обеих сторон. Партнёр засчитывается полностью, только если его экономика не меньше четверти нашей."
 won_trade_agreement:0 "Предложить торговое соглашение"
