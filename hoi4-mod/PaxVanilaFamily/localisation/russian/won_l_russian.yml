 won_open_dashboard:0 "Открыть экономическую панель"
 won_open_dashboard_desc:0 "Графики, политика, торговля и весь бюджет. Также открывается по цифре казны на верхней панели."
 won_reform_system:0 "Реформировать экономическую систему"
 won_reform_system_desc:0 "Выбрать новую экономическую систему, допустимую для нашей идеологии. Вызывает 120 дней перехода."
 won_stimulus_package:0 "Пакет стимулов"
 won_stimulus_package_desc:0 "Вливание денег в экономику: +10% строительства на 180 дней, большой прирост доверия, немного инфляции."
 won_austerity_budget:0 "Бюджет жёсткой экономии"
 won_austerity_budget_desc:0 "Сократить расходы, чтобы получить §Y[?won_c_mid|2] млрд§!. Доверие и стабильность страдают 180 дней."
 won_print_money:0 "Печатать деньги"
 won_print_money_desc:0 "Сразу получить §Y[?won_c_big|2] млрд§!. Цель инфляции +5 на целый год."
 won_issue_war_bonds:0 "Выпустить военные облигации"
 won_issue_war_bonds_desc:0 "Получить §Y[?won_c_mid|2] млрд§! от патриотичных вкладчиков и сплотить нацию."
 won_sell_gold:0 "Продать золотой запас"
 won_sell_gold_desc:0 "Получить §Y[?won_c_big|2] млрд§!, продав слитки. Рынки сочтут это признаком беды."
 won_devalue_currency:0 "Девальвировать валюту"
 won_devalue_currency_desc:0 "Дешевле экспорт, дороже импорт: +3% выпуска фабрик, +2% потребительских товаров на год, инфляция +2."
 won_restructure_debt:0 "Реструктурировать долг"
 won_restructure_debt_desc:0 "Заставить кредиторов принять списание 35%. Долг уменьшается, но на год наступает §RСуверенный дефолт§!."
 won_deregulate_markets:0 "Дерегулировать рынки"
 won_deregulate_markets_desc:0 "Отменить регулирование: +8% строительства на год и всплеск доверия."
 won_public_works_dec:0 "Программа общественных работ"
 won_public_works_dec_desc:0 "Сразу построить три уровня инфраструктуры и +25% скорости инфраструктуры на год."
 won_social_insurance_act:0 "Закон о социальном страховании"
 won_social_insurance_act_desc:0 "Пенсии и страхование от безработицы: +6% стабильности на год."
 won_five_year_plan:0 "Запустить пятилетку"
 won_five_year_plan_desc:0 "На два года: +15% строительства, +5% потребительских товаров. Рост общего числа фабрик на 15% (не менее 5). Успех даёт +10% выпуска фабрик на два года, провал приводит к чисткам."
 won_lease_concessions_dec:0 "Выдать арендные концессии"
 won_lease_concessions_dec_desc:0 "Сдать заводы в аренду иностранным фирмам за §Y[?won_c_mid|2] млрд§! и их ноу-хау. Партийные пуристы ворчат."
 won_requisition_campaign:0 "Кампания реквизиций"
 won_requisition_campaign_desc:0 "Изъять товаров на §Y[?won_c_mid|2] млрд§! и сильнее нажать на фабрики, дорогой ценой для стабильности."
 won_corporate_chambers:0 "Созвать корпоративные палаты"
 won_corporate_chambers_desc:0 "Палаты определят экономическую политику на ближайший год. Чью сторону займёт государство?"
 won_ersatz_drive:0 "Программа производства эрзацев"
 won_ersatz_drive_desc:0 "Синтетическое топливо и заменители материалов: +20% ресурсов на год."
 won_mefo_bills:0 "Выпустить векселя «Мефо»"
 won_mefo_bills_desc:0 "Получить §Y[?won_c_big|2] млрд§! дважды через подставную компанию. Через год наступает срок по векселям с 20% процентов. Неплатёж приводит к §RСуверенному дефолту§! и запрещает новые векселя на три года."
 won_nationalize_industry:0 "Национализировать ключевые отрасли"
 won_nationalize_industry_desc:0 "Передать командные высоты в руки государства: постоянный доход 0,2% ВВП в месяц и больше политической силы. Каждый иностранный инвестор здесь теряет свою долю и в ярости."
 won_agri_export_drive:0 "Аграрный экспортный рывок"
 won_agri_export_drive_desc:0 "Продать урожай за рубеж за §Y[?won_c_mid|2] млрд§!."
 won_rural_electrification:0 "Электрификация деревни"
 won_rural_electrification_desc:0 "Провести электричество в сельскую местность: +6% строительства на год."
 won_export_subsidies:0 "Экспортные субсидии"
 won_export_subsidies_desc:0 "На год каждое торговое соглашение приносит на 50% больше."
 won_merchant_marine_dec:0 "Расширить торговый флот"
 won_merchant_marine_dec_desc:0 "+10% выпуска верфей на год."
 won_fund_factory:0 "Профинансировать государственную фабрику"
 won_fund_factory_desc:0 "Сразу построить гражданскую фабрику в одном из наших коренных штатов. Каждая покупка удорожает следующую (до 4 млрд)."
 won_fund_railways:0 "Профинансировать железные и автомобильные дороги"
 won_fund_railways_desc:0 "Два уровня инфраструктуры, построенные сразу."
 won_hire_consortium:0 "Заказать строительный консорциум"
 won_hire_consortium_desc:0 "+15% скорости строительства на 180 дней."
 won_hire_consultants:0 "Привлечь промышленных консультантов"
 won_hire_consultants_desc:0 "+8% к пределу эффективности производства и +10% к росту эффективности на 180 дней."
 won_hire_institute:0 "Профинансировать договорные научные институты"
 won_hire_institute_desc:0 "+5% скорости исследований на 180 дней."
 won_hire_prospectors:0 "Нанять геологоразведочную компанию"
 won_hire_prospectors_desc:0 "Обследовать наши коренные земли в течение 90 дней. Они могут найти нефть, сталь или более редкие руды. Каждая находка снижает вероятность следующей (55%, затем 43%, 31%... но не ниже 10%)."
 won_world_contracts:0 "Продать инженерные услуги за рубеж"
 won_world_contracts_desc:0 "Сдать две гражданские фабрики мировому рынку на 180 дней. Они приносят 0,4% ВВП в месяц (от 0,03 до 0,12 млрд)."
