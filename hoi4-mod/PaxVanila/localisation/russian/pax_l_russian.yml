 PAX_faction_steppe:0 "Степной Пакт"
 pax_tech_tablets:0 "Таблички Предтеч"
 pax_tech_tablets_desc:0 "Учёные Ромеи и Эллады заново читают глиняные таблички Ур-Кадима."
 pax_tech_kaer_copper:0 "Медь Каэр-Тала"
 pax_tech_kaer_copper_desc:0 "Древние рудники Медного Союза дают медь и чертежи паровых машин."
 pax_tech_redstone:0 "Редстоун-машины"
 pax_tech_redstone_desc:0 "Медь, редстоун и уголь дали миру то, чего не знали даже Предтечи."
 pax_tech_star_shards:0 "Звёздные осколки"
 pax_tech_star_shards_desc:0 "Осколки звёздного дождя 1500 года наконец научились резать и плавить."
 pax_tech_copper_heart:0 "Медное сердце"
 pax_tech_copper_heart_desc:0 "Проект «Седьмой»: инженеры изучают сердце голема под Монолитом."
 pax_tech_copper_legions:0 "Медные легионы"
 pax_tech_copper_legions_desc:0 "Страж-7 строит армию медных големов. Теперь их умеют строить и люди."
 pax_tech_sculk_net:0 "Скалк-сеть"
 pax_tech_sculk_net_desc:0 "Скалк Народа Глубин передаёт сигналы. Корпорации строят на нём свою сеть."
 pax_tech_gates:0 "Врата по подписке"
 pax_tech_gates_desc:0 "Карт-Хадашт продаёт порталы в Незер всем, кто может платить."
