 PAX_GRE_fai:0 "State Faith: Poseidon"
 PAX_GRE_fai_desc:0 "The gods of Olympus. The sea god guards the ships of Hellas."
 PAX_GRE_thalassia:0 "Legacy of Thalassia"
 PAX_GRE_thalassia_desc:0 "A hundred islands of the Western Sea went under the water, but their ship blueprints remained with the Hellenes."
 PAX_GRE_academy:0 "Academy of Hellas"
 PAX_GRE_academy_desc:0 "Plato and Aristotle compiled the list of everything. The Academy continues their work."
 PAX_GRE_isles:0 "Islands of the League"
 PAX_GRE_isles_desc:0 "Every island of the League builds its own shipyard."
 PAX_GRE_hoplites:0 "Hoplites of Olympus"
 PAX_GRE_hoplites_desc:0 "The hoplite phalanx now holds rifles."
 PAX_GRE_join_pax:0 "A Seat in the PAX Union"
 PAX_GRE_join_pax_desc:0 "Hellas has always stood beside Romea. It is time to say it out loud."
 PAX_GRE_cw_watch:0 "Tower Watch"
 PAX_GRE_cw_watch_desc:0 "Hellas. A hundred years ago we swore the oath of PAX. Now our guard stands at the tower every day."
 PAX_GRE_cw_intel:0 "Obsidian Reconnaissance"
