 won_cat_economy:0 "Министерство экономики"
 won_cat_economy_desc:0 "Экономика: §Y[GetWonPhase]§!   ВВП §Y[?won_gdp|1] млрд§! ([?won_growth_y|+1]%)\nКазна [?won_treasury|+1] млрд   Инфляция [?won_inflation|1]%   Доверие [?won_confidence|0]\nСистема: §Y[GetWonSystem]§!\n\nПолная панель открывается по цифре казны на верхней панели."
 won_cat_business:0 "Бизнес и контракты"
 won_cat_business_desc:0 "Тратьте казну на фабрики, железные дороги и частные фирмы или продавайте труд наших инженеров за рубеж.\nКазна: [?won_treasury|+1] млрд"
