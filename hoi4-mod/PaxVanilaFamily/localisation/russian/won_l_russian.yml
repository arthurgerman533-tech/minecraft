 won_sp_minn3:0 "Плановик"
 won_sp_dir1_tt:0 "§YЭкономическое сотрудничество§!\nДо §G+8%§! производительности и §G-3§! инфляции для каждого члена, §G+10§! влияния. Выпуск вооружений §R-3%§!."
 won_sp_dir2_tt:0 "§YСбалансированная§!\nДо §G+4%§! производительности и §G-1,5§! инфляции для каждого члена, §G+5§! влияния."
 won_sp_dir3_tt:0 "§YСовместное перевооружение§!\nДо §G+6%§! выпуска вооружений для каждого члена. Производительность §R-2%§!, цель по инфляции §R+0,5§!."
 won_sp_min1_tt:0 "§YИндустриалист§!\nСтроительство §G+4%§!, до §G+10%§! с влиянием, для каждого члена. §G+5§! влияния."
 won_sp_min2_tt:0 "§YФинансист§!\nИнвестиционный климат §G+5§! и цель по инфляции §G-1§! для каждого члена. §G+5§! влияния."
 won_sp_min3_tt:0 "§YПлановик§!\nТорговые соглашения §G+10%§! и доход от экспорта ресурсов §G+25%§! для каждого члена. §G+5§! влияния."
