 won_bank_crisis:0 "Banking Crisis"
 won_bank_crisis_desc:0 "Credit has frozen."
 won_war_bonds:0 "War Bonds"
 won_war_bonds_desc:0 "Buy a bond, back the boys."
 won_agri_exports:0 "Agricultural Exports"
 won_agri_exports_desc:0 "Our farms feed foreign cities."
 won_export_drive:0 "Export Subsidies"
 won_export_drive_desc:0 "Trade agreements earn 50% more while subsidies last."
 won_nationalized:0 "Nationalised Industry"
 won_nationalized_desc:0 "Key industries belong to the state and pay it 0.2% of GDP every month."
 won_hyperinflation:0 "Hyperinflation"
 won_hyperinflation_desc:0 "Banknotes are worth less than the paper they are printed on."
 won_public_works:0 "Public Works"
 won_public_works_desc:0 "Roads, dams and railways put men back to work."
 won_corporate_industry:0 "Industrialists Favoured"
 won_corporate_industry_desc:0 "The chambers sided with the employers."
 won_corporate_labour:0 "Labour Favoured"
 won_corporate_labour_desc:0 "The chambers sided with the workers."
 won_corporate_state:0 "State Supremacy"
 won_corporate_state_desc:0 "The chambers obey the state."
 won_lease_concessions:0 "Lease Concessions"
 won_lease_concessions_desc:0 "Foreign firms operate state plants under lease."
 won_world_fair:0 "World's Fair"
 won_world_fair_desc:0 "The world came to see the future, and saw us."
 won_devaluation:0 "Devalued Currency"
 won_devaluation_desc:0 "Exports are cheap, imports are dear."
 won_entrepreneur:0 "Inventor's Breakthrough"
 won_entrepreneur_desc:0 "A new process is spreading through our factories."
 won_industrial_accident:0 "Industrial Disaster"
