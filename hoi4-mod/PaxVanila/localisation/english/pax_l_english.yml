 pax.20.f:0 "Scenarios and eras"
 pax.20.g:0 "The Monolith and the Guardians"
 pax.24.t:0 "Guide: scenarios and eras"
 pax.24.d:0 "Two scenarios are available at start: '1936' (the whole world) and '1936 without Asia' (a small world, the far east is switched off). Other eras are in the mod but hidden from the list: 1241 'Blizzard', 1914 'First Great War', 1939, 1962, 2041, 2096.\n\nEach era places rulers, blocs and the number of living Guardians differently. In late eras the lore powers get decision branches: cold war, robots, corporations. All branches are in the decisions tab, category 'PaxVanila Lore': heritage, state faith and national decisions of your power."
 pax.25.t:0 "Guide: the Monolith and the Guardians"
 pax.25.d:0 "The Monolith stands at 0, 0. Six Guardians once stood at its gate, and by 1936 two are left. When two great powers go to war, one Guardian falls and a new crack appears. When all have fallen, Romea can start the project 'Guardian-7' (a decision, 150 political power) and wake the seventh golem with a copper heart under the tower. After that the Northern Kingdom gets the decision 'Steal the blueprints'.\n\nBlocs: Romea gathers the PAX Union, the Northern Kingdom gathers the Steppe Pact. Rulers and country names are in the scenario description."
 pax.21.t:0 "Guide to the World"
 pax.22.t:0 "Guide to the Economy"
 pax.22.d:0 "PaxVanila's economy has two parts: Family laws and an 'Economy' menu in the spirit of Millennium Dawn.\n\nLAWS (politics tab). 'Civilian economy' gives +30% civilian factory construction speed and +25% infrastructure. When factories are done, move to war economy: it speeds up military factories and dockyards. 'Free trade' is strengthened, 'Closed economy' is changed.\n\nECONOMY MENU (decisions tab). Four groups of three modes, one active in each, switching costs 25 political power: taxes (low, moderate, high), funding (civilian, balanced, military), trade (open markets, selective, protectionism), energy and fuel (oil and coal, nuclear, green). This is a simplification of MD: there is no budget or power grid, modes only give modifiers.\n\nFOCUSES are twice as fast as vanilla (3.5 days per point instead of 7)."
 pax.23.t:0 "Guide: MD technologies and army"
 pax.23.d:0 "MD TECHNOLOGIES. 111 technologies from Millennium Dawn (industry, infantry, electronics) are bought in decisions for political power, in three 'MD technologies' categories. Cost starts at 25 and grows with the technology year, the effect is permanent. In the 2041 and 2096 eras the lore powers get them by default. Family VI technologies are in the normal research tree, in the 'Industry' folder.\n\nARMY. While there is no war, everyone has the 'Peaceful Sky' spirit: training is twice as fast, air and navy train without losses. It disappears with the first war. Templates change for free, experience accumulates up to 9999. Family support companies (snipers, mortars, dogs, flamethrowers, flame tanks) are open to everyone from the start."
