 won.100.t:0 "Засуха"
 won.100.d:0 "Уже несколько недель не было дождя. Пшеница вянет на полях, а цена хлеба растёт с каждым рыночным днём.\n\nПрограмма субсидий фермерам и зерновых резервов сделала бы такие кризисы реже и легче."
 won.100.dp:0 "Уже несколько недель не было дождя. Пшеница вянет на полях, а цена хлеба растёт с каждым рыночным днём.\n\nНаша программа субсидий фермерам и зерновых резервов готова именно к такому случаю."
 won.100.a:0 "Субсидии фермерам: открыть государственные зернохранилища."
 won.100.b:0 "Импортировать зерно любой ценой."
 won.100.c:0 "Ужесточить пайки и молиться о дожде."
 won.101.t:0 "Болезнь посевов"
 won.101.d:0 "Грибок поражает картофель и зерновые в нескольких провинциях. Агрономы говорят, что урожай может быть потерян целиком.\n\nПрограмма субсидий фермерам и зерновых резервов сделала бы такие кризисы реже и легче."
 won.101.dp:0 "Грибок поражает картофель и зерновые в нескольких провинциях. Агрономы говорят, что урожай может быть потерян целиком.\n\nНаша программа субсидий фермерам и зерновых резервов готова именно к такому случаю."
 won.101.a:0 "Субсидии фермерам: субсидируемая пересадка здоровыми семенами."
 won.101.b:0 "Сжечь поля и пересадить."
 won.101.c:0 "Пусть фермеры справляются сами."
 won.102.t:0 "Эпизоотия"
 won.102.d:0 "Ящур распространяется от фермы к ферме. Каждое заражённое стадо необходимо уничтожить, иначе эпидемия захлестнёт всю страну.\n\nПрограмма субсидий фермерам и зерновых резервов сделала бы такие кризисы реже и легче."
 won.102.dp:0 "Ящур распространяется от фермы к ферме. Каждое заражённое стадо необходимо уничтожить, иначе эпидемия захлестнёт всю страну.\n\nНаша программа субсидий фермерам и зерновых резервов готова именно к такому случаю."
 won.102.a:0 "Субсидии фермерам: государственные ветеринары и компенсации фермерам."
 won.102.b:0 "Приказать массовый забой."
 won.102.c:0 "Замять дело."
 won.103.t:0 "Фермеры идут на столицу"
 won.103.d:0 "Цены на зерно упали ниже себестоимости. Тысячи фермеров с тракторами блокируют дороги в столицу.\n\nПрограмма субсидий фермерам и зерновых резервов сделала бы такие кризисы реже и легче."
 won.103.dp:0 "Цены на зерно упали ниже себестоимости. Тысячи фермеров с тракторами блокируют дороги в столицу.\n\nНаша программа субсидий фермерам и зерновых резервов готова именно к такому случаю."
 won.103.a:0 "Гарантировать цены: ввести субсидии фермерам немедленно."
 won.103.b:0 "Пообещать реформы позже."
 won.103.c:0 "Расчистить дороги силами полиции."
 won.104.t:0 "Голод"
 won.104.d:0 "Плохие урожаи обернулись голодом. Деревни пустеют, семьи идут в города в поисках хлеба.\n\nПрограмма субсидий фермерам и зерновых резервов сделала бы такие кризисы реже и легче."
 won.104.dp:0 "Плохие урожаи обернулись голодом. Деревни пустеют, семьи идут в города в поисках хлеба.\n\nНаша программа субсидий фермерам и зерновых резервов готова именно к такому случаю."
 won.104.a:0 "Экстренная продовольственная помощь любой ценой."
 won.104.b:0 "Реквизировать зерно у фермеров."
 won.104.c:0 "Обратиться за международной помощью."
 won.105.t:0 "Тракторы для ферм"
 won.105.d:0 "Производитель техники предлагает тракторы и комбайны по оптовой цене. Одна машина заменяет двадцать работников."
 won.105.a:0 "Купить для кооперативов."
 won.105.b:0 "Не сейчас."
 won.106.t:0 "Исход из деревни"
 won.106.d:0 "Молодёжь уезжает из деревень на фабрики в городах. Фабрики довольны, городские советы — нет."
 won.106.a:0 "Построить рабочее жильё."
 won.106.b:0 "Пусть города разбираются сами."
 won.110.t:0 "Забастовка докеров"
 won.110.d:0 "Грузчики вышли на забастовку. Корабли скапливаются на рейде, а грузы гниют на причалах.\n\nПрограмма совета по трудовым отношениям сделала бы такие кризисы реже и легче."
 won.110.dp:0 "Грузчики вышли на забастовку. Корабли скапливаются на рейде, а грузы гниют на причалах.\n\nНаша программа совета по трудовым отношениям готова именно к такому случаю."
 won.110.a:0 "Совет по трудовым отношениям: совет добивается соглашения."
 won.110.b:0 "Выполнить их требования."
 won.110.c:0 "Отправить флот разгружать."
 won.110.e:0 "Переждать."
 won.111.t:0 "Забастовка шахтёров"
 won.111.d:0 "Угольные и рудные шахтёры бросили работу из-за зарплат и безопасности. Без них печи скоро остынут.\n\nПрограмма совета по трудовым отношениям сделала бы такие кризисы реже и легче."
 won.111.dp:0 "Угольные и рудные шахтёры бросили работу из-за зарплат и безопасности. Без них печи скоро остынут.\n\nНаша программа совета по трудовым отношениям готова именно к такому случаю."
 won.111.a:0 "Совет по трудовым отношениям: совет добивается соглашения."
 won.111.b:0 "Повысить им зарплаты."
 won.111.c:0 "Объявить локаут."
 won.112.t:0 "Профсоюзы требуют признания"
 won.112.d:0 "Федерация профсоюзов хочет национальное коллективное соглашение: признанные профсоюзы, фиксированные переговоры о зарплатах, никаких стихийных забастовок."
 won.112.a:0 "Совет по трудовым отношениям: подписать национальное соглашение."
 won.112.b:0 "Признать профсоюзы."
 won.112.c:0 "Отказать."
 won.113.t:0 "Нехватка рабочей силы"
 won.113.d:0 "Когда столько мужчин на фронте, заводы не могут укомплектовать смены."
 won.113.a:0 "Привлечь женщин в промышленность."
 won.113.b:0 "Повысить зарплаты, чтобы привлечь рабочих."
