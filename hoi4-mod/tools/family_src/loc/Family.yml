 modern_fire_control_system:0 "Современная система управления огнём"
 modern_fire_control_system_desc:0 "Вводя курс, скорость и расстояние до цели, современный механический компьютер может более точно предсказать, где будет находиться цель, когда будет готов следующий залп."

 modern_decryption:0 "Дешифрование - Анализ блочного шифра"
 modern_decryption_desc:0 "Анализ блочного шифра - это метод, используемый для взлома зашифрованных сообщений путем анализа закономерностей блоков символов в сообщении. Определяя общие закономерности и используя статистический анализ, можно расшифровать шифр, раскрывая исходное сообщение."

 modern_encryption:0 "Шифрование - Продвинутый стандарт шифрования"
 modern_encryption_desc:0 "AES - это широко используемый симметричный алгоритм шифрования, считающийся безопасным и используемый для защиты конфиденциальных данных. Он работает с фиксированными блоками размером 128 бит и переменным размером ключа - 128, 192 или 256 бит. AES принят многими организациями и применяется в различных областях, включая файловое шифрование, шифрование дисков и безопасную связь."

 concentrated_industry6:0 "Концентрированная промышленность VI"
 concentrated_industry6_desc:0 "Произошли значительные прорывы в автоматизации и эффективности производства. Благодаря передовым технологиям и усовершенствованным процессам удается значительно снизить издержки и увеличить выпуск. Этот новый уровень автоматизации позволяет вести упорядоченные и эффективные операции, давая вашей отрасли конкурентное преимущество на мировом рынке."

 dispersed_industry6:0 "Рассредоточенная промышленность VI"
 dispersed_industry6_desc:0 "Интеграция передовых технологий и безопасной связи улучшает защиту промышленности, делая её невозможной для обнаружения и уничтожения воздушными атаками, что обеспечивает успешное ведение операций."
 
 modern_equipment_conversion:0 "Современная модернизация оборудования"
 modern_equipment_conversion_desc:0 "С использованием современных процессов переоснащения и специализированных команд можно быстро и эффективно обновлять устаревшее оружие и технику до последних стандартов."

 improved_modern_oil_processing:0 "Улучшенная современная переработка нефти"
 improved_modern_oil_processing_desc:1 "Наши нефтеперерабатывающие заводы могут быть модернизированы с использованием передовых методов, таких как термический крекинг и деасфальтизация растворителями, для увеличения выхода и повышения эффективности."

 flexible_line2:0 "Улучшенная гибкая линия"
 flexible_line2_desc:0 "Передовые технологии автоматизации и робототехники повышают адаптивность людей в производстве, обеспечивая рост эффективности и быструю реакцию на изменения. Это значительно повышает конкурентоспособность промышленности."

 streamlined_line2:0 "Улучшенная упорядоченная линия"
 streamlined_line2_desc:0 "Передовые технологии автоматизации и робототехники увеличивают стандартизацию, структуру, безопасность и эффективность производства, что приводит к значительному повышению конкурентоспособности."

 construction6:0 "Строительство VI"
 construction6_desc:0 "Строительный процесс оптимизирован с использованием новейших технологий и достижений в области проектного планирования, что приводит к более быстрым, надежным и эффективным результатам с меньшими отходами."

 excavation6:0 "Разработка VI"
 excavation6_desc:0 "Добыча ресурсов становится более эффективной и устойчивой благодаря использованию передовых технологий автоматизации и робототехники, что позволяет добывать больше с меньшими отходами и меньшим воздействием на окружающую среду."

 improved_modern_rubber_processing:0 "Улучшенная современная переработка резины"
 improved_modern_rubber_processing_desc:1 "Процессы полимеризации оптимизированы с использованием новейших технологий, что снижает затраты и увеличивает объемы производства, делая отрасль по переработке резины более эффективной и производительной."


 
 