 # ---------------------------------------------------------------- events
 won.51.t:0 "Foreign Arms Maker"
 won.51.d:0 "An armaments firm from [?global.won_ev_partner_name.GetNameDef] wants to build a modern weapons plant in our country with its own capital. It would pay us corporate tax and send part of the profits home every month."
 won.51.a:0 "Welcome the arms plant."
 won.51.b:0 "We build our own weapons."
 won.52.t:0 "Foreign Shipbuilders"
 won.52.d:0 "A shipbuilding consortium from [?global.won_ev_partner_name.GetNameDef] wants to open a yard on our coast with its own money, paying us corporate tax and sending part of its profits home."
 won.52.a:0 "Welcome the shipyard."
 won.52.b:0 "Our coast is not for sale."
 won.200.t:0 "Supply Contract Request"
 won.200.d:0 "The government of [?global.won_ev_partner_name.GetNameDef] wants a supply contract: [GetWonPackage] delivered in six monthly shipments of half that size, paying [?won_pkg_rev|2] bn for each delivery when it arrives.\n\nSigning needs a free contract slot ([?won_sc_count|0] of [?won_sc_max|0] in use) and twice one package in stock."
 won.200.a:0 "Sign it: [?won_pkg_rev|2] bn per delivery."
 won.200.b:0 "Ask for [?won_pkg_rev_hi|2] bn per delivery."
 won.200.c:0 "Decline."
 won.201.t:0 "What Shall We Deliver?"
 won.201.d:0 "[?global.won_ev_partner_name.GetNameDef] has agreed to a supply contract. Choose what we deliver every month for six months. Each delivery is paid when it arrives."
 won.201.a:0 "750 rifles a month ([?won_p1|2] bn each)."
 won.201.b:0 "125 artillery pieces a month ([?won_p2|2] bn each)."
 won.201.c:0 "125 support sets a month ([?won_p3|2] bn each)."
 won.201.e:0 "125 anti-tank guns a month ([?won_p4|2] bn each)."
 won.201.f:0 "125 anti-air guns a month ([?won_p5|2] bn each)."
 won.201.g:0 "200 trucks a month ([?won_p6|2] bn each)."
 won.201.x:0 "On second thought, no contract."
 won.202.t:0 "Licence Request"
 won.202.d:0 "[?global.won_ev_partner_name.GetNameDef] wants a licence to build our [GetWonLicence] in its own factories. They offer [?won_lic_fee|2] bn now and royalties of 0.015 bn a month for two years."
 won.202.a:0 "Grant the licence."
 won.202.b:0 "Demand [?won_lic_fee_hi|2] bn."
 won.202.c:0 "Our designs stay ours."
 won.203.t:0 "Which Design?"
 won.203.d:0 "[?global.won_ev_partner_name.GetNameDef] will pay [?won_lic_fee|2] bn now and royalties for two years. Choose the design we license."
 won.203.a:0 "Rifles."
 won.203.b:0 "Artillery."
 won.203.c:0 "Support equipment."
 won.203.e:0 "Anti-tank guns."
 won.203.f:0 "Anti-air guns."
 won.203.g:0 "Trucks."
 won.203.h:0 "Light tanks."
 won.203.i:0 "Medium tanks."
 won.203.j:0 "Fighters."
 won.203.x:0 "On second thought, no licence."
 won.205.t:0 "Surplus Equipment Sale"
 won.205.d:0 "Brokers on the world market will take our surplus off our hands for cash at once, at about 60% of what a supply contract would pay. Choose what to sell."
 won.205.a:0 "1,500 rifles for [?won_d1|2] bn."
 won.205.b:0 "250 artillery pieces for [?won_d2|2] bn."
 won.205.c:0 "250 support sets for [?won_d3|2] bn."
 won.205.e:0 "250 anti-tank guns for [?won_d4|2] bn."
 won.205.f:0 "250 anti-air guns for [?won_d5|2] bn."
 won.205.g:0 "400 trucks for [?won_d6|2] bn."
 won.205.x:0 "Keep everything."
 won_tt_one_contract:0 "They do not already have a supply contract with us."
 won_tt_contract_cap:0 "We run fewer supply contracts than our agency can handle (§Y[?won_sc_count|0]/[?won_sc_max|0]§!; +1 per 25 reputation, up to 6)."
 WON_END_ARMS_CONTRACT_TITLE:0 "End Arms Contract"
 WON_END_ARMS_CONTRACT_ACTION_DESC:0 "Stop the monthly deliveries to them. Their opinion of us and our arms reputation suffer."
 won_end_arms_contract:0 "End Arms Contract"
 won_end_arms_contract_send:0 "Stop supplying them? They will not forget it."
 won_contract_broken:0 "Broke an arms contract"
 won.210.t:0 "Supply Contract Completed"
 won.210.d:0 "The last shipment of [GetWonPackage] has reached [?global.won_ev_partner_name.GetNameDef], and they paid [?won_pkg_rev|2] bn for every delivery. Their procurement office asks what comes next.\n\nRenewing needs a free contract slot and enough stock for the first deliveries."
 won.210.a:0 "Renew on the same terms ([?won_pkg_rev|2] bn per delivery)."
 won.210.b:0 "Renew, but at [?won_pkg_rev_hi|2] bn per delivery."
 won.210.c:0 "Offer them a different package."
 won.210.e:0 "Let the contract end."
 won.212.t:0 "Arms Contract Cancelled"
 won.212.d:0 "Our stockpile could not cover two deliveries in a row, so [?global.won_ev_partner_name.GetNameDef] has cancelled its supply contract. Buyers talk to each other: our arms reputation has suffered."
 won.212.a:0 "We must keep more in stock."
 won_trade_office:0 "Foreign Trade Office ([?won_q_count|0] waiting)"
 won_trade_office_desc:0 "Every request from abroad waits here instead of interrupting you: supply contract offers, licence requests, foreign investors and contracts up for renewal. Requests wait up to three months.\n\nThe office is also where you sell surplus, host arms fairs and offer export credit guarantees."
 won_tt_tray_room:0 "The Foreign Trade Office has room for another request (at most 5 wait at once)."
 won.201.l:0 "Sell them a production licence instead."
 won.220.t:0 "Foreign Trade Office"
 won.220.d:0 "Requests waiting: [?won_q_count|0]\n\nMarket Standing: [GetAonTierName] ([?aon_rep|0]). We are [GetWonCourtStatus].\nInternational Market: selling [?aon_exp_n|0] contracts, buying [?aon_imp_n|0]; market cash [?won_mkt_income|2] bn last month.\nSupply contracts: [?won_sc_count|0] of [?won_sc_max|0], paying [?won_sc_income|2] bn last month.\n[GetWonRivalLine]\nTechnical Insight: [?aon_insight|0]. Investment climate: [?won_climate|0] of 100.\n\nExhibitions open at Regional Arms Supplier, export credits at Established Arms Exporter."
 won.220.a:0 "Review the next request ([?won_q_count|0] waiting)."
 won.220.b:0 "Sell surplus equipment for cash."
 won.220.c:0 "Host an international arms exhibition ([?won_c_small|2] bn)."
 won.220.e:0 "Offer export credit guarantees for 180 days ([?won_c_mid|2] bn)."
 won.220.x:0 "Close the office."
 won.220.h:0 "Show foreign requests as pop-ups the moment they arrive."
 won.220.i:0 "Keep foreign requests waiting here in the office instead of popping up."
 won.219.t:0 "The Foreign Trade Office Opens"
 won.219.d:0 "A foreign request has reached our ministries for the first time. From now on, every offer from abroad will wait at the Foreign Trade Office instead of interrupting the cabinet: supply contracts, licence requests, foreign investors and contracts up for renewal.\n\nYou will find it at the top of the Global Markets decisions, with the number of requests waiting. Requests that wait more than three months lapse."
 won.219.a:0 "Open the office now."
 won.219.b:0 "Later."
 won.220.s:0 "Study the equipment we bought abroad (40 Technical Insight)."
 won.220.f:0 "Court foreign buyers on the International Market."
 won.220.g:0 "Stop courting foreign buyers."
 won_tt_study:0 "Technical Insight: §R-40§!. Our engineers pick a field to study."
 won_tt_court_on:0 "AI nations will prefer our listings on the International Market. Expect more purchase requests."
 won_tt_court_off:0 "AI nations stop preferring our listings. Fewer purchase requests."
