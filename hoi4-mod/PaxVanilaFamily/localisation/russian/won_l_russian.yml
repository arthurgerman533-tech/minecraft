 won_tt_prog_safety:0 "Запускает §Yинспекцию промышленной безопасности§!: §R-[?won_c_prog_safety|2] млрд§! ежемесячно, §G+1% к пределу эффективности производства§! и защита от промышленных катастроф, обрушений шахт, пожаров на заводах, отключений электричества и железнодорожных аварий."
 won_prog_health_start:0 "Финансировать: служба общественного здравоохранения"
 won_prog_health_start_desc:0 "Клиники, кампании вакцинации и санитарные инспекторы в каждом городе.\n\nСтоит §Y[?won_c_prog_health|2] млрд§! в месяц (0,15% ВВП). Пассивно: §G+1% стабильности§!.\n§GЗащищает от:§! эпидемий, тифа и вспышек болезней в трущобах."
