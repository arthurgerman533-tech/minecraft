 won_open_0:0 "Closed"
 won_open_1:0 "Open"
 # ---------------------------------------------------------------- Systems (national spirits)
 won_sys_1:0 "Laissez-Faire Capitalism"
 won_sys_1_desc:0 "Let the market decide. Low taxes and light rules make building fast and investors happy, but the state collects less and the business cycle swings harder.\n\nSignature decision: §YDeregulate the Markets§!."
 won_sys_2:0 "Keynesian Mixed Economy"
 won_sys_2_desc:0 "The state steps in when demand fails. Public works smooth the cycle and deficits cause only half the usual inflation.\n\nSignature decision: §YPublic Works Programme§!."
 won_sys_3:0 "Social Market Economy"
 won_sys_3_desc:0 "Markets with a safety net. Welfare keeps society calm and research flowing, at the price of higher taxes and spending.\n\nSignature decision: §YSocial Insurance Act§!."
 won_sys_4:0 "Command Economy"
 won_sys_4_desc:0 "Gosplan sets the targets and the factories meet them. Prices are controlled, so inflation stays low, but markets have little faith in planners.\n\nSignature decision: §YLaunch a Five-Year Plan§!."
 won_sys_5:0 "Market Socialism"
 won_sys_5_desc:0 "The commanding heights stay with the state; small trade and farming are left to the market. A flexible compromise.\n\nSignature decision: §YGrant Lease Concessions§!."
 won_sys_6:0 "War Communism"
 won_sys_6_desc:0 "Requisition everything, ration everything. Output soars, the home front suffers and money loses meaning.\n\nSignature decision: §YRequisition Campaign§!."
 won_sys_7:0 "Corporatism"
 won_sys_7_desc:0 "Employers and workers sit in state chambers, and the state decides. Order and political strength.\n\nSignature decision: §YConvene the Corporate Chambers§!."
 won_sys_8:0 "Autarky"
 won_sys_8_desc:0 "A nation that needs no one. Resources are squeezed from home soil and trade agreements are refused.\n\nSignature decision: §YErsatz Production Drive§!."
 won_sys_9:0 "Defence Economy"
 won_sys_9_desc:0 "Wehrwirtschaft: the economy as an arm of the military. Arms factories rise fast, consumers wait.\n\nSignature decision: §YIssue Mefo Bills§!."
 won_sys_10:0 "State Capitalism"
 won_sys_10_desc:0 "State-owned champions and close ties between ministries and industry.\n\nSignature decision: §YNationalise Key Industries§!."
 won_sys_11:0 "Agrarian Economy"
 won_sys_11_desc:0 "Farms feed the nation and pay its bills abroad. Society is stable, industry is modest.\n\nSignature decisions: §YAgricultural Export Drive§! and §YRural Electrification§!."
 won_sys_12:0 "Mercantilism"
 won_sys_12_desc:0 "Exports, shipping and a full treasury. Two more trade agreements and every agreement is worth 50% more.\n\nSignature decisions: §YExport Subsidies§! and §YExpand the Merchant Marine§!."
 won_sys_fyp:0 "Five-Year Plan"
 won_sys_fyp_desc:0 "The plan must be fulfilled. Target: §Y[?won_fyp_target|0]§! factories (we started with [?won_fyp_start|0])."
 won_economy:0 "National Economy"
 won_economy_desc:0 "The live state of our economy, updated every month. Open the §YMinistry of Economy§! (top bar) for details."
 # ---------------------------------------------------------------- Timed spirits
 won_transition:0 "Economic Transition"
 won_transition_desc:0 "Ministries are being reorganised for the new economic system."
 won_stimulus:0 "Stimulus Package"
 won_stimulus_desc:0 "Public money is flowing into construction."
 won_austerity:0 "Austerity Budget"
 won_austerity_desc:0 "Spending cuts fill the treasury and empty the streets of goodwill."
 won_consortium:0 "Construction Consortium"
