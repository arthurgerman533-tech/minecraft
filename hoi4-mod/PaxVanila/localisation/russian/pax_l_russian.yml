 GER_pax_mil1:0 "Мобилизация"
 GER_pax_mil1_desc:0 "Каждый житель получает винтовку и паёк. Резервисты возвращаются в казармы."
 GER_pax_mil2:0 "Укрепления"
 GER_pax_mil2_desc:0 "Стены вокруг стен. Ромея научила весь мир, что крепость переживёт любой набег."
 GER_pax_mil3:0 "Тотальная война"
 GER_pax_mil3_desc:0 "Вся нация становится армией. Нельзя одновременно воевать мечом и держать соседей в вассалах."
 GER_pax_eco1:0 "Торговые пути"
 GER_pax_eco1_desc:0 "Караваны и корабли снова ходят по старым дорогам. Торговля кормит казну."
 GER_pax_eco2:0 "Дипкорпус"
 GER_pax_eco2_desc:0 "Со времён Договора у Монолита в 251 году пакт о ненападении стоит дешевле войны."
 GER_pax_eco3:0 "Гегемония"
 GER_pax_eco3_desc:0 "Держава правит не мечом, а данью. Соседи платят, а казна растёт."
 GER_pax_her:0 "Наследие: Железо и уголь"
 GER_pax_her_desc:0 "Германские королевства сидят на самых богатых рудах мира. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 GER_pax_fai:0 "Государственная вера: Молот Донара"
 GER_pax_fai_desc:0 "Вотан и Донар. В грозу германские полки идут вперёд."
 GER_pax_revanche:0 "Реванш за 1914"
 GER_pax_revanche_desc:0 "Рейх проиграл Первую Великую войну. Канцлер обещает, что второй раз так не будет."
 GER_pax_teutoburg:0 "Тевтобург Индастриз"
 GER_pax_teutoburg_desc:0 "Старый лес наконец построил свой каменный город, и тот вышел больше всех."
 GER_pax_army:0 "Армия Рейха"
 GER_pax_army_desc:0 "Штаб изучает ошибки окопной войны."
 GER_pax_iron_north:0 "За железом на север"
 GER_pax_iron_north_desc:0 "Железо и уголь Северного Царства. Так началась Вторая Великая война."
 GER_pax_before_winter:0 "Наступать до зимы"
 GER_pax_before_winter_desc:0 "Канцлер верит, что армия успеет до снега. Так думали и в 1942 году."
 GER_pax_winter_lesson:0 "Урок метели"
 GER_pax_winter_lesson_desc:0 "Летописцы Форума писали: «Зима всегда на стороне того, кто дома». Рейх шьёт зимние шинели."
 GER_pax_cw_watch:0 "Курултай у костра"
 GER_pax_cw_watch_desc:0 "Германия. Пакт собирается каждую зиму. Мы смотрим на башню издалека и ждём."
 GER_pax_cw_intel:0 "Разведка обсидиана"
 GER_pax_cw_intel_desc:0 "Обе стороны тайно ищут обсидиан под землёй. Наши агенты знают, где копать."
 GER_pax_cw_shield:0 "Кулак степи"
 GER_pax_cw_shield_desc:0 "Блок держит строй. Пока мы вместе, никто не рискнёт начать войну."
 GER_pax_cw_deter:0 "Сдерживание"
 GER_pax_cw_deter_desc:0 "Ни одна сторона не нажмёт первой. Лучшая война та, которой не было."
 GER_pax_rb_net:0 "Сеть Курултая"
 GER_pax_rb_net_desc:0 "Курултай просит доступ к каждому заводу Пакта. Отказать ему нельзя."
 GER_pax_rb_golems:0 "Медные легионы"
 GER_pax_rb_golems_desc:0 "Големы с медным сердцем встают на границах и заменяют дивизии."
 GER_pax_rb_human:0 "Ответ человека"
 GER_pax_rb_human_desc:0 "Разум разумом, а последнее слово останется за нами."
 GER_pax_rb_merge:0 "Слияние с разумом"
 GER_pax_rb_merge_desc:0 "Мы отдаём штабы и заводы общему разуму. Это быстрее и тише."
 GER_pax_rb_war:0 "Война двух разумов"
 GER_pax_rb_war_desc:0 "Страж-7 и Курултай смотрят друг на друга. Мы стоим между ними."
 GER_pax_co_charter:0 "Устав корпорации"
 GER_pax_co_charter_desc:0 "Германия теперь бренд. Гражданин стал акционером, налог подпиской."
 GER_pax_co_sculk:0 "Скалк-сеть"
 GER_pax_co_sculk_desc:0 "Сигналы идут через скалк. Новости приходят раньше событий."
 GER_pax_co_gates:0 "Врата по подписке"
 GER_pax_co_gates_desc:0 "Врата открываются тем, кто заплатил. Карт-Хадашт уже продаёт места."
 GER_pax_co_loyal:0 "Лояльность Протекторату"
 GER_pax_co_loyal_desc:0 "Протекторат Сети запретил войны. Мы подпишем всё, что он попросит."
 GER_pax_co_shadow:0 "Теневая корпорация"
 GER_pax_co_shadow_desc:0 "Мы существуем, пока нас не ищут. Чёрные серверы платят дороже."
