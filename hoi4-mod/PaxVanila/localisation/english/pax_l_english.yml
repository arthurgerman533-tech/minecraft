 ITA_pax_romul:0 "Romulus the Two Hundred and Fifth"
 ITA_pax_romul_desc:0 "Every ruler of Romea takes the name Romulus on accession. This one has kept the seal since 1931 and remembers how the first crack appeared on the tower in 1914."
 SPR_pax_hannon:0 "Suffete Hanno Barca"
 SPR_pax_hannon_desc:0 "Head of the Council of Suffetes and master of the Golden Caravan. He says the best war is the one both sides profit from."
 GRE_pax_pericles:0 "Archon Pericles Thalassidis"
 GRE_pax_pericles_desc:0 "Descendant of the sailors of Thalassia. Believes the sea remembers everything, even what has sunk."
 FRA_pax_ambiorix:0 "High Druid Ambiorix"
 FRA_pax_ambiorix_desc:0 "Head of the Council of Druids. Every autumn he gathers mistletoe himself in the sacred grove near the capital."
 ENG_pax_elinor:0 "Admiral-President Eleanor Vane"
 ENG_pax_elinor_desc:0 "The Republic of Seafarers elects its president from among captains. Vane commanded the fleet that returned from the Fog of the Nameless."
 GER_pax_arminius:0 "Reich Chancellor Arminius Waldger"
 GER_pax_arminius_desc:0 "Veteran of the trenches of 1914. Promises the Reich the iron and coal of the North and does not believe in blizzards."
 SOV_pax_vseslav:0 "Tsar Vseslav the Icy"
 SOV_pax_vseslav_desc:0 "The Northern Kingdom was founded by refugees of all peoples. Tsar Vseslav says winter is always on the side of the one at home."
 ROM_pax_decebal:0 "Tsar Decebalus the Ninth"
 ROM_pax_decebal_desc:0 "Tsar of the copper mountains. Romea took tribute from Dacia since 117, and Decebalus has not forgiven it."
 TUR_pax_tengiz:0 "Khagan Tengiz"
 TUR_pax_tengiz_desc:0 "Elected by the kurultai of the clans. His ancestors emerged from the sandstorm in 375 and reached the tower itself."
 PER_pax_idanthyrsus:0 "Tsar Idanthyrsus the Second"
 PER_pax_idanthyrsus_desc:0 "Kurgan king of the far east. His treasury is the gold of his ancestors, and his army is horse archers."
 ITA_pax_1962:0 "Romulus the Two Hundred and Sixth"
 ITA_pax_1962_desc:0 "Ordered that no new golem be placed on the empty pedestal: 'Let everyone see that there are no guardians left.'"
 SPR_pax_1962:0 "Suffete Hamilcar Mago"
 SPR_pax_1962_desc:0 "Head of the Council of Suffetes in the years of the Cold War."
 GRE_pax_1962:0 "Archon Irene Thalassidou"
 GRE_pax_1962_desc:0 "The first woman archon of the Hellenic Republic."
 FRA_pax_1962:0 "Druid-Chancellor Luern the Arvernian"
 FRA_pax_1962_desc:0 "Chancellor of the Confederation and keeper of the old grove."
 ENG_pax_1962:0 "Admiral-President Thomas Keir"
 ENG_pax_1962_desc:0 "A captain who led the Union's convoys through the Fog of the Nameless."
 SOV_pax_1962:0 "First Secretary Yaroslav Severin"
 SOV_pax_1962_desc:0 "Master of the Kurultai of the Victors. His intelligence service searches for the blueprints of Romea."
 ROM_pax_1962:0 "First Secretary Burebista Marin"
 ROM_pax_1962_desc:0 "Did not forgive Romea the old tribute and brought Dacia into the Pact."
 TUR_pax_1962:0 "Khagan Arslan"
 TUR_pax_1962_desc:0 "Khagan of the Horde, who holds the steppe together with the North."
 PER_pax_1962:0 "Tsar Scopasis the Third"
 PER_pax_1962_desc:0 "Kurgan king, loyal to the Kurultai."
 GER_pax_1962:0 "Chairman Otto Rheinwald"
 GER_pax_1962_desc:0 "The broken Reich became a vassal of the Pact, and then its ally."
 ITA_pax_2041:0 "Romulus the Two Hundred and Thirty-Eighth"
 ITA_pax_2041_desc:0 "The Romulus under whom Guardian-7 awoke."
 SPR_pax_2041:0 "Suffete Elissa Barca"
 SPR_pax_2041_desc:0 "Head of Carthage in the age of robots."
 GRE_pax_2041:0 "Archon Nikos Paleiras"
 GRE_pax_2041_desc:0 "Archon of Hellas in the age of robots."
 FRA_pax_2041:0 "Druid-Chancellor Mael Brian"
 FRA_pax_2041_desc:0 "The chancellor who gave the druids' laboratories to the Network."
 ENG_pax_2041:0 "Admiral-President Ada Morrow"
 ENG_pax_2041_desc:0 "Seafaring president of the age of robots."
 SOV_pax_2041:0 "Chairman of the Kurultai Miron Hold"
 SOV_pax_2041_desc:0 "The man who gave the Kurultai access to all the factories of the Pact."
 ROM_pax_2041:0 "Chairman Decebalus Stan"
 ROM_pax_2041_desc:0 "Head of Dacia in the age of robots."
 TUR_pax_2041:0 "Khagan Timur the Second"
 TUR_pax_2041_desc:0 "Khagan of the Horde in the age of robots."
 PER_pax_2041:0 "Tsar Ariapeithes"
 PER_pax_2041_desc:0 "Scythian tsar of the age of robots."
 GER_pax_2041:0 "Chairman Karl Wendt"
 GER_pax_2041_desc:0 "Head of Germany within the Pact."
 ITA_pax_2096:0 "Romulus the Two Hundred and Ninetieth"
 ITA_pax_2096_desc:0 "The Romulus under the Network Protectorate. Guardian-7 talks to him every day."
 SPR_pax_2096:0 "Director Hanna Barca-Seventh"
 SPR_pax_2096_desc:0 "Chief executive of Qart-Hadasht."
 GRE_pax_2096:0 "Director Xanthippe Nereus"
 GRE_pax_2096_desc:0 "Head of the Thalasso-Net corporation."
 FRA_pax_2096:0 "Director Belenos Carnot"
 FRA_pax_2096_desc:0 "Head of the Druidicon corporation."
 ENG_pax_2096:0 "Admiral-President Ray Hollis"
 ENG_pax_2096_desc:0 "The Island Union still elects its president from among captains."
 SOV_pax_2096:0 "Tsar Vseslav the Twelfth"
 SOV_pax_2096_desc:0 "The tsars returned to the North when the Pact fell apart."
 ROM_pax_2096:0 "Director Zalmox Ionescu"
 ROM_pax_2096_desc:0 "Head of the Sarmizegetusa Mining corporation."
 TUR_pax_2096:0 "Director Tengiz Nur"
 TUR_pax_2096_desc:0 "Head of the Neo-Horde corporation."
 PER_pax_2096:0 "Director Ateas Kurgan"
 PER_pax_2096_desc:0 "Head of the Kurgan corporation."
 GER_pax_2096:0 "Director Arminia Wald"
 GER_pax_2096_desc:0 "Head of the Teutoburg Industries corporation."
 pax.1.t:0 "Peace Between the Great Wars"
 pax.1.d:0 "The year 1936. Eighteen years have passed since the First Great War. In 1914 lightning struck the Monolith at 0, 0, and the first crack appeared on the tower, exactly at the level of the sixth row. Of the six Guardians at the entrance, four have fallen. Two still stand.\n\nIn the west, Romea, Carthage, Hellas, Gaul and the Island Union remember the oath of PAX. In the east, the German Reich counts its grievances, the Northern Kingdom waits for winter, and Dacia, the Horde and Scythia look at the steppe. The chroniclers of the Forum write: 'Laws always lag behind weapons.'\n\nThis world is taken from the lore of the PaxVanila server."
 pax.1.a:0 "Let it all be recorded."
 pax.2.t:0 "Treaty at the Monolith"
 pax.2.d:0 "[From.GetNameDefCap] calls us into the PAX Union. As in 251, the powers of the west promise not to fight each other and to keep the seal at the tower together."
 pax.2.a:0 "We swear the oath of PAX."
 pax.2.b:0 "We have our own path."
 pax.3.t:0 "Kurultai of the Victors"
 pax.3.d:0 "[From.GetNameDefCap] gathers the eastern powers on the steppe. This is how the Steppe Pact is born."
 pax.3.a:0 "We ride to the Kurultai."
 pax.3.b:0 "The steppe can wait."
 pax.10.t:0 "Storm Over the Monolith"
 pax.10.d:0 "The great powers are at war again. A shell burst at the walls of the tower, and another Guardian has fallen. The chroniclers of the Forum recorded a new crack in the sixth row of stones."
 pax.10.a:0 "The laws have lagged behind weapons again."
 pax.11.t:0 "No More Guardians"
 pax.11.d:0 "Only an empty pedestal is left at the entrance of the Monolith. No one knows that deep beneath the tower, before the door to the Seal hall, stands a seventh golem with a copper heart. Romean engineers are already looking for the way down."
 pax.11.a:0 "The Seal is cracking."
 pax.12.t:0 "Awakening"
 pax.12.d:0 "Romean engineers descended beneath the Monolith and found the seventh golem. When current was brought to it, its eyes lit with a copper glow. The first word of Guardian-7 was 'PAX'."
 pax.12.a:0 "He remembers how this ends."
 pax.30.t:0 "North for Iron"
 pax.30.d:0 "The Reich has too little land. The iron and coal of the Northern Kingdom lie across the border. The generals say the army will make it before the snow. The chroniclers of the Forum say winter is always on the side of the one at home."
 pax.30.a:0 "Prepare for war with the North."
 pax.30.b:0 "Wait."
 pax.20.t:0 "PaxVanila Guide"
 pax.20.d:0 "Choose a guide section."
 pax.20.a:0 "Exit"
 pax.21.d:0 "1936, between the First and Second Great Wars. Ten lore powers of the PaxVanila server have taken the lands of Europe and Asia: Romea, Carthage, Hellas, Gaul and the Island Union in the west, Germany, the Northern Kingdom, Dacia, the Horde and Scythia in the east. The rest of the world is the 'Far Lands'.\n\nGuide sections: economy and the decisions menu, MD technologies and army, scenarios and eras, the Monolith and the Guardians.\n\nFocus trees come from your build (CHADDFIXREBALANCE). Lore branches, heritage and faith of your power are in decisions, category 'PaxVanila Lore'."
