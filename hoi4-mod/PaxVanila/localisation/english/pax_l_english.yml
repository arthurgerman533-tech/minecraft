 ENG_pax_fai_desc:0 "The school of Pythagoras. Seafarers believe everything has a number, even luck."
 ENG_pax_said_no:0 "We Said 'No'"
 ENG_pax_said_no_desc:0 "The memory of the war of independence of 1781 unites all the islands."
 ENG_pax_ports:0 "Ports on Every Shore"
 ENG_pax_ports_desc:0 "The Age of Sail left the Union with ports all over the world."
 ENG_pax_fog:0 "Fog of the Nameless"
 ENG_pax_fog_desc:0 "In 1700 a fleet vanished in the fog. The Union still sends scouts there."
 ENG_pax_sailor_fleet:0 "Fleet of the Seafarers"
 ENG_pax_sailor_fleet_desc:0 "The Republic of Seafarers builds a new fleet."
 ENG_pax_join_pax:0 "A Seat in the PAX Union"
 ENG_pax_join_pax_desc:0 "The islands pay tribute to no one, but swear the oath of PAX of their own will."
 ENG_pax_cw_watch:0 "Tower Watch"
 ENG_pax_cw_watch_desc:0 "Island Union. A hundred years ago we swore the oath of PAX. Now our guard stands at the tower every day."
 ENG_pax_cw_intel:0 "Obsidian Reconnaissance"
 ENG_pax_cw_intel_desc:0 "Both sides secretly search for obsidian underground. Our agents know where to dig."
 ENG_pax_cw_shield:0 "Shield of PAX"
 ENG_pax_cw_shield_desc:0 "The bloc holds the line. As long as we stand together, no one will risk starting a war."
 ENG_pax_cw_deter:0 "Deterrence"
 ENG_pax_cw_deter_desc:0 "Neither side will press first. The best war is the one that never happened."
 ENG_pax_rb_net:0 "Seven's Network"
 ENG_pax_rb_net_desc:0 "Guardian-7 calculates faster than any bureau. We connect our laboratories to it."
 ENG_pax_rb_golems:0 "Copper Legions"
 ENG_pax_rb_golems_desc:0 "Golems with copper hearts rise on the borders and replace divisions."
 ENG_pax_rb_human:0 "The Human Answer"
 ENG_pax_rb_human_desc:0 "Mind is mind, but the last word will stay with us."
 ENG_pax_rb_merge:0 "Merging with the Mind"
 ENG_pax_rb_merge_desc:0 "We hand our staffs and factories to the shared mind. It is faster and quieter."
 ENG_pax_rb_war:0 "War of Two Minds"
 ENG_pax_rb_war_desc:0 "Guardian-7 and the Kurultai look at each other. We stand between them."
 ENG_pax_co_charter:0 "Corporate Charter"
 ENG_pax_co_charter_desc:0 "Island Union is now a brand. The citizen has become a shareholder, the tax a subscription."
 ENG_pax_co_sculk:0 "Sculk Net"
 ENG_pax_co_sculk_desc:0 "Signals travel through sculk. The news arrives before the events."
 ENG_pax_co_gates:0 "Gates by Subscription"
 ENG_pax_co_gates_desc:0 "The gates open for those who pay. Qart-Hadasht is already selling seats."
 ENG_pax_co_loyal:0 "Loyalty to the Protectorate"
 ENG_pax_co_loyal_desc:0 "The Network Protectorate has banned wars. We will sign whatever it asks."
 ENG_pax_co_shadow:0 "Shadow Corporation"
 ENG_pax_co_shadow_desc:0 "We exist as long as no one looks for us. The black servers pay more."
 ENG_pax_cw_arms:0 "Arms Race"
 ENG_pax_cw_arms_desc:0 "Both sides stack shells in cellars. The factories work three shifts."
 ENG_pax_cw_spies:0 "Shadows at the Tower"
 ENG_pax_cw_spies_desc:0 "The agents of the Union and the Pact play a game whose rules only they know."
 ENG_pax_cw_bunkers:0 "Underground Shelters"
 ENG_pax_cw_bunkers_desc:0 "If the tower falls, people and machines must remain underground."
 ENG_pax_cw_diplo:0 "Talks at the Monolith"
 ENG_pax_cw_diplo_desc:0 "Every five years the ambassadors gather at the tower and promise not to shoot."
 ENG_pax_cw_balance:0 "Balance of Fear"
 ENG_pax_cw_balance_desc:0 "Peace holds as long as both sides fear each other."
 ENG_pax_rb_factories:0 "Automated Factories"
 ENG_pax_rb_factories_desc:0 "The conveyors no longer wait for people. People watch that nothing breaks."
 ENG_pax_rb_labs:0 "Seven's Laboratories"
 ENG_pax_rb_labs_desc:0 "The mind helps run experiments and read results faster than any scientist."
 ENG_pax_rb_drones:0 "Reconnaissance Drones"
 ENG_pax_rb_drones_desc:0 "Light machines fly around the borders and see farther than any sentry."
 ENG_pax_rb_cyber:0 "Neural Interfaces"
 ENG_pax_rb_cyber_desc:0 "Commanders connect the staff directly to the mind. The order arrives instantly."
 ENG_pax_rb_peace:0 "Treaty of Two Minds"
 ENG_pax_rb_peace_desc:0 "The machines sat down at the table before the people. The rest have only to sign."
 ENG_pax_co_ads:0 "Advertising in Every Home"
 ENG_pax_co_ads_desc:0 "Advertising replaced slogans. The subscription replaced the tax."
 ENG_pax_co_security:0 "Corporate Security"
 ENG_pax_co_security_desc:0 "Private armies guard offices and warehouses better than state ones."
 ENG_pax_co_monopoly:0 "Communications Monopoly"
 ENG_pax_co_monopoly_desc:0 "The sculk net belongs to us. Everything else can be rented."
 ENG_pax_co_black:0 "Black Servers"
 ENG_pax_co_black_desc:0 "Archives that do not exist keep everything we forgot."
 ENG_pax_co_summit:0 "Board of Directors of the World"
 ENG_pax_co_summit_desc:0 "Ten corporations sit at one table. Whoever pays more decides."
 GER_pax_ind1:0 "Industrialization"
 GER_pax_ind1_desc:0 "The first step of every power of the Age of Steel: factories, railways, coal."
 GER_pax_ind2:0 "Miners' Guilds"
 GER_pax_ind2_desc:0 "Miners' guilds dig deeper, like the masters of Caer-Tal once did."
 GER_pax_ind3:0 "War Economy"
 GER_pax_ind3_desc:0 "Factories switch to shells and rifles. The treasury fills with war orders."
 GER_pax_mil1:0 "Mobilization"
 GER_pax_mil1_desc:0 "Every resident receives a rifle and a ration. Reservists return to the barracks."
 GER_pax_mil2:0 "Fortifications"
 GER_pax_mil2_desc:0 "Walls around walls. Romea taught the whole world that a fortress outlasts any raid."
 GER_pax_mil3:0 "Total War"
 GER_pax_mil3_desc:0 "The whole nation becomes an army. You cannot fight with a sword and keep your neighbors as vassals at the same time."
 GER_pax_eco1:0 "Trade Routes"
 GER_pax_eco1_desc:0 "Caravans and ships again travel the old roads. Trade feeds the treasury."
 GER_pax_eco2:0 "Diplomatic Corps"
 GER_pax_eco2_desc:0 "Since the Treaty at the Monolith in 251, a non-aggression pact costs less than war."
 GER_pax_eco3:0 "Hegemony"
 GER_pax_eco3_desc:0 "The power rules not by the sword but by tribute. Neighbors pay and the treasury grows."
 GER_pax_ind4:0 "Great Construction"
 GER_pax_ind4_desc:0 "The Republic builds by a plan for decades. Every city gets a factory, every factory its own railway branch."
 GER_pax_ind5:0 "Factory Cities"
 GER_pax_ind5_desc:0 "Entire cities switch to arms production. Workers' quarters grow around the workshops."
 GER_pax_ind6:0 "Age of Steel"
 GER_pax_ind6_desc:0 "Steel, coal and steam give a power more than any war. The laboratories of the Forum open one more department."
 GER_pax_mil4:0 "New Army"
 GER_pax_mil4_desc:0 "The old legions retrain for rifles, machine guns and armor. The main thing: listen to the staff, not to memory."
 GER_pax_mil5:0 "Staff School"
 GER_pax_mil5_desc:0 "The staff studies the mistakes of past wars. Generals go to courses together with lieutenants."
 GER_pax_mil6:0 "Hundred Legions"
 GER_pax_mil6_desc:0 "The Republic conscripts everyone who can hold a weapon. The country becomes one big camp."
 GER_pax_eco4:0 "Golden Age of Trade"
 GER_pax_eco4_desc:0 "Trading houses open offices all over the world. The treasury is full, and the ports cannot keep up with the cargo."
 GER_pax_eco5:0 "Union of Treaties"
 GER_pax_eco5_desc:0 "A hundred treaties bind the power to its neighbors. Break even one and you lose them all."
 GER_pax_eco6:0 "World Power"
 GER_pax_eco6_desc:0 "The word of the power is heard from the Monolith to the far lands. Its currency is in every pocket."
 GER_pax_her:0 "Legacy: Iron and Coal"
 GER_pax_her_desc:0 "The Germanic kingdoms sit on the richest ores in the world. The legacy of the ten lore powers, like the 'her' focus on the PaxVanila server."
 GER_pax_fai:0 "State Faith: Hammer of Donar"
 GER_pax_fai_desc:0 "Wotan and Donar. In a thunderstorm the Germanic regiments march forward."
 GER_pax_revanche:0 "Revenge for 1914"
 GER_pax_revanche_desc:0 "The Reich lost the First Great War. The Chancellor promises it will not happen a second time."
 GER_pax_teutoburg:0 "Teutoburg Industries"
 GER_pax_teutoburg_desc:0 "The old forest finally built its stone city, and it came out the biggest of all."
 GER_pax_army:0 "Army of the Reich"
 GER_pax_army_desc:0 "The staff studies the mistakes of trench warfare."
 GER_pax_iron_north:0 "North for Iron"
 GER_pax_iron_north_desc:0 "The iron and coal of the Northern Kingdom. This is how the Second Great War began."
 GER_pax_before_winter:0 "Attack Before Winter"
 GER_pax_before_winter_desc:0 "The Chancellor believes the army will make it before the snow. They thought so in 1942 too."
 GER_pax_winter_lesson:0 "Lesson of the Blizzard"
 GER_pax_winter_lesson_desc:0 "The chroniclers of the Forum wrote: 'Winter is always on the side of the one at home.' The Reich sews winter greatcoats."
 GER_pax_cw_watch:0 "Kurultai by the Campfire"
 GER_pax_cw_watch_desc:0 "Germany. The Pact gathers every winter. We look at the tower from afar and wait."
 GER_pax_cw_intel:0 "Obsidian Reconnaissance"
 GER_pax_cw_intel_desc:0 "Both sides secretly search for obsidian underground. Our agents know where to dig."
 GER_pax_cw_shield:0 "Fist of the Steppe"
 GER_pax_cw_shield_desc:0 "The bloc holds the line. As long as we stand together, no one will risk starting a war."
 GER_pax_cw_deter:0 "Deterrence"
 GER_pax_cw_deter_desc:0 "Neither side will press first. The best war is the one that never happened."
 GER_pax_rb_net:0 "Kurultai Network"
 GER_pax_rb_net_desc:0 "The Kurultai asks for access to every factory of the Pact. It cannot be refused."
 GER_pax_rb_golems:0 "Copper Legions"
 GER_pax_rb_golems_desc:0 "Golems with copper hearts rise on the borders and replace divisions."
