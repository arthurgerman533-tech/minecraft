 ROM_pax_ind6_desc:0 "Steel, coal and steam give a power more than any war. The laboratories of the Forum open one more department."
 ROM_pax_mil4:0 "New Army"
 ROM_pax_mil4_desc:0 "The old legions retrain for rifles, machine guns and armor. The main thing: listen to the staff, not to memory."
 ROM_pax_mil5:0 "Staff School"
 ROM_pax_mil5_desc:0 "The staff studies the mistakes of past wars. Generals go to courses together with lieutenants."
 ROM_pax_mil6:0 "Hundred Legions"
 ROM_pax_mil6_desc:0 "The Republic conscripts everyone who can hold a weapon. The country becomes one big camp."
 ROM_pax_eco4:0 "Golden Age of Trade"
 ROM_pax_eco4_desc:0 "Trading houses open offices all over the world. The treasury is full, and the ports cannot keep up with the cargo."
 ROM_pax_eco5:0 "Union of Treaties"
 ROM_pax_eco5_desc:0 "A hundred treaties bind the power to its neighbors. Break even one and you lose them all."
 ROM_pax_eco6:0 "World Power"
 ROM_pax_eco6_desc:0 "The word of the power is heard from the Monolith to the far lands. Its currency is in every pocket."
 ROM_pax_her:0 "Legacy: Copper of Caer-Tal"
 ROM_pax_her_desc:0 "Dacia dug out the mines of the Copper Union to the very bottom. The legacy of the ten lore powers, like the 'her' focus on the PaxVanila server."
 ROM_pax_fai:0 "State Faith: Without Fear of Death"
 ROM_pax_fai_desc:0 "Zalmoxis. The Dacians go into battle because they do not fear death."
 ROM_pax_old_tribute:0 "The Old Tribute Is Not Forgotten"
 ROM_pax_old_tribute_desc:0 "In 117 the mountains collapsed and hungry Dacia became the first vassal of Romea. The Dacians remember."
 ROM_pax_sarmizegetusa:0 "Sarmizegetusa Mining"
 ROM_pax_sarmizegetusa_desc:0 "The royal mines become a company. Copper goes to the factories."
 ROM_pax_steam:0 "Steam Engines of Caer-Tal"
 ROM_pax_steam_desc:0 "Blueprints of steam engines were found in the mines. The Age of Steel began with them."
 ROM_pax_mountain_forts:0 "Mountain Fortresses"
 ROM_pax_mountain_forts_desc:0 "The mountains of Dacia are a fortress in themselves."
 ROM_pax_join_steppe:0 "A Voice at the Kurultai"
 ROM_pax_join_steppe_desc:0 "Dacia has not forgiven Romea the old tribute and turns to the eastern powers."
 ROM_pax_cw_watch:0 "Kurultai by the Campfire"
 ROM_pax_cw_watch_desc:0 "Dacia. The Pact gathers every winter. We look at the tower from afar and wait."
 ROM_pax_cw_intel:0 "Obsidian Reconnaissance"
 ROM_pax_cw_intel_desc:0 "Both sides secretly search for obsidian underground. Our agents know where to dig."
 ROM_pax_cw_shield:0 "Fist of the Steppe"
 ROM_pax_cw_shield_desc:0 "The bloc holds the line. As long as we stand together, no one will risk starting a war."
 ROM_pax_cw_deter:0 "Deterrence"
 ROM_pax_cw_deter_desc:0 "Neither side will press first. The best war is the one that never happened."
 ROM_pax_rb_net:0 "Kurultai Network"
 ROM_pax_rb_net_desc:0 "The Kurultai asks for access to every factory of the Pact. It cannot be refused."
 ROM_pax_rb_golems:0 "Copper Legions"
 ROM_pax_rb_golems_desc:0 "Golems with copper hearts rise on the borders and replace divisions."
 ROM_pax_rb_human:0 "The Human Answer"
 ROM_pax_rb_human_desc:0 "Mind is mind, but the last word will stay with us."
 ROM_pax_rb_merge:0 "Merging with the Mind"
 ROM_pax_rb_merge_desc:0 "We hand our staffs and factories to the shared mind. It is faster and quieter."
 ROM_pax_rb_war:0 "War of Two Minds"
 ROM_pax_rb_war_desc:0 "Guardian-7 and the Kurultai look at each other. We stand between them."
 ROM_pax_co_charter:0 "Corporate Charter"
 ROM_pax_co_charter_desc:0 "Dacia is now a brand. The citizen has become a shareholder, the tax a subscription."
 ROM_pax_co_sculk:0 "Sculk Net"
 ROM_pax_co_sculk_desc:0 "Signals travel through sculk. The news arrives before the events."
 ROM_pax_co_gates:0 "Gates by Subscription"
 ROM_pax_co_gates_desc:0 "The gates open for those who pay. Qart-Hadasht is already selling seats."
 ROM_pax_co_loyal:0 "Loyalty to the Protectorate"
 ROM_pax_co_loyal_desc:0 "The Network Protectorate has banned wars. We will sign whatever it asks."
 ROM_pax_co_shadow:0 "Shadow Corporation"
 ROM_pax_co_shadow_desc:0 "We exist as long as no one looks for us. The black servers pay more."
 ROM_pax_cw_arms:0 "Arms Race"
 ROM_pax_cw_arms_desc:0 "Both sides stack shells in cellars. The factories work three shifts."
 ROM_pax_cw_spies:0 "Shadows at the Tower"
 ROM_pax_cw_spies_desc:0 "The agents of the Union and the Pact play a game whose rules only they know."
 ROM_pax_cw_bunkers:0 "Underground Shelters"
 ROM_pax_cw_bunkers_desc:0 "If the tower falls, people and machines must remain underground."
 ROM_pax_cw_diplo:0 "Talks at the Monolith"
 ROM_pax_cw_diplo_desc:0 "Every five years the ambassadors gather at the tower and promise not to shoot."
 ROM_pax_cw_balance:0 "Balance of Fear"
 ROM_pax_cw_balance_desc:0 "Peace holds as long as both sides fear each other."
 ROM_pax_rb_factories:0 "Automated Factories"
 ROM_pax_rb_factories_desc:0 "The conveyors no longer wait for people. People watch that nothing breaks."
 ROM_pax_rb_labs:0 "Seven's Laboratories"
 ROM_pax_rb_labs_desc:0 "The mind helps run experiments and read results faster than any scientist."
 ROM_pax_rb_drones:0 "Reconnaissance Drones"
 ROM_pax_rb_drones_desc:0 "Light machines fly around the borders and see farther than any sentry."
 ROM_pax_rb_cyber:0 "Neural Interfaces"
 ROM_pax_rb_cyber_desc:0 "Commanders connect the staff directly to the mind. The order arrives instantly."
 ROM_pax_rb_peace:0 "Treaty of Two Minds"
 ROM_pax_rb_peace_desc:0 "The machines sat down at the table before the people. The rest have only to sign."
 ROM_pax_co_ads:0 "Advertising in Every Home"
 ROM_pax_co_ads_desc:0 "Advertising replaced slogans. The subscription replaced the tax."
 ROM_pax_co_security:0 "Corporate Security"
 ROM_pax_co_security_desc:0 "Private armies guard offices and warehouses better than state ones."
 ROM_pax_co_monopoly:0 "Communications Monopoly"
 ROM_pax_co_monopoly_desc:0 "The sculk net belongs to us. Everything else can be rented."
 ROM_pax_co_black:0 "Black Servers"
 ROM_pax_co_black_desc:0 "Archives that do not exist keep everything we forgot."
 ROM_pax_co_summit:0 "Board of Directors of the World"
 ROM_pax_co_summit_desc:0 "Ten corporations sit at one table. Whoever pays more decides."
 TUR_pax_ind1:0 "Industrialization"
 TUR_pax_ind1_desc:0 "The first step of every power of the Age of Steel: factories, railways, coal."
 TUR_pax_ind2:0 "Miners' Guilds"
 TUR_pax_ind2_desc:0 "Miners' guilds dig deeper, like the masters of Caer-Tal once did."
 TUR_pax_ind3:0 "War Economy"
 TUR_pax_ind3_desc:0 "Factories switch to shells and rifles. The treasury fills with war orders."
 TUR_pax_mil1:0 "Mobilization"
 TUR_pax_mil1_desc:0 "Every resident receives a rifle and a ration. Reservists return to the barracks."
 TUR_pax_mil2:0 "Fortifications"
 TUR_pax_mil2_desc:0 "Walls around walls. Romea taught the whole world that a fortress outlasts any raid."
 TUR_pax_mil3:0 "Total War"
 TUR_pax_mil3_desc:0 "The whole nation becomes an army. You cannot fight with a sword and keep your neighbors as vassals at the same time."
