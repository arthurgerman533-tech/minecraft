 SOV_pax_2041:0 "Председатель Курултая Мирон Хольд"
 SOV_pax_2041_desc:0 "Человек, который дал Курултаю доступ ко всем заводам Пакта."
 ROM_pax_2041:0 "Председатель Децебал Стан"
 ROM_pax_2041_desc:0 "Глава Дакии эпохи роботов."
 TUR_pax_2041:0 "Каган Тимур Второй"
 TUR_pax_2041_desc:0 "Каган Орды эпохи роботов."
 PER_pax_2041:0 "Царь Ариапейт"
 PER_pax_2041_desc:0 "Скифский царь эпохи роботов."
 GER_pax_2041:0 "Председатель Карл Вендт"
 GER_pax_2041_desc:0 "Глава Германии в Пакте."
 ITA_pax_2096:0 "Ромул Двести Девяностый"
 ITA_pax_2096_desc:0 "Ромул при Протекторате Сети. Страж-7 говорит с ним каждый день."
 SPR_pax_2096:0 "Директор Ганна Барка-Седьмая"
 SPR_pax_2096_desc:0 "Генеральный директор Карт-Хадашт."
 GRE_pax_2096:0 "Директор Ксантиппа Нерей"
 GRE_pax_2096_desc:0 "Глава корпорации Талассо-Нет."
 FRA_pax_2096:0 "Директор Беленос Карно"
 FRA_pax_2096_desc:0 "Глава корпорации Друидикон."
 ENG_pax_2096:0 "Адмирал-президент Рэй Холлис"
 ENG_pax_2096_desc:0 "Островной Союз всё ещё выбирает президента из капитанов."
 SOV_pax_2096:0 "Царь Всеслав Двенадцатый"
 SOV_pax_2096_desc:0 "Цари вернулись на Север, когда Пакт распался."
 ROM_pax_2096:0 "Директор Залмокс Ионеску"
 ROM_pax_2096_desc:0 "Глава корпорации Сармизегетуза Майнинг."
 TUR_pax_2096:0 "Директор Тенгиз Нур"
 TUR_pax_2096_desc:0 "Глава корпорации Нео-Орда."
 PER_pax_2096:0 "Директор Атей Курган"
 PER_pax_2096_desc:0 "Глава корпорации Курган."
 GER_pax_2096:0 "Директор Арминия Вальд"
 GER_pax_2096_desc:0 "Глава корпорации Тевтобург Индастриз."
 pax.1.t:0 "Мир между Великими войнами"
 pax.1.d:0 "1936 год. Прошло восемнадцать лет после Первой Великой войны. В 1914 году молния ударила в Монолит на 0, 0, и на башне появилась первая трещина, ровно на уровне шестой строки. Из шести Стражей у входа пали четверо. Двое ещё стоят.\n\nНа западе Ромея, Карфаген, Эллада, Галлия и Островной Союз помнят клятву PAX. На востоке Германский Рейх считает обиды, Северное Царство ждёт зимы, а Дакия, Орда и Скифия смотрят на степь. Летописцы Форума пишут: «Законы всегда отстают от оружия».\n\nЭтот мир взят из лора сервера PaxVanila."
 pax.1.a:0 "Пусть всё будет записано."
 pax.2.t:0 "Договор у Монолита"
 pax.2.d:0 "[From.GetNameDefCap] зовёт нас в Союз PAX. Как в 251 году, державы запада обещают не воевать друг с другом и вместе хранить печать у башни."
 pax.2.a:0 "Мы даём клятву PAX."
 pax.2.b:0 "У нас свой путь."
 pax.3.t:0 "Курултай победителей"
 pax.3.d:0 "[From.GetNameDefCap] собирает восточные державы в степи. Так рождается Степной Пакт."
 pax.3.a:0 "Мы едем на Курултай."
 pax.3.b:0 "Степь подождёт."
 pax.10.t:0 "Гроза над Монолитом"
 pax.10.d:0 "Великие державы снова воюют. Снаряд разорвался у стен башни, и ещё один Страж пал. Летописцы Форума записали новую трещину в шестом ряду камней."
 pax.10.a:0 "Законы опять отстали от оружия."
 pax.11.t:0 "Стражей больше нет"
 pax.11.d:0 "У входа в Монолит остался только пустой постамент. Никто не знает, что глубоко под башней перед дверью в зал Печати стоит седьмой голем с медным сердцем. Ромейские инженеры уже ищут дорогу вниз."
 pax.11.a:0 "Печать трещит."
 pax.12.t:0 "Пробуждение"
 pax.12.d:0 "Ромейские инженеры спустились под Монолит и нашли седьмого голема. Когда к нему подвели ток, его глаза зажглись медным светом. Первое слово Стража-7 было «PAX»."
 pax.12.a:0 "Он помнит, как это заканчивается."
 pax.30.t:0 "За железом на север"
 pax.30.d:0 "Рейху мало земли. Железо и уголь Северного Царства лежат за границей. Генералы говорят, что армия успеет до снега. Летописцы Форума говорят, что зима всегда на стороне того, кто дома."
 pax.30.a:0 "Готовить войну с Севером."
 pax.30.b:0 "Подождать."
 pax.20.t:0 "Путеводитель PaxVanila"
 pax.20.d:0 "Выберите раздел. Разделы об экономике и армии взяты из гайда Family mod."
 pax.20.a:0 "Выйти"
 pax.21.d:0 "§HМир.§! 1936 год, между Первой и Второй Великими войнами. Десять держав лора сервера PaxVanila заняли страны Европы и Азии. Остальной мир это «Дальние земли».\n\n§HФокусы.§! Как на сервере: Промышленность, Армия и Экономика. «Тотальная война» и «Гегемония» взаимоисключающие. Фокус «Наследие» даёт бонус вашей державы, фокус «Государственная вера» даёт бонус её богов. Национальная ветка идёт по лору.\n\n§HМонолит.§! У башни стоят два последних Стража. Когда две великие державы начинают войну, один из них падает. Когда падут оба, Ромея сможет разбудить Стража-7.\n\n§HБлоки.§! Ромея собирает Союз PAX, Северное Царство собирает Степной Пакт."
 PAX_guide_category:0 "Путеводитель PaxVanila"
 PAX_guide_category_desc:0 "Как устроен этот мир и что даёт каждая ветка фокусов."
 PAX_open_guide:0 "Открыть путеводитель"
 PAX_open_guide_desc:0 "Короткая справка по моду."
 PAX_monolith_category:0 "Монолит"
 PAX_monolith_category_desc:0 "Все шесть Стражей у входа пали. Под башней кто-то ждёт."
 PAX_project_seven:0 "Проект «Седьмой»"
 PAX_project_seven_desc:0 "Спуститься под Монолит и разбудить седьмого голема."
 PAX_steal_blueprints:0 "Украсть чертежи Седьмого"
 PAX_steal_blueprints_desc:0 "Разведка Пакта знает, что Ромея разбудила машину. Мы построим свою и назовём её Курултай."
