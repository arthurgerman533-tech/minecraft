 SOV_pax_her:0 "Наследие: Метель 1942"
 SOV_pax_her_desc:0 "Зимой враги на земле Царства вмерзают в снег. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 SOV_pax_fai:0 "Государственная вера: Хранители Печати"
 SOV_pax_fai_desc:0 "Северяне верят в Монолит больше, чем в богов. Печать держит мир."
 SOV_pax_tsar:0 "Царь во льдах"
 SOV_pax_tsar_desc:0 "Царство собрали беглецы всех народов. Царь держит их вместе."
 SOV_pax_winter_campaign:0 "Обычай зимней кампании"
 SOV_pax_winter_campaign_desc:0 "Обычай родился в 1241 году, когда метель остановила Орду. Северяне воюют зимой."
 SOV_pax_forests:0 "Отступить в леса и ждать"
 SOV_pax_forests_desc:0 "Северяне не держат границу. Они уходят в леса и ждут, пока враг замёрзнет."
 SOV_pax_north_iron:0 "Железо Севера"
 SOV_pax_north_iron_desc:0 "За этим железом придёт Рейх. Пусть оно сначала станет пушками."
 SOV_pax_kurultai:0 "Курултай победителей"
 SOV_pax_kurultai_desc:0 "Восточные державы сходятся в степи. Рождается Степной Пакт."
