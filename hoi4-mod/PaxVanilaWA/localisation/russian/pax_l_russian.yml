 PAX_PER_archers_desc:0 "Скифский всадник стреляет на скаку. Теперь из винтовки."
 PAX_PER_animal_style:0 "Звериный стиль"
 PAX_PER_animal_style_desc:0 "Олени и барсы на золотых бляхах снова на знамёнах. Роды спорят меньше."
 PAX_PER_tribute:0 "Дань степи"
 PAX_PER_tribute_desc:0 "Кочевья платят дань царю, а царь строит дороги."
