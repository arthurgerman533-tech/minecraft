 LOADING_TIP_0:0 "'Laws always lag behind weapons.'\n- Chronicler of the Forum"
 LOADING_TIP_1:0 "'Winter is always on the side of the one at home.'\n- Chroniclers of the Forum, 1942"
 LOADING_TIP_2:0 "'PAX.'\n- The first word of Guardian-7"
 LOADING_TIP_3:0 "'Let everyone see that there are no guardians left. Maybe that will stop them.'\n- Romulus the Two Hundred and Sixth"
 LOADING_TIP_4:0 "'History repeats itself not because people are foolish.'\n- Chronicler of the Forum"
 LOADING_TIP_5:0 "'No shooting at the tower.'\n- Law of 1529"
 LOADING_TIP_6:0 "'I remember this because I have already seen how it ends.'\n- Guardian-7"
 LOADING_TIP_7:0 "'Every ruler of Romea takes the name Romulus. It will always be so.'\n- Senate, year 12"
