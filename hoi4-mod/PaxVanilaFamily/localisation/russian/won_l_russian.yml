l_russian:
 # ---------------------------------------------------------------- Dashboard
 won_dash_title:0 "Министерство экономики"
 won_dash_subtitle:0 "Экономический отчёт: [Root.GetNameDefCap]"
 won_tb_plain:0 "[?won_treasury|1]"
 won_tb_thousands:0 "[?won_treasury_k|1]K"
 won_tt_mefo_banned:0 "Новых векселей «Мефо» не будет §Y3 года§!."
 won_tt_mefo_ban_active:0 "Мы не объявляли дефолт по векселям «Мефо» последние 3 года."
 won_default:0 "Суверенный дефолт"
 won_default_desc:0 "Мы перестали платить кредиторам. Какое-то время нам никто не даст денег на хороших условиях."
 won_close_tt:0 "Закрыть Министерство экономики."
 won_card_gdp_l:0 "ВВП"
 won_card_gdp_v:0 "[?won_gdp|1] млрд"
 won_card_gdp_tt:0 "§YВаловой внутренний продукт§! в миллиардах в год.\nСкладывается из гражданских (0,8 млрд) и военных или морских фабрик (0,6 млрд), плюс торговля (§Y[?won_trade_value|1] млрд§!) и иностранный капитал, умноженное на производительность.\n\nПроизводительность растёт со стабильностью, подъёмами и технологиями (сейчас §G+[?won_p_tech_pct|1]%§!), а падает от высокой инфляции, дефляции, депрессий и долгих войн (сейчас §R-[?won_p_war_pct|1]%§!).\n\nНаселение: §Y[?won_pop_m|1] млн§!. Развитие штатов: §Y[?won_dev_levels|0]§! ур., §G+[?won_dev_gdp|1] млрд§!. ВВП на душу: §Y[?won_gdppc|0] долларов§! в год. Доля мирового ВВП: §Y[?won_gdp_share|1]%§!.\nВоенные расходы: §Y[?won_mil_bn|1] млрд§! ([?won_mil_pct|1]% ВВП).\nМесто в мире: §Y#[?won_rank_gdp|0]§! по ВВП, §Y#[?won_rank_pc|0]§! на душу. Откройте §YВсемирную экономическую лигу§! в решениях."
 won_card_growth_l:0 "Рост (за год)"
 won_card_growth_v:0 "[?won_growth_y|+1]%"
 won_card_growth_tt:0 "ВВП по сравнению с прошлым годом. Сильный рост поднимает доверие рынка, а сжатие экономики тянет его вниз."
 won_card_treasury_l:0 "Казна"
 won_card_treasury_v:0 "[?won_treasury|+1] млрд"
 won_card_treasury_tt:0 "§YГосударственная казна§! (минус = государственный долг).\n\n§GДоход за прошлый месяц: [?won_income|2] млрд§!\n  Налоги: [?won_inc_tax|2]\n  Торговые соглашения: [?won_inc_trade|2]\n  Дивиденды из-за рубежа: [?won_inc_div|2]\n  Наши фирмы за рубежом: [?won_inc_svc|2]\n  Проценты: [?won_inc_interest|2]\n  Налог на иностранные фирмы: [?won_inc_corp|2]\n  Лицензионные отчисления: [?won_inc_roy|2]\n  Экспорт ресурсов: [?won_inc_res|2]\n  Потребительские траты: [?won_inc_cons|2]\n\n§RРасходы за прошлый месяц: [?won_spending|2] млрд§!\n  Администрация: [?won_exp_admin|2]\n  Государственные программы: [?won_exp_prog|2]\n  Приоритет бюджета: [?won_exp_policy|2]\n  Проценты по долгу: [?won_exp_interest|2]\n  Нанятые иностранные фирмы: [?won_exp_svc|2]\n  Дивиденды иностранным инвесторам: [?won_exp_div|2]"
 won_card_inflation_l:0 "Инфляция"
 won_card_inflation_v:0 "[?won_inflation|1]%"
 won_card_inflation_tt:0 "§YИнфляция§! каждый месяц на пятую часть приближается к цели.\nРастёт от дефицита, дешёвых денег, войны, печатания денег и подъёмов. Долгие войны, крупный импорт оружия, военные расходы выше 25% ВВП и волнения прибавляют сейчас §Y[?won_infl_extra|1]§! п. (не больше 5). Снижают жёсткие деньги, торговля и спады.\n\nВыше 3%: растут потребительские товары. Выше 5%: падает стабильность. Выше 6%: страдает производительность. Выше 25%: гиперинфляция.\nНиже 0%: дефляция душит рост."
 won_card_credit_l:0 "Кредитный рейтинг"
 won_card_credit_v:0 "[GetWonCredit]"
 won_card_credit_tt:0 "Рейтинг по резервам или долгу как доле ВВП.\n§GAAA§!: резервы выше 30% ВВП (+5% политической силы).\n§RBB§! и хуже: долг выше 60% ВВП повышает проценты; выше 80% стоит стабильности и политической силы; выше 150% страдает ещё и строительство."
 won_conf_label:0 "Доверие рынка"
 won_conf_value:0 "[?won_confidence|0] / 100"
 won_conf_tt:0 "§YДоверие рынка§! задаёт настроение экономики: каждое очко выше 50 даёт +0,3% к скорости строительства и +0,1% к выпуску фабрик (ниже 50 наоборот).\n\nОно тянется к цели, собранной из стабильности, роста, инфляции, резервов или долга, торговых соглашений, открытости, процентных ставок, войны и вашей экономической системы. События и решения дают ему краткие толчки."
 won_dash_phase:0 "Экономика: [GetWonPhase]"
 won_phase_tt:0 "[GetWonPhaseDesc]"
 won_chart_gdp_title:0 "ВВП за последние 24 месяца"
 won_chart_gdp_range:0 "от [?won_chart_gmin|1] до [?won_chart_gmax|1] млрд"
 won_chart_tre_title:0 "Казна за последние 24 месяца"
 won_chart_tre_range:0 "масштаб +/- [?won_chart_tmax|1] млрд"
 won_sys_header:0 "Экономическая система"
 won_sys_name:0 "[GetWonSystem]"
 won_sys_desc:0 "[GetWonSystemDesc]"
 won_sys_tt:0 "Ваша экономическая система это национальный дух со своими бонусами, и она открывает особое решение в разделе решений §YМинистерства экономики§!.\nКакие системы доступны, зависит от вашей идеологии."
 won_reform_label:0 "Реформа"
 won_reform_tt:0 "Выбрать другую экономическую систему, подходящую вашей идеологии.\nСтоит §Y75§! политической силы, вызывает 120 дней перехода и возможна раз в 24 месяца.\n\nМесяцев до возможной реформы: §Y[?won_system_cd|0]§!"
 won_pol_header:0 "Политика"
 won_pol_tax_l:0 "Налоговая ставка"
 won_pol_tax_v:0 "[GetWonTax]"
 won_pol_tax_tt:0 "§YНизкая§!: налоги 1,0% ВВП в месяц, +5% стабильности, +4% строительства.\n§YОбычная§!: налоги 1,4% ВВП в месяц.\n§YВысокая§!: налоги 1,9% ВВП в месяц, -5% стабильности, +10% политической силы, -4% строительства.\n\nАдминистрация стоит 1,2% ВВП в месяц. Налоги собираются по §Yнизшей§! ставке, действовавшей с прошлого бюджета, поэтому переключение в последний день ничего не даёт. Каждую политику можно менять раз в 30 дней."
 won_pol_rate_l:0 "Процентные ставки"
 won_pol_rate_v:0 "[GetWonRate]"
 won_pol_rate_tt:0 "§YНизкие§!: +6% строительства, +4 доверия, цель инфляции +2,5, долг дешевле.\n§YНейтральные§!: без эффекта.\n§YВысокие§!: -8% строительства, -4 доверия, цель инфляции -2,5, +2% стабильности, долг дороже.\n\nПроценты по долгу берутся по §Yвысшей§! ставке с прошлого бюджета, инфляция по §Yнизшей§!. Каждую политику можно менять раз в 30 дней."
 won_pol_budget_l:0 "Приоритет бюджета"
 won_pol_budget_v:0 "[GetWonBudget]"
 won_pol_budget_tt:0 "Любой приоритет стоит 0,3% ВВП в месяц и списывается, если он действовал в любой момент с прошлого бюджета.\n§YСбалансированный§!: без затрат и эффекта.\n§YПромышленность§!: +5% выпуска фабрик, +5% к пределу эффективности производства.\n§YИнфраструктура§!: +25% инфраструктуры и +5% к скорости строительства.\n§YБлагосостояние§!: +7% стабильности, -2% потребительских товаров.\n§YВоенный§!: +7% поддержки войны, +15% к строительству военных фабрик.\n\nКаждую политику можно менять раз в 30 дней."
 won_pol_open_l:0 "Иностранный капитал"
 won_pol_open_v:0 "[GetWonOpen]"
 won_pol_open_tt:0 "§YОткрытый§!: +4 доверия рынка; иностранные инвесторы могут предлагать строить здесь фабрики, а другие страны могут вкладываться через дипломатию. В плохие времена капитал может и бежать.\n§YЗакрытый§!: ни иностранных вложений, ни бегства капитала.\nКомандная экономика, военный коммунизм и автаркия всегда закрыты."
 won_trade_header:0 "Торговля и капитал"
 won_trade_line1:0 "Торговые сделки: §Y[?won_trade_count|0]/[?won_trade_max|0]§!  Пакты: §Y[?won_pact_count|0]/4§!  Климат: §Y[?won_climate|0]§!"
 won_trade_line2:0 "Вложено за рубежом: §Y[?won_inv_total|1] млрд§! (+[?won_inv_div|2]/мес)   Капитал здесь: §Y[?won_fdi_in|1] млрд§!"
 won_trade_line3:0 "Нанято фирм: §Y[?won_hire_count|0]/2§!  За рубежом: §Y[?won_sold_count|0]/3§!  Оружие: §Y[?won_arms_rev_12|1] млрд/год§!"
 won_trade_tt:0 "§YИнвестиционный климат§! [?won_climate|0]/100: каждый месяц с шансом §Y[?won_fdi_chance|1]%§! иностранный инвестор предлагает построить здесь фабрику. См. решения «§YГлобальные рынки§!».\n\n§YТорговые соглашения§!: каждое даёт до -1,5% потребительских товаров (не более -9%), снижает инфляцию и добавляет доход от торговли и ВВП. Партнёр засчитывается полностью, только если его ВВП не меньше четверти нашего; меньшие партнёры считаются пропорционально.\n§YСтроительные пакты§!: до +3% к скорости строительства каждый (до 4), считаются так же. Сначала нужно торговое соглашение.\n\nОткройте §Yэкран дипломатии§! любой страны, чтобы их предложить.\n\n§YЗаконы§!: [?won_law_cl|+0] к инвестиционному климату (торговый закон [?won_law_cl_trade|+0], экономический закон [?won_law_cl_eco|+0]), торговые соглашения x[?won_law_trade|2], потребительские траты [?won_law_cons_pct|2]% ВВП в месяц. Свободная торговля и упор на экспорт привлекают инвесторов и покупателей; закрытая экономика их отпугивает. Гражданская экономика радует инвесторов и больше всего зарабатывает на потреблении; военная экономика и тотальная мобилизация стоят климата, налогов и поднимают цены.\nЭмбарго против нас: [?won_embargo_n|0] (-8 климата и -10% торговой стоимости каждое).\n\n§YЭкспорт ресурсов§!: [?won_res_units|0] ед., проданных за рубеж, приносят §G[?won_inc_res|2] млрд§! в месяц сверх фабрик, которые оплачивают покупатели. Импорт ничего дополнительного не стоит."
 won_capital_tt:0 "§YВложить капитал§! (дипломатия): заплатите 1,5 млрд, чтобы построить гражданскую фабрику в другой стране, и каждый месяц получайте 1,5% с неё, пока вы в мире. Война или национализация обнуляют долю.\nИностранный капитал здесь повышает ваш предел эффективности производства (+0,5% за млрд, до +10%), но дивиденды платите вы."
 won_contracts_tt:0 "§YЭкспорт оружия§!: [?won_arms_rev_12|1] млрд за последний год. Положение на рынке: [GetAonTierName]. Экспорт идёт в ВВП.\n\n§YНанять их компании§! (дипломатия): на 12 месяцев их фирмы дают §G+[?won_hire_bonus_pct|1]%§! к скорости строительства (около трёх гражданских фабрик труда, не более +10%) за плату [?won_c_fee|2] млрд в месяц.\n§YПредложить наши услуги§! (дипломатия): наши фирмы работают на них; они платят нам 0,4% своего ВВП в месяц (от 0,02 до 0,06 млрд), и каждый контракт занимает одну нашу гражданскую фабрику."
 won_effects_header:0 "Национальная экономика"
 won_effects_line1:0 "Строительство [?won_pct_build|+0]%   Выпуск фабрик [?won_pct_output|+0]%"
 won_effects_line2:0 "Потребительские товары [?won_pct_cg|-0]%   Стабильность [?won_pct_stab|+0]%"
 won_effects_tt:0 "Сумма доверия, фазы, инфляции, политик, долга, торговли, пактов, компаний и иностранного капитала. Отображается как национальный дух «§YНациональная экономика§!». Дух вашей экономической системы действует поверх него."
 won_budget_line:0 "Месячный баланс: [?won_balance|+2] млрд   Резервы: [?won_reserve_ratio|%0]"
 won_tip:0 "§YМинистерство экономики§!\nЗдесь задаются налоги, процентные ставки и приоритеты бюджета.\n\nОткройте §Yэкран дипломатии§! любой страны, чтобы подписывать торговые соглашения и строительные пакты, вкладывать капитал, нанимать её компании или продавать свои услуги. Другие инструменты есть в решениях «§YМинистерство экономики§!» и «§YБизнес и контракты§!»."
 won_topbar_text:0 "[GetWonTreasuryShort]"
 won_topbar_tt:0 "§YПерестройка экономической системы§!\nВВП: §Y[?won_gdp|1] млрд§! ([?won_growth_y|+1]% за год), место в мире §Y#[?won_rank_gdp|0]§!\nКазна: [?won_treasury|+1] млрд ([?won_balance|+2] млрд/месяц)\nИнфляция: [?won_inflation|1]%   Доверие: [?won_confidence|0]\nЭкономика: [GetWonPhase]\nБюро внешней торговли: §Y[?won_q_count|0]§! запросов в ожидании\n\n§GНажмите, чтобы открыть Министерство экономики.§!"
 # ---------------------------------------------------------------- Scripted loc values
 won_sys_name_0:0 "Системы нет (выберите)"
 won_sys_short_0:0 "Режим ещё не выбрал экономическую систему."
 won_sys_short_1:0 "Свободные рынки, низкие налоги, быстрое строительство. Подъёмы и спады резче."
 won_sys_short_2:0 "Государство управляет спросом. Дефицит вызывает меньше инфляции."
 won_sys_short_3:0 "Щедрое благосостояние и стабильное общество за счёт высоких налогов."
 won_sys_short_4:0 "Планы и квоты. Контроль цен, но мало доверия рынка."
 won_sys_short_5:0 "Социализм с рынком по краям. Гибкая и устойчивая система."
 won_sys_short_6:0 "Всё для фронта. Огромный выпуск, жалкий тыл."
 won_sys_short_7:0 "Капитал и труд, запряжённые государством в палаты."
 won_sys_short_8:0 "Самообеспечение. Больше ресурсов, но нет торговых соглашений."
 won_sys_short_9:0 "Экономика, построенная для войны: сначала оружие, масло потом."
 won_sys_short_10:0 "Государственная промышленность и сильный политический контроль."
 won_sys_short_11:0 "Сначала фермы. Стабильно и бережливо, но промышленность отстаёт."
 won_sys_short_12:0 "Экспорт и судоходство. Больше и богаче торговых соглашений."
 won_phase_1:0 "§RДепрессия§!"
 won_phase_2:0 "§OСпад§!"
 won_phase_3:0 "§YСтабильность§!"
 won_phase_4:0 "§GРасширение§!"
 won_phase_5:0 "§GПодъём§!"
 won_phase_desc_1:0 "§RДепрессия§!: -6% стабильности, +5% потребительских товаров, -5% производительности. Инфляция падает."
 won_phase_desc_2:0 "§OСпад§!: -2% стабильности."
 won_phase_desc_3:0 "§YСтабильность§!: без эффектов фазы."
 won_phase_desc_4:0 "§GРасширение§!: дела идут хорошо. Возможны события роста и потребительского бума."
 won_phase_desc_5:0 "§GПодъём§!: +3% стабильности, -3% потребительских товаров, +3% производительности, но инфляция растёт."
 won_credit_1:0 "§GAAA§!"
 won_credit_2:0 "§GAA§!"
 won_credit_3:0 "§YA§!"
 won_credit_4:0 "§YBBB§!"
