 PAX_SOV_co_monopoly:0 "Монополия на связь"
 PAX_SOV_co_monopoly_desc:0 "Скалк-сеть принадлежит нам. Всё остальное можно арендовать."
 PAX_SOV_co_black:0 "Чёрные серверы"
 PAX_SOV_co_black_desc:0 "Архивы, которых нет, хранят всё, что мы забыли."
 PAX_SOV_co_summit:0 "Совет директоров мира"
 PAX_SOV_co_summit_desc:0 "Десять корпораций сидят за одним столом. Решает тот, кто платит больше."
 PAX_ROM_her:0 "Наследие: Медь Каэр-Тала"
 PAX_ROM_her_desc:0 "Дакия раскопала рудники Медного Союза до самого дна."
 PAX_ROM_fai:0 "Государственная вера: Без страха смерти"
 PAX_ROM_fai_desc:0 "Залмоксис. Даки идут в бой, потому что не боятся смерти."
 PAX_ROM_old_tribute:0 "Старая дань не забыта"
 PAX_ROM_old_tribute_desc:0 "В 117 году горы рухнули, и голодная Дакия стала первым вассалом Ромеи. Даки помнят."
 PAX_ROM_sarmizegetusa:0 "Сармизегетуза Майнинг"
 PAX_ROM_sarmizegetusa_desc:0 "Царские рудники становятся компанией. Медь идёт на заводы."
 PAX_ROM_steam:0 "Паровые машины Каэр-Тала"
 PAX_ROM_steam_desc:0 "В рудниках нашли чертежи паровых машин. С них начался Век стали."
 PAX_ROM_mountain_forts:0 "Горные крепости"
 PAX_ROM_mountain_forts_desc:0 "Горы Дакии сами по себе крепость."
 PAX_ROM_join_steppe:0 "Голос на Курултае"
 PAX_ROM_join_steppe_desc:0 "Дакия не простила Ромее старую дань и идёт к восточным державам."
 PAX_ROM_cw_watch:0 "Курултай у костра"
 PAX_ROM_cw_watch_desc:0 "Дакия. Пакт собирается каждую зиму. Мы смотрим на башню издалека и ждём."
 PAX_ROM_cw_intel:0 "Разведка обсидиана"
 PAX_ROM_cw_intel_desc:0 "Обе стороны тайно ищут обсидиан под землёй. Наши агенты знают, где копать."
 PAX_ROM_cw_shield:0 "Кулак степи"
 PAX_ROM_cw_shield_desc:0 "Блок держит строй. Пока мы вместе, никто не рискнёт начать войну."
 PAX_ROM_cw_deter:0 "Сдерживание"
 PAX_ROM_cw_deter_desc:0 "Ни одна сторона не нажмёт первой. Лучшая война та, которой не было."
 PAX_ROM_rb_net:0 "Сеть Курултая"
 PAX_ROM_rb_net_desc:0 "Курултай просит доступ к каждому заводу Пакта. Отказать ему нельзя."
 PAX_ROM_rb_golems:0 "Медные легионы"
 PAX_ROM_rb_golems_desc:0 "Големы с медным сердцем встают на границах и заменяют дивизии."
 PAX_ROM_rb_human:0 "Ответ человека"
 PAX_ROM_rb_human_desc:0 "Разум разумом, а последнее слово останется за нами."
 PAX_ROM_rb_merge:0 "Слияние с разумом"
 PAX_ROM_rb_merge_desc:0 "Мы отдаём штабы и заводы общему разуму. Это быстрее и тише."
 PAX_ROM_rb_war:0 "Война двух разумов"
 PAX_ROM_rb_war_desc:0 "Страж-7 и Курултай смотрят друг на друга. Мы стоим между ними."
 PAX_ROM_co_charter:0 "Устав корпорации"
 PAX_ROM_co_charter_desc:0 "Дакия теперь бренд. Гражданин стал акционером, налог подпиской."
 PAX_ROM_co_sculk:0 "Скалк-сеть"
 PAX_ROM_co_sculk_desc:0 "Сигналы идут через скалк. Новости приходят раньше событий."
 PAX_ROM_co_gates:0 "Врата по подписке"
 PAX_ROM_co_gates_desc:0 "Врата открываются тем, кто заплатил. Карт-Хадашт уже продаёт места."
 PAX_ROM_co_loyal:0 "Лояльность Протекторату"
 PAX_ROM_co_loyal_desc:0 "Протекторат Сети запретил войны. Мы подпишем всё, что он попросит."
 PAX_ROM_co_shadow:0 "Теневая корпорация"
 PAX_ROM_co_shadow_desc:0 "Мы существуем, пока нас не ищут. Чёрные серверы платят дороже."
 PAX_ROM_cw_arms:0 "Гонка вооружений"
 PAX_ROM_cw_arms_desc:0 "Обе стороны складывают снаряды в погреба. Заводы работают в три смены."
 PAX_ROM_cw_spies:0 "Тени у башни"
 PAX_ROM_cw_spies_desc:0 "Агенты Союза и Пакта играют в игру, правила которой знают только они."
 PAX_ROM_cw_bunkers:0 "Подземные убежища"
 PAX_ROM_cw_bunkers_desc:0 "Если башня упадёт, под землёй должны остаться люди и станки."
 PAX_ROM_cw_diplo:0 "Переговоры у Монолита"
 PAX_ROM_cw_diplo_desc:0 "Каждые пять лет послы собираются у башни и обещают не стрелять."
 PAX_ROM_cw_balance:0 "Равновесие страха"
 PAX_ROM_cw_balance_desc:0 "Мир держится, пока обе стороны боятся друг друга."
 PAX_ROM_rb_factories:0 "Автоматические заводы"
 PAX_ROM_rb_factories_desc:0 "Конвейеры больше не ждут людей. Люди смотрят, чтобы ничего не сломалось."
 PAX_ROM_rb_labs:0 "Лаборатории Седьмого"
 PAX_ROM_rb_labs_desc:0 "Разум помогает ставить опыты и читать результаты быстрее любого учёного."
 PAX_ROM_rb_drones:0 "Дроны разведки"
 PAX_ROM_rb_drones_desc:0 "Лёгкие машины облетают границы и видят дальше любого часового."
 PAX_ROM_rb_cyber:0 "Нейроинтерфейсы"
 PAX_ROM_rb_cyber_desc:0 "Командиры подключают штаб прямо к разуму. Приказ идёт мгновенно."
 PAX_ROM_rb_peace:0 "Договор двух разумов"
 PAX_ROM_rb_peace_desc:0 "Машины сели за стол раньше людей. Остальным остаётся подписать."
