 RULE_GROUP_WON:0 "Перестройка экономической системы"
 RULE_WON_SYSTEM_CHOICE:0 "Выбор экономической системы"
 RULE_WON_SYSTEMS_IDEOLOGICAL:0 "Идеологический"
 RULE_WON_SYSTEMS_IDEOLOGICAL_DESC:0 "Каждая страна может принять только экономические системы своей правящей идеологии: демократии выбирают между капиталистическими, коммунисты между социалистическими, фашисты между корпоративистскими."
 RULE_WON_SYSTEMS_FREE_PLAYERS:0 "Свободно для игроков"
 RULE_WON_SYSTEMS_FREE_PLAYERS_DESC:0 "Живые игроки могут принять любую из двенадцати экономических систем независимо от идеологии. ИИ остаётся идеологическим."
 RULE_WON_SYSTEMS_FREE_ALL:0 "Свободно для всех"
 RULE_WON_SYSTEMS_FREE_ALL_DESC:0 "Любая страна может принять любую экономическую систему. Около четверти стран под управлением ИИ нарушают обычай и выбирают систему чужой идеологии."
 RULE_WON_AI_OFFERS:0 "Экономические предложения ИИ игрокам"
