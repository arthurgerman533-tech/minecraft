 PAX_PER_co_security_desc:0 "Частные армии защищают офисы и склады лучше государственных."
 PAX_PER_co_monopoly:0 "Монополия на связь"
 PAX_PER_co_monopoly_desc:0 "Скалк-сеть принадлежит нам. Всё остальное можно арендовать."
 PAX_PER_co_black:0 "Чёрные серверы"
 PAX_PER_co_black_desc:0 "Архивы, которых нет, хранят всё, что мы забыли."
 PAX_PER_co_summit:0 "Совет директоров мира"
 PAX_PER_co_summit_desc:0 "Десять корпораций сидят за одним столом. Решает тот, кто платит больше."
 PAX_economy_category:0 "Экономика"
 PAX_economy_category_desc:0 "Упрощённое меню экономики в духе Millennium Dawn: налоги, финансирование, торговля, энергетика. В каждой группе действует один режим, его можно менять за политическую власть."
 PAX_eco_tax_low:0 "Налоги: Низкие налоги"
 PAX_eco_tax_low_desc:0 "Казна беднее, народ доволен. Режим группы «Налоги»: Низкие налоги."
 PAX_eco_tax_mid:0 "Налоги: Умеренные налоги"
 PAX_eco_tax_mid_desc:0 "Золотая середина, без бонусов и штрафов. Режим группы «Налоги»: Умеренные налоги."
 PAX_eco_tax_high:0 "Налоги: Высокие налоги"
 PAX_eco_tax_high_desc:0 "Казна полна, народ ворчит. Режим группы «Налоги»: Высокие налоги."
 PAX_eco_fund_civ:0 "Финансирование: Упор на гражданское"
 PAX_eco_fund_civ_desc:0 "Фабрики и стройки дешевле, армия ждёт. Режим группы «Финансирование»: Упор на гражданское."
 PAX_eco_fund_bal:0 "Финансирование: Баланс бюджета"
 PAX_eco_fund_bal_desc:0 "Ровное финансирование всего. Режим группы «Финансирование»: Баланс бюджета."
 PAX_eco_fund_mil:0 "Финансирование: Упор на военное"
 PAX_eco_fund_mil_desc:0 "Армия получает больше, стройки медленнее. Режим группы «Финансирование»: Упор на военное."
 PAX_eco_trade_open:0 "Торговля: Открытые рынки"
 PAX_eco_trade_open_desc:0 "Больше торговли, больше уважения за рубежом. Режим группы «Торговля»: Открытые рынки."
 PAX_eco_trade_mix:0 "Торговля: Выборочная торговля"
 PAX_eco_trade_mix_desc:0 "Торгуем с теми, с кем выгодно. Режим группы «Торговля»: Выборочная торговля."
 PAX_eco_trade_closed:0 "Торговля: Протекционизм"
 PAX_eco_trade_closed_desc:0 "Свои фабрики растут, чужие товары дороже. Режим группы «Торговля»: Протекционизм."
 PAX_eco_energy_fossil:0 "Энергетика и топливо: Нефть и уголь"
 PAX_eco_energy_fossil_desc:0 "Дёшево и быстро, но топлива уходит больше. Режим группы «Энергетика и топливо»: Нефть и уголь."
 PAX_eco_energy_atom:0 "Энергетика и топливо: Атомная энергия"
 PAX_eco_energy_atom_desc:0 "Дорогой старт, потом стабильная энергия. Режим группы «Энергетика и топливо»: Атомная энергия."
 PAX_eco_energy_green:0 "Энергетика и топливо: Зелёная энергия"
 PAX_eco_energy_green_desc:0 "Чистая сеть и меньше расходов на топливо. Режим группы «Энергетика и топливо»: Зелёная энергия."
 PAX_md_industry:0 "Технологии MD: промышленность"
 PAX_md_industry_desc:0 "Технологии из Millennium Dawn. Покупаются за политическую власть, эффекты постоянные."
 PAX_md_infantry:0 "Технологии MD: пехота"
 PAX_md_infantry_desc:0 "Технологии из Millennium Dawn. Покупаются за политическую власть, эффекты постоянные."
 PAX_md_electronics:0 "Технологии MD: электроника"
