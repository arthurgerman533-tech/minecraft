 # ---------------------------------------------------------------- Decisions
 won_cat_economy:0 "Ministry of Economy"
 won_cat_economy_desc:0 "Economy: §Y[GetWonPhase]§!   GDP §Y[?won_gdp|1] bn§! ([?won_growth_y|+1]%)\nTreasury [?won_treasury|+1] bn   Inflation [?won_inflation|1]%   Confidence [?won_confidence|0]\nSystem: §Y[GetWonSystem]§!\n\nThe full dashboard opens from the treasury figure in the top bar."
 won_cat_business:0 "Business and Contracts"
 won_cat_business_desc:0 "Spend the treasury on factories, railways and private firms, or sell our engineers' work abroad.\nTreasury: [?won_treasury|+1] bn"
