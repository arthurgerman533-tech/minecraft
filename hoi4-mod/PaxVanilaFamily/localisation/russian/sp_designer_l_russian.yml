  TANK_DESIGNER_TITLE:0 "Конструктор наземной техники"
  unknown_role_disallowed:0 "Не обращать внимания на роли"

  main_HE_shell:0 "ОФ"
  main_HE_shell_desc:0 "Осколочно-фугасные снаряды содержат взрывчатый заряд, срабатывающий при ударе или с задержкой и поражающий взрывной волной и осколками. Очень эффективны против пехоты, небронированной техники и укреплений. Не подходят для пробития брони, но отлично годятся для общих задач. Широко применяются в артиллерии и танковых орудиях."

  main_AP_shell:0 "БП"
  main_AP_shell_desc:0 "Бронебойные снаряды — сплошные болванки, пробивающие броню за счёт массы, формы и скорости. Не имеют взрывчатого наполнителя и наносят урон внутри за счёт кинетического удара и осколков брони. Эффективны против танков и бронетехники, но бесполезны против мягких целей."

  main_APHE_shell:0 "БПФ"
  main_APHE_shell_desc:0 "Бронебойно-фугасные снаряды сочетают пробитие брони с внутренним разрывным зарядом. Пробив броню, снаряд взрывается внутри, усиливая урон экипажу и механизмам."

  main_HEI_shell:0 "ОЗ"
  main_HEI_shell_desc:0 "Осколочно-зажигательные снаряды применяются в малокалиберных зенитных орудиях."

  main_HE_shell_time_fuzed:0 "ОФ с дистанционным взрывателем"
  main_HE_shell_time_fuzed_desc:0 "Осколочно-фугасные снаряды с дистанционным взрывателем, способные взрываться рядом с вражескими самолётами в воздухе."

  main_HEAT_shell:0 "Кумулятивный"
  main_HEAT_shell_desc:0 "Кумулятивные снаряды используют фигурный заряд, фокусирующий энергию взрыва в струю, пробивающую броню независимо от скорости снаряда. Эффективны на большой дистанции и против толстой брони. Уязвимы для динамической и разнесённой брони."

  main_APCR_shell:0 "БПК"
  main_APCR_shell_desc:0 "Подкалиберные снаряды с плотным вольфрамовым сердечником в лёгкой оболочке. Летят с высокой скоростью и отлично пробивают броню на короткой дистанции. Однако быстро теряют энергию с расстоянием и плохо действуют против наклонной или композитной брони."

  main_APDS_shell:0 "БОПС"
  main_APDS_shell_desc:0 "Бронебойные оперённые подкалиберные снаряды состоят из плотного подкалиберного сердечника (обычно вольфрамового) в отделяемом поддоне. После выстрела поддон отлетает, и сердечник летит с высокой скоростью. Пробивает лучше подкалиберных снарядов, особенно на больших дистанциях."

  main_HESH_shell:0 "ОФЗ"
  main_HESH_shell_desc:0 "Фугасные снаряды с пластичным взрывчатым веществом размазывают его по броне при ударе, и взрыв порождает ударные волны, вызывающие откол внутри без пробития. Эффективны против тонкой или катаной брони и укреплений. Хуже действуют против современной композитной или динамической брони."

  smoke_shells:0 "Дымовые снаряды"
  smoke_shells_desc:0 "Дымовые снаряды распыляют химические вещества (обычно белый фосфор или гексахлорэтан) для создания дымовой завесы. Используются для ослепления, целеуказания или сигнализации. Содержат мало взрывчатки или не содержат её вовсе и не предназначены для нанесения урона. Полезны при тактических манёврах, прикрытии и обмане."

  gas_shells:0 "Химические снаряды"
  gas_shells_desc:0 "Химические снаряды доставляют отравляющие вещества, такие как хлор, фосген или иприт. Предназначены для вывода из строя или уничтожения вражеских войск. Эффекты варьируются от удушья и слепоты до смертельного отравления."

  thick_armored_plate:0 "Толстый бронещит"
  thick_armored_plate_desc:0 "Небольшой защитный щит для расчёта орудия. Его толщина позволяет остановить часть выстрелов малого калибра и осколки."

  wide_armored_plate:0 "Усиленный бронещит"
  wide_armored_plate_desc:0 "Большой и тяжёлый бронещит для расчёта орудия, способный остановить выстрелы из лёгкого оружия и большинство снарядов малого калибра."

  wood_wheels:0 "Деревянные колёса"
  wood_wheels_desc:0 "Традиционные деревянные колёса, часто с железным ободом. Дёшевы и просты в производстве, но хрупки и плохо подходят для пересечённой местности. Ограниченная скорость и высокие затраты на обслуживание. Подходят для артиллерии ранней эпохи и перевозки по ровным сухим дорогам. Неэффективны в грязи, снегу и затяжных кампаниях."

  iron_wheels:0 "Железные колёса"
  iron_wheels_desc:0 "Колёса, полностью или в основном сделанные из железа, с повышенной прочностью и грузоподъёмностью. Лучше подходят для тяжёлой артиллерии, чем деревянные, но всё ещё неудобны на неровной земле. Нет подвески, плохое поглощение ударов и ограниченная скорость."

  tires_wheels:0 "Колёса с резиновыми шинами"
  tires_wheels_desc:0 "Колёса с резиновыми шинами значительно повышают подвижность и амортизацию. Позволяют быстрее буксировать орудие по дорогам и умеренному бездорожью. Снижают износ орудия и повышают комфорт расчёта."

  multi_tired_wheels:0 "Двухскатная система"
  multi_tired_wheels_desc:0 "Продвинутые многоосные или двухскатные системы, часто встречающиеся на современной самоходной или буксируемой автомобилями артиллерии. Отлично подходят для бездорожья, тяжёлых грузов и быстрой переброски. Лучшие показатели по сцеплению, долговечности и универсальности."

  caliber_25mm:0 "25 мм"
  caliber_25mm_desc:0 "Лёгкий калибр автоматической пушки для поддержки пехоты, зенитных и скорострельных орудий на технике. Высокая скорострельность, но низкое пробитие и урон."

  caliber_a_37mm:0 "37 мм"
  caliber_a_37mm_desc:0 "Ранний калибр противотанковых и авиационных пушек. Эффективен против лёгкой техники и самолётов, но быстро уступает более тяжёлой броне."

  caliber_b_50mm:0 "50 мм"
  caliber_b_50mm_desc:0 "Промежуточный противотанковый калибр. Сбалансированное пробитие и подвижность. Распространён в танковых и противотанковых орудиях начала и середины войны."

  caliber_c_75mm:0 "75 мм"
  caliber_c_75mm_desc:0 "Универсальный калибр для артиллерийских и танковых орудий. Хорошее сочетание огневой мощи, пробития и логистической эффективности."

  caliber_d_90mm:0 "90 мм"
  caliber_d_90mm_desc:0 "Тяжёлый противотанковый и зенитный калибр. Отличное пробитие и взрывная мощь. Требует прочного шасси или установки."

  caliber_e_120mm:0 "120 мм"
  caliber_e_120mm_desc:0 "Фугасный артиллерийский калибр. Идеален для стрельбы с закрытых позиций, разрушения укреплений и массированных обстрелов."

  caliber_f_150mm:0 "150 мм"
  caliber_f_150mm_desc:0 "Очень тяжёлый артиллерийский калибр. Разрушительное воздействие на сооружения и пехоту. Низкая скорострельность и тяжёлое бремя логистики."

  ccaliber_g_180mm:0 "180 мм"
  ccaliber_g_180mm_desc:0 "Сверхтяжёлый артиллерийский калибр. Применяется для стратегических обстрелов и контрбатарейной борьбы. Огромная мощь, но ограниченная подвижность."

  short_barrel:0 "Короткий ствол"
  short_barrel_desc:0 "Компактный ствол, оптимизированный для подвижности и стрельбы на близкой дистанции. Быстрее наводится и перезаряжается, но менее точен и имеет меньшую начальную скорость снаряда."

  medium_barrel:0 "Средний ствол"
  medium_barrel_desc:0 "Сбалансированная длина ствола — хороший компромисс между дальностью, точностью и подвижностью. Стандартная конфигурация для большинства артиллерийских и танковых орудий."

  long_barrel:0 "Длинный ствол"
  long_barrel_desc:0 "Удлинённый ствол обеспечивает большую начальную скорость снаряда, лучшее пробитие или дальность. Повышает точность и мощность, но добавляет вес и снижает скорость наведения."

