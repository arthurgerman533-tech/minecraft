 # --- Events ---
 aon.1.t:0 "Our First Foreign Customers"
 aon.1.d:0 "The first export contracts have been signed and delivered. Military delegations from abroad have inspected our factories and left satisfied, and the foreign payments are already reaching the treasury.\n\nIt is a modest beginning, but the ministry believes that a reputation for reliable deliveries will bring many more orders."
 aon.1.a:0 "A promising start."
 aon.2.t:0 "A Regional Supplier"
 aon.2.d:0 "Our arms now equip the armies of several nations. Procurement officers no longer need to be persuaded to look at our catalogue; they come to us.\n\nThe Foreign Trade Office proposes to build on this success by inviting the world's military attachés to a grand exhibition of our latest equipment."
 aon.2.a:0 "Our order books are filling up."
 aon.3.t:0 "An Established Exporter"
 aon.3.d:0 "The arms trade has become a permanent part of our economy. Whole factories now work for foreign customers, and the steady income has paid for new machinery across the country.\n\nThe finance ministry suggests that state guarantees for foreign buyers, offered through the Foreign Trade Office, could open markets that are still beyond our reach."
 aon.3.a:0 "Excellent."
 aon.4.t:0 "A Major Arms Exporter"
 aon.4.d:0 "Few nations sell more weapons than we do. Our exports fund research institutes and modernise industries that never produced a single rifle. Foreign governments court our favour, knowing that their armies depend on our deliveries."
 aon.4.a:0 "The world comes to our foundries."
 aon.5.t:0 "The Arsenal of the World"
 aon.5.d:0 "No other nation can rival the scale of our arms exports. Our rifles, guns and machines equip armies on every continent, and the wealth of the trade flows into every part of the economy.\n\nForeign newspapers call us the arsenal of the world. For once, the ministry does not object to the papers' choice of words."
 aon.5.a:0 "And business has never been better."
 aon.6.t:0 "[From.GetNameDefCap]: The Arsenal of the World"
 aon.6.d:0 "Figures published this week confirm that [From.GetNameDef] has become the largest arms exporter in the world. Its factories now supply armies on every continent, and its trade officials are received in foreign capitals like ambassadors.\n\nCritics warn that so much of the world's firepower should not come from a single nation. Its customers, for the moment, appear content."
 aon.6.a:0 "Interesting."
 aon.9.t:0 "Our Standing Slips"
 aon.9.d:0 "Foreign buyers have found other suppliers. With fewer contracts to fulfil, our reputation on the International Market is fading, and the ministry warns that the benefits of the arms trade will fade with it unless our exports recover."
 aon.9.a:0 "We will win them back."
 aon.10.t:0 "The Arms Exhibition Closes"
 aon.10.d:0 "For a month, military attachés from across the world watched our tanks cross the proving grounds, our guns fire and our aircraft climb. The final banquet was attended by more foreign officers than any reception in living memory.\n\nThe ministry reports that interest in our equipment has never been higher."
 aon.10.a:0 "A triumph."
 aon.20.t:0 "Studying Foreign Equipment"
 aon.20.d:0 "Our engineers have set up a workshop to dismantle the equipment we have bought abroad. Every weld and every drawing number will be examined, but resources are limited and the team can only focus on one field at a time.\n\nWhich equipment should they study first?"
 aon.20.a:0 "The rifles and support weapons."
 aon.20.b:0 "The guns."
 aon.20.c:0 "The armoured vehicles."
 aon.20.e:0 "The aircraft."
 aon.20.f:0 "How they were made, not what was made."
 aon.30.t:0 "An Order of Unusual Size"
 aon.30.d:0 "The procurement office of [?aon_partner.GetNameDef] has asked whether we could increase our deliveries well beyond the agreed amounts. Meeting the order would require extra shifts in our factories, but the payment offered is generous.\n\nAlternatively, we could decline politely and keep the additional production for our own army, which would surely appreciate it."
 aon.30.a:0 "Add the extra shifts."
 aon.30.b:0 "Our own army comes first."
 aon.31.t:0 "Bribery in the Procurement Office"
 aon.31.d:0 "An official of our export office has been caught accepting payments from a foreign agent in exchange for favourable contract terms. The press has not yet learned of the matter.\n\nWe could settle the affair quietly by compensating the injured buyers from the treasury, or open a public inquiry that will embarrass the government but restore confidence in our institutions."
 aon.31.a:0 "Settle it quietly."
 aon.31.b:0 "Hold a public inquiry."
 aon.32.t:0 "A Customer Falls Behind"
 aon.32.d:0 "The government of [?aon_partner.GetNameDef] has informed us that it cannot meet the next payment on its orders. Its ambassador asks for patience and promises that the debt will be honoured.\n\nWe could grant generous terms and earn the gratitude of a loyal customer, or insist on payment and recover what we are owed through the courts."
 aon.32.a:0 "Grant them more time."
 aon.32.b:0 "A contract is a contract."
 aon.33.t:0 "Feedback from Abroad"
 aon.33.d:0 "Officers of [?aon_partner.GetNameDef] have sent a detailed report on the performance of our equipment in their service. Their observations on wear, reliability and maintenance are valuable, and the military attaché suggests that our engineers should study them.\n\nThe report could also serve as an excellent advertisement for our sales department."
 aon.33.a:0 "Pass it to the engineers."
 aon.33.b:0 "Pass it to the sales department."
 aon.34.t:0 "The Press against the Arms Trade"
 aon.34.d:0 "A series of newspaper articles accuses the government of profiting from the wars of others. Pacifist societies have organised meetings in several cities, and members of parliament demand an explanation.\n\nThe government could answer the critics in a public debate, or let the matter pass and remind the public that the trade keeps our own workers employed and our own army strong."
 aon.34.a:0 "Answer the critics."
 aon.34.b:0 "Our workers and soldiers come first."
 aon.40.t:0 "Instructors Arrive with the Shipment"
 aon.40.d:0 "The latest delivery from [?aon_partner.GetNameDef] has arrived with a small team of instructors, sent to train our troops in the use and upkeep of the new equipment.\n\nOur officers are keen to learn from them, but our engineers would rather spend the time with the instructors' technical manuals."
 aon.40.a:0 "Let them train our troops."
 aon.40.b:0 "Give the engineers the manuals."
 aon.41.t:0 "A Faulty Batch"
 aon.41.d:0 "Quartermasters report that part of the latest shipment from [?aon_partner.GetNameDef] is defective. A number of weapons have failed inspection and must be repaired before they can be issued.\n\nWe could lodge a formal complaint, and our engineers would learn a good deal from examining the faults. Or we could quietly repair the batch ourselves and avoid a dispute with a valuable supplier."
 aon.41.a:0 "Lodge a formal complaint."
 aon.41.b:0 "Repair it quietly."
 aon.42.t:0 "Machine Tools in the Crates"
 aon.42.d:0 "Along with the equipment ordered from [?aon_partner.GetNameDef], our depots have received a set of modern machine tools for its maintenance. Our industrialists have asked to borrow them, while the army's technical office would rather study them."
 aon.42.a:0 "Lend them to industry."
 aon.42.b:0 "Let the army study them."
 won_unlocks_exhibition_tt:0 "The §YForeign Trade Office§! can now host an §YInternational Arms Exhibition§!.\n"
 won_unlocks_credit_tt:0 "The §YForeign Trade Office§! can now offer §YExport Credit Guarantees§!.\n"
 WON_MKT_OFFICE_BUTTON:0 "Foreign Trade Office"
 WON_MKT_OFFICE_BUTTON_TT:0 "Open the §YForeign Trade Office§!: requests from abroad, supply contracts, licences, exhibitions and export credits."
 WON_MKT_COURT_BUTTON:0 "[GetWonCourtButton]"
 WON_MKT_COURT_BUTTON_TT:0 "While we §Ycourt foreign buyers§!, AI nations prefer our listings on this market and buy from us more often. Expect more purchase requests. Needs the §YArms Export Agency§!."
 won_court_on_label:0 "Courting Buyers: On"
 won_court_off_label:0 "Courting Buyers: Off"
 won_court_status_on:0 "courting foreign buyers"
 won_court_status_off:0 "not courting foreign buyers"
 won_rival_line:0 "Regular customers: [?aon_client_n|0] of [?aon_client_cap|0] (more as our Market Standing grows). Main competitor: [?global.won_rival_name.GetNameDef]."
 won_rival_none:0 "Regular customers: [?aon_client_n|0] of [?aon_client_cap|0] (more as our Market Standing grows). No great power competes with us."
 won.230.t:0 "Undercut by a Rival"
 won.230.d:0 "Arms dealers from [?global.won_rival_name.GetNameDef] have offered [?global.won_rt_name.GetNameDef] the same weapons we sell, at a lower price and with generous credit. Unless we respond, our customer will take their business elsewhere for a year.\n\nMatching the offer would cost us [?won_rival_cost|2] bn."
 won.230.a:0 "Match their price ([?won_rival_cost|2] bn)."
 won.230.b:0 "Lean on them diplomatically (40 political power)."
 won.230.c:0 "Let them go."
 won_rival_match_tt:0 "[?global.won_rt_name.GetNameDef] stays with us and thinks better of us. Market Standing +5."
 won_rival_keep_tt:0 "§G65%§!: [?global.won_rt_name.GetNameDef] stays with us."
 won_rival_lost_tt:0 "§R[?global.won_rt_name.GetNameDef] stops buying from us for a year.§!"
 won.231.t:0 "A Rival's Customer Knocks"
 won.231.d:0 "The procurement office of [?global.won_rt_name.GetNameDef] is unhappy with what [?global.won_rival_name.GetNameDef] has been selling them and asks whether we would supply them instead. Taking them on will not go unnoticed in [?global.won_rival_name.GetNameDef]."
 won.231.a:0 "Welcome them as a customer."
 won.231.b:0 "Not worth the trouble."
 won_rival_won_tt:0 "[?global.won_rt_name.GetNameDef] becomes a regular customer for two years. [?global.won_rival_name.GetNameDef] resents it. Market Standing +10."
 won.232.t:0 "Embargo Imposed"
 won.232.d:0 "[?global.won_emb_name.GetNameDef] has placed an embargo on our country. Our trade agreements, investments and arms contracts with them are cancelled, and foreign investors are getting nervous about doing business with us."
 won.232.a:0 "They will regret this."
 WON_EMBARGO_TITLE:0 "Impose Embargo"
 WON_EMBARGO_ACTION_DESC:0 "Cut every economic tie with them: trade agreements, investments and arms contracts end, they cannot buy our weapons, and their investment climate drops by 8. Lasts until we lift it."
 won_embargo:0 "Impose Embargo"
 won_embargo_send:0 "Place an embargo on them? Every economic tie between us ends."
 WON_LIFT_EMBARGO_TITLE:0 "Lift Embargo"
 WON_LIFT_EMBARGO_ACTION_DESC:0 "End our embargo. Economic agreements can be signed again."
 won_lift_embargo:0 "Lift Embargo"
 won_lift_embargo_send:0 "Lift our embargo on them?"
 won_tt_not_allied:0 "Not our ally, subject or overlord"
 won_embargoed:0 "Embargo against us"
 won_poached:0 "Poached our arms customer"
 won_cat_modern:0 "State Development"
 won_cat_modern_desc:0 "Develop our states up to §Ylevel 10§!. Each programme adds a level, and every level in our country adds §G0.3 bn GDP§!. Developed states also keep permanent bonuses: §G+3%§! local construction and §G+2%§! local manpower per level.\n\n§YInfrastructure & Rail§!: +1 infrastructure and a railway upgrade to the capital.\n§YUrbanisation§!: the state grows into a bigger settlement, from village to metropolis, with more building slots and new residents.\n§YIndustrial District§!: +1 building slot and faster local construction.\n§YResource Development§!: +15% resources from the state.\n\nProgrammes running: §Y[?won_mod_active|0] of [?won_dev_max|0]§! (more as GDP grows). Development levels: §Y[?won_dev_levels|0]§!, worth §G[?won_dev_gdp|1] bn§! of GDP."
 won_develop_state:0 "Develop [FROM.GetName]"
 won_develop_state_desc:0 "Development level [?FROM.won_mod_lvl|0] of 10. Infrastructure & Rail [?FROM.won_dev_n_inf|0], Urbanisation [?FROM.won_dev_n_urb|0], Industrial [?FROM.won_dev_n_ind|0], Resources [?FROM.won_dev_n_res|0]."
 won_cost_mod:0 "§Yfrom [?won_mod_cost|2] bn§!"
 won_tt_dev_slots:0 "Fewer than [?won_dev_max|0] development programmes running"
 won_state_modern:0 "Developed State"
 won.260.t:0 "Development Plan: [?won_dev_target.GetName]"
 won.260.d:0 "The ministries have drawn up plans for [?won_dev_target.GetName], now at development level [?won_dev_lvl|0] of 10. Whatever we choose will cost [?won_dev_cost|2] bn and take about [?won_dev_dur|0] days, and will raise the state to level [?won_dev_next|0].\n\nSo far: Infrastructure & Rail [?won_dev_target.won_dev_n_inf|0], Urbanisation [?won_dev_target.won_dev_n_urb|0], Industrial Districts [?won_dev_target.won_dev_n_ind|0], Resource Development [?won_dev_target.won_dev_n_res|0]."
 won.260.a:0 "Infrastructure & Rail"
 won.260.b:0 "Urbanisation"
 won.260.c:0 "Industrial District"
 won.260.e:0 "Resource Development"
 won.260.x:0 "Not now."
 won_dev_inf_tt:0 "When finished: §G+1 infrastructure§! (or a double railway upgrade if roads are already the best), §G+1 railway level§! towards the capital, §G+0.2§! local supply."
 won_dev_urb_tt:0 "When finished: the state grows into the next settlement size, up to a metropolis (§Gmore building slots§!), §Gnew residents§! and §G+5%§! local manpower."
 won_dev_ind_tt:0 "When finished: §G+1 building slot§! and §G+5%§! local construction speed."
 won_dev_res_tt:0 "When finished: §G+15%§! resources from this state."
 won.261.t:0 "Construction Boom in [?won_dev_ev_state.GetName]"
 won.261.d:0 "Workers are pouring into [?won_dev_ev_state.GetName] and the contractors are ahead of schedule. The development programme there will finish early."
 won.261.a:0 "Excellent."
 won_dev_boom_tt:0 "The programme finishes §G45 days§! sooner."
 won.262.t:0 "Budget Overrun in [?won_dev_ev_state.GetName]"
 won.262.d:0 "Material prices have climbed and the development programme in [?won_dev_ev_state.GetName] has run over budget by [?won_dev_ev_cost|2] bn. We can pay the difference or let the work slow down."
 won.262.a:0 "Pay the [?won_dev_ev_cost|2] bn."
 won.262.b:0 "Slow the work down."
 won_dev_delay60_tt:0 "The programme takes §R60 days§! longer."
 won.263.t:0 "Local Opposition in [?won_dev_ev_state.GetName]"
 won.263.d:0 "Landowners and local notables in [?won_dev_ev_state.GetName] are fighting the development programme in the courts and the press. We can push it through, or take the time to win them over."
 won.263.a:0 "Push it through."
 won.263.b:0 "Negotiate with the locals."
 won_dev_delay45_tt:0 "The programme takes §R45 days§! longer."
 won.264.t:0 "A Model Province"
 won.264.d:0 "[?won_dev_ev_state.GetName] has reached development level 10: modern roads and railways, busy factories and growing cities. Delegations from across the country come to see how it was done."
 won.264.a:0 "Let it be an example to the nation."
