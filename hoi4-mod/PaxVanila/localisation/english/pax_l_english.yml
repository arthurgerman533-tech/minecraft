 PER_pax_kurgan_gold_desc:0 "The kings open the treasury of their ancestors. The gold of the kurgans goes to the factories."
 PER_pax_archers:0 "Horse Archers"
 PER_pax_archers_desc:0 "The Scythian horseman shoots at full gallop. Now with a rifle."
