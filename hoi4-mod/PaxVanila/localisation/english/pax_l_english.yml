 FRA_pax_druids:0 "Council of Druids"
 FRA_pax_druids_desc:0 "The confederation is ruled by druids. Their council meets in the oldest grove."
 FRA_pax_harvest:0 "Autumn Harvest"
 FRA_pax_harvest_desc:0 "The harvest of Gaul feeds half the world."
 FRA_pax_forest_forts:0 "Forest Fortresses"
