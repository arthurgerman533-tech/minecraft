 PAX_BM_2041:0 "2041: Пробуждение"
 PAX_BM_2041_DESC:0 "2041 год. Эпоха роботов. У Монолита проснулся Страж-7, его первое слово было «PAX». Степной Пакт построил свой разум, Курултай. Скоро начнётся Война двух разумов."
