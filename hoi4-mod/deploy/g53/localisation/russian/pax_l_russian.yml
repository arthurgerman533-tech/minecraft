 pax_friends_PER_desc:0 "Старые товарищи по партиям приходят в армию. Пасхалка для своих."
 pax_friends_MON:0 "Позвать друзей на службу"
 pax_friends_MON_desc:0 "Старые товарищи по партиям приходят в армию. Пасхалка для своих."
 pax_friends_BUL:0 "Позвать друзей на службу"
 pax_friends_BUL_desc:0 "Старые товарищи по партиям приходят в армию. Пасхалка для своих."
 pax_train_attack:0 "Тренировка друзей: атака"
 pax_train_attack_desc:0 "За политическую власть друзья-генералы учатся бить сильнее (+1 к атаке)."
 pax_train_defense:0 "Тренировка друзей: защита"
 pax_train_defense_desc:0 "За политическую власть друзья-генералы учатся держать оборону (+1 к защите)."
 pax_mon_tank_nation:0 "Танковая Монголия"
 pax_mon_tank_nation_desc:0 "Степь становится бронёй. Монголия получает танки, моторизацию и дух танковой державы. Генералы Арсен доступны в решении «Позвать друзей»."
 pax_mon_tank_nation_idea:0 "Танковая Монголия"
 pax_mon_tank_nation_idea_desc:0 "Вся степь работает на броню."
 pax_mon_steppe_levy:0 "Степной призыв"
 pax_mon_steppe_levy_desc:0 "Каждый всадник степи становится солдатом."
 pax_mon_horse_to_steel:0 "От коня к стали"
 pax_mon_horse_to_steel_desc:0 "Старые кавалерийские традиции пересаживаются в броню."
 pax_mon_khan_workshops:0 "Мастерские хана"
 pax_mon_khan_workshops_desc:0 "Ремонтные ямы под открытым небом дают первые моторы."
 pax_mon_iron_horde:0 "Железная орда"
 pax_mon_iron_horde_desc:0 "Орда получает оружие и порядок."
 pax_mon_tank_wedges:0 "Танковые клинья"
 pax_mon_tank_wedges_desc:0 "Лёгкие танки идут по степи быстрее любого коня."
 pax_mon_red_cap:0 "Красный колпак"
 pax_mon_red_cap_desc:0 "Знак генерала в тёмных очках виден на всю степь."
 pax_mon_great_steppe:0 "Великая степь"
 pax_mon_great_steppe_desc:0 "От Байкала до пустыни Гоби идёт одна броня."
 pax_tpl_1:0 "Шаблон: Горно-стрелковые войска"
 pax_tpl_1_desc:0 "Добавляет готовый шаблон дивизии."
 pax_tpl_2:0 "Шаблон: Пехотная дивизия (22)"
 pax_tpl_2_desc:0 "Добавляет готовый шаблон дивизии."
 pax_tpl_3:0 "Шаблон: Морпехи"
 pax_tpl_3_desc:0 "Добавляет готовый шаблон дивизии."
 pax_tpl_4:0 "Шаблон: Морпехи с танком"
 pax_tpl_4_desc:0 "Добавляет готовый шаблон дивизии."
 pax_templates_category:0 "Основные шаблоны"
 pax_templates_category_desc:0 "Автошаблоны дивизий."
 pax_auto_templates:0 "Автошаблоны дивизий"
 pax_auto_templates_desc:0 "Добавляет готовые шаблоны: горно-стрелковые войска, пехотная дивизия, морпехи и морпехи с танком."
 pax_friends_all:0 "Позвать всех друзей (проверка)"
 pax_friends_all_desc:0 "Все 29 друзей сразу, для проверки. Доступно любой державе."
 pax_friends_category:0 "Друзья"
 pax_friends_category_desc:0 "Старая гвардия сервера."
 ITA_pax_1962:0 "Ромул Двести Шестой"
 ITA_pax_1962_desc:0 "Приказал не ставить нового голема на пустой постамент: «Пусть все видят, что стражей больше нет»."
 SPR_pax_1962:0 "Суффет Гамилькар Магон"
 SPR_pax_1962_desc:0 "Глава Совета суффетов в годы Холодной войны."
 GRE_pax_1962:0 "Архонт Ирина Талассиду"
 GRE_pax_1962_desc:0 "Первая женщина-архонт Эллинской Республики."
 FRA_pax_1962:0 "Друид-канцлер Луэрн Арверн"
 FRA_pax_1962_desc:0 "Канцлер Конфедерации и хранитель старой рощи."
 ENG_pax_1962:0 "Адмирал-президент Томас Кейр"
 ENG_pax_1962_desc:0 "Капитан, который водил конвои Союза через Туман Безымянных."
 SOV_pax_1962:0 "Первый секретарь Ярослав Северин"
 SOV_pax_1962_desc:0 "Хозяин Курултая победителей. Его разведка ищет чертежи Ромеи."
 ROM_pax_1962:0 "Первый секретарь Буребиста Марин"
 ROM_pax_1962_desc:0 "Не простил Ромее старую дань и привёл Дакию в Пакт."
 TUR_pax_1962:0 "Каган Арслан"
 TUR_pax_1962_desc:0 "Каган Орды, который держит степь вместе с Севером."
 PER_pax_1962:0 "Царь Скопасис Третий"
 PER_pax_1962_desc:0 "Курганный царь, верный Курултаю."
