l_english:
 # ---------------------------------------------------------------- Dashboard
 won_dash_title:0 "Ministry of Economy"
 won_dash_subtitle:0 "Economic report for [Root.GetNameDefCap]"
 won_tb_plain:0 "[?won_treasury|1]"
 won_tb_thousands:0 "[?won_treasury_k|1]K"
 won_tt_mefo_banned:0 "No new Mefo bills for §Y3 years§!."
 won_tt_mefo_ban_active:0 "We have not defaulted on Mefo bills in the last 3 years."
 won_default:0 "Sovereign Default"
 won_default_desc:0 "We stopped paying our creditors. Nobody will lend to us on good terms for a while."
 won_close_tt:0 "Close the Ministry of Economy."
 won_card_gdp_l:0 "GDP"
 won_card_gdp_v:0 "[?won_gdp|1] bn"
 won_card_gdp_tt:0 "§YGross Domestic Product§!, in billions per year.\nBuilt from civilian (0.8 bn) and military or naval factories (0.6 bn), plus trade (§Y[?won_trade_value|1] bn§!) and foreign capital, multiplied by productivity.\n\nProductivity rises with stability, booms and technology (now §G+[?won_p_tech_pct|1]%§!); it falls with high inflation, deflation, depressions and long wars (now §R-[?won_p_war_pct|1]%§!).\n\nPopulation: §Y[?won_pop_m|1] million§!. State development: §Y[?won_dev_levels|0]§! levels, §G+[?won_dev_gdp|1] bn§!. GDP per capita: §Y[?won_gdppc|0] dollars§! a year. Share of world GDP: §Y[?won_gdp_share|1]%§!.\nMilitary spending: §Y[?won_mil_bn|1] bn§! ([?won_mil_pct|1]% of GDP).\nWorld rank: §Y#[?won_rank_gdp|0]§! in GDP, §Y#[?won_rank_pc|0]§! per capita. Open §YWorld Economic League§! in the decisions."
 won_card_growth_l:0 "Growth (year)"
 won_card_growth_v:0 "[?won_growth_y|+1]%"
 won_card_growth_tt:0 "GDP compared with twelve months ago. Strong growth lifts market confidence; a shrinking economy drags it down."
 won_card_treasury_l:0 "Treasury"
 won_card_treasury_v:0 "[?won_treasury|+1] bn"
 won_card_treasury_tt:0 "§YNational treasury§! (negative = public debt).\n\n§GIncome last month: [?won_income|2] bn§!\n  Taxes: [?won_inc_tax|2]\n  Trade agreements: [?won_inc_trade|2]\n  Dividends from abroad: [?won_inc_div|2]\n  Our firms abroad: [?won_inc_svc|2]\n  Interest: [?won_inc_interest|2]\n  Corporate tax on foreign firms: [?won_inc_corp|2]\n  Licence royalties: [?won_inc_roy|2]\n  Resource exports: [?won_inc_res|2]\n  Consumer spending: [?won_inc_cons|2]\n\n§RSpending last month: [?won_spending|2] bn§!\n  Administration: [?won_exp_admin|2]\n  Public programmes: [?won_exp_prog|2]\n  Budget priority: [?won_exp_policy|2]\n  Interest on debt: [?won_exp_interest|2]\n  Foreign firms we hired: [?won_exp_svc|2]\n  Dividends paid to foreign investors: [?won_exp_div|2]"
 won_card_inflation_l:0 "Inflation"
 won_card_inflation_v:0 "[?won_inflation|1]%"
 won_card_inflation_tt:0 "§YInflation§! moves a fifth of the way to its target each month.\nRaised by deficits, cheap money, war, printing money and booms. Long wars, heavy arms imports, military spending above 25% of GDP and unrest add §Y[?won_infl_extra|1]§! points right now (at most 5). Lowered by tight money, trade and recessions.\n\nAbove 3%: consumer goods rise. Above 5%: stability falls. Above 6%: productivity suffers. Above 25%: hyperinflation.\nBelow 0%: deflation chokes growth."
 won_card_credit_l:0 "Credit rating"
 won_card_credit_v:0 "[GetWonCredit]"
 won_card_credit_tt:0 "Rating by reserves or debt as a share of GDP.\n§GAAA§!: reserves above 30% of GDP (+5% political power).\n§RBB§! and worse: debt above 60% of GDP raises interest; above 80% costs stability and political power; above 150% construction suffers too."
 won_conf_label:0 "Market confidence"
 won_conf_value:0 "[?won_confidence|0] / 100"
 won_conf_tt:0 "§YMarket confidence§! sets the mood of the economy: every point above 50 gives +0.3% construction speed and +0.1% factory output (and the reverse below 50).\n\nIt drifts toward a target built from stability, growth, inflation, reserves or debt, trade agreements, openness, interest rates, war and your economic system. Events and decisions give it short shocks."
 won_dash_phase:0 "Economy: [GetWonPhase]"
 won_phase_tt:0 "[GetWonPhaseDesc]"
 won_chart_gdp_title:0 "GDP, last 24 months"
 won_chart_gdp_range:0 "[?won_chart_gmin|1] to [?won_chart_gmax|1] bn"
 won_chart_tre_title:0 "Treasury, last 24 months"
 won_chart_tre_range:0 "scale +/- [?won_chart_tmax|1] bn"
 won_sys_header:0 "Economic System"
 won_sys_name:0 "[GetWonSystem]"
 won_sys_desc:0 "[GetWonSystemDesc]"
 won_sys_tt:0 "Your economic system is a national spirit with its own bonuses, and it unlocks a signature decision in the §YMinistry of Economy§! decisions.\nWhich systems you may pick depends on your ideology."
 won_reform_label:0 "Reform"
 won_reform_tt:0 "Choose a different economic system that fits your ideology.\nCosts §Y75§! political power, causes a 120-day transition and can be done once every 24 months.\n\nMonths until reform is possible: §Y[?won_system_cd|0]§!"
 won_pol_header:0 "Policies"
 won_pol_tax_l:0 "Tax rate"
 won_pol_tax_v:0 "[GetWonTax]"
 won_pol_tax_tt:0 "§YLow§!: taxes 1.0% of GDP a month, +5% stability, +4% construction.\n§YNormal§!: taxes 1.4% of GDP a month.\n§YHigh§!: taxes 1.9% of GDP a month, -5% stability, +10% political power, -4% construction.\n\nAdministration costs 1.2% of GDP a month. Taxes are collected at the §Ylowest§! rate you held since the last budget, so switching on the last day does not pay. Each policy can change once every 30 days."
 won_pol_rate_l:0 "Interest rates"
 won_pol_rate_v:0 "[GetWonRate]"
 won_pol_rate_tt:0 "§YLow§!: +6% construction, +4 confidence, inflation target +2.5, cheaper debt.\n§YNeutral§!: no effect.\n§YHigh§!: -8% construction, -4 confidence, inflation target -2.5, +2% stability, dearer debt.\n\nDebt interest uses the §Yhighest§! rate held since the last budget; inflation uses the §Ylowest§!. Each policy can change once every 30 days."
 won_pol_budget_l:0 "Budget priority"
 won_pol_budget_v:0 "[GetWonBudget]"
 won_pol_budget_tt:0 "Any priority costs 0.3% of GDP a month, billed whenever it was active at any point since the last budget.\n§YBalanced§!: no cost, no effect.\n§YIndustry§!: +5% factory output, +5% production efficiency cap.\n§YInfrastructure§!: +25% infrastructure and +5% construction speed.\n§YWelfare§!: +7% stability, -2% consumer goods.\n§YMilitary§!: +7% war support, +15% military factory construction.\n\nEach policy can change once every 30 days."
 won_pol_open_l:0 "Foreign capital"
 won_pol_open_v:0 "[GetWonOpen]"
 won_pol_open_tt:0 "§YOpen§!: +4 market confidence; foreign investors may offer to build factories here, and other countries can invest through diplomacy. Capital can also flee in bad times.\n§YClosed§!: no foreign investment and no capital flight.\nCommand Economy, War Communism and Autarky are always closed."
 won_trade_header:0 "Trade and Capital"
 won_trade_line1:0 "Trade deals: §Y[?won_trade_count|0]/[?won_trade_max|0]§!  Pacts: §Y[?won_pact_count|0]/4§!  Climate: §Y[?won_climate|0]§!"
 won_trade_line2:0 "Invested abroad: §Y[?won_inv_total|1] bn§! (+[?won_inv_div|2]/mo)   Capital here: §Y[?won_fdi_in|1] bn§!"
 won_trade_line3:0 "Firms hired: §Y[?won_hire_count|0]/2§!  Abroad: §Y[?won_sold_count|0]/3§!  Arms: §Y[?won_arms_rev_12|1] bn/yr§!"
 won_trade_tt:0 "§YInvestment climate§! [?won_climate|0]/100: each month there is a §Y[?won_fdi_chance|1]%§! chance a foreign investor offers to build a factory here. See §YGlobal Markets§! decisions.\n\n§YTrade agreements§!: each gives up to -1.5% consumer goods (at most -9%), lowers inflation and adds trade income and GDP. A partner counts fully only if its GDP is at least a quarter of ours; smaller partners count in proportion.\n§YConstruction pacts§!: up to +3% construction speed each (up to 4), scaled the same way. Need a trade agreement first.\n\nOpen the §Ydiplomacy screen§! of any country to propose them.\n\n§YLaws§!: [?won_law_cl|+0] investment climate (trade law [?won_law_cl_trade|+0], economy law [?won_law_cl_eco|+0]), trade agreements x[?won_law_trade|2], consumer spending [?won_law_cons_pct|2]% of GDP a month. Free Trade and Export Focus attract investors and buyers; Closed Economy scares them off. Civilian Economy pleases investors and earns the most from consumer spending; War Economy and Total Mobilisation cost climate, taxes and push up prices.\nEmbargoes against us: [?won_embargo_n|0] (-8 climate and -10% trade value each).\n\n§YResource exports§!: [?won_res_units|0] units sold abroad earn §G[?won_inc_res|2] bn§! a month on top of the factories the buyers pay. Importing costs you nothing extra."
 won_capital_tt:0 "§YInvest Capital§! (diplomacy): pay 1.5 bn to build a civilian factory in another country, then collect 1.5% of it every month for as long as you stay at peace. War or nationalisation wipes the stake.\nForeign capital here raises your production efficiency cap (+0.5% per bn, up to +10%), but you pay the dividends."
 won_contracts_tt:0 "§YArms exports§!: [?won_arms_rev_12|1] bn over the last year. Market Standing: [GetAonTierName]. Exports count towards GDP.\n\n§YHire their Companies§! (diplomacy): for 12 months their firms add §G+[?won_hire_bonus_pct|1]%§! construction speed (about three civilian factories of work, at most +10%) for a fee of [?won_c_fee|2] bn a month.\n§YOffer our Services§! (diplomacy): our firms work for them; they pay us 0.4% of their GDP a month (0.02 to 0.06 bn) and each contract uses one of our civilian factories."
 won_effects_header:0 "National Economy"
 won_effects_line1:0 "Construction [?won_pct_build|+0]%   Factory output [?won_pct_output|+0]%"
 won_effects_line2:0 "Consumer goods [?won_pct_cg|-0]%   Stability [?won_pct_stab|+0]%"
 won_effects_tt:0 "The sum of confidence, phase, inflation, policies, debt, trade, pacts, companies and foreign capital. It appears as the §YNational Economy§! national spirit. Your economic system's spirit comes on top of this."
 won_budget_line:0 "Monthly balance: [?won_balance|+2] bn   Reserves: [?won_reserve_ratio|%0]"
 won_tip:0 "§YMinistry of Economy§!\nSet taxes, interest rates and budget priorities here.\n\nOpen any country's §Ydiplomacy screen§! to sign trade agreements and construction pacts, invest capital, hire its companies or sell your own services. More tools are in the §YMinistry of Economy§! and §YBusiness and Contracts§! decisions."
 won_topbar_text:0 "[GetWonTreasuryShort]"
 won_topbar_tt:0 "§YEconomic System Rework§!\nGDP: §Y[?won_gdp|1] bn§! ([?won_growth_y|+1]% in a year), world rank §Y#[?won_rank_gdp|0]§!\nTreasury: [?won_treasury|+1] bn ([?won_balance|+2] bn/month)\nInflation: [?won_inflation|1]%   Confidence: [?won_confidence|0]\nEconomy: [GetWonPhase]\nForeign Trade Office: §Y[?won_q_count|0]§! requests waiting\n\n§GClick to open the Ministry of Economy.§!"
 # ---------------------------------------------------------------- Scripted loc values
 won_sys_name_0:0 "No system (choose one)"
 won_sys_short_0:0 "The regime has not chosen an economic system yet."
 won_sys_short_1:0 "Free markets, low taxes, fast building. Booms and busts are wilder."
 won_sys_short_2:0 "The state steers demand. Deficits cause less inflation."
 won_sys_short_3:0 "Generous welfare and stable society, paid by higher taxes."
 won_sys_short_4:0 "Plans and quotas. Price control, but little market confidence."
 won_sys_short_5:0 "Socialism with markets at the edges. Flexible and steady."
 won_sys_short_6:0 "Everything for the front. Huge output, miserable home front."
 won_sys_short_7:0 "Capital and labour harnessed to the state in chambers."
 won_sys_short_8:0 "Self-sufficiency. More resources, but no trade agreements."
 won_sys_short_9:0 "An economy built for war: arms first, butter later."
 won_sys_short_10:0 "State-led industry and strong political control."
 won_sys_short_11:0 "Farms first. Stable and frugal, but industry lags."
 won_sys_short_12:0 "Exports and shipping. More and richer trade agreements."
 won_phase_1:0 "§RDepression§!"
 won_phase_2:0 "§ORecession§!"
 won_phase_3:0 "§YStable§!"
 won_phase_4:0 "§GExpansion§!"
 won_phase_5:0 "§GBoom§!"
 won_phase_desc_1:0 "§RDepression§!: -6% stability, +5% consumer goods, -5% productivity. Inflation sinks."
 won_phase_desc_2:0 "§ORecession§!: -2% stability."
 won_phase_desc_3:0 "§YStable§!: no phase effects."
 won_phase_desc_4:0 "§GExpansion§!: business is good. Rally and consumer boom events become possible."
 won_phase_desc_5:0 "§GBoom§!: +3% stability, -3% consumer goods, +3% productivity, but inflation climbs."
 won_credit_1:0 "§GAAA§!"
 won_credit_2:0 "§GAA§!"
 won_credit_3:0 "§YA§!"
 won_credit_4:0 "§YBBB§!"
 won_credit_5:0 "§OBB§!"
 won_credit_6:0 "§RB§!"
 won_credit_7:0 "§RC§!"
 won_tax_1:0 "Low"
 won_tax_2:0 "Normal"
 won_tax_3:0 "High"
 won_rate_1:0 "Low"
 won_rate_2:0 "Neutral"
 won_rate_3:0 "High"
 won_budget_0:0 "Balanced"
 won_budget_1:0 "Industry"
 won_budget_2:0 "Infrastructure"
 won_budget_3:0 "Welfare"
