 ROM_pax_her:0 "Наследие: Медь Каэр-Тала"
 ROM_pax_her_desc:0 "Дакия раскопала рудники Медного Союза до самого дна. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 ROM_pax_fai:0 "Государственная вера: Без страха смерти"
 ROM_pax_fai_desc:0 "Залмоксис. Даки идут в бой, потому что не боятся смерти."
 ROM_pax_old_tribute:0 "Старая дань не забыта"
 ROM_pax_old_tribute_desc:0 "В 117 году горы рухнули, и голодная Дакия стала первым вассалом Ромеи. Даки помнят."
 ROM_pax_sarmizegetusa:0 "Сармизегетуза Майнинг"
 ROM_pax_sarmizegetusa_desc:0 "Царские рудники становятся компанией. Медь идёт на заводы."
 ROM_pax_steam:0 "Паровые машины Каэр-Тала"
 ROM_pax_steam_desc:0 "В рудниках нашли чертежи паровых машин. С них начался Век стали."
 ROM_pax_mountain_forts:0 "Горные крепости"
 ROM_pax_mountain_forts_desc:0 "Горы Дакии сами по себе крепость."
 ROM_pax_join_steppe:0 "Голос на Курултае"
 ROM_pax_join_steppe_desc:0 "Дакия не простила Ромее старую дань и идёт к восточным державам."
