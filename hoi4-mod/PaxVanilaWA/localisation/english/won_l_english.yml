 # --- Market Standing spirits ---
 aon_standing_0:0 "No Market Standing"
 aon_standing_1:0 "Minor Arms Supplier"
 aon_standing_1_desc:0 "Our foundries have begun to fill orders from abroad. The sums are modest, but foreign currency is foreign currency, and the workshops that earn it are learning to work to a higher standard."
 aon_standing_2:0 "Regional Arms Supplier"
 aon_standing_2_desc:0 "Neighbouring general staffs now count on our deliveries. Steady orders keep our production lines running at full capacity, and the revenue eases the burden on the domestic economy."
 aon_standing_3:0 "Established Arms Exporter"
 aon_standing_3_desc:0 "Our name is known in procurement offices across the world. Export contracts finance new machinery, and the government enjoys the confidence that comes with a full order book."
 aon_standing_4:0 "Major Arms Exporter"
 aon_standing_4_desc:0 "Few nations can match the volume and quality of our arms exports. The trade has become a pillar of the national economy, funding research and modernising entire industries."
 aon_standing_5:0 "Arsenal of the World"
 aon_standing_5_desc:0 "Half the armies of the world march with weapons stamped with our foundries' marks. The wealth of the arms trade flows into every corner of our economy, and no government can afford to ignore us."
 aon_export_credit_guarantees:0 "Export Credit Guarantees"
 aon_export_credit_guarantees_desc:0 "The state underwrites the payments of foreign buyers, allowing them to order now and pay later. Our arms are suddenly within reach of every treasury."
