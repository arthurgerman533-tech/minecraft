 won_cat_programmes:0 "Public Programmes"
 won_cat_programmes_desc:0 "Standing programmes cost a share of GDP every month, but they make whole families of crises §Yfour times rarer§! and give you a cheap way out when one still happens.\n\nActive programmes: §Y[?won_prog_count|0]§!   Monthly cost: §Y[?won_exp_prog|2] bn§!\n\nA programme ended early is still billed for that month and cannot be restarted for 90 days."
 won_tt_prog_cooldown:0 "This programme was ended less than 90 days ago."
 won_tt_prog_end:0 "The programme stops at once. This month is still billed, and it cannot be restarted for 90 days."
 won_prog_farm_start:0 "Fund: Farm Subsidies and Grain Reserves"
 won_prog_farm_start_desc:0 "Guaranteed prices for farmers and state granaries for the lean years.\n\nCosts §Y[?won_c_prog_farm|2] bn§! a month (0.15% of GDP). Passive: §G+1% stability§!.\n§GProtects against:§! droughts, crop blights, livestock plagues, farmers' protests and famine."
 won_prog_farm_end:0 "End: Farm Subsidies and Grain Reserves"
 won_prog_farm_end_desc:0 "Stop paying §Y[?won_c_prog_farm|2] bn§! a month. Protection and the passive bonus end at once."
 won_tt_prog_farm:0 "Starts §YFarm Subsidies and Grain Reserves§!: §R-[?won_c_prog_farm|2] bn§! every month, §G+1% stability§!, and protection against droughts, crop blights, livestock plagues, farmers' protests and famine."
 won_prog_labour_start:0 "Fund: Labour Relations Board"
 won_prog_labour_start_desc:0 "A permanent board where unions and employers settle disputes before they turn into strikes.\n\nCosts §Y[?won_c_prog_labour|2] bn§! a month (0.1% of GDP). Passive: §G+1% stability§!.\n§GProtects against:§! general strikes, dock and mine strikes and wage disputes."
 won_prog_labour_end:0 "End: Labour Relations Board"
 won_prog_labour_end_desc:0 "Stop paying §Y[?won_c_prog_labour|2] bn§! a month. Protection and the passive bonus end at once."
 won_tt_prog_labour:0 "Starts §YLabour Relations Board§!: §R-[?won_c_prog_labour|2] bn§! every month, §G+1% stability§!, and protection against general strikes, dock and mine strikes and wage disputes."
 won_prog_bank_start:0 "Fund: Banking Supervision"
 won_prog_bank_start_desc:0 "Inspectors, reserve requirements and a deposit insurance fund.\n\nCosts §Y[?won_c_prog_bank|2] bn§! a month (0.1% of GDP). Passive: §G+3 market confidence§!.\n§GProtects against:§! market crashes, bank runs, insurance failures, swindles, bubbles and currency attacks."
 won_prog_bank_end:0 "End: Banking Supervision"
 won_prog_bank_end_desc:0 "Stop paying §Y[?won_c_prog_bank|2] bn§! a month. Protection and the passive bonus end at once."
 won_tt_prog_bank:0 "Starts §YBanking Supervision§!: §R-[?won_c_prog_bank|2] bn§! every month, §G+3 market confidence§!, and protection against market crashes, bank runs, insurance failures, swindles, bubbles and currency attacks."
 won_prog_safety_start:0 "Fund: Industrial Safety Inspectorate"
 won_prog_safety_start_desc:0 "Factory inspectors, mine rescue teams and grid maintenance crews.\n\nCosts §Y[?won_c_prog_safety|2] bn§! a month (0.1% of GDP). Passive: §G+1% production efficiency cap§!.\n§GProtects against:§! industrial disasters, mine collapses, factory fires, blackouts and railway accidents."
 won_prog_safety_end:0 "End: Industrial Safety Inspectorate"
 won_prog_safety_end_desc:0 "Stop paying §Y[?won_c_prog_safety|2] bn§! a month. Protection and the passive bonus end at once."
 won_tt_prog_safety:0 "Starts §YIndustrial Safety Inspectorate§!: §R-[?won_c_prog_safety|2] bn§! every month, §G+1% production efficiency cap§!, and protection against industrial disasters, mine collapses, factory fires, blackouts and railway accidents."
 won_prog_health_start:0 "Fund: Public Health Service"
 won_prog_health_start_desc:0 "Clinics, vaccination drives and sanitary inspectors in every city.\n\nCosts §Y[?won_c_prog_health|2] bn§! a month (0.15% of GDP). Passive: §G+1% stability§!.\n§GProtects against:§! epidemics, typhus and slum outbreaks."
 won_prog_health_end:0 "End: Public Health Service"
 won_prog_health_end_desc:0 "Stop paying §Y[?won_c_prog_health|2] bn§! a month. Protection and the passive bonus end at once."
 won_tt_prog_health:0 "Starts §YPublic Health Service§!: §R-[?won_c_prog_health|2] bn§! every month, §G+1% stability§!, and protection against epidemics, typhus and slum outbreaks."
 won_prog_graft_start:0 "Fund: Anti-Corruption Bureau"
 won_prog_graft_start_desc:0 "Auditors and investigators who answer to no ministry.\n\nCosts §Y[?won_c_prog_graft|2] bn§! a month (0.1% of GDP). Passive: §G+3% political power gain§!.\n§GProtects against:§! corruption scandals, black markets, smuggling, tax evasion and procurement bribery."
 won_prog_graft_end:0 "End: Anti-Corruption Bureau"
 won_prog_graft_end_desc:0 "Stop paying §Y[?won_c_prog_graft|2] bn§! a month. Protection and the passive bonus end at once."
 won_tt_prog_graft:0 "Starts §YAnti-Corruption Bureau§!: §R-[?won_c_prog_graft|2] bn§! every month, §G+3% political power gain§!, and protection against corruption scandals, black markets, smuggling, tax evasion and procurement bribery."
 won_prog_relief_start:0 "Fund: Disaster Relief and Flood Control"
 won_prog_relief_start_desc:0 "Dykes, relief depots and emergency crews ready before disaster strikes.\n\nCosts §Y[?won_c_prog_relief|2] bn§! a month (0.1% of GDP). Passive: §G+5% infrastructure construction speed§!.\n§GProtects against:§! floods, earthquakes and harsh winters."
 won_prog_relief_end:0 "End: Disaster Relief and Flood Control"
 won_prog_relief_end_desc:0 "Stop paying §Y[?won_c_prog_relief|2] bn§! a month. Protection and the passive bonus end at once."
 won_tt_prog_relief:0 "Starts §YDisaster Relief and Flood Control§!: §R-[?won_c_prog_relief|2] bn§! every month, §G+5% infrastructure construction speed§!, and protection against floods, earthquakes and harsh winters."
 won_prog_reserves_start:0 "Fund: Strategic Commodity Reserves"
 won_prog_reserves_start_desc:0 "State stockpiles of fuel, coal and rubber that can be released when prices spike.\n\nCosts §Y[?won_c_prog_reserves|2] bn§! a month (0.15% of GDP). Passive: §G+2% resource gain efficiency§!.\n§GProtects against:§! oil shocks, rubber shortages and commodity price spikes."
 won_prog_reserves_end:0 "End: Strategic Commodity Reserves"
 won_prog_reserves_end_desc:0 "Stop paying §Y[?won_c_prog_reserves|2] bn§! a month. Protection and the passive bonus end at once."
 won_tt_prog_reserves:0 "Starts §YStrategic Commodity Reserves§!: §R-[?won_c_prog_reserves|2] bn§! every month, §G+2% resource gain efficiency§!, and protection against oil shocks, rubber shortages and commodity price spikes."
