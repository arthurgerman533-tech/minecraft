 PAX_economy_category:0 "Economy"
 PAX_economy_category_desc:0 "A simplified Millennium Dawn style economy menu: taxes, funding, trade, energy. One mode is active per group and can be changed for political power."
 PAX_eco_tax_low:0 "Taxes: Low taxes"
 PAX_eco_tax_low_desc:0 "The treasury is poorer, the people are happier. Group 'Taxes' mode: Low taxes."
 PAX_eco_tax_mid:0 "Taxes: Moderate taxes"
 PAX_eco_tax_mid_desc:0 "The middle road, no bonuses or penalties. Group 'Taxes' mode: Moderate taxes."
 PAX_eco_tax_high:0 "Taxes: High taxes"
 PAX_eco_tax_high_desc:0 "A full treasury and a grumbling public. Group 'Taxes' mode: High taxes."
 PAX_eco_fund_civ:0 "Funding: Civilian focus"
 PAX_eco_fund_civ_desc:0 "Factories and construction are cheaper, the army waits. Group 'Funding' mode: Civilian focus."
 PAX_eco_fund_bal:0 "Funding: Balanced budget"
 PAX_eco_fund_bal_desc:0 "Even funding for everything. Group 'Funding' mode: Balanced budget."
 PAX_eco_fund_mil:0 "Funding: Military focus"
 PAX_eco_fund_mil_desc:0 "The army gets more, construction is slower. Group 'Funding' mode: Military focus."
 PAX_eco_trade_open:0 "Trade: Open markets"
 PAX_eco_trade_open_desc:0 "More trade and more respect abroad. Group 'Trade' mode: Open markets."
 PAX_eco_trade_mix:0 "Trade: Selective trade"
 PAX_eco_trade_mix_desc:0 "We trade with whoever is profitable. Group 'Trade' mode: Selective trade."
 PAX_eco_trade_closed:0 "Trade: Protectionism"
 PAX_eco_trade_closed_desc:0 "Home factories grow, foreign goods cost more. Group 'Trade' mode: Protectionism."
 PAX_eco_energy_fossil:0 "Energy and fuel: Oil and coal"
 PAX_eco_energy_fossil_desc:0 "Cheap and fast, but more fuel is burned. Group 'Energy and fuel' mode: Oil and coal."
 PAX_eco_energy_atom:0 "Energy and fuel: Nuclear power"
 PAX_eco_energy_atom_desc:0 "Costly start, then steady power. Group 'Energy and fuel' mode: Nuclear power."
 PAX_eco_energy_green:0 "Energy and fuel: Green energy"
 PAX_eco_energy_green_desc:0 "A clean grid and lower fuel costs. Group 'Energy and fuel' mode: Green energy."
