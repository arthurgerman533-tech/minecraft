 GER_pax_her:0 "Наследие: Железо и уголь"
 GER_pax_her_desc:0 "Германские королевства сидят на самых богатых рудах мира. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 GER_pax_fai:0 "Государственная вера: Молот Донара"
 GER_pax_fai_desc:0 "Вотан и Донар. В грозу германские полки идут вперёд."
 GER_pax_revanche:0 "Реванш за 1914"
 GER_pax_revanche_desc:0 "Рейх проиграл Первую Великую войну. Канцлер обещает, что второй раз так не будет."
 GER_pax_teutoburg:0 "Тевтобург Индастриз"
 GER_pax_teutoburg_desc:0 "Старый лес наконец построил свой каменный город, и тот вышел больше всех."
 GER_pax_army:0 "Армия Рейха"
 GER_pax_army_desc:0 "Штаб изучает ошибки окопной войны."
 GER_pax_iron_north:0 "За железом на север"
 GER_pax_iron_north_desc:0 "Железо и уголь Северного Царства. Так началась Вторая Великая война."
 GER_pax_before_winter:0 "Наступать до зимы"
 GER_pax_before_winter_desc:0 "Канцлер верит, что армия успеет до снега. Так думали и в 1942 году."
 GER_pax_winter_lesson:0 "Урок метели"
 GER_pax_winter_lesson_desc:0 "Летописцы Форума писали: «Зима всегда на стороне того, кто дома». Рейх шьёт зимние шинели."
