 FRA_pax_druids:0 "Совет друидов"
 FRA_pax_druids_desc:0 "Конфедерацией правят друиды. Их совет собирается в самой старой роще."
 FRA_pax_harvest:0 "Осенний урожай"
 FRA_pax_harvest_desc:0 "Урожай Галлии кормит полмира."
 FRA_pax_forest_forts:0 "Лесные крепости"
 FRA_pax_forest_forts_desc:0 "Каждая роща может стать крепостью. Галлы прячут пушки под дубами."
 FRA_pax_druidicon:0 "Друидикон"
 FRA_pax_druidicon_desc:0 "Друиды изучают редстоун так же, как травы. Из их лабораторий выйдет целая корпорация."
 FRA_pax_join_pax:0 "Место в Союзе PAX"
 FRA_pax_join_pax_desc:0 "Галлия и Ромея вместе стояли в окопах 1914 года."
 ENG_pax_ind1:0 "Индустриализация"
 ENG_pax_ind1_desc:0 "Первый шаг любой державы Века стали: заводы, железные дороги, уголь."
 ENG_pax_ind2:0 "Шахтёрские артели"
 ENG_pax_ind2_desc:0 "Артели шахтёров копают глубже, как когда-то мастера Каэр-Тала."
 ENG_pax_ind3:0 "Военная экономика"
 ENG_pax_ind3_desc:0 "Заводы переходят на снаряды и винтовки. Казна наполняется военными заказами."
 ENG_pax_mil1:0 "Мобилизация"
 ENG_pax_mil1_desc:0 "Каждый житель получает винтовку и паёк. Резервисты возвращаются в казармы."
 ENG_pax_mil2:0 "Укрепления"
 ENG_pax_mil2_desc:0 "Стены вокруг стен. Ромея научила весь мир, что крепость переживёт любой набег."
 ENG_pax_mil3:0 "Тотальная война"
 ENG_pax_mil3_desc:0 "Вся нация становится армией. Нельзя одновременно воевать мечом и держать соседей в вассалах."
 ENG_pax_eco1:0 "Торговые пути"
 ENG_pax_eco1_desc:0 "Караваны и корабли снова ходят по старым дорогам. Торговля кормит казну."
 ENG_pax_eco2:0 "Дипкорпус"
 ENG_pax_eco2_desc:0 "Со времён Договора у Монолита в 251 году пакт о ненападении стоит дешевле войны."
 ENG_pax_eco3:0 "Гегемония"
 ENG_pax_eco3_desc:0 "Держава правит не мечом, а данью. Соседи платят, а казна растёт."
 ENG_pax_her:0 "Наследие: Республика мореходов"
 ENG_pax_her_desc:0 "Каждый гражданин Союза моряк, и каждый порт его дом. Наследие десяти держав лора, как фокус «her» на сервере PaxVanila."
 ENG_pax_fai:0 "Государственная вера: Союз Числа"
 ENG_pax_fai_desc:0 "Школа Пифагора. Мореходы верят, что у всего есть число, даже у удачи."
 ENG_pax_said_no:0 "Мы сказали «нет»"
 ENG_pax_said_no_desc:0 "Память о войне за независимость 1781 года объединяет все острова."
 ENG_pax_ports:0 "Порты на всех берегах"
 ENG_pax_ports_desc:0 "Эпоха парусов оставила Союзу порты по всему миру."
 ENG_pax_fog:0 "Туман Безымянных"
 ENG_pax_fog_desc:0 "В 1700 году флот пропал в тумане. Союз до сих пор посылает туда разведчиков."
 ENG_pax_sailor_fleet:0 "Флот мореходов"
 ENG_pax_sailor_fleet_desc:0 "Республика мореходов строит новый флот."
 ENG_pax_join_pax:0 "Место в Союзе PAX"
 ENG_pax_join_pax_desc:0 "Острова никому не платят дань, но клятву PAX дают сами."
