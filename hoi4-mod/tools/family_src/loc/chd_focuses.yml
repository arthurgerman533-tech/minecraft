 MON_the_mongolian_culture:0 "The Mongolian Culture"
 
 MON_the_peoples_army:0 "The People's Army of Mongolia"
 
 MON_grain_exports:0 "Grain Exports"
 MON_grain_imports:0 "Mongolian War Imports"
 MON_grain_imports_desc:0 "Mongolia is supplying us with fuel, weaponry and grain to secure that we can continue our war effort."
 
 MON_supplies_for_war:0 "Mongolian Supplies For War"
 # Decisions
 MON_stop_studyign_the_china_war:0 "Stop Studying of China War"
 MON_smuggle_guns_to_china:0 "Smuggle Guns To China"
 MON_smuggle_guns_to_china_desc:0 "Smuggling weapons over to China will allow us to keep them better equipped while fighting the Japanese menance."
 MON_request_control_of_tanna_tuva:0 "Request Control of Tanna Tuva"
 MON_request_control_of_chinese_territory:0 "Request Control Of Chinese Claims"
 MON_offer_china_protection:0 "Offer China \"Protection\""
 
 MON_the_revolutionary_mongolia_tank_brigade:0 "Deploy the 112th \"Revolutionary Mongolia\" Tank Brigade"
 MON_the_revolutionary_tank_brigade_tt:0 "Gains a division with 2 §YLight Armor§! Brigade, 2 §YMotorised§! Brigade and 1 §YMotorised Art.§! Brigade. This division also has an §YEngineer§! and §YAnti-Tank§! Support Company."
 
 MON_promote_our_industrial_centres:0 "Promote Industrial Centres"
 MON_celebrate_our_industrial_expansion:0 "Celebrate Successful Industrial Expansion"
 
 MON_secure_loyalty_in_government:0 "Secure Loyalty In Government"
 MON_semi_autonomious_region_in_china:0 "Give Autonomy In Chinese Region"
 MON_power_struggle:0 "Power Struggle"
 MON_power_struggle_desc:0 "There is a slow but undeniable process where the Soviets are taking care control over our nation, and if not stopped Khorloogiin Choibalsan will take full power over the nation."
 the_transition_to_new_leader_cant_be_stopped:0 "The focus §YAnti-Propaganda Campaign§! has been completed and due to that the mission can't be stopped."
 this_will_remove_the_current_leader_only:0 "When this decision times out the current leader will be replaced by §YKhorloogiin Choibalsan§!."
 # Focus
 MON_continue_the_industrialisation:0 "Continue The Industrialisation"
 MON_continue_the_industrialisation_desc:0 "The current industrialisation that has occured in Mongolia needs to be continued and move towards our own Five Year Plan."
 MON_long_term_self_reliance:0 "Long Term Self-Reliance"
 MON_long_term_self_reliance_desc:0 "Relying to heavily on the Soviets will not cause us any good in the long run, despite how tempting their resources are we need to make sure we achieve the revolution by our own means."
 MON_industrial_reorganisation:0 "Industrial Reorganisation"
 MON_industrial_reorganisation_desc:0 "Reorganising the industry we have will allow us to make better use of it."
 MON_further_cooperation_with_soviets:0 "Further Soviet Cooperation"
 MON_further_cooperation_with_soviets_desc:0 "The Soviets have been vital to our industrialisation so far, to not use their help now would be foolish."
 MON_invite_soviet_experts:0 "Invite Soviet Experts"
 MON_invite_soviet_experts_desc:0 "Getting to know Soviet Know-How will be more important than ever before, their aid will provide us with what we need to improve our industries."
 MON_collectivisation_effort:0 "Collectivization"
 MON_collectivisation_effort_desc:0 "Collectivization is the tool we need to proper modernise Mongolia and we need to take after the Soviet Union in this regard."
 
 MON_industrial_independence:0 "Industrial Independence"
 MON_industrial_independence_desc:0 "By going further we'll be able to stand on more equal ground next to the Soviet Union and make sure we become a nation that can stand on its own two legs."
 cannot_remove_the_economy_penalty_unless_at_war_with_this_path_tt:0 "§RCannot Remove§! the §YInefficient Economy§! penalty until at War With A §YMajor§! Nation."
 MON_rural_investments:0 "Rural Investments"
 MON_rural_investments_desc:0 "Investing and creating industries inside our rural regions will make them more self-reliant, rather than having to travel as far into the country for their needs."
 MON_one_leg_forward:0 "One Leg Forward"
 MON_one_leg_forward_desc:0 "We'll need to take onoe step forward and strengthen our industries, for the greater good of Mongolia."
 MON_prepare_rural_arsenal:0 "Rural Arsenals"
 MON_prepare_rural_arsenal_desc:0 "It's not only up to our industrial heartland in the South to provide for our armies, so much the rural regions as well."
 MON_secure_our_resources:0 "Secure Our Resources"
 MON_secure_our_resources_desc:0 "We need to make sure our resources are put to the best use possible, we cannot allow them to go to waste."
 MON_revise_our_industrial_plans:0 "Revise Our Industrial Plans"
 MON_revise_our_industrial_plans_desc:0 "While we're not ready for our own Five Year Plan, we need to first revise our current plans."
 MON_for_the_greater_good:0 "For The Greater Good"
 MON_for_the_greater_good_desc:0 "The outbreak of war hasn't worked well for our industries, but we cannot let any problem stand in the way of the duty to protect the revolution!"
 MON_secure_our_future:0 "Secure Our Future"
 MON_secure_our_future_desc:0 "We need to secure our future no matter the cost, innovation will come and go but we'll prosper!"
 
 MON_stable_industrial_expansion:0 "Stable Industrial Expansion"
 MON_stable_industrial_expansion_desc:0 "We can't risk doing too much damage to our nation as we grow our industries, creating a strong backbone might not lead us exactly where we want to but it'll bring us where we need to go."
 cannot_remove_the_economy_penalty_until_fifty_factories_tt:0 "§RCannot Remove§! the §YInefficient Economy§! penalty until Mongolia owns §Y50§! factories and passes the decision §YCelebrate Successful Industrial Expansion§!."
 cannot_remove_the_economy_penalty_with_this_path_tt:0 "§RCannot Remove§! the §YInefficient Economy§! penalty with this path."
 MON_fund_new_industrial_sectors:0 "Foundation Of New Sectors"
 MON_fund_new_industrial_sectors_desc:0 "Founding new industrial sectors will allow us to ease our economy into adapting to these new industries."
 MON_modern_economic_theories:0 "Modern Economic Theories"
 MON_modern_economic_theories_desc:0 "Improving the economy takes a lot of effort and we need to make sure that what we do today pays off in the future. As such we need to carefully study any and all economic theories and apply the best ones here."
 
 MON_efficiency_before_all:0 "Efficiency Before All"
 MON_efficiency_before_all_desc:0 "There is no cost too great for our industrial heartland, once our industry has outpaced those around us we'll be able to rest."
 heavy_stability_penalty_but_fixes_eco_tt:0 "While this will remove the §YInefficient Economy§! penalty, it comes at a hefty §Rcost of stability§!."
 MON_expand_our_arsenals:0 "Expand Military Sector"
 MON_expand_our_arsenals_desc:0 "It's of outmost importance that our military is well-equipped so it can handle the ongoing conflicts and aid us during the revolution."
 MON_excavation_effort:0 "Excavation Effort"
 MON_excavation_effort_desc:0 "We need to improve our excavation efforts to secure we've the resources needed to continue to the expansion of our industry."
 MON_qoutas_first:0 "Qoutas First"
 MON_qoutas_first_desc:0 "We need to prioritise the qoutas first, we cannot delay when a box of supplies arrive by any day and our people need to do their duty in making sure everything runs on time."
 MON_leap_forward_together:0 "Leap Forward Together"
 MON_leap_forward_together_desc:0 "Together we'll leap forward and our industry will stand among those around us."
 MON_rapid_industrialisation:0 "Rapid Industrialisation"
 MON_rapid_industrialisation_desc:0 "The world moves forward and we cannot stay behind, every part of our country needs to do their part now!"
 
 MON_our_four_year_plan:0 "Our Four-Year Plan"
 MON_our_four_year_plan_desc:0 "We're now prepared to execute our own Four-Year Plan, it's high time we put it into motion."
 
 MON_organise_the_republic:0 "Organise The Republic"
 MON_organise_the_republic_desc:0 "Our republic is suffering from many problems and we need to reorganise and prepare to face them."
 MON_our_role_in_the_commintern:0 "Our Role In The Comintern"
 MON_our_role_in_the_commintern_desc:0 "Like other communists around the world, we've a role in the international revolution. Our role currently is closely tied together with the Soviet Union's role."
 MON_our_peoples_army:0 "The Mongolian People's Army"
 MON_our_peoples_army_desc:0 "We need to form our own people's army to secure we've enough recruits to secure that we've enough men to protect Mongolia."
 MON_purchase_soviet_arms:0 "Purchase Soviet Arms"
 MON_purchase_soviet_arms_desc:0 "With the creation of a People's Army we've a need to gather more equipment, our best source for this is the Soviets."
 MON_strive_to_secure_our_independence:0 "Secure Our Independence"
 MON_strive_to_secure_our_independence_desc:0 "While we're formally independent, to many nations we're nothing but a Soviet Puppet State. We need to do what we can to change this international outlook on us."
 MON_support_soviet_war_effort:0 "Support Soviet War Effort"
 MON_support_soviet_war_effort_desc:0 "The Soviets are in need of our aid and have requested we send them grain and equipment for their military. We need to do whatever we can to manage this so that they can keep up the war effort."
 MON_prepare_for_the_front_lines:0 "Prepare For The Front"
 MON_prepare_for_the_front_lines_desc:0 "For every day that passes it becomes more and more important for us to reach the front lines of the Soviet Union and support them directly."
 
 MON_threat_of_japan:0 "The Japanese Threat"
 MON_threat_of_japan_desc:0 "Japan has been posturing on our borders for a while and it's clear they'll soon expand their empire further and when they do it's only a matter of time before they turn to us. We need to prepare."
 MON_study_the_china_war:0 "Study The War In China"
 MON_study_the_china_war_desc:0 "The War between China and Japan is still ongoing and we could learn many things by sending observers to China."
 MON_supplies_to_china:0 "Supplies To China"
 MON_supplies_to_china_desc:0 "The ongoing conflict between China and Japan seems to be tough on both nations, we should do what we can to prolong it to secure that Japan can't exploit the resources of China."
 MON_the_mistakes_of_the_chinese:0 "Mistakes Of The Chinese"
 MON_the_mistakes_of_the_chinese_desc:0 "The Chinese failed in their attempts to fight off the Chinese, we need to learn from their failures."
 MON_integrate_chinese_refugees:0 "Welcome Chinese Refugees"
 MON_integrate_chinese_refugees_desc:0 "There are many Chinese escaping from the horrors of war, we should welcome them with open arms as they may be willing to help us in our defence against Japan in the future."
 MON_panmongolian_ambitions:0 "Pan-Mongolian Ambitions"
 MON_panmongolian_ambitions_desc:0 "We need to promote our own nationalism and strive towards one day expanding our nation."
 have_to_be_at_war_for_decision_tt:0 "§RMust be at war to gain access to the decision§!.\n"
 
 MON_internal_matters:0 "Internal Matters"
 MON_internal_matters_desc:0 "We need to look inwards and make sure that our republic won't collapse under the weight of the problems inside it."
 MON_anti_propaganda_campaigns:0 "Anti-Propaganda Campaign"
 MON_anti_propaganda_campaigns_desc:0 "The NKVD has suggested that in preparation for the future takeover of Khorloogiin Choibalsan that the current ruler needs to be undermined with propaganda campaigns aimed against them."
 failure_to_complete_focus_before_coup_will_worsen_the_transition:0 "Failure to complete the focus before the §YPower Struggle§! ends and §YKhorloogiin Choibalsan§! takes power will make the transition be §Rmore turbolent§!."
 MON_political_purges:0 "Political Purges"
 MON_political_purges_desc:0 "We need to remove those who may stand in the way of the revolution, the NKVD has been willing to offer us help in this and we're ready to take the first steps towards securing the safety of our new state.\n§RNo one can stand in the way of the revolution!§!"
 MON_the_resolve_of_the_nation:0 "Resolve Of Our Nation"
 MON_the_resolve_of_the_nation_desc:0 "With the enemies within being eliminated from Mongolia, we also need to steel ourselves and prepare to look outwards to those who may threaten us abroad."
 will_lower_undermine_power_struggle_duration:0 "Will lower the time until §YUndermine The Power Struggle§! is removed."
 MON_undermine_the_power_struggle:0 "Undermine The Power Struggle"
 MON_undermine_the_power_struggle_desc:0 "There is an ongoing struggle for Power within Mongolia and all of it can be traced back to Stalin wanting full control over who is in charge here. We need to undermine it and seek to prove that we can follow our own path to the revolution!"
 MON_only_way_to_keep_current_leader_tt:0 "Only way to keep §YAnandyn Amar§! in charge of Mongolia."
 MON_seek_soviet_appeasement:0 "Seek Soviet Appeasement"
 MON_seek_soviet_appeasement_desc:0 "We need to seek the help of the Soviet or rather the support of Stalin, this is likely not going to be a fruitful endevaour but may be what we need for the future of Mongolia."
 MON_leverage_local_support:0 "Leverage Local Support"
 MON_leverage_local_support_desc:0 "There are many who support the current status quo, while it's true that we're losing supporters by the day it's not too late to leverage what we can to secure our hold over the nation."
 MON_remove_the_marshal:0 "Remove The Marshal"
 MON_remove_the_marshal_desc:0 "Khorloogiin Choibalsan has been a problem for us for too long, with us comming up on top in the Power Struggle it's time to remove him from his position of power."
 MON_address_our_problems:0 "Address Our Problems"
 MON_address_our_problems_desc:0 "Now that our leadership position is secured, we need to look at our problems with illiteracy and the problems our culture has encountered in the name of the revolution."
 
 MON_anti_illiteracy_campaign:0 "Anti-Illiteracy Campaigns"
 MON_anti_illiteracy_campaign_desc:0 "The Illiteracy in Mongolia has caused us quite a few headaches in the past, while it's not as widespread as it once have been it's bad enough to where it hinders the development of our nation."
 MON_reform_existing_education_system:0 "Reform Existing Education System"
 MON_reform_existing_education_system_desc:0 "Our current way of educating our populace has worked fine in the past, we cannot imitate the Russians and hope their methods work here. We need to instead improve the system we've in place."
 MON_mend_our_problems:0 "Mend Our Problems"
 MON_mend_our_problems_desc:0 "Our people have in the near past been forced to adopt to the Russian presence, learning their language and methods to fit their view of the revolution. We need to mend these issues before they cause an unfortunate future for our nation."
 MON_research_effort:0 "Education Effort"
 MON_research_effort_desc:0 "We need to improve our effort into improving our education sector, all resources need to go towards that."
 MON_encourage_soviet_thinking:0 "Encourage Soviet Thinking"
 MON_encourage_soviet_thinking_desc:0 "Encouraging Soviet Thinking will allow us to better educate our populace in the teachings of marxism and secure that our future remains bright."
 MON_establish_national_university:0 "National University of Mongolia"
 MON_establish_national_university_desc:0 "The National University of Mongolia shall be our first academic institution at higher level. With it we'll be able to properly educate our populace, all under the supervision of our state."
 
 MON_a_modern_mongolia:0 "A Modern Mongolia"
 MON_a_modern_mongolia_desc:0 "We cannot cling to the past if we hope to achieve a world-wide revolution, instead we need to modernise every sector of our country to match our future ideals."
 MON_extend_religious_persecution:0 "Extend Religious Persecution"
 MON_extend_religious_persecution_desc:0 "The religious institutions of the past are just a tool to control the masses, we need to continue to root it out where we can and extend our efforts."
 MON_secure_military_loyalty:0 "Secure Military Loyalty"
 MON_secure_military_loyalty_desc:0 "With our culture slowly evolving forward, there are those in the military that look on with worry. We need to make sure they won't stand against us and introduce commissars in the ranks to make sure ideological purity in our ranks is achieved."
 MON_preserve_our_culture:0 "Preserve Our Culture"
 MON_preserve_our_culture_desc:0 "Our culture is worth preserving, even with us moving towards the revolution. We'll need to take steps to find concessions that can be made so that everything Mongolia stands for survives in the future."
 MON_safeguard_what_can_be_saved:0 "Safeguard What Can Be Saved"
 MON_safeguard_what_can_be_saved_desc:0 "Our old culture that lies in old Buddhist monasteries, lamas and our language needs to be protected. Safeguarding our past will secure our people can look back and say that we served the people's revolution well."
 MON_state_atheism:0 "State Atheism"
 MON_state_atheism_desc:0 "The state can't afford to involve itself in religion, atheism is the reality of life and we need to make sure our people knows they won't be stuck under the shackles of religion."
 MON_buddhism:0 "Buddhism"
 MON_buddhism_desc:0 "Our culture has always been Buddhist and our stability comes from it, while it may undermine the revolution slightly we cannot afford to abandon our past entirerly."
 MON_end_russofication:0 "End Russofication"
 MON_end_russofication_desc:0 "The influence of the Russians and more importantly the NKVD has had some quite horrible consequenses for our populace, we need to do what we can to promote our culture first and foremost and engage with the Russians as we would any other nation."
 MON_savior_of_mongolia:0 "The Savior of Mongolia"
 MON_savior_of_mongolia_desc:0 "The Mongolian Identity is now safekept and it's all thanks to our efforts in the last few years. We need to use this to create a propaganda campagin that will unite our people properly."
 
 MON_the_mongolian_army:0 "The Mongolian Army"
 MON_the_mongolian_army_desc:0 "Our army could stand to be improved, our doctrines aren't yet up to the task of protecting Mongolia and we need to take steps necessary now."
 
 MON_our_own_aircraft:0 "Our Own Aircraft"
 MON_our_own_aircraft_desc:0 "We need to design our own aircraft to secure that we can contest the skies."
 MON_study_the_soviet_civil_war:0 "Studies From Russian Civil War"
 MON_study_the_soviet_civil_war_desc:0 "Without the Russian Civil War we wouldn't be standing here today, so we need to study the conflicts that occured here in the east during it to learn more about modern warfare."
 MON_soften_our_enemies:0 "Soften Our Enemies"
 MON_soften_our_enemies_desc:0 "We need to be on the lookout for our enemies at all times, using proper forward observers and heavy artillery fire will secure they will think twice before trying to attack us."
 MON_the_core_of_our_doctrines:0 "Core Of Our Doctrines"
 MON_the_core_of_our_doctrines_desc:0 "The core of our doctrines need to be improved, we cannot pursue other fruitless endevaours in the meantime."
 MON_improved_command_structure:0 "Improved Command Structure"
 MON_improved_command_structure_desc:0 "Improving our command structure will allow us to better respond during attacks by our enemies and with that initative secure victory."
 MON_a_mechanised_force:0 "Iron Horses"
 MON_a_mechanised_force_desc:0 "Mobility in the field has always allowed our people to do great things, now it's time to use armored vehicles that can achieved the same thing."
 
 MON_the_eastern_war:0 "The Eastern War"
 MON_the_eastern_war_desc:0 "Open conflict has broken out between us and the Japanese, we'll need to rally the populace towards our duty to defend the eastern front!"
 will_gain_four_twenty_width_infantry_divisions_tt:0 "Will Gain §Y4§! §G20§!-width §YInfantry§! divisions in §Y[330.GetName]§!."
 
 # Events
 chd_mongolia.0.t:0 "Takeover of Khorloogiin"
 chd_mongolia.0.d:0 "Khorloogiin Choibalsan has managed to secure power over Mongolia, using his position as the Internal Affairs Ministry he has removed many of his opponents that would otherwise stand in his way."
 chd_mongolia.0.a:0 "A new era has begun"
 
 chd_mongolia.1.t:0 "Removal of Peljiddin Genden"
 chd_mongolia.1.d:0 "Genden has ever since 1934 been on thin ice with Stalin, being a deeply religious man who once said that \"On earth there are two great geniuses - Buddha and Lenin,\" and had in the past openly declared in 1933 that he wouldn't fight the religion in Mongolia and leave it in peace. This was in open defienace of Stalin's instructions.\nIt wasn't even that long ago since he drunkly insulted Stalin at a Mongolian Embassy in Moscow where he shouted to him that \"You bloody Georgian, you have become a virtual Russian Czar\".\n\nNow Khorloogiin Choibalsan has under Stalin's orders organised a meeting with the Revolutionary Party to remove him from office."
 chd_mongolia.1.a:0 "Let's hope things will turn to the better"
 
 chd_mongolia.2.t:0 "The Internal Affairs Ministry"
 chd_mongolia.2.d:0 "Ever since the removal of Genden as prime minister, Choibalsan has become more popular with Stalin and today he was named the head of the new Internal Affairs Ministry. This position has made him the de facto most powerful person in Mongolia."
 chd_mongolia.2.a:0 "Good for him"
 
 chd_mongolia.3.t:0 "End Of Purges"
 chd_mongolia.3.d:0 "The purges in Mongolia has finally reached an end, or at least almost. There is one more person that needs to be removed."
 chd_mongolia.3.a:0 "Goodbye"
 
 chd_mongolia.4.t:0 "Request of Support"
 chd_mongolia.4.d:0 "The Mongolian government has requested we make some accomendation to support their current prime minister. While he hasn't stated it openly, the diplomats indicated that he feels threatened by internal enemies and would like our support in making sure he can lead Mongolia through these troubling times where enemies can be anywhere."
 chd_mongolia.4.a:0 "Agree but keep an eye on them"
 chd_mongolia.4.b:0 "They are attempting to undermine the revolution!"
 chd_mongolia.5.t:0 "Stalin Supports Our Regime"
 chd_mongolia.5.d:0 "We've been given more resources to better stabilize our position here in the east, with Stalin now backing us it'll be easier to secure we won't be overthrown."
 chd_mongolia.5.a:0 "You can always trust Stalin to do the right thing"
 chd_mongolia.6.t:0 "Stalin Distrust Our Attempts"
 chd_mongolia.6.d:0 "It seems our attempts to get support has led to the opposite and Stalin quite openly distrusts what we're attempting to do."
 chd_mongolia.6.a:0 "You can never trust Stalin to do the right thing"
 
 chd_mongolia.7.t:0 "The Tuvan Problem"
 chd_mongolia.7.d:0 "[329.GetName] has been a contested territory for a while, with the Tanna Tuvan People's Republic owning land that has long belonged to Mongolia. Now Mongolia is requesting that we hand over the territory once more."
 chd_mongolia.7.a:0 "It's theirs"
 chd_mongolia.7.b:0 "They can't have it"
 chd_mongolia.8.t:0 "[329.GetName] Returned"
 chd_mongolia.8.d:0 "The Soviet Union has returned [329.GetName] to us."
 chd_mongolia.8.a:0 "Wonderful"
 chd_mongolia.9.t:0 "Soviet Union Keeps [329.GetName]"
 chd_mongolia.9.d:0 "It seems the Soviet Union has decided to keep [329.GetName]."
 chd_mongolia.9.a:0 "That land is ours, how dare they?"
 
 chd_mongolia.10.t:0 "Mongolia Request Chinese Territory"
 chd_mongolia.10.d:0 "Our occupation of western China has been part of our invasion eastward. Now Mongolia has requested that we hand some of the territory over to them."
 chd_mongolia.10.a:0 "They can have it"
 chd_mongolia.10.b:0 "We need to control it"
 chd_mongolia.11.t:0 "Chinese Territory Handed Over"
 chd_mongolia.11.d:0 "We've been given full control over the Chinese territory we requested from [From.GetNameDef]."
 chd_mongolia.11.a:0 "Yes"
 chd_mongolia.12.t:0 "Chinese Territory Not Given"
 chd_mongolia.12.d:0 "It seems that [From.GetNameDef] would rather keep the territory than let us have it."
 chd_mongolia.12.a:0 "Outrageous!"
 
 chd_mongolia.13.t:0 "Death of Demid"
 chd_mongolia.13.d:0 "The Marshal of the Mongolian People's Republic, Gelegdorjiin Demid died earlier today in mysterious circumstances. While traveling to Moscow on board the Trans-Siberian Railway it was discovered that he was posioned.\n\nChoibalsan has posthumoursely declared him a Japanese Spy and has taken over the role as Marshal."
 chd_mongolia.13.a:0 "This is pretty sus"
 
 chd_mongolia.14.t:0 "Mongolia Offers Protection"
 chd_mongolia.14.d:0 "With the war ongoing [MON.GetNameDef] has offered to protect some of our southern territories further inland, just to make sure our enemies won't be able to exploit our people there.\nThis is a clear attempt to exploit our vulnerable position but we're not exactly in a position to say no."
 chd_mongolia.14.a:0 "We need to keep our people safe"
 chd_mongolia.14.b:0 "This is just imperialism!"
 
 # Brazil
 # Opinion
 BRA_good_neighbor_opinion:0 "Good Neighbor"
 # National Spirits
 BRA_great_depression:0 "The Great Depression"
 BRA_great_depression_desc:0 "The Great Depression has hit Brazil hard as coffee sales plumet and more and more industries close, without proper care the economy will continue to suffer."
 
 BRA_legacy_of_revolution_of_1930:0 "Legacy of the 1930 Revolution"
 BRA_legacy_of_revolution_of_1930_desc:0 "The Revolution of 30 and the Communist Uprising of 35 has left our proud country scared and many fear that another uprising will happen soon enough, this heavily hurts the national unity of Brazil."
 BRA_coffee_oligarchs:0 "Coffee Oligarchs"
 BRA_integralism:0 "Brazilian Integralism"
 BRA_integralism_desc:0 "Brazilian Integralism is a political movement in Brazil, created in October 1932 by Plínio Salgado. The movement has adopted many characteristics of Italian Fascism, and while supportive of Vargas regime is causing some troubles for the country."
 BRA_vagas_opposition:0 "Vargas Opposition"
 BRA_vagas_opposition_desc:0 "While Vargas is the leader of the country and has secured loyalty of the army, there are quite a few who wish to challenge him."
 unlocks_decisions_that_smoothen_transition_into_dictatorship:0 "Unlocks decisions that will lower the stability penalty of turning into a Dictatorship with the focus §YCohen Plan§!.\nThese decisions lower the §YVargas Opposition§! National Spirit."
 
 BRA_democratic_opposition_organised:0 "Democratic Opposition Organised"
 BRA_communist_opposition_organised:0 "Communist Opposition Organised"
 
 BRA_restricted_national_congress:0 "National Congress of Brazil Restricted"
 BRA_estado_novo:0 "Estado Novo"
 BRA_estado_novo_desc:0 "Estado Novo, or the New State, is largely inspired by the Portugal's own Estado Novo and other authoritarian states within Europe. This concept has let Vargas hold unrivaled legislative power in the nation."
 
 BRA_early_mob:0 "Organised Economic Mobilisation"
 BRA_catholic_cooperation:0 "Catholic Cooperation"
 
 BRA_national_security_tribunal:0 "Tribunal de Segurança Nacional"
 
 BRA_greenshirts:0 "Greenshirts"
 BRA_department_of_press_and_propaganda_idea:0 "Department of Press And Propaganda"
 
 BRA_volunteer_corps:0 "Brazilian Volunteer Corps"
 
 BRA_expeditionary_force_idea:0 "Brazilian Expeditionary Force"
 BRA_expeditionary_force_idea_desc:0 "The Brazilian Expeditionary Force was an Expeditionary Force organised by the Americans to aid in the war in Europe against fascism. These forces are particularly infamous as a force to be reckoned with."
 BRA_anti_uboat_mission_idea:0 "Anti-Uboat Mission"
 
 BRA_agricultural_protection_idea:0 "Agricultural Protectionism"
 BRA_economic_nationalism:0 "Economic Nationalism"
 BRA_economic_nationalism_desc:0 "State intervention is common and has allowed the government more control over the economy."
 BRA_consolidation_of_labor_laws_idea:0 "Consolidation of Labor Laws"
 
 BRA_weakened_oligarchs:0 "Weakened Coffee Oligarchs"
 
 BRA_foreign_instructors:0 "Foreign Pilot Instructors"
 BRA_plane_effort:0 "Organised Plane Construction"
 BRA_naval_quantity:0 "Naval Quantity Effort"
 BRA_naval_quantity_desc:0 "There is a large-scale effort to produce a large navy in Brazil, however this has come at the cost of cutting corners."
 
 BRA_bases_in_brazil:0 "Bases In Brazil"
 BRA_bases_in_brazil_desc:0 "We've recieved bases in Brazil and it has allowed us to properly make use of it to combat submarines."
 # Focuses
 BRA_the_aftermath_of_the_uprising:0 "Aftermath of the Uprising"
 BRA_the_aftermath_of_the_uprising_desc:0 "The recent Communist uprising of 1935 has left the government in a state of misery. With worries that another attempt to take power from Vargas it's time we move forward and towards strengthening the state."
 BRA_political_censorship:0 "Political Censorship"
 BRA_political_censorship_desc:0 "We need to continue our censorship of the enemies of the state to make sure that stability is preserved."
 BRA_prepare_for_self_coup:0 "Prepare For The Self-Coup"
 BRA_prepare_for_self_coup_desc:0 "We need to make preparations for our attempts to secure the dictatorship in the future, no man can stand in our way."
 BRA_continue_restrictions_on_congress:0 "Continued Restrictions On Congress"
 BRA_continue_restrictions_on_congress_desc:0 "It won't be difficult to make sure the National Congress of Brazil gives up more power to Vargas, all in the name of containing another possible revolt."
 BRA_the_cohen_plan:0 "The Cohen Plan"
 BRA_the_cohen_plan_desc:0 "By forging a document we can make it seem that the communists are attempting another revolution and legitimize a coup d'état and cancel the upcoming elections. That way Vargas rule will be preserved."
 has_lowered_vargas_opposition_tt:0 "The National Spirit §YVargas Opposition§!'s Penalty has been lowered at least once."
 lack_of_removal_of_opposition_will_cause_a_stab_hit_tt:0 "For each level §YVargas Opposition§! has been lowered, the stability hit from this focus will be lowered."
 BRA_tribunal_de_seguarnca_nacional:0 "Tribunal de Segurança Nacional"
 BRA_tribunal_de_seguarnca_nacional_desc:0 "The military needs to take action and let them handle matters of court to secure Brazil remains stable."
 BRA_military_role_in_justice:0 "Expand Military Role In Justice"
 BRA_military_role_in_justice_desc:0 "There is only one way to secure long-term stability for Brazil and that is to trust that the military will be able to fullfill their duty of finding the enemies within the state. We'll give them more resources to achieve this as soon as possible."
 BRA_take_care_of_the_communists:0 "Root Out Communist Problem"
 BRA_take_care_of_the_communists_desc:0 "The communists keeps returning and causing problems for us, we need to quickly nip the problem in the bud to make sure they won't cause any more issues for us."
 
 BRA_continued_work_with_integralism:0 "Continue Cooperation With Integralists"
 BRA_continued_work_with_integralism_desc:0 "The Integralist movement in Brazil has in the past been promised to be part of the foundation of the dictatorship, it's time we uphold that promise."
 BRA_expand_the_greenshirts:0 "Expand The Greenshirts"
 BRA_expand_the_greenshirts_desc:0 "The Greenshirts is a fascist paramilitary group under the Integralists, we need to properly integrate them into the military to better mobilize those on the right into our armies."
 BRA_mobilize_and_prepare:0 "Mobilize And Prepare"
 BRA_mobilize_and_prepare_desc:0 "We need to make preparations for whatever conflict may reach us, whatever it's from Argentina or abroad we'll be ready."
 BRA_reorganise_integralist_movement:0 "Reform The Integralist Movement"
 BRA_reorganise_integralist_movement_desc:0 "To secure they won't cause trouble for the regime in the future, the AIB needs to be reorganised and their support needs to go to the state first and foremost."
 BRA_mobilize_the_economy:0 "Full Economic Mobilization"
 BRA_mobilize_the_economy_desc:0 "For the greater good of Brazil we shall mobilize, for everything we stand for we need to be ready and the needs and desires of our people needs to become one with the Homeland."
 BRA_work_with_the_catholics:0 "Work With The Catholics"
 BRA_work_with_the_catholics_desc:0 "The Catholic populace needs to be rallied and organised to make sure they support the Homeland fullheartedly."
 
 BRA_disband_all_political_parties:0 "Disband All Political Parties"
 BRA_disband_all_political_parties_desc:0 "To secure political scheming won't stand in the way of our dictatorship, we need to disband all political parties and establish a proper dictatorship. One that is strong enough to manage our new state."
 BRA_department_of_press_and_propaganda:0 "Department of Press And Propaganda"
 BRA_department_of_press_and_propaganda_desc:0 "Establishing the Department of Press And Propaganda will give us further control over the Press and secure that no internal or external pressures will destabilize our proud country."
 
 BRA_make_use_of_good_neighbor_policy:0 "Our Good Neighbor"
 BRA_make_use_of_good_neighbor_policy_desc:0 "The US has established a Good Neighbor Policy where it tries to better improve their relations with the many North and South American nations that exist, we need to make use of this."
 BRA_form_volunteer_corps:0 "Form Volunteer Corps"
 BRA_form_volunteer_corps_desc:0 "While those around us happily march into war, we'll take a more careful step to support the Americans and form volunteer corps and encourage them to fight abroad for us."
 BRA_wasinghton_accords:0 "Washington Accords"
 BRA_wasinghton_accords_desc:0 "With the United States entering a formal alliance that is currently facing a conflict, we need to do so too and officially join the Americans as well."
 BRA_american_lend_lease_program:0 "American Lend Lease Program"
 BRA_american_lend_lease_program_desc:0 "The americans are currently lend leasing weapons to the Europeans but we may be able to establish a few agreements that can allow us to get weapons from them as well."
 BRA_expeditionary_force:0 "Brazilian Expeditionary Force"
 BRA_expeditionary_force_desc:0 "With the preparations being made to fight in a conflict, we need to officially form the Brazilian Expeditionary Force that will aid in the fight against fascism."
 BRA_will_give_one_free_infantry_division_tt:0 "Will gain a 24-Width §GSeasoned§! Infantry Division that spawns in [500.GetName]"
 BRA_prepare_for_italian_front:0 "Prepare For The Italian Front"
 BRA_prepare_for_italian_front_desc:0 "The Italian's Homeland is filled with mountains and we need to do whatever we can to prepare ourselves for the push through it."
 BRA_companhia_siderurgica_nacional:0 "Companhia Siderúrgica Nacional"
 BRA_companhia_siderurgica_nacional_desc:0 "The Companhia Siderúrgica Nacional was a steel company that came up as part of the Washington Accords, with it being an agreement between the Brazilian and American to construct a facility that would help provide steel for the Allied forces."
 BRA_american_investments:0 "Seek American Investments"
 BRA_american_investments_desc:0 "We need to seek American Investments to support our industrial growth, their money shall fuel our greatness."
 BRA_american_expertice:0 "American Expertice"
 BRA_american_expertice_desc:0 "Making use of what the Americans have learnt over the years should be enough to give us a foundation for something great, but we can take it one step further and invite their experts here to guide us."
 BRA_restrict_german_trade:0 "Restrict German Trade"
 BRA_restrict_german_trade_desc:0 "The Germans have gotten too cozy lately and we need to undermine them as soon as possible, this is most simply achieved through sanctions."
 BRA_anti_uboat_missions:0 "Anti-Uboat Missions"
 BRA_anti_uboat_missions_desc:0 "The German Uboats are causing harm to our trade and we need to quickly establish a proper mission to combat this."
 
 BRA_encourage_economic_nationalism:0 "Encourage Economic Nationalism"
 BRA_encourage_economic_nationalism_desc:0 "We need to encourage a system of economic nationalism and state interventionism to grow our economy efficiently."
 BRA_cooperate_with_oligarchs:0 "Cooperate With The Oligarchs"
 BRA_cooperate_with_oligarchs_desc:0 "The Oligarchs in our country may not be the friends of our people, but they are important as a powerbase for our rule. We need to more closely cooperate with them."
 BRA_land_reform:0 "Continue Our Land Reform"
 BRA_land_reform_desc:0 "Continuing our land reforms are necessary for the long-term development of our land, even if it means we'll have to weaken the oligarchs and make them our enemies."
 BRA_the_mining_industry:0 "Brazilian Mining Industry"
 BRA_the_mining_industry_desc:0 "The Brazilian Mining Industry is of great importance to the continued growth of our economy, we need to invest into it."
 BRA_establish_a_minimum_wage:0 "Establish A Minimum Wage"
 BRA_establish_a_minimum_wage_desc:0 "We need to properly establish a minimum wage to properly enhance the lives of our populace, with better living conditions comes a healthier economy!"
 BRA_consolidation_of_labor_laws:0 "Consolidation of Labor Laws"
 BRA_consolidation_of_labor_laws_desc:0 "The Consolidation of Labor Laws are new laws established to enhance the rights of the working man, protecting their rights from exploitative businesses. Such as their right to sit under Article 199."
 
 BRA_towards_modernisation:0 "Towards Modernisation"
 BRA_towards_modernisation_desc:0 "There is one policy that is agreed upon within the government and that is modernisation of the country needs to occur now. We shall do what we can to modernise and grow our industries."
 BRA_military_expansion:0 "Military Expansion"
 BRA_military_expansion_desc:0 "With our effort to modernise the country, we also need to keep the army well-supplied so they are ready for whatever might threaten our Homeland."
 
 BRA_engage_the_economy:0 "Engage The Economy"
 BRA_engage_the_economy_desc:0 "To secure proper recovery of our industries we need to stimulate the economy and have the government buy up products that'd otherwise go to waste, this should give our businesses some capital to start recovering with."
 BRA_long_term_infrastructure_improvements:0 "Infrastructure Improvements"
 BRA_long_term_infrastructure_improvements_desc:0 "There are many ways we can improve our infrastructure and secure that it can functionally stand the test of time and grow our economy effectively."
 BRA_kick_economy_into_gear:0 "Kick Economy Into Gear"
 BRA_kick_economy_into_gear_desc:0 "We need to kick the economy into gear and finally drag ourselves out of the Great Depression that has plagued our nation for too long!"
 BRA_been_210_days_since_last_depression_improvement:0 "Has been §Y210§! Days since the §OGreat Depression§! was last lowered. (Note that most focuses of Brazil aren't 70 days long, so it might require more than 3 focuses)"
 
 BRA_agricultural_protection:0 "Agricultural Protection"
 BRA_agricultural_protection_desc:0 "We need to protect our agricultural sector as we grow our industrial base, the farmers and plantations have always been important to our economy and they need to be safekept."
 BRA_agreement_with_farmers:0 "Agreement With Farmers"
 BRA_agreement_with_farmers_desc:0 "We need to come to an agreement with the farmers of our nation to better grow our economy, perhaps we can come to an understanding without it harming either side."
 
 BRA_northern_industrialisation:0 "Northern Industrialisation"
 BRA_northern_industrialisation_desc:0 "Our industries in the north can afford to be the start of a new industrial revolution within Brazil."
 BRA_civilian_investments:0 "Civilian Investments"
 BRA_civilian_investments_desc:0 "Investing into our civilian industry will be needed to secure further growth of our industries."
 BRA_factories_for_the_army:0 "Factories For The Army"
 BRA_factories_for_the_army_desc:0 "We need to continue our efforts to expand the army and that requires more arsenals that produces weapons for us."
 BRA_amazons_investments:0 "Amazon Investments"
 BRA_amazons_investments_desc:0 "The Amazons hasn't been able to grow a proper industry in a long time and is largely untamed, this needs to change."
 BRA_rubber_plantations:0 "Rubber Plantations"
 BRA_rubber_plantations_desc:0 "There is a shortage of rubber in the world right now and with our recent investments into the Amazon we'll be able to provide it and gain a profit."
 BRA_rubber_soldiers:0 "Soldados da Borracha"
 BRA_rubber_soldiers_desc:0 "Soldados da Borracha, or \"Rubber Soldiers\", are men picked to be sent into the depths of the Amazon to make sure we produce enough rubber to supply our allies. It's a dangerous job and few want to do it, but we need to enforce this job for the greater good."
 
 BRA_prepare_the_brazilian_military:0 "Prepare Brazilian Military"
 BRA_prepare_the_brazilian_military_desc:0 "We need to make preparations for improving our military, war has changed a lot and the spirit of our doctrines needs to change with it."
 
 BRA_the_airforce:0 "Improve The Airforce"
 BRA_the_airforce_desc:0 "The state of our air force isn't impressive, but one day it could be. We need to move towards that day now."
 BRA_foreign_purchases:0 "Import Foreign Planes"
 BRA_foreign_purchases_desc:0 "Importing foreign planes will allow us to properly secure an air force at more rapid speeds than our own factories could produce them at."
 BRA_invite_foreign_instructors:0 "Invite Foreign Instructors"
 BRA_invite_foreign_instructors_desc:0 "To secure that our pilots are well trained we need to invite instructors from abroad that are willing to give them top-tier training."
 BRA_prepare_local_production:0 "Prepare Local Production"
 BRA_prepare_local_production_desc:0 "We cannot rely on foreigners to produce planes for us, we need to instead standarise and start our own production line."
 
 BRA_quantity_effort:0 "Quantity Effort"
 BRA_quantity_effort_desc:0 "We need to focus on quantity to match those around us, cutting corners to get more ships out there at a more breakneck pace."
 BRA_quality_effort:0 "Quality Effort"
 BRA_quality_effort_desc:0 "Quality needs to come first and foremost, our men will be stuck at sea and they need to trust that the equipment they have will be of use to them no matter the situation."
 BRA_improving_our_doctrines:0 "Improve Our Doctrines"
 BRA_improving_our_doctrines_desc:0 "To achieve naval supremacy our doctrines must be in top shape, no matter the cost we'll achieve this."
 BRA_heavy_ship_effort:0 "Heavy Ship Effort"
 BRA_heavy_ship_effort_desc:0 "To properly aid our fleet we need heavy cruisers that can add the much needed firepower to our fleets."
 BRA_carrier_effort:0 "Carrier Effort"
 BRA_carrier_effort_desc:0 "We need to reroute our efforts to secure that we can achieve superiority at sea through new means, namely superiority in the sky."
 BRA_greater_ships:0 "Greater Ships"
 BRA_greater_ships_desc:0 "To fully establish supremacy over the sea we need great ships that can challenge those around them. Battleships that will intimidate our enemies and make them think twice before striking at our fleet."
 BRA_a_modern_option:0 "A Modern Option"
 BRA_a_modern_option_desc:0 "Inspired by the attempts of the Japanese, we'll pursue a doctrine of Super Heavy Battleships that will dominate the seas."
 BRA_continue_the_arms_race:0 "Continue The Arms Race"
 BRA_continue_the_arms_race_desc:0 "We've long been in a naval arms race with Argentina and Chile, trying to achieve superiority over the two at sea. We need to again intensify these efforts."
 BRA_defend_our_coasts:0 "Defend Our Coasts"
 BRA_defend_our_coasts_desc:0 "Our trade relies heavily on the sea, which means that we need to discourage any attack near our coasts."
 
 BRA_army_investments:0 "Army Investments"
 BRA_army_investments_desc:0 "We need to make sure our army has enough arms and that'll require further investments into our military complexes."
 
 BRA_tactical_supremacy:0 "Tactical Supremacy"
 BRA_tactical_supremacy_desc:0 "Modern war requires modern tactics and as such we need to do whatever is possible to achieve tactical supremacy."
 BRA_self_reliant_improvements:0 "Self-Reliant Improvements"
 BRA_self_reliant_improvements_desc:0 "If we rely on other nations that means any mistake they make will be a mistake we'll make. We need to learn by our own merit."
 BRA_american_instructors:0 "American Instructors"
 BRA_american_instructors_desc:0 "The Americans have proven themselves capable in innovating warfare for quite a while and we should allow them to instruct and organise our armies to turn them more capable."
 BRA_new_model_army:0 "New Model Army"
 BRA_new_model_army_desc:0 "Our army is in top shape now after our recent reforms and investments into it, it's now our pride and joy.\nWe shall show the world it cannot be stopped."
 
 BRA_import_american_tanks:0 "Import American Tanks"
 BRA_import_american_tanks_desc:0 "To properly create a core of armored vehicles we need to import American Tanks and make use of them."
 will_get_a_free_light_tank_design_tt:0 "Will recieve a free §YLight Tank§! Design."
 BRA_a_supported_army:0 "Improve The Support"
 BRA_a_supported_army_desc:0 "Artillery, Reconnaissance, Engineers and Radio companies are of major importance in modern warfare and we need to remain ahead in all such departments to make an effective fighting force."
 BRA_jungle_training:0 "Jungle Training"
 BRA_jungle_training_desc:0 "We've a jungle within our country that would be the perfect place to begin training exercises for training in hostile enviroments."
 # Decisions
 BRA_the_dictatorship_category:0 "Estado Novo"
 BRA_the_dictatorship_category_desc:0 "Getúlio Vargas has led Brazil since the start of the 1930s, leading a bride but incoherent coalition committed to a broad vision of \"modernisation\". As he has had to balance conflicting ideologies and interests in a diverse nation like Brazil it has led to many abrubpt shifts within the coalition.\n\nNow to continue his path to power he needs to make sure that the opposition won't form a too strong powerblock against him."
 BRA_the_election_of_thirtyeight:0 "Election of 38"
 BRA_the_election_of_thirtyeight_desc:0 "Vargas four-year term as President is due to expire in 1938, which would mean a new man would have to lead the nation as he is barred from-re-election. Something must be done about this or it could have terrible consequenses."
 will_trigger_an_unlawful_coup_tt:0 "§RWill Trigger An Unlawful Coup Which Will Have Serious Consequenses For Stability.§!"
 BRA_towards_economical_recovery:0 "Towards Economical Recovery"
 is_not_affected_by_great_depression:0 "Is not affected by the §YGreat Depression§!."
 BRA_democratic_opposition_organising:0 "Democratic Opposition Organising"
 BRA_communist_opposition_organising:0 "Recovery Of The Communists"
 BRA_communist_opposition_organising_desc:0 "The communists within Brazil recently lost a lot of momentum after the failed Revolution of 1930. Though it's quite clear that they won't stay under the radar forever and might one day recover their strength."
 
 BRA_declare_estado_novo:0 "Declare Estado Novo"
 BRA_exile_political_opponents:0 "Exile Political Opponents"
 BRA_strike_non_religious_movements:0 "Strike Anti-Religious Movements"
 BRA_root_out_com_sympathisers:0 "Root Out Communist Sympathisers"
 BRA_government_propaganda_campaign:0 "Launch Pro-Government Propaganda Campaign"
 
 BRA_integrate_militia_into_federal_military_500:0 "Integrate Militia Into Federal Military In [500.GetName]"
 BRA_integrate_militia_into_federal_military_499:0 "Integrate Militia Into Federal Military In [499.GetName]"
 BRA_integrate_militia_into_federal_military_498:0 "Integrate Militia Into Federal Military In [498.GetName]"
 BRA_integrate_militia_into_federal_military_497:0 "Integrate Militia Into Federal Military In [497.GetName]"
 BRA_secure_local_loyalty_500:0 "Secure Local Loyalty In [500.GetName]"
 BRA_secure_local_loyalty_499:0 "Secure Local Loyalty In [499.GetName]"
 BRA_secure_local_loyalty_498:0 "Secure Local Loyalty In [498.GetName]"
 BRA_secure_local_loyalty_497:0 "Secure Local Loyalty In [497.GetName]"
 if_all_modifiers_are_removed_opposition_will_be_lowered:0 "If all modifiers are removed the penalty of the National Spirit §YVargas Opposition§! will be lowered."
 
 BRA_declare_a_state_of_war:0 "Declare A State of War"
 BRA_defeat_the_opposition:0 "§YCrush The Opposition§!"
 BRA_prepare_a_new_constitution:0 "Prepare A New Constitution"
 
 BRA_strengthen_bonds_with_us:0 "Strengthen Bonds With America"
 BRA_american_trade_deals:0 "American-Brazilian Trade Deals"
 BRA_offer_bases_for_us:0 "Offer Naval Bases To America"
 # Modifiers
 BRA_militia_non_federalised:0 "Militia Non-Federalised"
 BRA_strong_local_governor:0 "Opposition Governor"
 # Events
 chd_brazil.0.t:0 "Democratic Opposition Organised"
 chd_brazil.0.d:0 "It seems that we've been unable to contain the recently growing democratic opposition and it has now grown further than expected.\nThey are now doing whatever they can to undermine our government."
 chd_brazil.0.a:0 "Damn them"
 chd_brazil.1.t:0 "Communists Organised"
 chd_brazil.1.d:0 "The communists have managed to form some underground movements and are doing what they can to actively fight against our government."
 chd_brazil.1.a:0 "They are traitors to the homeland!"
 chd_brazil.2.t:0 "Failure of the Government"
 chd_brazil.2.d:0 "Our government's inability to take care of the Great Depression has been noted by our populace and they are finally tired of it and it has broken the trust between our people and the government."
 chd_brazil.2.a:0 "We'll win them over again"
 chd_brazil.3.t:0 "Washington Accords"
 chd_brazil.3.d:0 "The Washington Accords are a treaty that would formally allow Brazil to enter into our alliance and join the ongoing global conflict. This implementation will be carried out by the Joint Brazil-United States Military Commission and includes various political and business agreement between us and Brazil.\n\nNow it's up to us to decide whatever to sign this or not."
 chd_brazil.3.a:0 "Sounds good"
 chd_brazil.3.b:0 "We don't need them"
 
 chd_brazil_news.1.t:0 "Coup In Brazil"
 chd_brazil_news.1.d:0 "In an unprecidented move, the Army led by Vargas has couped the government. While afterwards there was a hurried radio message accross the country about a communist plot, many onlookers have come to the conclussion it was a simple grab for power and an attempt to undermine the elections.\n\nWhatever the case, Vargas has formed a government with the Integralists and are attempting to unite the nation under a dictatorship."
 chd_brazil_news.2.d:0 "The elections in Brazil has been canceled and the Army under Vargas has declared a coup to counteract a communist plot to overthrow the government. Many members of this plot has been arrested and it seems that democracy has fallen in Brazil.\n\nWhile this has been critized by some onlookers, Joseph Goebbels has applauded this move as a step in the right direction."
 chd_brazil_news.1.a:0 "We'll stabilize again!"
 chd_brazil_news.2.a:0 "United under one state!"
 chd_brazil_news.1.b:0 "Whatever"
 chd_brazil_news.1.c:0 "No communists in Brazil this time!"
 chd_brazil_news.1.e:0 "Is this how democracy falls?"
 
 chd_brazil_news.3.t:0 "Washington Accords Signed"
 chd_brazil_news.3.d:0 "The Washington Accords was signed earlier today, the offical treaty that formally allows Brazil to enter the Allies and join the ongoing global conflict. This treaty has been overseen and implementation by the Joint Brazil-United States Military Commission and has included various political and business agreement between the US and Brazil."
 chd_brazil_news.3.a:0 "We're doing the right thing here"
 chd_brazil_news.3.b:0 "This should be profitable"
 chd_brazil_news.3.c:0 "This won't change anything"
 chd_brazil_news.3.e:0 "We'll welcome any aid we can get"
 chd_brazil_news.3.f:0 "Brazil came to them it seems"
 # Extra Minor Flavor
 chd_flavor.0.t:0 "Return of Indochina"
 chd_flavor.0.d:0 "Indochina was captured by the Japanese during the conflict with them, now with their capitulation it has been returned to their rightful owner: France."
 chd_flavor.0.a:0 "Back where it belongs"
 
 chd_flavor.1.t:0 "Adrian de Wiart Returns From Poland"
 chd_flavor.1.d:0 "The recent outbreak of war in Poland has caused quite a stir internationally. As Polish resistance seem to be weakening Carton de Wiart evacuated from Warsaw along with the Polish government accross the Romanian border.\nHe seem to be rearing to get back into a fight, as per usual. We've considered sending him over to another country to aid in the defence elsewhere."
 chd_flavor.1.a:0 "Promote him to General"
 adrian_carton_de_wiart_will_be_available_for_service:0 "§YAdrian Carton de Wiart§! will be available as a General."
 chd_flavor.1.b:0 "Send him to Norway"
 chd_flavor.1.c:0 "Send him to Yugoslavia"
 chd_flavor.1.e:0 "Send him to China"
 chd_flavor.1.f:0 "Just leave him be"
 
 chd_flavor.2.t:0 "The Golden Square Coup"
 chd_flavor.2.d:0 "Unhappy with the current diplomatic circumstances with limited independence from the British, nationalist generals has worked with German intelligence to prepare a coup d'état to take over the government. After doing so they approached Habbaniya to try and force the local british garrison to surrender.\n\nThey refused and now fighting has broken out between pro-British and anti-British forces in our country."
 chd_flavor.2.a:0 "We'll fight for another day"
 chd_flavor.3.t:0 "Iraqi Golden Square Coup"
 chd_flavor.3.d:0 "There has been a nationalist takeover in Iraq and our interests in the region is being threatened, if we don't intervene now it'll shortly fall and likely become another base that supports fascism."
 chd_flavor.3.a:0 "We have to intervene!"
 chd_flavor.3.b:0 "This isn't our concern"
 chd_flavor.4.t:0 "Iraq Nationalizes Oil Fields"
 chd_flavor.4.d:0 "Despite attempts to stop it, Iraq has recently nationalized and removed many British officers that handled our rights to their oil. It seems that we're no longer welcome there."
 chd_flavor.4.a:0 "We'll get back at them"
 chd_flavor.4.b:0 "We'll mobilize!"
 chd_flavor.5.t:0 "The Golden Square Coup"
 chd_flavor.5.d:0 "Unhappy with the current diplomatic circumstances with limited independence from the British, nationalist generals has worked with German intelligence to prepare a coup d'état to take over the government. After doing so they approached Habbaniya to try and force the local british garrison to surrender.\n\nThey refused and now fighting has broken out between pro-British and anti-British forces in Iraq."
 chd_flavor.5.a:0 "Will this change anything?"
 
 chd_flavor.7.t:0 "Iraqi Military Offers Collaboration"
 chd_flavor.7.d:0 "With our forces near Iraq, it seems that the [IRQ.GetAdjective] military has offered to peacefully cooperate with our militaries against the allies."
 chd_flavor.7.a:0 "Sounds like a good step forward"
 chd_flavor.7.b:0 "We can't trust them"
 chd_flavor.8.t:0 "Iraqi Collaboration"
 chd_flavor.8.d:0 "The military of Iraq has come to an agreement with the axis about collaboration against the allies, this has caused quite a shift in the region as Iraqi forces are now mobilising against their former allies and have even couped the government."
 chd_flavor.8.a:0 "This isn't good"
 
 chd_flavor.9.t:0 "Japan's Support"
 chd_flavor.9.d:0 "Japan has recently taken to trying to help stabilize Manchuria, leading to a clearer ability for our administration to rule the region."
 chd_flavor.9.a:0 "This is good progress!"
 
 chd_flavor.10.t:0 "Trotsky Sent to Soviet Union"
 chd_flavor.10.d:0 "It seems that Trotsky, former leader of the Soviet Union went to Mexico in his exile after formerly being in Norway. However upon arrival he was sent back to the Soviet Union.\nMany in our administration upon hearing about this believe that this was due to Soviet influences present on the American continent. Arguing that we're failing our duty with the Monroe doctrine by allowing Europeans (and worse yet Communists) to influence the nations on our doorstep."
 chd_flavor.10.a:0 "Use this to encourage interventionism!"
 chd_flavor.10.b:0 "We shouldn't interfere in Mexican affairs"
