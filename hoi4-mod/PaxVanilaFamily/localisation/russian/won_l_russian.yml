 won_trade_agreement_reject:0 "Торговое соглашение отклонено"
 won_trade_agreement_reject_desc:0 "Нашу делегацию отправили восвояси. Можно попробовать снова через 120 дней."
 WON_CONSTRUCTION_PACT_TITLE:0 "Предложить строительный пакт"
 WON_CONSTRUCTION_PACT_ACTION_DESC:0 "Делиться инженерами, техникой и строительными фирмами: до §G+3%§! скорости строительства для обеих сторон (до 4 пактов), в зависимости от размера партнёра. Требует торгового соглашения."
 won_construction_pact:0 "Предложить строительный пакт"
 won_construction_pact_send:0 "Предложить инженерно-строительный пакт?"
 won_construction_pact_receive:0 "Наш торговый партнёр предлагает строительный пакт: общие инженеры и техника, §G+3%§! скорости строительства для обеих сторон."
 won_construction_pact_accept:0 "Строительный пакт подписан"
 won_construction_pact_accept_desc:0 "Скоро наши инженеры будут работать бок о бок."
 won_construction_pact_reject:0 "Строительный пакт отклонён"
 won_construction_pact_reject_desc:0 "Они предпочитают держать инженеров дома."
 WON_INVEST_TITLE:0 "Вложить капитал (1,5 млрд)"
 WON_INVEST_ACTION_DESC:0 "Заплатить §Y1,5 млрд§!, чтобы построить в их стране §Yгражданскую фабрику§!. Мы получаем §G1,5%§! доли каждый месяц, пока сохраняется мир."
 won_invest:0 "Вложить капитал"
 won_invest_send:0 "Предложить 1,5 млрд инвестиций на новую фабрику в их стране?"
 won_invest_receive:0 "Иностранные инвесторы предлагают построить гражданскую фабрику в нашей стране. Взамен они будут забирать долю прибыли каждый месяц."
 won_invest_accept:0 "Инвестиции приняты"
 won_invest_accept_desc:0 "Начато строительство новой фабрики. Дивиденды пойдут со следующего месяца."
 won_invest_reject:0 "Инвестиции отклонены"
 won_invest_reject_desc:0 "Они не хотят иностранных денег в своей промышленности."
 WON_HIRE_COMPANIES_TITLE:0 "Нанять их компании"
 WON_HIRE_COMPANIES_ACTION_DESC:0 "Их строительные фирмы работают на нас 12 месяцев: около трёх гражданских фабрик дополнительных строительных работ (не более §G+10%§! к скорости строительства) за ежемесячную плату 0,4% нашего ВВП (0,02...0,06 млрд)."
 won_hire_companies:0 "Нанять их компании"
 won_hire_companies_send:0 "Попросить их фирмы взять 12-месячный строительный контракт в нашей стране?"
 won_hire_companies_receive:0 "Иностранное правительство хочет нанять наши строительные фирмы на 12 месяцев. Они будут платить нам каждый месяц, но работа занимает одну нашу гражданскую фабрику."
 won_hire_companies_accept:0 "Контракт подписан"
 won_hire_companies_accept_desc:0 "Их инженеры и техника уже в пути."
 won_hire_companies_reject:0 "Контракт отклонён"
 won_hire_companies_reject_desc:0 "Их фирмы недоступны."
 WON_OFFER_SERVICES_TITLE:0 "Предложить наши услуги"
 WON_OFFER_SERVICES_ACTION_DESC:0 "Наши строительные фирмы работают на них 12 месяцев. Они получают дополнительную скорость строительства и платят нам 0,4% своего ВВП в месяц (0,02...0,06 млрд). Занимает одну нашу гражданскую фабрику."
 won_offer_services:0 "Предложить наши услуги"
 won_offer_services_send:0 "Предложить наши фирмы для 12-месячного строительного контракта?"
 won_offer_services_receive:0 "Иностранные строительные фирмы предлагают работать в нашей стране 12 месяцев: дополнительная скорость строительства за ежемесячную плату 0,4% нашего ВВП (0,02...0,06 млрд)."
