 # --- International Market window ---
 AON_BUREAU_BUTTON:0 "Оружейная торговля"
 AON_BUREAU_BUTTON_TT:0 "Откройте §YБюро оружейной торговли§!: положение на рынке, торговые потоки, что оружейная торговля даёт нашей экономике, и путь в §YБюро внешней торговли§!."
 AON_PANEL_TITLE:0 "Бюро оружейной торговли"
 AON_PANEL_TIER_NAME:0 "[GetAonTierName]"
 AON_PANEL_TIER_TT:0 "§YПоложение на рынке§! это наша репутация поставщика оружия. Каждый проданный нами на этом рынке контракт каждую неделю добавляет свой торговый вес, а каждая поставка по контракту добавляет §Y6§!. Без экспорта оно падает на §R1%§! в неделю.\n\nКаждый уровень даёт национальный дух, повышает деньги от продаж на рынке на §G5%§!, повышает цены контрактов на поставки и позволяет Агентству экспорта оружия вести больше контрактов одновременно."
 AON_PANEL_STANDING:0 "Положение на рынке: §Y[?aon_rep|0]§!"
 AON_PANEL_STANDING_TT:0 "Положение теряется, только если падает ниже §Y75%§! порога текущего уровня."
 AON_PANEL_NEXT:0 "[GetAonNextTier]"
 AON_PANEL_FLOWS_HEADER:0 "Торговые потоки"
 AON_PANEL_EXPORTS:0 "Продаваемые контракты: §Y[?aon_exp_n|0]§!\nТорговый вес: §Y[?aon_exp_w|1]§! в неделю\nДеньги: §G[?won_mkt_income|2] млрд§! за прошлый месяц\nПокупатели: §Y[?aon_ai_clients|0]§!   Подчинённые: §Y[?aon_supplied_subjects|0]§!"
 AON_PANEL_EXPORTS_TT:0 "Каждый проданный контракт весит §Y1§!. Контракты с орудиями или машинами весят §Y1,5§!, с танками или самолётами §Y3§!. В неделю учитывается не более §Y30§! веса. Каждое очко веса приносит казне §G0,002 млрд§! в неделю, больше при более высоком положении.\n\n§YПокупатели§! это страны ИИ, которые предпочитают нашу технику другим продавцам, пока мы §Yобхаживаем иностранных покупателей§! (переключатель ниже). Интересуются только страны, не воюющие с нами и не презирающие нас; положение §YПризнанный экспортёр оружия§! заставляет их предпочитать нас ещё сильнее. Отключите обхаживание, если запросов на покупку станет слишком много.\n\n§YПодчинённые§!, которыми управляет ИИ, покупают технику только у нас.\n\nОни могут покупать только то, что мы выставили на продажу во вкладке «§YПродать технику§!»."
 AON_PANEL_IMPORTS:0 "Покупаемые контракты: §Y[?aon_imp_n|0]§!\nТорговый вес: §Y[?aon_imp_w|1]§! в неделю\nТехнический опыт: §Y[?aon_insight|0]§!"
 AON_PANEL_IMPORTS_TT:0 "Каждый купленный нами контракт весит §Y1§!, или §Y1,5§! с танками или самолётами. Учитываются только первые §Y4§! контракта.\n\nТехнический опыт позволяет нашим инженерам изучать импортную технику ради бонуса к исследованиям."
 AON_PANEL_EFFECTS_HEADER:0 "Экономические эффекты"
 AON_PANEL_EFFECTS_LEFT:0 "Выпуск фабрик: [?aon_m_output|1%+]\nПотребительские товары: [?aon_m_cg|1-%]\nСкорость строительства: [?aon_m_build|1%+]\nСкорость исследований: [?aon_m_research|1%+]"
 AON_PANEL_EFFECTS_RIGHT:0 "Рост эффективности: [?aon_m_eff|1%+]\nПредел эффективности: [?aon_m_maxeff|1%+]\nЛицензионное производство: [?aon_m_license|1%+]"
 AON_PANEL_EFFECTS_TT:0 "Эти эффекты следуют за нашим §Yторговым потоком§! последних недель, постепенно растя и падая.\n\nЭкспорт достигает полного эффекта при потоке §Y20§! веса в неделю (сейчас §Y[?aon_exp_flow|1]§!).\nИмпорт достигает полного эффекта при потоке §Y4§! (сейчас §Y[?aon_imp_flow|1]§!)."
 AON_PANEL_EXHIBITION:0 "[GetAonExhibitionStatus]"
 AON_PANEL_FOOTER:0 "Контракты на поставки, лицензии и запросы из-за рубежа: §YБюро внешней торговли§!."
 # --- Events ---
 aon.1.t:0 "Наши первые иностранные клиенты"
 aon.1.d:0 "Первые экспортные контракты подписаны и исполнены. Военные делегации из-за рубежа осмотрели наши фабрики и остались довольны, а иностранные платежи уже поступают в казну.\n\nНачало скромное, но министерство считает, что репутация надёжных поставщиков принесёт ещё много заказов."
 aon.1.a:0 "Многообещающее начало."
 aon.2.t:0 "Региональный поставщик"
 aon.2.d:0 "Наше оружие уже вооружает армии нескольких стран. Закупщикам больше не нужно уговаривать заглянуть в наш каталог — они приходят сами.\n\nУправление внешней торговли предлагает закрепить успех и пригласить военных атташе со всего мира на большую выставку нашей новейшей техники."
 aon.2.a:0 "Книги заказов заполняются."
 aon.3.t:0 "Устоявшийся экспортёр"
 aon.3.d:0 "Торговля оружием стала постоянной частью нашей экономики. Целые заводы работают на иностранных заказчиков, а стабильный доход оплатил новое оборудование по всей стране.\n\nМинистерство финансов предлагает: государственные гарантии для иностранных покупателей через Управление внешней торговли могут открыть рынки, пока недоступные нам."
 aon.3.a:0 "Превосходно."
 aon.4.t:0 "Крупный экспортёр оружия"
 aon.4.d:0 "Немногие страны продают оружия больше нас. Наш экспорт финансирует научные институты и модернизирует отрасли, не выпустившие ни одной винтовки. Иностранные правительства ищут нашей благосклонности, зная, что их армии зависят от наших поставок."
 aon.4.a:0 "Мир приходит к нашим литейным цехам."
 aon.5.t:0 "Арсенал мира"
 aon.5.d:0 "Ни одна страна не сравнится с нами в масштабах экспорта оружия. Наши винтовки, орудия и машины вооружают армии на всех континентах, а богатство от торговли течёт во все уголки экономики.\n\nИностранные газеты называют нас арсеналом мира. На этот раз министерство не возражает против такого выбора слов."
 aon.5.a:0 "И бизнес идёт лучше некуда."
 aon.6.t:0 "[From.GetNameDefCap]: арсенал мира"
 aon.6.d:0 "Опубликованные на этой неделе данные подтверждают, что [From.GetNameDef] стала крупнейшим экспортёром оружия в мире. Её заводы снабжают армии на всех континентах, а торговых представителей принимают в иностранных столицах как послов.\n\nКритики предупреждают, что столь значительная доля мировой огневой мощи не должна исходить от одной страны. Покупатели пока, похоже, довольны."
 aon.6.a:0 "Интересно."
 aon.9.t:0 "Наши позиции слабеют"
 aon.9.d:0 "Иностранные покупатели нашли других поставщиков. Контрактов становится меньше, наша репутация на международном рынке тускнеет, и министерство предупреждает: выгоды от торговли оружием исчезнут вместе с ней, если экспорт не восстановится."
 aon.9.a:0 "Мы вернём их."
 aon.10.t:0 "Оружейная выставка закрывается"
 aon.10.d:0 "Целый месяц военные атташе со всего мира наблюдали, как наши танки проходят полигон, орудия стреляют, а самолёты взмывают в небо. На заключительном банкете было больше иностранных офицеров, чем на любом приёме на памяти живущих.\n\nМинистерство сообщает, что интерес к нашей технике никогда не был так высок."
 aon.10.a:0 "Триумф."
 aon.20.t:0 "Изучение иностранной техники"
 aon.20.d:0 "Наши инженеры организовали мастерскую для разборки техники, купленной за рубежом. Будет изучен каждый шов и каждый номер чертежа, но ресурсы ограничены, и команда может заниматься лишь одной областью за раз.\n\nЧто изучать в первую очередь?"
 aon.20.a:0 "Винтовки и вспомогательное оружие."
 aon.20.b:0 "Орудия."
 aon.20.c:0 "Бронетехнику."
 aon.20.e:0 "Самолёты."
 aon.20.f:0 "Как это сделано, а не что сделано."
 aon.30.t:0 "Заказ необычного размера"
 aon.30.d:0 "Закупочное управление [?aon_partner.GetNameDef] спрашивает, не можем ли мы увеличить поставки намного сверх оговорённых. Выполнение заказа потребует дополнительных смен на наших заводах, но предлагаемая плата щедра.\n\nИли мы можем вежливо отказать и оставить дополнительную продукцию для собственной армии, которая, несомненно, будет ей рада."
 aon.30.a:0 "Добавить смены."
 aon.30.b:0 "Своя армия важнее."
 aon.31.t:0 "Взятка в закупочном управлении"
 aon.31.d:0 "Чиновник нашего экспортного ведомства пойман на получении платежей от иностранного агента в обмен на выгодные условия контрактов. Пресса пока ничего не узнала.\n\nМы можем тихо уладить дело, возместив ущерб пострадавшим покупателям из казны, или начать публичное расследование, которое опозорит правительство, но восстановит доверие к нашим институтам."
 aon.31.a:0 "Уладить тихо."
 aon.31.b:0 "Провести публичное расследование."
 aon.32.t:0 "Клиент задерживает платежи"
 aon.32.d:0 "Правительство [?aon_partner.GetNameDef] сообщило, что не может выплатить очередной платёж по заказам. Посол просит о терпении и обещает, что долг будет погашен.\n\nМы можем предложить щедрые условия и заслужить благодарность верного клиента или настоять на оплате и взыскать долг через суд."
 aon.32.a:0 "Дать им больше времени."
 aon.32.b:0 "Контракт есть контракт."
 aon.33.t:0 "Отзывы из-за рубежа"
 aon.33.d:0 "Офицеры [?aon_partner.GetNameDef] прислали подробный отчёт о работе нашей техники в их войсках. Их замечания об износе, надёжности и обслуживании ценны, и военный атташе предлагает нашим инженерам изучить их.\n\nОтчёт также мог бы стать отличной рекламой для нашего отдела продаж."
 aon.33.a:0 "Передать инженерам."
 aon.33.b:0 "Передать отделу продаж."
 aon.34.t:0 "Пресса против торговли оружием"
 aon.34.d:0 "Серия газетных статей обвиняет правительство в наживе на чужих войнах. Пацифистские общества организовали собрания в нескольких городах, а депутаты требуют объяснений.\n\nПравительство может ответить критикам в публичных дебатах или оставить всё как есть, напомнив обществу, что торговля обеспечивает работой наших рабочих и укрепляет нашу армию."
 aon.34.a:0 "Ответить критикам."
 aon.34.b:0 "Наши рабочие и солдаты важнее."
 aon.40.t:0 "Инструкторы прибыли вместе с поставкой"
 aon.40.d:0 "Вместе с последней партией от [?aon_partner.GetNameDef] прибыла небольшая группа инструкторов, чтобы обучить наши войска использованию и обслуживанию новой техники.\n\nНаши офицеры рвутся учиться у них, но инженеры предпочли бы потратить это время на технические руководства инструкторов."
 aon.40.a:0 "Пусть обучают наши войска."
 aon.40.b:0 "Отдать руководства инженерам."
 aon.41.t:0 "Бракованная партия"
 aon.41.d:0 "Интенданты сообщают, что часть последней поставки от [?aon_partner.GetNameDef] дефектна. Часть оружия не прошла проверку и требует ремонта перед выдачей.\n\nМы можем подать официальную жалобу, а наши инженеры многое узнают, изучив неисправности. Или мы можем тихо починить партию сами и избежать спора с ценным поставщиком."
 aon.41.a:0 "Подать официальную жалобу."
 aon.41.b:0 "Тихо починить."
 aon.42.t:0 "Станки в ящиках"
 aon.42.d:0 "Вместе с техникой, заказанной у [?aon_partner.GetNameDef], на наши склады поступил комплект современных станков для её обслуживания. Наши промышленники просят одолжить их, а технический отдел армии предпочёл бы изучить."
 aon.42.a:0 "Передать промышленности."
 aon.42.b:0 "Пусть армия изучит."
 won_unlocks_exhibition_tt:0 "§YУправление внешней торговли§! теперь может проводить §YМеждународную оружейную выставку§!.\n"
 won_unlocks_credit_tt:0 "§YУправление внешней торговли§! теперь может предлагать §YЭкспортные кредитные гарантии§!.\n"
 WON_MKT_OFFICE_BUTTON:0 "Управление внешней торговли"
 WON_MKT_OFFICE_BUTTON_TT:0 "Открыть §YУправление внешней торговли§!: заявки из-за рубежа, поставки по контрактам, лицензии, выставки и экспортные кредиты."
 WON_MKT_COURT_BUTTON:0 "[GetWonCourtButton]"
 WON_MKT_COURT_BUTTON_TT:0 "Пока мы §Yухаживаем за иностранными покупателями§!, государства под управлением ИИ предпочитают наши предложения на этом рынке и покупают у нас чаще. Ожидайте больше заявок на покупку. Требуется §YАгентство экспорта вооружений§!."
 won_court_on_label:0 "Ухаживание за покупателями: вкл."
 won_court_off_label:0 "Ухаживание за покупателями: выкл."
 won_court_status_on:0 "ухаживает за иностранными покупателями"
 won_court_status_off:0 "не ухаживает за иностранными покупателями"
 won_rival_line:0 "Постоянные клиенты: [?aon_client_n|0] из [?aon_client_cap|0] (больше по мере роста нашего рыночного авторитета). Главный конкурент: [?global.won_rival_name.GetNameDef]."
 won_rival_none:0 "Постоянные клиенты: [?aon_client_n|0] из [?aon_client_cap|0] (больше по мере роста нашего рыночного авторитета). Ни одна великая держава с нами не конкурирует."
 won.230.t:0 "Подкуплены конкурентом"
 won.230.d:0 "Торговцы оружием из [?global.won_rival_name.GetNameDef] предложили [?global.won_rt_name.GetNameDef] то же оружие, что продаём мы, по более низкой цене и с щедрым кредитом. Если мы не ответим, наш клиент уйдёт к ним на год.\n\nСоответствие предложению обойдётся нам в [?won_rival_cost|2] млрд."
 won.230.a:0 "Сравняться по цене ([?won_rival_cost|2] млрд)."
 won.230.b:0 "Надавить дипломатически (40 очков политической власти)."
 won.230.c:0 "Пусть уходят."
 won_rival_match_tt:0 "[?global.won_rt_name.GetNameDef] остаётся с нами и лучше к нам относится. Рыночный авторитет +5."
 won_rival_keep_tt:0 "§G65%§!: [?global.won_rt_name.GetNameDef] остаётся с нами."
 won_rival_lost_tt:0 "§R[?global.won_rt_name.GetNameDef] прекращает покупать у нас на год.§!"
 won.231.t:0 "К нам стучится клиент конкурента"
 won.231.d:0 "Закупочное управление [?global.won_rt_name.GetNameDef] недовольно тем, что продаёт им [?global.won_rival_name.GetNameDef], и спрашивает, не поставим ли мы им вместо этого. Принять их не останется незамеченным в [?global.won_rival_name.GetNameDef]."
 won.231.a:0 "Принять как клиента."
 won.231.b:0 "Не стоит хлопот."
 won_rival_won_tt:0 "[?global.won_rt_name.GetNameDef] становится постоянным клиентом на два года. [?global.won_rival_name.GetNameDef] возмущена этим. Рыночный авторитет +10."
 won.232.t:0 "Введено эмбарго"
 won.232.d:0 "[?global.won_emb_name.GetNameDef] ввела эмбарго против нашей страны. Наши торговые соглашения, инвестиции и оружейные контракты с ней аннулированы, а иностранные инвесторы начинают нервничать, ведя с нами дела."
 won.232.a:0 "Они пожалеют об этом."
 WON_EMBARGO_TITLE:0 "Ввести эмбарго"
 WON_EMBARGO_ACTION_DESC:0 "Разорвать все экономические связи: торговые соглашения, инвестиции и оружейные контракты прекращаются, они не смогут покупать наше оружие, а их инвестиционный климат падает на 8. Действует, пока мы его не снимем."
 won_embargo:0 "Ввести эмбарго"
 won_embargo_send:0 "Ввести эмбарго против них? Все экономические связи между нами прекратятся."
 WON_LIFT_EMBARGO_TITLE:0 "Снять эмбарго"
 WON_LIFT_EMBARGO_ACTION_DESC:0 "Прекратить наше эмбарго. Экономические соглашения можно будет подписывать снова."
 won_lift_embargo:0 "Снять эмбарго"
 won_lift_embargo_send:0 "Снять наше эмбарго против них?"
 won_tt_not_allied:0 "Не наш союзник, подданный или сюзерен"
 won_embargoed:0 "Эмбарго против нас"
 won_poached:0 "Переманили нашего оружейного клиента"
 won_cat_modern:0 "Развитие регионов"
 won_cat_modern_desc:0 "Развивайте наши регионы до §Yуровня 10§!. Каждая программа добавляет уровень, а каждый уровень в нашей стране приносит §G0,3 млрд ВВП§!. Развитые регионы также сохраняют постоянные бонусы: §G+3%§! к местному строительству и §G+2%§! к местной рабочей силе за уровень.\n\n§YИнфраструктура и железные дороги§!: +1 инфраструктуры и улучшение железной дороги до столицы.\n§YУрбанизация§!: регион вырастает в более крупное поселение, от деревни до мегаполиса, с большим числом слотов зданий и новыми жителями.\n§YПромышленный район§!: +1 слот здания и более быстрое местное строительство.\n§YРазвитие ресурсов§!: +15% ресурсов региона.\n\nПрограмм в работе: §Y[?won_mod_active|0] из [?won_dev_max|0]§! (больше по мере роста ВВП). Уровней развития: §Y[?won_dev_levels|0]§!, что даёт §G[?won_dev_gdp|1] млрд§! ВВП."
 won_develop_state:0 "Развить [FROM.GetName]"
 won_develop_state_desc:0 "Уровень развития [?FROM.won_mod_lvl|0] из 10. Инфраструктура и ж/д [?FROM.won_dev_n_inf|0], урбанизация [?FROM.won_dev_n_urb|0], промышленность [?FROM.won_dev_n_ind|0], ресурсы [?FROM.won_dev_n_res|0]."
 won_cost_mod:0 "§Yот [?won_mod_cost|2] млрд§!"
 won_tt_dev_slots:0 "Запущено менее [?won_dev_max|0] программ развития"
 won_state_modern:0 "Развитый регион"
 won.260.t:0 "План развития: [?won_dev_target.GetName]"
 won.260.d:0 "Министерства подготовили планы для [?won_dev_target.GetName], сейчас имеющего уровень развития [?won_dev_lvl|0] из 10. Любой выбор обойдётся в [?won_dev_cost|2] млрд, займёт около [?won_dev_dur|0] дней и поднимет регион до уровня [?won_dev_next|0].\n\nНа данный момент: инфраструктура и ж/д [?won_dev_target.won_dev_n_inf|0], урбанизация [?won_dev_target.won_dev_n_urb|0], промышленные районы [?won_dev_target.won_dev_n_ind|0], развитие ресурсов [?won_dev_target.won_dev_n_res|0]."
 won.260.a:0 "Инфраструктура и железные дороги"
 won.260.b:0 "Урбанизация"
 won.260.c:0 "Промышленный район"
 won.260.e:0 "Развитие ресурсов"
 won.260.x:0 "Не сейчас."
 won_dev_inf_tt:0 "По завершении: §G+1 инфраструктуры§! (или двойное улучшение железной дороги, если дороги уже лучшие), §G+1 уровень железной дороги§! к столице, §G+0,2§! к местному снабжению."
 won_dev_urb_tt:0 "По завершении: регион вырастает до следующего размера поселения, вплоть до мегаполиса (§Gбольше слотов зданий§!), §Gновые жители§! и §G+5%§! к местной рабочей силе."
 won_dev_ind_tt:0 "По завершении: §G+1 слот здания§! и §G+5%§! к скорости местного строительства."
 won_dev_res_tt:0 "По завершении: §G+15%§! ресурсов из этого региона."
 won.261.t:0 "Строительный бум в [?won_dev_ev_state.GetName]"
 won.261.d:0 "Рабочие стекаются в [?won_dev_ev_state.GetName], а подрядчики опережают график. Программа развития там завершится раньше срока."
 won.261.a:0 "Превосходно."
 won_dev_boom_tt:0 "Программа завершится на §G45 дней§! раньше."
 won.262.t:0 "Перерасход бюджета в [?won_dev_ev_state.GetName]"
 won.262.d:0 "Цены на материалы выросли, и программа развития в [?won_dev_ev_state.GetName] превысила бюджет на [?won_dev_ev_cost|2] млрд. Мы можем покрыть разницу или замедлить работы."
 won.262.a:0 "Заплатить [?won_dev_ev_cost|2] млрд."
 won.262.b:0 "Замедлить работы."
 won_dev_delay60_tt:0 "Программа займёт на §R60 дней§! больше."
 won.263.t:0 "Местное сопротивление в [?won_dev_ev_state.GetName]"
 won.263.d:0 "Землевладельцы и местная знать в [?won_dev_ev_state.GetName] борются с программой развития в судах и прессе. Мы можем продавить её или потратить время, чтобы переубедить их."
 won.263.a:0 "Продавить."
 won.263.b:0 "Вести переговоры с местными."
 won_dev_delay45_tt:0 "Программа займёт на §R45 дней§! больше."
 won.264.t:0 "Образцовая провинция"
 won.264.d:0 "[?won_dev_ev_state.GetName] достиг 10-го уровня развития: современные дороги и железные дороги, оживлённые фабрики и растущие города. Делегации со всей страны приезжают посмотреть, как это было сделано."
 won.264.a:0 "Пусть послужит примером для нации."
