 won_tt_has_surplus:0 "У нас есть как минимум вдвое больше одного пакета: 3000 винтовок, 500 орудий, поддержка, противотанковые или зенитные орудия, либо 800 грузовиков."
 won_tt_roadshow:0 "Инвестиционный климат §G+15§! на 180 дней."
 won_tt_tax_holiday:0 "Инвестиционный климат §G+20§! на год. Нет корпоративного налога с иностранных фирм, и §R-0,1% ВВП§! в месяц от внутренних налогов."
 won_tt_red_tape:0 "Инвестиционный климат §G+10§! на год."
 won_tt_sez:0 "Столичный штат: §G+2 слота зданий§!. Инвестиционный климат §G+10§! навсегда. Иностранные фирмы платят половину корпоративного налога."
 won_tt_court_investors:0 "Иностранный инвестор отправляет предложение в Бюро внешней торговли, которое сразу открывается."
 won_tt_agency:0 "Положение на рынке §G+40§! (Малый поставщик оружия). В Бюро внешней торговли начинают приходить предложения контрактов и запросы лицензий, а страны ИИ начинают предпочитать наши лоты на Международном рынке."
 won_tt_arms_fair:0 "Положение на рынке §G+30§!, положение от экспорта §G+50%§! на 180 дней и больше предложений контрактов на 90 дней."
 won_tt_export_credit:0 "Предложения контрактов на поставки приходят намного чаще в течение года."
 won_tt_ship:0 "Начинается §Yконтракт на поставки§!: §Y6 ежемесячных поставок§! с нашего склада, каждая оплачивается §G[?won_pkg_rev|2] млрд§! по прибытии. Пропущенная поставка не оплачивается; две подряд, и они расторгают контракт. Оружейная репутация §G+3§!."
 won_tt_haggle_won:0 "Они согласны на более высокую цену."
 won_tt_haggle_lost:0 "Они уходят. Оружейная репутация §R-3§!."
 won_tt_licence:0 "Они могут строить по нашему проекту. Плата §G+[?won_lic_fee|2] млрд§! сейчас и §G0,015 млрд§! в месяц в течение 24 месяцев, пока мы в мире."
 won_tt_fdi_mil:0 "Здесь строится §Yвоенная фабрика§!. Им принадлежит доля 1,5 млрд, и они получают 1,5% с неё каждый месяц; их фирма платит нам корпоративный налог."
 won_tt_fdi_dock:0 "Здесь строится §Yверфь§!. Им принадлежит доля 1,5 млрд, и они получают 1,5% с неё каждый месяц; их фирма платит нам корпоративный налог."
