 won_contract_broken:0 "Разорвали оружейный контракт"
 won.210.t:0 "Контракт на поставки выполнен"
 won.210.d:0 "Последняя партия [GetWonPackage] дошла до [?global.won_ev_partner_name.GetNameDef], и они заплатили [?won_pkg_rev|2] млрд за каждую поставку. Их закупочное бюро спрашивает, что дальше.\n\nДля продления нужен свободный слот контракта и достаточно запаса для первых поставок."
 won.210.a:0 "Продлить на тех же условиях ([?won_pkg_rev|2] млрд за поставку)."
 won.210.b:0 "Продлить, но по [?won_pkg_rev_hi|2] млрд за поставку."
 won.210.c:0 "Предложить им другой пакет."
 won.210.e:0 "Дать контракту закончиться."
 won.212.t:0 "Оружейный контракт расторгнут"
 won.212.d:0 "Наш запас не покрыл две поставки подряд, поэтому [?global.won_ev_partner_name.GetNameDef] расторгло контракт на поставки. Покупатели разговаривают друг с другом: наша оружейная репутация пострадала."
 won.212.a:0 "Нужно держать больше на складе."
 won_trade_office:0 "Бюро внешней торговли (ожидает: [?won_q_count|0])"
 won_trade_office_desc:0 "Все запросы из-за рубежа ждут здесь, не отвлекая вас: предложения контрактов на поставки, запросы лицензий, иностранные инвесторы и контракты на продление. Запросы ждут до трёх месяцев.\n\nВ бюро также продаются излишки, проводятся оружейные ярмарки и предлагаются гарантии экспортных кредитов."
 won_tt_tray_room:0 "В Бюро внешней торговли есть место для ещё одного запроса (одновременно ждут не более 5)."
 won.201.l:0 "Вместо этого продать им лицензию на производство."
 won.220.t:0 "Бюро внешней торговли"
 won.220.d:0 "Запросов в ожидании: [?won_q_count|0]\n\nПоложение на рынке: [GetAonTierName] ([?aon_rep|0]). Мы [GetWonCourtStatus].\nМеждународный рынок: продаём [?aon_exp_n|0] контрактов, покупаем [?aon_imp_n|0]; деньги рынка [?won_mkt_income|2] млрд за прошлый месяц.\nКонтракты на поставки: [?won_sc_count|0] из [?won_sc_max|0], принесли [?won_sc_income|2] млрд за прошлый месяц.\n[GetWonRivalLine]\nТехнический опыт: [?aon_insight|0]. Инвестиционный климат: [?won_climate|0] из 100.\n\nВыставки открываются на уровне «Региональный поставщик оружия», экспортные кредиты на уровне «Признанный экспортёр оружия»."
 won.220.a:0 "Рассмотреть следующий запрос (ожидает: [?won_q_count|0])."
 won.220.b:0 "Продать излишки техники за наличные."
 won.220.c:0 "Провести международную оружейную выставку ([?won_c_small|2] млрд)."
 won.220.e:0 "Предложить гарантии экспортных кредитов на 180 дней ([?won_c_mid|2] млрд)."
 won.220.x:0 "Закрыть бюро."
 won.220.h:0 "Показывать иностранные запросы всплывающими окнами сразу по получении."
 won.220.i:0 "Держать иностранные запросы в бюро, а не показывать всплывающими окнами."
 won.219.t:0 "Бюро внешней торговли открывается"
 won.219.d:0 "Иностранный запрос впервые дошёл до наших министерств. Отныне каждое предложение из-за рубежа будет ждать в Бюро внешней торговли, а не отвлекать кабинет: контракты на поставки, запросы лицензий, иностранные инвесторы и контракты на продление.\n\nБюро находится в верху решений «Мировые рынки» с числом ожидающих запросов. Запросы, ждущие дольше трёх месяцев, теряют силу."
 won.219.a:0 "Открыть бюро сейчас."
 won.219.b:0 "Позже."
 won.220.s:0 "Изучить технику, купленную за рубежом (40 технического опыта)."
 won.220.f:0 "Обхаживать иностранных покупателей на Международном рынке."
 won.220.g:0 "Прекратить обхаживать иностранных покупателей."
 won_tt_study:0 "Технический опыт: §R-40§!. Наши инженеры выбирают область для изучения."
 won_tt_court_on:0 "Страны ИИ будут предпочитать наши лоты на Международном рынке. Ждите больше запросов на покупку."
 won_tt_court_off:0 "Страны ИИ перестают предпочитать наши лоты. Меньше запросов на покупку."
 # ---------------- International Market module (merged from Arsenal of Nations) ----------------
 # --- Market Standing spirits ---
 aon_standing_0:0 "Нет положения на рынке"
 aon_standing_1:0 "Малый поставщик оружия"
 aon_standing_1_desc:0 "Наши литейные начали выполнять заказы из-за рубежа. Суммы скромные, но валюта есть валюта, а мастерские, которые её зарабатывают, учатся работать на более высоком уровне."
 aon_standing_2:0 "Региональный поставщик оружия"
 aon_standing_2_desc:0 "Соседние генеральные штабы уже рассчитывают на наши поставки. Стабильные заказы держат наши производственные линии на полную мощность, а выручка облегчает нагрузку на внутреннюю экономику."
 aon_standing_3:0 "Признанный экспортёр оружия"
 aon_standing_3_desc:0 "Наше имя известно в закупочных бюро по всему миру. Экспортные контракты финансируют новое оборудование, а правительство пользуется уверенностью, которую даёт полный портфель заказов."
 aon_standing_4:0 "Крупный экспортёр оружия"
 aon_standing_4_desc:0 "Немногие страны могут сравниться с нами по объёму и качеству экспорта оружия. Торговля стала опорой национальной экономики, финансируя исследования и модернизируя целые отрасли."
 aon_standing_5:0 "Арсенал мира"
 aon_standing_5_desc:0 "Половина армий мира идёт в бой с оружием, на котором клеймо наших литейных. Богатство оружейной торговли растекается по всем уголкам нашей экономики, и ни одно правительство не может нас игнорировать."
 aon_export_credit_guarantees:0 "Гарантии экспортных кредитов"
 aon_export_credit_guarantees_desc:0 "Государство гарантирует платежи иностранных покупателей, позволяя им заказывать сейчас и платить потом. Наше оружие вдруг становится доступным для любой казны."
