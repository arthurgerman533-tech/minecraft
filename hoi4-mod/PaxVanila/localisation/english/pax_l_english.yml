 pax.20.c:0 "Economy"
 pax.20.e:0 "Army and Air Force"
 pax.21.t:0 "Guide to the World"
 pax.22.t:0 "Guide to the Economy"
 pax.22.d:0 "The economy laws are taken from Family. §HCivilian Economy§! gives +30% civilian factory construction speed and +25% infrastructure. When you have finished building factories, switch to the war economy: it reduces consumer goods and speeds up military factories and dockyards. §HFree Trade§! is strengthened, §HClosed Economy§! is changed.\n\nThe Family technologies 'Concentrated and Dispersed Industry VI', 'Construction VI', 'Excavation VI', improved lines and oil and rubber processing are in the 'Industry' folder. Before their year (1941-1946) they carry an ahead-of-time penalty."
 pax.23.t:0 "Guide to Army and Air Force"
 pax.23.d:0 "While there is no war, all powers have the §HPeaceful Sky§! spirit: army training is twice as fast, and aviation and navy train without accidents and without fuel use. It disappears with the first war.\n\nDivision templates change for free, army, navy and air experience accumulates up to 9999. Division experience from combat does not grow, training gives up to 0.9. There is almost no resistance in occupied lands.\n\nAircraft attrition is reduced (air combat damage is 0.35 of vanilla), and aviation does not hit supply or railways. Advice from Family: from the start train one division at 50 combat width, it gains experience quickly."
 pax.21.a:0 "Go Back"
 pax.21.b:0 "Exit the Guide"
