 ENG_pax_fai:0 "Государственная вера: Союз Числа"
 ENG_pax_fai_desc:0 "Школа Пифагора. Мореходы верят, что у всего есть число, даже у удачи."
 ENG_pax_said_no:0 "Мы сказали «нет»"
 ENG_pax_said_no_desc:0 "Память о войне за независимость 1781 года объединяет все острова."
 ENG_pax_ports:0 "Порты на всех берегах"
