 won_prog_graft_start:0 "Финансировать: антикоррупционное бюро"
 won_prog_graft_start_desc:0 "Аудиторы и следователи, не подчиняющиеся ни одному министерству.\n\nСтоит §Y[?won_c_prog_graft|2] млрд§! в месяц (0,1% ВВП). Пассивно: §G+3% к приросту политической власти§!.\n§GЗащищает от:§! коррупционных скандалов, чёрных рынков, контрабанды, уклонения от налогов и взяток при закупках."
