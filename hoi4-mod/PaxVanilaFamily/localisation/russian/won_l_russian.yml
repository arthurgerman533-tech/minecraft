 won_tt_prog_graft:0 "Запускает §Yантикоррупционное бюро§!: §R-[?won_c_prog_graft|2] млрд§! ежемесячно, §G+3% к приросту политической власти§! и защита от коррупционных скандалов, чёрных рынков, контрабанды, уклонения от налогов и взяток при закупках."
 won_prog_relief_start:0 "Финансировать: помощь при бедствиях и борьба с наводнениями"
 won_prog_relief_start_desc:0 "Дамбы, склады помощи и аварийные бригады, готовые до наступления бедствия.\n\nСтоит §Y[?won_c_prog_relief|2] млрд§! в месяц (0,1% ВВП). Пассивно: §G+5% к скорости строительства инфраструктуры§!.\n§GЗащищает от:§! наводнений, землетрясений и суровых зим."
 won_prog_relief_end:0 "Прекратить: помощь при бедствиях и борьба с наводнениями"
 won_prog_relief_end_desc:0 "Прекратить платить §Y[?won_c_prog_relief|2] млрд§! в месяц. Защита и пассивный бонус исчезают немедленно."
 won_tt_prog_relief:0 "Запускает §Yпомощь при бедствиях и борьбу с наводнениями§!: §R-[?won_c_prog_relief|2] млрд§! ежемесячно, §G+5% к скорости строительства инфраструктуры§! и защита от наводнений, землетрясений и суровых зим."
 won_prog_reserves_start:0 "Финансировать: стратегические товарные резервы"
 won_prog_reserves_start_desc:0 "Государственные запасы топлива, угля и каучука, которые можно выпустить при скачке цен.\n\nСтоит §Y[?won_c_prog_reserves|2] млрд§! в месяц (0,15% ВВП). Пассивно: §G+2% к эффективности добычи ресурсов§!.\n§GЗащищает от:§! нефтяных шоков, нехватки каучука и скачков цен на сырьё."
