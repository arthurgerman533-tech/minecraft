 # Australia
 AST_central_bureau:0 "Coordinate Central Bureau"
 AST_central_bureau_desc:0 "A Signals & Intelligence bureau coordinated with the US promises to give us a strategic edge in the coming storm. Our expertise in this area should be acknowledged."
 AST_central_bureau_idea:0 "Central Bureau"
 AST_central_bureau_idea_desc:0 "A joint intelligence taskforce established and coordinated with the USA, which aims to counter the efforts of our enemies in the pacific theater. "
 # Romania
 ROM_white_squadron_focus:0 "White Squadron"
 ROM_white_squadron_focus_desc:0 "The White squadron, proposed by Marina Ştirbei - a talented pilot of noble birth - is a service of air ambulances piloted exclusively by women. Merely the notion that rescue might be close at hand could keep our soldiers in high spirits."
 ROM_white_squadron:0 "White Squadron"
 ROM_white_squadron_desc:0 "The White squadron is a service of air ambulances piloted exclusively by women. Merely the notion that rescue might be close at hand keeps our soldiers in high spirits. "
 # Italy
 # National Spirits
 ITA_controlled_homeland_and_colonies:0 "Italian Control"
 ITA_controlled_homeland_and_colonies_desc:0 "Italy is working towards a greatness, wanting to become a Great Power equal to those around him. Currently the hold over the Colonies and Homeland is secure, giving them an ability to conduct affairs effectively."
 ITA_controlled_homeland:0 "Italian Control"
 ITA_controlled_homeland_desc:0 "Italy is working towards a greatness, wanting to become a Great Power equal to those around him. Currently the hold over the Homeland is secure though with the colonies lost many question what will come next."
 ITA_partly_controlled_homeland:0 "Italian Control"
 ITA_partly_controlled_homeland_desc:0 "Italy is working towards a greatness, wanting to become a Great Power equal to those around him. Though currently the hold over the Homeland is strained and people are slowly working towards abandoning the current regime."
 ITA_low_controlled_homeland:0 "Italian Control"
 ITA_low_controlled_homeland_desc:0 "Italy is working towards a greatness, wanting to become a Great Power equal to those around him. Though currently the hold over the Homeland is intangible and people are rapidly working towards abandoning the current regime."
 # Focus
 ITA_war_with_yugoslavia:0 "Yugoslavian Invasion"
 ITA_war_with_yugoslavia_desc:0 "Yugoslavia has been an eyesore in the Balkans and owned territory that rightfully belongs to us, we need to do something about this now."
 # Decisions
 ITA_yugoslavian_claims:0 "Claim Yugoslavian Coast"
 # Hungary
 HUN_consolidate_the_regency:0 "Consolidate The Regency"
 HUN_consolidate_the_regency_desc:0 "To secure the Hungarian state won't falter in the trying times ahead Miklós Horthy is working towards further vesting power in his regime."
 # Spain
 # Focus
 SPR_support_the_revolution_abroad:0 "Support Revolution Abroad"
 SPR_support_the_revolution_abroad_desc:0 "We need to repay the aid the Soviet gave to us and support the revolution abroad!"
 # Balance Stuff (Disarmed)
 chd_balance.0.t:0 "Disarmed At War"
 chd_balance.0.d:0 "With [Root.GetName] ending up at war with [From.GetName] it's clear that we can no longer afford to keep our armies disarmed."
 chd_balance.0.a:0 "Allow volunteers to join our cause"
 chd_balance.0.b:0 "Time for some conscription!"
 
 chd_balance.1.t:0 "Dangers Around Us"
 chd_balance.1.d:0 "There is no point denying there are many threats in the world, most comming from abroad. Our people has noticed this and demanded that we start rearming ourselves again, fearing that [Root.GetNameDef] will be caught with no defences should war strike."
 chd_balance.1.a:0 "We can't stay disarmed"
 chd_balance.1.b:0 "Why would we ever end up at war?"
 because_you_are_in_a_faction_higher_penalty:0 "§RBecause [Root.GetName] is in a faction there is an added political power penalty for not rearming.§!"
 
 chd_balance.2.t:0 "Chinese Warlords Cooperate"
 chd_balance.2.d:0 "While for a time the Chinese Warlords have undermined the republic's legitimacy and attempts to unite China, it seems now they are putting their differences aside to fight the greater threat: Japan."
 chd_balance.2.a:0 "The fight goes on!"
 CHI_can_now_recruit_armies_and_gain_extra_warlords_from_waves:0 "China will now be able to recruit new divisions and will gain additional units spawned in as they are pushed back further into the mainland."