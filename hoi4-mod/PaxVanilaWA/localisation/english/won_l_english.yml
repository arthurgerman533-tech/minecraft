 won_consumer_boom:0 "Consumer Boom"
 won_consumer_boom_desc:0 "Radios, refrigerators and motor cars."
 won_harvest_good:0 "Bumper Harvest"
 won_harvest_good_desc:0 "Full granaries and cheap bread."
 won_harvest_bad:0 "Poor Harvest"
 won_harvest_bad_desc:0 "Bread queues are growing."
 won_black_market:0 "Black Market"
 won_black_market_desc:0 "Anything can be had, for a price."
 won_corruption:0 "Corruption"
 won_corruption_desc:0 "Contracts go to friends."
 won_brain_gain:0 "Emigre Scientists"
 won_brain_gain_desc:0 "Refugee scholars bring their knowledge with them."
 won_brain_drain:0 "Brain Drain"
 won_brain_drain_desc:0 "Our brightest minds are leaving."
 won_price_controls:0 "Price Controls"
