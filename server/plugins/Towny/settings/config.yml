# PaxVanila — только экономические настройки Towny.
# Towny при первом запуске сам допишет все остальные параметры по умолчанию и сохранит эти.
last_run_version: 0.103.2.0
economy:
  using_economy: true
  town_rename_cost: 200
  nation_rename_cost: 500
  price_nation_neutrality: 300.0
  price_town_neutrality: 50.0
  spawn_travel:
    price_town_spawn_travel: 0.0
    price_town_nation_spawn_travel: 10.0
    price_town_ally_spawn_travel: 25.0
    price_town_public_spawn_travel: 25.0
    price_town_public_spawn_travel_maximum: 50.0
  new_expand:
    price_new_nation: 3000.0
    price_new_town: 500.0
    price_reclaim_ruined_town: 1000.0
    price_outpost: 750.0
    price_claim_townblock: 50.0
    price_claim_townblock_increase: 1.02
    max_price_claim_townblock: 300.0
    price_purchased_bonus_townblock: 100.0
  takeoverclaim:
    price: 250.0
  death:
    price_death: 0.0
  banks:
    town_allow_withdrawals: true
    nation_allow_withdrawals: true
    disallow_bank_actions_outside_town: true
  daily_taxes:
    enabled: true
    max_plot_tax_amount: 100.0
    max_town_tax_amount: 200.0
    max_nation_tax_amount: 500.0
    max_town_tax_percent: 20
    max_nation_tax_percent: 20
    price_nation_upkeep: 150.0
    price_town_upkeep: 25.0
  bankruptcy:
    enabled: true
    upkeep:
      delete_towns_that_reach_debt_cap: false
    nation_tax:
      do_bankrupt_towns_pay_nation_tax: false
      kick_towns_that_reach_debt_cap: true
